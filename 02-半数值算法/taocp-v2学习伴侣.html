ate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g transform=\"translate(71.5, 612.5)\" class=\"edgeLabel\"><g transform=\"translate(-16, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">小于</span></div></foreignObject></g></g><g transform=\"translate(266.7265625, 612.5)\" class=\"edgeLabel\"><g transform=\"translate(-16, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">大于</span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(169.11328125, 18)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-203\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95.890625\" y=\"-18\" x=\"-47.9453125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40.4453125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80.890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">分 k 个格子</span></div></foreignObject></g></g><g transform=\"translate(169.11328125, 104)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-204\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127\" y=\"-18\" x=\"-63.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数每格实际个数</span></div></foreignObject></g></g><g transform=\"translate(169.11328125, 190)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-206\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127\" y=\"-18\" x=\"-63.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">算每格期望个数</span></div></foreignObject></g></g><g transform=\"translate(169.11328125, 276)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-208\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">算偏差平方除以期望</span></div></foreignObject></g></g><g transform=\"translate(169.11328125, 362)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-210\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">全部加总得卡方值</span></div></foreignObject></g></g><g transform=\"translate(169.11328125, 503.5)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-212\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-73.5,73.5)\" class=\"label-container\" points=\"73.5,0 147,-73.5 73.5,-147 0,-73.5\"></polygon><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">与临界值比较</span></div></foreignObject></g></g><g transform=\"translate(71.5, 666)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-214\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">没有理由否定均匀</span></div></foreignObject></g></g><g transform=\"translate(266.7265625, 666)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-216\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">显著偏离 需查原因</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看最后的分叉：结论只有「没查出问题」与「查出问题」两种，不存在「证明均匀」。<\/p>\n<h2>详解<\/h2>\n<p>公式：χ² = Σ (O − E)² / E。<\/p>\n<p><strong>实例<\/strong>：骰子 60 次，六面计数 8、12、9、11、10、10，期望各 10。 χ² = (4+4+1+1+0+0)/10 = 1.0。自由度 5，5% 临界值 11.07，1.0 远小于它，不显著。<\/p>\n<p><strong>自由度<\/strong>：格子数减 1。因为频数总和被样本量固定，最后一个格子的值是推出来的。<\/p>\n<p><strong>期望频数下限<\/strong>：每格期望不小于 5，否则卡方分布近似失效，要合并格子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为卡方值小就一定好：接近 0 说明「整齐得不像抽样」。\n<\/li><li>\n别以为通过检验就证明随机：只证明这批数据没暴露问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.3.1<\/td><td>一般检验过程<\/td><td>卡方的构造与自由度<\/td><\/tr><tr><td>3.3.2<\/td><td>经验检验<\/td><td>对具体发生器做卡方<\/td><\/tr><tr><td>3.3.4<\/td><td>谱检验<\/td><td>另一种相关性的检验<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">线性同余发生器<\/a>\n<\/li><li>\n后续：卷3 排序的平均情况分析\n<\/ul>", "c03": "<h1>秦九韶法则与多精度乘法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>秦九韶法则（Horner）把 n 次多项式求值化成 n 次乘加；多精度乘法把大整数切块，用竖式逐块相乘，朴素代价 O(n²)。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两件事看起来无关，其实共享同一个思路：<strong>把高次问题拆成逐层递推<\/strong>。秦九韶把「求幂」拆成「每层乘一次 x」；多精度乘法把「大数相乘」拆成「小块相乘再进位」。后者再往前走一步，就是快速乘法。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 400.4609375 396\" style=\"max-width: 400.4609375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg17\"><style>#svg17{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg17 .error-icon{fill:#552222;}#svg17 .error-text{fill:#552222;stroke:#552222;}#svg17 .edge-thickness-normal{stroke-width:2px;}#svg17 .edge-thickness-thick{stroke-width:3.5px;}#svg17 .edge-pattern-solid{stroke-dasharray:0;}#svg17 .edge-pattern-dashed{stroke-dasharray:3;}#svg17 .edge-pattern-dotted{stroke-dasharray:2;}#svg17 .marker{fill:#333333;stroke:#333333;}#svg17 .marker.cross{stroke:#333333;}#svg17 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg17 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg17 .cluster-label text{fill:#333;}#svg17 .cluster-label span,#svg17 p{color:#333;}#svg17 .label text,#svg17 span,#svg17 p{fill:#333;color:#333;}#svg17 .node rect,#svg17 .node circle,#svg17 .node ellipse,#svg17 .node polygon,#svg17 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg17 .flowchart-label text{text-anchor:middle;}#svg17 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg17 .node .label{text-align:center;}#svg17 .node.clickable{cursor:pointer;}#svg17 .arrowheadPath{fill:#333333;}#svg17 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg17 .flowchart-link{stroke:#333333;fill:none;}#svg17 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg17 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg17 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg17 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg17 .cluster text{fill:#333;}#svg17 .cluster span,#svg17 p{color:#333;}#svg17 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg17 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg17 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg17_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg17_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 5 L 10 10 L 10 0 z\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"11\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg17_flowchart-circleEnd\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" c line-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(63.9453125, 18)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-217\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多项式求值</span></div></foreignObject></g></g><g transform=\"translate(63.9453125, 104)\" data-id=\"H1\" data-node=\"true\" id=\"flowchart-H1-218\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127\" y=\"-18\" x=\"-63.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从最高系数开始</span></div></foreignObject></g></g><g transform=\"translate(63.9453125, 190)\" data-id=\"H2\" data-node=\"true\" id=\"flowchart-H2-220\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127.890625\" y=\"-18\" x=\"-63.9453125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56.4453125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112.890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘 x 加下一系数</span></div></foreignObject></g></g><g transform=\"translate(63.9453125, 276)\" data-id=\"H3\" data-node=\"true\" id=\"flowchart-H3-222\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">重复到常数项</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 18)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-223\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">大数相乘</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 104)\" data-id=\"M1\" data-node=\"true\" id=\"flowchart-M1-224\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">按基数切块</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 190)\" data-id=\"M2\" data-node=\"true\" id=\"flowchart-M2-226\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">逐块相乘 错位相加</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 276)\" data-id=\"M3\" data-node=\"true\" id=\"flowchart-M3-228\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"113.6875\" y=\"-18\" x=\"-56.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"98.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">朴素 O n 平方</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 362)\" data-id=\"M4\" data-node=\"true\" id=\"flowchart-M4-230\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"265.6875\" y=\"-18\" x=\"-132.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-125.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"250.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">对半切开 三次乘法 约 n 一点五八五</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看两条线的共同点：都是「从一端开始，每步只做一次小运算，把结果交给下一步」。<\/p>\n<h2>详解<\/h2>\n<p><strong>Horner 实例<\/strong>：p(x)=2x³+3x²+5x+7，x=2。 2 → 2×2+3=7 → 7×2+5=19 → 19×2+7=45。直接代入也是 45，两条路必须对上。<\/p>\n<p><strong>多精度实例<\/strong>：按十进制竖式算 47×23。 3×47=141；2×47=94 左移一位得 940；141+940=1081。<\/p>\n<p><strong>代价对照<\/strong>：Horner 是 O(n)；朴素多精度乘法是 O(n²)；快速乘法用三次半规模乘法替代四次，得 T(n)=3T(n/2)+O(n)，即 O(n^1.585)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Horner 只适用于多项式：进制转换的「乘基累加」就是它。\n<\/li><li>\n别以为快速乘法总要更快：小规模时递归开销超过收益，要设阈值。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.3.1<\/td><td>经典算法<\/td><td>竖式乘法与进位<\/td><\/tr><tr><td>4.3.3<\/td><td>乘法有多快<\/td><td>快速乘法的递归式<\/td><\/tr><tr><td>4.6.4<\/td><td>多项式求值<\/td><td>秦九韶法则<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">卡方检验<\/a>\n<\/li><li>\n后续：卷4 组合计数的生成函数\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：伪随机数怎么造<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：随机数是怎么造出来的<\/a><br>检查点：能手算一个模 16 的线性同余序列并数出周期，说清满周期的三个条件<\/li><li class='path-step' id='path-02'><strong>步骤 02：怎么证明它像随机数<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：检验随机性，并把随机数用起来<\/a><br>检查点：能算一次卡方统计量并与临界值比较，能写出逆变换法与洗牌的正确做法<\/li><li class='path-step' id='path-03'><strong>步骤 03：浮点与多精度算术<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：浮点与多精度算术<\/a><br>检查点：能解释 0.1 加 0.2 为何不等于 0.3，能算出两个 n 位整数朴素乘法的次数<\/li><li class='path-step' id='path-04'><strong>步骤 04：进制、有理数与多项式<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：进制、有理数与多项式<\/a><br>检查点：能用秦九韶法则手算一个四次多项式，能说清快速乘法的递归式<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q13.<\/b> 综合题：要为一个模拟程序选伪随机数发生器，既要求快又要求二维相关性可接受，最合理的做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 模取 2 的幂并直接用最低位<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 模取素数或组合两个发生器，并做谱检验<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 平方取中法<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 固定种子重复使用同一段序列<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：随机数是怎么造出来的<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性同余法满周期的条件不包括下列哪一条？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> c 与 m 互素<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> a−1 被 m 的所有素因子整除<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> m 必须是素数<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> m 被 4 整除时 a−1 也被 4 整除<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> m=16、a=5、c=3、x0=1 的线性同余序列，周期是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 模取 2 的幂时，线性同余序列的哪一部分质量最差？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 最高位<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 最低位<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 中间位<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 都一样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：检验随机性，并把随机数用起来<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 掷骰子 60 次，六面各出现 10 次，卡方统计量是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 6<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 10<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 卡方检验分成 6 个格子，自由度是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 正确的洗牌做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 每个 i 与 1 到 n 中随机位置交换<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 从 i=n 递减，与 1 到 i 中随机位置交换<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 随机排序键后排序<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 每次随机取两个位置交换 n 次<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：浮点与多精度算术<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 双精度浮点数的尾数（含隐含位）是多少位？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 24<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 32<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 53<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 64<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 快速乘法递归式 T(n)=3T(n/2)+O(n) 的复杂度指数约为多少？（填三位小数）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 双精度下 1e16 + 1 − 1e16 的结果是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 1e16<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：进制、有理数与多项式<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 十进制 100 的二进制表示是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1100100<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 1001100<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 1010100<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 1110000<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 用秦九韶法则算 2x³+3x²+5x+7 在 x=2 处的值，结果是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 计算 x^15 最少需要多少次乘法？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 15<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='伪随机数'>伪随机数 — 由确定性算法产生、但通过统计检验看起来像随机的数列。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='线性同余法'>线性同余法 — 用 x 的下一项等于 a 乘 x 加 c 再对 m 取余来生成数列。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='周期'>周期 — 数列开始重复之前的不同项个数。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='满周期'>满周期 — 周期恰好等于模 m，一个周期内取遍所有余数。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='势'>势 — 衡量乘数在二进制低位上混合快慢的指标。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='卡方检验'>卡方检验 — 把观测频数与期望频数的偏差平方后按期望归一，再加总得到的统计量。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='柯尔莫哥洛夫检验'>柯尔莫哥洛夫检验 — 比较经验分布函数与理论分布函数的最大差距。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='逆变换法'>逆变换法 — 用均匀随机数经过目标分布的累积分布函数反函数，得到该分布的随机数。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='洗牌'>洗牌 — 把 n 个元素随机重排，使 n! 种排列等概率出现。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='浮点'>浮点 — 用符号、指数、尾数三部分表示实数，尾数位数决定精度。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='有效位'>有效位 — 浮点尾数中真正可靠的二进制位数。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='多精度算术'>多精度算术 — 把大整数切成若干位一块，用数组表示并逐块运算。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='模算术'>模算术 — 只保留余数的算术，加减乘可以直接做，除法要解同余式。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='快速乘法'>快速乘法 — 把大整数对半切开，用三次半规模乘法替代四次，把复杂度降到约 n 的 1.585 次方。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='秦九韶法则'>秦九韶法则 — 从最高次项开始，每次「乘 x 再加下一项」的求值方法。 <span class=glossary-ref>（第 4 章：进制、有理数与多项式）<\/span><\/li><li data-term='幂级数'>幂级数 — 形如 a0 加 a1x 加 a2x 平方……的无穷和，用于近似函数。 <span class=glossary-ref>（第 4 章：进制、有理数与多项式）<\/span><\/li><li data-term='进制转换'>进制转换 — 把一个整数在基数 b 与基数 b 的幂之间重新表示。 <span class=glossary-ref>（第 4 章：进制、有理数与多项式）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：造一个可用的伪随机数发生器<\/h2>\n<ol><li>\n<strong>选类型<\/strong>：需要长周期、可重复 → 线性同余；需要更高质量 → 组合多个发生器（如相加或异或）。\n<\/li><li>\n<strong>选模<\/strong>：模取 2 的幂便于硬件取余，但低位质量差；取素数（如 2^31−1）低位与高位一样好。\n<\/li><li>\n<strong>选乘数<\/strong>：模 2^e 时乘数取 a ≡ 5 (mod 8)，纯乘同余也能拿到 2^(e−2) 的周期。\n<\/li><li>\n<strong>验周期<\/strong>：m、c 互素，a−1 能被 m 的所有素因子整除，m 被 4 整除时 a−1 也被 4 整除 —— 三条齐了才是满周期。\n<\/li><li>\n<strong>做检验<\/strong>：卡方查均匀性，柯尔莫哥洛夫查分布形状，谱检验查多维相关性。\n<\/ol>\n<h2>决策规则：随机数用哪种变换<\/h2>\n<ul><li>\n只要均匀整数 → 直接用发生器的输出。\n<\/li><li>\n要 0 到 1 的实数 → 输出除以模，注意不要用到低位。\n<\/li><li>\n要正态分布 → Box-Muller（两个均匀数经对数与三角函数）。\n<\/li><li>\n要任意分布 → 逆变换法，前提是累积分布函数的反函数可算。\n<\/li><li>\n要随机排列 → Fisher-Yates 洗牌，从后往前，每次与前面随机位置交换。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用 rand() % n 取范围<\/strong>。当 n 不整除发生器周期时会引入偏斜，正确做法是拒绝采样或先放大再取整。\n<\/li><li>\n<strong>把低位当高位用<\/strong>。线性同余的低位周期很短（模 2^e 时第 0 位周期只有 2），要取高位。\n<\/li><li>\n<strong>用同一个种子跑两次实验还当成独立样本<\/strong>。伪随机数可重复是优点，但重复的样本不是新样本。\n<\/li><li>\n<strong>浮点数直接用 == 比较<\/strong>。应比较差值是否小于容差。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>线性同余<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>递推式<\/td><td>x(n+1) = (a·x(n) + c) mod m<\/td><\/tr><tr><td>满周期三条件<\/td><td>gcd(c, m) = 1；a−1 被 m 的所有素因子整除；m 被 4 整除时 a−1 也被 4 整除<\/td><\/tr><tr><td>模 2^e 的乘数<\/td><td>a ≡ 5 (mod 8)，纯乘同余周期 2^(e−2)<\/td><\/tr><tr><td>取范围<\/td><td>用高位，不要用低位<\/td><\/tr><\/tbody><\/table>\n<h2>常用检验<\/h2>\n<table><thead><tr><th>检验<\/th><th>统计量<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>卡方<\/td><td>Σ(观测−期望)²/期望<\/td><td>频数是否均匀<\/td><\/tr><tr><td>柯尔莫哥洛夫<\/td><td>经验分布与理论分布的最大差<\/td><td>分布形状<\/td><\/tr><tr><td>谱检验<\/td><td>多维格点的最大空隙<\/td><td>相邻数的相关性<\/td><\/tr><\/tbody><\/table>\n<h2>浮点与多精度<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>单精度<\/td><td>约 7 位十进制有效数字<\/td><\/tr><tr><td>双精度<\/td><td>约 16 位十进制有效数字<\/td><\/tr><tr><td>朴素乘法<\/td><td>n 位 × n 位需 n² 次单位乘法<\/td><\/tr><tr><td>快速乘法<\/td><td>T(n) = 3T(n/2) + O(n)，约 O(n^1.585)<\/td><\/tr><tr><td>秦九韶<\/td><td>n 次多项式只需 n 次乘法加 n 次加法<\/td><\/tr><\/tbody><\/table>\n<h2>洗牌<\/h2>\n<p>从 i = n 递减到 2，随机取 j 在 1 到 i 之间，交换 i 与 j。n! 种排列等概率。<\/p>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
