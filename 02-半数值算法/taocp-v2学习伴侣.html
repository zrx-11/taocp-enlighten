<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;

}
[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}

.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}

.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}

.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}

.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}

.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}

.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
<style id="diagram-style">
.diagram-rendered{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin:14px 0;overflow-x:auto}
.diagram-rendered svg{max-width:100%;height:auto;display:block;margin:0 auto}
body[data-theme="dark"] .diagram-rendered{background:#f1f5f9;border-color:#334155}

再加总得到的统计量。", "chapterId": "ch02"}, {"term": "柯尔莫哥洛夫检验", "def": "比较经验分布函数与理论分布函数的最大差距。", "chapterId": "ch02"}, {"term": "逆变换法", "def": "用均匀随机数经过目标分布的累积分布函数反函数，得到该分布的随机数。", "chapterId": "ch02"}, {"term": "洗牌", "def": "把 n 个元素随机重排，使 n! 种排列等概率出现。", "chapterId": "ch02"}, {"term": "浮点", "def": "用符号、指数、尾数三部分表示实数，尾数位数决定精度。", "chapterId": "ch03"}, {"term": "有效位", "def": "浮点尾数中真正可靠的二进制位数。", "chapterId": "ch03"}, {"term": "多精度算术", "def": "把大整数切成若干位一块，用数组表示并逐块运算。", "chapterId": "ch03"}, {"term": "模算术", "def": "只保留余数的算术，加减乘可以直接做，除法要解同余式。", "chapterId": "ch03"}, {"term": "快速乘法", "def": "把大整数对半切开，用三次半规模乘法替代四次，把复杂度降到约 n 的 1.585 次方。", "chapterId": "ch03"}, {"term": "秦九韶法则", "def": "从最高次项开始，每次「乘 x 再加下一项」的求值方法。", "chapterId": "ch04"}, {"term": "幂级数", "def": "形如 a0 加 a1x 加 a2x 平方……的无穷和，用于近似函数。", "chapterId": "ch04"}, {"term": "进制转换", "def": "把一个整数在基数 b 与基数 b 的幂之间重新表示。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "q01", "chapterId": "ch01", "type": "single", "question": "线性同余法满周期的条件不包括下列哪一条？", "options": ["c 与 m 互素", "a−1 被 m 的所有素因子整除", "m 必须是素数", "m 被 4 整除时 a−1 也被 4 整除"], "answer": 2, "explain": "模可以是 2 的幂也可以是素数，条件里没有要求 m 必须是素数。"}, {"id": "q02", "chapterId": "ch01", "type": "blank", "question": "m=16、a=5、c=3、x0=1 的线性同余序列，周期是多少？（填数字）", "options": [], "answer": "16", "explain": "序列走遍 0 到 15 后回到 1，周期等于模 16。"}, {"id": "q03", "chapterId": "ch01", "type": "single", "question": "模取 2 的幂时，线性同余序列的哪一部分质量最差？", "options": ["最高位", "最低位", "中间位", "都一样"], "answer": 1, "explain": "模 2^e 时最低位周期只有 2，第 k 位周期最多 2^(k+1)；进位只向上传播，低位看不到高位变化。"}, {"id": "q04", "chapterId": "ch02", "type": "single", "question": "掷骰子 60 次，六面各出现 10 次，卡方统计量是多少？", "options": ["0", "1", "6", "10"], "answer": 0, "explain": "每项 (10−10)²/10 = 0，总和 0。统计量恰为 0 反而提示「整齐得不像抽样」。"}, {"id": "q05", "chapterId": "ch02", "type": "blank", "question": "卡方检验分成 6 个格子，自由度是多少？（填数字）", "options": [], "answer": "5", "explain": "自由度 = 格子数 − 1 = 5，因为六个频数之和被样本量固定。"}, {"id": "q06", "chapterId": "ch02", "type": "single", "question": "正确的洗牌做法是？", "options": ["每个 i 与 1 到 n 中随机位置交换", "从 i=n 递减，与 1 到 i 中随机位置交换", "随机排序键后排序", "每次随机取两个位置交换 n 次"], "answer": 1, "explain": "Fisher-Yates：第 i 步只在 1 到 i 中取，路径数恰为 n!，每种排列等概率。全范围交换有 n^n 条路径，通常不能被 n! 整除，必然偏斜。"}, {"id": "q07", "chapterId": "ch03", "type": "single", "question": "双精度浮点数的尾数（含隐含位）是多少位？", "options": ["24", "32", "53", "64"], "answer": 2, "explain": "52 位显式尾数加 1 位隐含位共 53 位，约 16 位十进制有效数字。"}, {"id": "q08", "chapterId": "ch03", "type": "blank", "question": "快速乘法递归式 T(n)=3T(n/2)+O(n) 的复杂度指数约为多少？（填三位小数）", "options": [], "answer": "1.585", "explain": "指数是 log2 3 ≈ 1.58496，取三位为 1.585。"}, {"id": "q09", "chapterId": "ch03", "type": "single", "question": "双精度下 1e16 + 1 − 1e16 的结果是？", "options": ["0", "1", "2", "1e16"], "answer": 0, "explain": "1e16 附近的 ulp 是 2，加 1 不足半个 ulp 被舍入回 1e16，再减 1e16 得 0。"}, {"id": "q10", "chapterId": "ch04", "type": "single", "question": "十进制 100 的二进制表示是？", "options": ["1100100", "1001100", "1010100", "1110000"], "answer": 0, "explain": "64 + 32 + 4 = 100，对应第 6、5、2 位为 1，即 1100100。"}, {"id": "q11", "chapterId": "ch04", "type": "blank", "question": "用秦九韶法则算 2x³+3x²+5x+7 在 x=2 处的值，结果是多少？（填数字）", "options": [], "answer": "45", "explain": "2 → 7 → 19 → 45，与直接代入 16+12+10+7=45 一致。"}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "计算 x^15 最少需要多少次乘法？", "options": ["4", "6", "15", "8"], "answer": 1, "explain": "x²、x³、x⁶、x⁷、x¹⁴、x¹⁵ 各一次乘法，共 6 次（3 次平方、3 次相乘）。"}, {"id": "q13", "chapterId": "__all__", "type": "single", "question": "综合题：要为一个模拟程序选伪随机数发生器，既要求快又要求二维相关性可接受，最合理的做法是？", "options": ["模取 2 的幂并直接用最低位", "模取素数或组合两个发生器，并做谱检验", "平方取中法", "固定种子重复使用同一段序列"], "answer": 1, "explain": "模取素数让高低位质量一致，组合发生器提升周期与统计性质，谱检验专门查二维相关性。最低位质量最差，平方取中会退化，重复同一段不是新样本。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "线性同余法的递推式怎么写？", "back": "x(n+1) = (a·x(n) + c) mod m，参数是模 m、乘数 a、增量 c、初值 x0。", "tags": ["随机数"]}, {"id": "f02", "chapterId": "ch01", "front": "满周期的三个条件是什么？", "back": "gcd(c, m)=1；a−1 被 m 的所有素因子整除；m 被 4 整除时 a−1 也被 4 整除。", "tags": ["随机数"]}, {"id": "f03", "chapterId": "ch01", "front": "为什么线性同余不能直接用最低位？", "back": "模 2^e 时最低位周期只有 2，第 k 位周期最多 2^(k+1)，低位都很短，要用高位。", "tags": ["随机数"]}, {"id": "f04", "chapterId": "ch01", "front": "模取 2 的幂与取素数各有什么代价？", "back": "2 的幂快（按位与）但低位差；素数高低位一致但要做真除法。", "tags": ["随机数"]}, {"id": "f05", "chapterId": "ch02", "front": "卡方统计量的公式与自由度怎么定？", "back": "χ² = Σ(观测−期望)²/期望；自由度 = 格子数 − 1。", "tags": ["检验"]}, {"id": "f06", "chapterId": "ch02", "front": "卡方检验对期望频数有什么要求？", "back": "每格期望不小于 5，否则近似失效，要合并相邻格子。", "tags": ["检验"]}, {"id": "f07", "chapterId": "ch02", "front": "逆变换法怎么把均匀数变成指数分布？", "back": "x = −ln(1−u)/λ，λ 是速率参数。", "tags": ["变换"]}, {"id": "f08", "chapterId": "ch02", "front": "Fisher-Yates 洗牌怎么做？", "back": "从 i=n 递减到 2，随机取 j 在 1 到 i 之间，交换第 i 与第 j 个。", "tags": ["洗牌"]}, {"id": "f09", "chapterId": "ch03", "front": "浮点数由哪三部分组成？", "back": "符号位、指数、尾数；尾数位数决定精度。", "tags": ["浮点"]}, {"id": "f10", "chapterId": "ch03", "front": "为什么 0.1 + 0.2 不等于 0.3？", "back": "0.1 与 0.2 在二进制下都是无限循环小数，存进有限尾数时已被截断，相加再舍入。", "tags": ["浮点"]}, {"id": "f11", "chapterId": "ch03", "front": "朴素多精度乘法的代价是多少？快速乘法呢？", "back": "朴素 O(n²)；快速乘法 T(n)=3T(n/2)+O(n)，约 O(n^1.585)。", "tags": ["多精度"]}, {"id": "f12", "chapterId": "ch03", "front": "模运算里什么时候可以做除法？", "back": "除数的逆元存在时，条件是 gcd(a, m) = 1。", "tags": ["模算术"]}, {"id": "f13", "chapterId": "ch04", "front": "整数转 b 进制的步骤？", "back": "不断除以 b 记余数，商为 0 后把余数倒着读。", "tags": ["进制"]}, {"id": "f14", "chapterId": "ch04", "front": "秦九韶法则的步骤？", "back": "从最高次系数开始，每次「乘 x 再加下一个系数」，直到常数项。", "tags": ["多项式"]}, {"id": "f15", "chapterId": "ch04", "front": "有理数运算为什么必须约分？", "back": "不约分分子分母会指数膨胀；用欧几里得算法约分后规模可控。", "tags": ["有理数"]}, {"id": "f16", "chapterId": "ch04", "front": "Horner 与进制转换有什么共同点？", "back": "两者都是「从一端开始，每步乘基数再加下一位/下一系数」，是同一个算法。", "tags": ["多项式"]}]}, "pages": {"ch01": {"html": "<h1>第 1 章：随机数是怎么造出来的<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：卷1 第 1 章（算法与代价）、卷1 第 2 章（同余与数论）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清「伪随机数」为什么能替代随机数，以及它替代不了什么。\n<\/li><li>\n写出线性同余法的递推式，手算一小段序列并数出周期。\n<\/li><li>\n用满周期的三个条件判断一组参数行不行。\n<\/li><li>\n解释为什么线性同余的低位不能直接用，模取 2 的幂与取素数各有什么代价。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>计算机造不出真随机，它造的是<strong>周期极长、通过统计检验的确定序列<\/strong>；随机性的保证来自数论，不来自算法有多复杂。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：伪随机数到底「伪」在哪（难度：基础）<\/h3>\n<p>真随机来自物理过程（噪声、放射性衰变）。程序只能做确定运算，所以同一个种子必然产生同一串数。<\/p>\n<p>这看起来是缺陷，实际是优点：<strong>可复现<\/strong>。调试模拟、跑对照实验、复现论文结果，都要求「同样的种子给同样的序列」。真正要避免的是另一件事——序列看起来有规律，比如每 10 个数循环一次，或者低位总是 0 和 1 交替。<\/p>\n<p>所以「伪随机」的合格标准是两条：周期足够长（长到实验跑不完一个周期），统计性质足够像独立均匀分布（过得了检验）。<\/p>\n<p><strong>类比<\/strong>：掷骰子换成按一张极长的数字表往下读。表是印好的（确定），但你不知道从哪一行开始，读出来的数字看起来就是随机的。 <strong>类比失效<\/strong>：真骰子每次掷都独立；数字表只要知道位置就能预测下一个数。密码学场景里这一点是致命的，所以加密用的随机数不能用这种表。<\/p>\n<h3>概念 2：线性同余法（难度：基础）<\/h3>\n<p>最常用的一类发生器，递推只有一行：<\/p>\n<p>x(n+1) = (a·x(n) + c) mod m<\/p>\n<p>四个参数：模 m、乘数 a、增量 c、初值 x0。输出取 x(n) 本身，或取它除以 m 的小数。<\/p>\n<p><strong>手算实例<\/strong>：m = 16，a = 5，c = 3，x0 = 1。<\/p>\n<table><thead><tr><th>n<\/th><th>x(n)<\/th><th>计算<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td>初值<\/td><\/tr><tr><td>1<\/td><td>8<\/td><td>5×1+3 = 8，8 mod 16 = 8<\/td><\/tr><tr><td>2<\/td><td>11<\/td><td>5×8+3 = 43，43 mod 16 = 11<\/td><\/tr><tr><td>3<\/td><td>10<\/td><td>5×11+3 = 58，58 mod 16 = 10<\/td><\/tr><tr><td>4<\/td><td>5<\/td><td>5×10+3 = 53，53 mod 16 = 5<\/td><\/tr><tr><td>5<\/td><td>12<\/td><td>5×5+3 = 28，28 mod 16 = 12<\/td><\/tr><tr><td>6<\/td><td>15<\/td><td>5×12+3 = 63，63 mod 16 = 15<\/td><\/tr><tr><td>7<\/td><td>14<\/td><td>5×15+3 = 78，78 mod 16 = 14<\/td><\/tr><tr><td>8<\/td><td>9<\/td><td>5×14+3 = 73，73 mod 16 = 9<\/td><\/tr><tr><td>9<\/td><td>0<\/td><td>5×9+3 = 48，48 mod 16 = 0<\/td><\/tr><tr><td>10<\/td><td>3<\/td><td>5×0+3 = 3<\/td><\/tr><tr><td>11<\/td><td>2<\/td><td>5×3+3 = 18，18 mod 16 = 2<\/td><\/tr><tr><td>12<\/td><td>13<\/td><td>5×2+3 = 13<\/td><\/tr><tr><td>13<\/td><td>4<\/td><td>5×13+3 = 68，68 mod 16 = 4<\/td><\/tr><tr><td>14<\/td><td>7<\/td><td>5×4+3 = 23，23 mod 16 = 7<\/td><\/tr><tr><td>15<\/td><td>6<\/td><td>5×7+3 = 38，38 mod 16 = 6<\/td><\/tr><tr><td>16<\/td><td>1<\/td><td>5×6+3 = 33，33 mod 16 = 1<\/td><\/tr><\/tbody><\/table>\n<p>第 16 步回到初值 1，所以周期是 16，正好等于模 m。这一串把 0 到 15 全部取了一遍，叫<strong>满周期<\/strong>。<\/p>\n<h3>概念 3：满周期的三个条件（难度：进阶）<\/h3>\n<p>不是随便选 a、c 都能满周期。三个条件同时成立才够：<\/p>\n<ol><li>\n<strong>c 与 m 互素<\/strong>：gcd(c, m) = 1。\n<\/li><li>\n<strong>a − 1 能被 m 的所有素因子整除<\/strong>。\n<\/li><li>\n<strong>若 m 被 4 整除，则 a − 1 也能被 4 整除<\/strong>。\n<\/ol>\n<p>用上面的例子核对：m = 16 = 2⁴，素因子只有 2；c = 3 与 16 互素 ✓；a − 1 = 4 能被 2 整除 ✓；m 被 4 整除，4 也能被 4 整除 ✓。三条齐，所以满周期。<\/p>\n<p><strong>为什么是这三条<\/strong>（直觉版）：第 1 条保证增量能把序列推离 0 的循环，第 2、3 条保证乘数在二进制下「搅得够狠」，让低位也跟着变。<\/p>\n<h3>概念 4：模与乘数怎么挑（难度：进阶）<\/h3>\n<ul><li>\n<strong>模取 2 的幂<\/strong>：取余变成按位与，硬件上极快。代价是低位质量差——模 2^e 时最低位的周期只有 2，次低位只有 4。所以<strong>要用高位，不要用低位<\/strong>。\n<\/li><li>\n<strong>模取素数<\/strong>：例如 m = 2^31 − 1。取余要真做除法，慢一点，但高位低位质量一样，且周期可达 m − 1。\n<\/li><li>\n<strong>纯乘同余（c = 0）<\/strong>：模 2^e 时，乘数取 a ≡ 5 (mod 8)，周期可达 2^(e−2)。\n<\/li><li>\n<strong>势（potency）<\/strong>：衡量乘数把低位搅乱的快慢。势不够，序列的低位会出现明显的短循环，即使整体周期很长。\n<\/ul>\n<p><strong>实例<\/strong>：模 2^32、乘数取 5 的纯乘同余，周期约 2^30，看起来很长；但最低位的周期只有 2，直接用 <code>x % 2<\/code> 会得到 0、1、0、1 的死循环。<\/p>\n<h3>概念 5：其他发生器（难度：进阶）<\/h3>\n<ul><li>\n<strong>平方取中法<\/strong>：把上一个数平方，取中间几位。早期用过，但会退化到 0（一旦出现 0 就永远 0），已被淘汰。\n<\/li><li>\n<strong>滞后斐波那契法<\/strong>：x(n) = x(n−k) + x(n−j) mod m，只用加法，适合硬件；理论分析比线性同余难。\n<\/li><li>\n<strong>组合发生器<\/strong>：把两个发生器的输出相加或异或。周期是两者周期的最小公倍数量级，统计性质通常更好。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 411.34765625 512\" style=\"max-width: 411.34765625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg11\"><style>#svg11{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg11 .error-icon{fill:#552222;}#svg11 .error-text{fill:#552222;stroke:#552222;}#svg11 .edge-thickness-no rm=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">参数合格吗</span></div></foreignObject></g></g><g transform=\"translate(217.95703125, 306)\" data-id=\"OK\" data-node=\"true\" id=\"flowchart-OK-148\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"96.78125\" y=\"-18\" x=\"-48.390625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40.890625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"81.78125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">周期等于 m</span></div></foreignObject></g></g><g transform=\"translate(355.84765625, 306)\" data-id=\"BAD\" data-node=\"true\" id=\"flowchart-BAD-150\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">提前循环</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：图上有一个闭环（生成）和一个判断（参数）。闭环转得快不代表序列好——判断分支不过关，闭环再快也只是在原地打转。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：线性同余像一台齿轮组。模 m 是齿轮的齿数，乘数 a 决定每次转几格，增量 c 决定起点偏移。齿数选得不好，齿轮会在几个位置之间来回咬，永远走不到别的齿。\n<\/li><li>\n类比失效：齿轮的周期一眼能数出来，序列的周期要靠数论算。而且现实中「走遍所有齿」也不等于「看起来随机」——顺序可能极有规律（例如每次固定加 5）。\n<\/ul>\n<p><strong>实例（判断参数）<\/strong>：m = 8，a = 5，c = 4，x0 = 1。<\/p>\n<ul><li>\ngcd(4, 8) = 4 ≠ 1，第 1 条就不过。实际序列：1 → (5+4)=9 mod 8 = 1，立刻回到初值，周期 1。这就是「条件不过关」的直接后果。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为周期长就等于随机性好<\/strong>——实际上周期 2^30 的序列也可能低位全是 0、1 交替。周期只是必要条件。\n<\/li><li>\n<strong>别以为取模 2 的幂又快又好<\/strong>——实际上快是真，低位差也是真。要么取高位，要么换素数模。\n<\/li><li>\n<strong>别以为 <code>rand() % n<\/code> 就能得到均匀的 0 到 n−1<\/strong>——实际上当 n 不整除周期时会偏斜，越靠近 n 的边界越明显。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：线性同余法满周期的条件不包括下列哪一条？\n<p>A. c 与 m 互素 B. a − 1 被 m 的所有素因子整除 C. m 必须是素数 D. m 被 4 整除时 a − 1 也被 4 整除 （答案：C；解析：模可以是 2 的幂，也可以是素数，条件里没有要求 m 必须是素数。）<\/p>\n<\/ol>\n<ol><li>\n填空题：m = 16、a = 5、c = 3、x0 = 1 的线性同余序列，周期是 ___。\n<p>（答案：16；解析：序列走遍 0 到 15 后回到 1，周期等于模 16，属满周期。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么模 2^e 的线性同余发生器不能直接取最低位当随机位？\n<p>（答案：最低位的周期只有 2，会在 0、1 之间交替；第 k 位的周期最多 2^(k+1)，低位都短。解析：模 2 的幂时进位只向上传播，低位看不到高位的变化，所以要用高位。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性同余一行递推：x(n+1) = (a·x(n) + c) mod m。\n<\/li><li>\n满周期三条件：c 与 m 互素、a−1 被 m 的素因子整除、m 被 4 整除时 a−1 也被 4 整除。\n<\/li><li>\n模 2 的幂要取高位；模取素数则高低位质量一致。\n<\/ul>", "kind": "chapter", "title": "第 1 章：随机数是怎么造出来的"}, "ch02": {"html": "<h1>第 2 章：检验随机性，并把随机数用起来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1 章；基础概率\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用卡方统计量判断一组频数是否偏离均匀，并说出自由度怎么定。\n<\/li><li>\n说出柯尔莫哥洛夫检验与卡方检验各自查什么。\n<\/li><li>\n用逆变换法把均匀随机数变成指定分布的随机数。\n<\/li><li>\n写出正确的洗牌算法，并解释常见写法为什么会偏。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>检验不能证明「随机」，只能证明「没查出问题」；用途不同，需要的随机性质也不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：卡方检验（难度：基础）<\/h3>\n<p>把取值范围分成 k 个格子，统计每个格子里实际落了多少个数，与「如果均匀应该落多少」比较。<\/p>\n<p>统计量：χ² = Σ (观测数 − 期望数)² / 期望数。<\/p>\n<p><strong>实例<\/strong>：掷一枚骰子 60 次，六个面分别出现 8、12、9、11、10、10 次。期望每面 10 次。 χ² = (8−10)²/10 + (12−10)²/10 + (9−10)²/10 + (11−10)²/10 + (10−10)²/10 + (10−10)²/10 = (4 + 4 + 1 + 1 + 0 + 0)/10 = 1.0。<\/p>\n<p>自由度 = 格子数 − 1 = 5。查表，5% 显著性水平的临界值约 11.07。1.0 远小于 11.07，所以没有理由认为骰子不均匀。<\/p>\n<p><strong>自由度为什么减 1<\/strong>：六个格子的频数加起来必须等于 60，知道五个就能推出第六个，独立信息只有 5 份。<\/p>\n<p><strong>使用时的一条硬规矩<\/strong>：每个格子的期望频数不能太小（一般要求不小于 5）。期望太小时卡方统计量不服从卡方分布，结论不可靠。解决办法是合并相邻格子。<\/p>\n<h3>概念 2：柯尔莫哥洛夫检验（难度：进阶）<\/h3>\n<p>卡方只看「每个格子多少」，不看「顺序」。柯尔莫哥洛夫检验比较的是<strong>累积分布<\/strong>：<\/p>\n<p>把 n 个观测值排序，得到经验分布函数 F_n(x)（小于等于 x 的比例）。理论分布函数记 F(x)。统计量取两者差的最大值：<\/p>\n<p>D = max |F_n(x) − F(x)|<\/p>\n<p>D 越小越像。它的好处是直接看整体形状，不依赖分格；缺点是只对连续分布好用。<\/p>\n<p><strong>两检验的分工<\/strong>：卡方查「频数是否均匀」，柯尔莫哥洛夫查「形状是否吻合」。前者对局部的偏离敏感，后者对整体的偏移敏感。<\/p>\n<h3>概念 3：谱检验与多维相关（难度：进阶）<\/h3>\n<p>线性同余生成的数对 (x(n), x(n+1)) 落在平面上并不是漫布，而是落在若干条平行直线上。谱检验就是量这些直线之间的最大空隙：空隙越小，分布越像二维均匀。<\/p>\n<p><strong>为什么会出现直线<\/strong>：因为 x(n+1) 是 x(n) 的线性函数取余，相邻两个数满足一个线性关系，落在少数几条斜率为 a 的直线上。三维、四维同理，会落在超平面上。<\/p>\n<p>这也是「乘数不能随便取」的一个原因：乘数选得差，直线少而稀，二维、三维的相关性就肉眼可见。<\/p>\n<h3>概念 4：把均匀数变成别的分布（难度：进阶）<\/h3>\n<p><strong>逆变换法<\/strong>：设目标分布的累积分布函数是 F，取一个均匀随机数 u（0 到 1），令 x = F 的反函数在 u 处的值。<\/p>\n<p><strong>实例（指数分布）<\/strong>：F(x) = 1 − e^(−λx)，反解得 x = −ln(1−u)/λ。取 λ = 2、u = 0.5： x = −ln(0.5)/2 = 0.6931/2 ≈ 0.3466。 核对：F(0.3466) = 1 − e^(−0.6931) = 1 − 0.5 = 0.5，正好对应 u = 0.5。<\/p>\n<p><strong>Box-Muller 法（正态分布）<\/strong>：取两个独立均匀数 u1、u2， z = √(−2 ln u1) · cos(2π u2)。 这样得到的 z 服从标准正态分布。它的直觉是：半径由指数分布决定（−2 ln u1 开方），角度均匀，合起来就是二维正态。<\/p>\n<h3>概念 5：洗牌（难度：进阶）<\/h3>\n<p>要把 n 个元素随机重排，要求 n! 种排列等概率。<\/p>\n<p><strong>正确做法（Fisher-Yates）<\/strong>：从 i = n 递减到 2，随机取 j 在 1 到 i 之间（含），交换第 i 与第 j 个元素。<\/p>\n<p>为什么对：第 i 步时，前 i 个位置里每个元素被换到位置 i 的概率都是 1/i，逐层乘起来每种排列的概率都是 1/n!。<\/p>\n<p><strong>常见错误写法<\/strong>：对每个 i 从 1 到 n，随机取 j 在 1 到 n 之间，交换 i 与 j。这样一共 n^n 种可能，而 n! 通常不整除 n^n，必然有排列比其他排列更常出现。n = 3 时共有 27 种路径要分给 6 种排列，27 不能被 6 整除，偏斜无法避免。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 890.6640625 340\" style=\"max-width: 890.6640625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg12\"><style>#svg12{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg12 .error-icon{fill:#552222;}#svg12 .error-text{fill:#552222;stroke:#552222;}#svg12 .edge-thickness-normal{stroke-width:2px;}#svg12 .edge-thickness-thick{stroke-width:3.5px;}#svg12 .edge-pattern-solid{stroke-dasharray:0;}#svg12 .edge-pattern-dashed{stroke-dasharray:3;}#svg12 .edge-pattern-dotted{stroke-dasharray:2;}#svg12 .marker{fill:#333333;stroke:#333333;}#svg12 .marker.cross{stroke:#333333;}#svg12 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg12 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg12 .cluster-label text{fill:#333;}#svg12 .cluster-label span,#svg12 p{color:#333;}#svg12 .label text,#svg12 span,#svg12 p{fill:#333;color:#333;}#svg12 .node rect,#svg12 .node circle,#svg12 .node ellipse,#svg12 .node polygon,#svg12 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg12 .flowchart-label text{text-anchor:middle;}#svg12 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg12 .node .label{text-align:center;}#svg12 .node.clickable{cursor:pointer;}#svg12 .arrowheadPath{fill:#333333;}#svg12 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg12 .flowchart-link{stroke:#333333;fill:none;}#svg12 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg12 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg12 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg12 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg12 .cluster text{fill:#333;}#svg12 .cluster span,#svg12 p{color:#333;}#svg12 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg12 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg12 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" tern-solid flowchart-link LS-U LE-Q\" id=\"L-U-Q-0\" d=\"M497.141,28.625L469.63,34.021C442.12,39.417,387.099,50.208,359.655,58.971C332.21,67.734,332.342,74.467,332.408,77.834L332.474,81.201\"></path><path marker-end=\"url(#svg12_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-Q LE-I\" id=\"L-Q-I-0\" d=\"M286.779,171.701L255.196,185.167C223.613,198.634,160.447,225.567,128.864,244.067C97.281,262.567,97.281,272.633,97.281,277.667L97.281,282.7\"></path><path marker-end=\"url(#svg12_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-Q LE-B\" id=\"L-Q-B-0\" d=\"M332.578,217.5L332.495,223.333C332.411,229.167,332.245,240.833,332.161,251.7C332.078,262.567,332.078,272.633,332.078,277.667L332.078,282.7\"></path><path marker-end=\"url(#svg12_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-Q LE-R\" id=\"L-Q-R-0\" d=\"M377.924,172.154L408.157,185.545C438.389,198.936,498.855,225.718,529.088,244.142C559.32,262.567,559.32,272.633,559.32,277.667L559.32,282.7\"></path><path marker-end=\"url(#svg12_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-U LE-S\" id=\"L-U-S-0\" d=\"M605.484,28.625L632.995,34.021C660.505,39.417,715.526,50.208,743.036,66.804C770.547,83.4,770.547,105.8,770.547,117L770.547,128.2\"></path><path marker-end=\"url(#svg12_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-S LE-P\" id=\"L-S-P-0\" d=\"M770.547,169.5L770.547,183.333C770.547,197.167,770.547,224.833,770.547,243.7C770.547,262.567,770.547,272.633,770.547,277.667L770.547,282.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/x ect height=\"21\" width=\"93.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">均匀随机数 u</span></div></foreignObject></g></g><g transform=\"translate(332.078125, 151.5)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-152\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">要什么分布</span></div></foreignObject></g></g><g transform=\"translate(97.28125, 306)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-154\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"194.5625\" y=\"-18\" x=\"-97.28125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-89.78125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"179.5625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">逆变换 x 等于 F 的反函数</span></div></foreignObject></g></g><g transform=\"translate(332.078125, 306)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-156\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"175.03125\" y=\"-18\" x=\"-87.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-80.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"160.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Box Muller 两个均匀数</span></div></foreignObject></g></g><g transform=\"translate(559.3203125, 306)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-158\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"179.453125\" y=\"-18\" x=\"-89.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-82.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"164.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">拒绝采样 避免取模偏斜</span></div></foreignObject></g></g><g transform=\"translate(770.546875, 151.5)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-160\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"208.234375\" y=\"-18\" x=\"-104.1171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-96.6171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"193.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">洗牌 Fisher Yates 从后往前</span></div></foreignObject></g></g><g transform=\"translate(770.546875, 306)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-162\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">每种排列概率相等</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：注意「取模」被单独标成需要拒绝采样的分支。这是实践里最常见的坑：直接 <code>% n<\/code> 会偏，尤其当 n 接近发生器周期时。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：卡方检验像检查一副麻将被摸过之后每个花色数量是否接近；柯尔莫哥洛夫检验像把整副牌按大小摊开，看分布曲线贴不贴合标准曲线。\n<\/li><li>\n类比失效：麻将牌数是固定的，随机数的分布是连续或离散无限多种；检验的临界值依赖样本量，样本越大越容易「查出问题」，即使偏差很小。\n<\/ul>\n<p><strong>实例（判断偏斜）<\/strong>：某发生器输出 0 到 9，理论上每个 10%。实测 1000 次，0 出现 130 次，其余 9 个数字共 870 次、平均 96.7 次。 χ² ≈ (130−100)²/100 + 9×(96.7−100)²/100 ≈ 9 + 0.98 ≈ 9.98。 自由度 9，5% 临界值约 16.9。9.98 &lt; 16.9，单看这一项还不算显著；但 0 的偏差已经很明显，值得再查低位。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为检验通过就说明「真随机」<\/strong>——实际上只说明这批数据没暴露问题。换一段、换一个维度可能就查出来了。\n<\/li><li>\n<strong>别以为卡方值越小越好<\/strong>——实际上太小（接近 0）反而可疑，说明观测值与期望值贴合得不像随机抽样。\n<\/li><li>\n<strong>别以为洗牌只要「看起来乱」就行<\/strong>——实际上要求每种排列等概率，错误写法产生的偏斜用肉眼看不出来，但用统计一测就现形。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：掷骰子 60 次，六面各 10 次，卡方统计量是多少？\n<p>A. 0 B. 1 C. 6 D. 10 （答案：A；解析：每项 (10−10)²/10 = 0，总和 0。注意统计量为 0 反而提示「过于整齐」，真实抽样很少这么巧。）<\/p>\n<\/ol>\n<ol><li>\n填空题：卡方检验中，把范围分成 6 个格子，自由度是 ___。\n<p>（答案：5；解析：自由度 = 格子数 − 1 = 6 − 1 = 5，因为六个频数之和被样本量固定。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么「对每个 i 随机与 1 到 n 中某个位置交换」的洗牌不公平？\n<p>（答案：一共 n^n 条执行路径，而目标排列只有 n! 种，n^n 通常不能被 n! 整除，必然有排列被多算、有排列被少算。解析：正确做法是第 i 步只在 1 到 i 中取，路径数恰好是 n!，一一对应。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n卡方：Σ(观测−期望)²/期望，自由度 = 格子数 − 1，期望频数不小于 5。\n<\/li><li>\n柯尔莫哥洛夫看累积分布的最大差，查形状；卡方查频数。\n<\/li><li>\n洗牌从后往前，每步只在 1 到 i 中取。\n<\/ul>", "kind": "chapter", "title": "第 2 章：检验随机性，并把随机数用起来"}, "ch03": {"html": "<h1>第 3 章：浮点与多精度算术<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章；二进制基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清浮点数的三部分结构，解释为什么 0.1 加 0.2 不等于 0.3。\n<\/li><li>\n举一个灾难性抵消的例子并说明原因。\n<\/li><li>\n用数组表示大整数，写出多精度加法与朴素乘法的代价。\n<\/li><li>\n说清快速乘法为什么能把 O(n²) 降到约 O(n^1.585)。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>浮点数的本质是「用固定位数的科学计数法表示实数」，<strong>能表示的数只有有限多个<\/strong>；多精度算术的本质是「把大数切块，用整数运算模拟手算竖式」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：浮点数的三部分（难度：基础）<\/h3>\n<p>一个浮点数由三部分构成：<\/p>\n<ul><li>\n<strong>符号位<\/strong>：正或负。\n<\/li><li>\n<strong>指数<\/strong>：决定数量级，相当于科学计数法里的 10 的几次方，只不过底数是 2。\n<\/li><li>\n<strong>尾数<\/strong>（也叫有效数字）：决定精度，相当于科学计数法里小数点后的那串数字。\n<\/ul>\n<p>双精度（64 位）里，尾数占 52 位，加上隐含的 1 位共 53 位有效二进制位。53 位约等于 15.95 位十进制数字，所以说双精度有「约 16 位有效数字」。<\/p>\n<p><strong>类比<\/strong>：浮点像一把只有 16 个刻度的尺子，量什么都能量，但只能记到 16 位。量一栋楼和量一颗螺丝，绝对精度不同，相对精度一样。 <strong>类比失效<\/strong>：尺子的刻度是均匀的，浮点数的刻度随指数变化——数值越大，相邻两个可表示数的间隔越大（这个间隔叫 ulp）。<\/p>\n<h3>概念 2：0.1 加 0.2 为什么不等于 0.3（难度：进阶）<\/h3>\n<p>0.1 在二进制下是无限循环小数：0.000110011001100…（1100 循环）。有限位的尾数只能截断，存进去的已经不是精确的 0.1，而是一个略大或略小的近似值。<\/p>\n<p>0.2 同理。两个近似值相加，再舍入到最近的 53 位，结果可能是 0.30000000000000004。<\/p>\n<p><strong>这不是程序的 bug，是表示方式的必然结果<\/strong>。<\/p>\n<p><strong>推论一<\/strong>：不要用 <code>==<\/code> 比较两个浮点数，要比较差值是否小于容差。 <strong>推论二<\/strong>：判断「0.1 + 0.2 是否等于 0.3」这类问题，答案永远是「按位比较不等，按数学期望相等」。<\/p>\n<p><strong>灾难性抵消<\/strong>：两个相近的大数相减，有效位会被「抵消」掉。 实例：双精度下 1e16 + 1 的结果仍是 1e16。因为 1e16 附近的 ulp 是 2，加 1 不足半个 ulp，被舍入掉了。再减 1e16 得到 0，而数学上应该是 1。<\/p>\n<h3>概念 3：多精度加法的代价（难度：基础）<\/h3>\n<p>把大整数按基数 b 切块，存进数组，低位在前。例如十进制 123456 存成 [6, 5, 4, 3, 2, 1]（每块一位），或按千进制存成 [456, 123]。<\/p>\n<p><strong>加法<\/strong>：从低位到高位逐块相加，处理进位。n 块需要 n 次加法加 n 次进位判断，代价 O(n)。 <strong>减法<\/strong>：同理，借位从高位借。 <strong>比较<\/strong>：从最高块往下比，第一个不同的块决定大小。<\/p>\n<h3>概念 4：朴素乘法的代价（难度：进阶）<\/h3>\n<p>竖式乘法：用第二个数的每一位去乘第一个数的每一位，再把结果错位相加。<\/p>\n<p><strong>实例<\/strong>：47 × 23。<\/p>\n<ul><li>\n3 × 47 = 141\n<\/li><li>\n2 × 47 = 94，整体左移一位得 940\n<\/li><li>\n141 + 940 = 1081\n<\/ul>\n<p>代价：n 位乘 n 位，要做 n² 次单位乘法、约 n² 次加法。所以朴素多精度乘法是 O(n²)。<\/p>\n<p><strong>为什么这很重要<\/strong>：RSA 加密要乘几百位、几千位的整数，O(n²) 在 n = 4096 位时是 1600 万次单位乘法，太慢。这就是快速乘法的动机。<\/p>\n<h3>概念 5：快速乘法（难度：高难）<\/h3>\n<p>把两个 n 位数各切成高低两半：<\/p>\n<p>X = X1·b^(n/2) + X0，Y = Y1·b^(n/2) + Y0<\/p>\n<p>直接展开要算四次半规模乘法：X1Y1、X1Y0、X0Y1、X0Y0。<\/p>\n<p>Karatsuba 的技巧是只算三次：<\/p>\n<ol><li>\nP1 = X1·Y1\n<\/li><li>\nP2 = X0·Y0\n<\/li><li>\nP3 = (X1 + X0)(Y1 + Y0)\n<\/ol>\n<p>中间项 X1Y0 + X0Y1 = P3 − P1 − P2，不用再乘。<\/p>\n<p>于是 T(n) = 3T(n/2) + O(n)。展开得 T(n) = O(n^log2 3) ≈ O(n^1.585)。n = 4096 时，n^1.585 约 4.6×10⁵ 量级，比 n² 的 1.6×10⁷ 小一个多数量级。<\/p>\n<p><strong>代价<\/strong>：多做了几次加减法，但加减是 O(n)，比省下的一次 O(n²) 乘法划算。<\/p>\n<h3>概念 6：模算术（难度：进阶）<\/h3>\n<p>模 m 的算术只保留余数。加、减、乘都可以先算再取余；除法要先求逆元。<\/p>\n<p><strong>实例<\/strong>：模 7 下，3 × 5 = 15 ≡ 1，所以 3 的逆元是 5，5 的逆元是 3。要求 3 除 2（即 2 × 3 的逆元），就是 2 × 5 = 10 ≡ 3。<\/p>\n<p><strong>为什么除法难<\/strong>：不是所有数都有逆元。模 6 下，2 没有逆元，因为 2x ≡ 1 (mod 6) 无解（左边永远是偶数）。有逆元的充要条件是 gcd(a, m) = 1。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 483.93359375 512\" style=\"max-width: 483.93359375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg13\"><style>#svg13{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg13 .error-icon{fill:#552222;}#svg13 .error-text{fill:#552222;stroke:#552222;}#svg13 .edge-thickness-normal{stroke-width:2px;}#svg13 .edge-thickness-thick{stroke-width:3.5px;}#svg13 .edge-pattern-solid{stroke-dasharray:0;}#svg13 .edge-pattern-dashed{stroke-dasharray:3;}#svg13 .edge-pattern-dotted{stroke-dasharray:2;}#svg13 .marker{fill:#333333;stroke:#333333;}#svg13 .marker.cross{stroke:#333333;}#svg13 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg13 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg13 .cluster-label text{fill:#333;}#svg13 .cluster-label span,#svg13 p{color:#333;}#svg13 .label text,#svg13 span,#svg13 p{fill:#333;color:#333;}#svg13 .node rect,#svg13 .node circle,#svg13 .node ellipse,#svg13 .node polygon,#svg13 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg13 .flowchart-label text{text-anchor:middle;}#svg13 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg13 .node .label{text-align:center;}#svg13 .node.clickable{cursor:pointer;}#svg13 .arrowheadPath{fill:#333333;}#svg13 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg13 .flowchart-link{stroke:#333333;fill:none;}#svg13 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg13 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg13 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg13 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px; container\"></rect><g transform=\"translate(-65.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"130.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">朴素乘法 O n 平方</span></div></foreignObject></g></g><g transform=\"translate(200.078125, 478)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-174\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"163.453125\" y=\"-18\" x=\"-81.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-74.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"148.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快速乘法 三次半规模</span></div></foreignObject></g></g><g transform=\"translate(389.76171875, 392)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-176\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"125.25\" y=\"-18\" x=\"-62.625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-55.125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"110.25\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">注意 ulp 与抵消</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：左边是「精度够用」的路径，右边是「精度必须自己管」的路径。两条路径的交界不在数值大小，而在所需有效位数——几百位的整数用浮点存，尾数根本不够。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：浮点像用科学计数法记测量值，只保留固定几位；多精度像用算盘，一位一位地拨，位子有多少就能算多少位。\n<\/li><li>\n类比失效：算盘的位数是硬件固定的，多精度数组可以按需加长；而浮点的尾数位数是硬性上限，加长不了。\n<\/ul>\n<p><strong>实例（多精度加法）<\/strong>：按千进制算 987654 + 123456。<\/p>\n<ul><li>\n低位块：654 + 456 = 1110，写 110，进位 1\n<\/li><li>\n高位块：987 + 123 + 1 = 1111，写 1111\n<\/li><li>\n结果 1111110。核对十进制：987654 + 123456 = 1,111,110，对得上。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为浮点误差是「程序写错了」<\/strong>——实际上是二进制表示十进制小数的固有损失。\n<\/li><li>\n<strong>别以为 double 比 float 精确两倍<\/strong>——实际上双精度尾数 53 位、单精度 24 位，有效位数差了约一倍，可表示的数值范围也差很多。\n<\/li><li>\n<strong>别以为快速乘法在所有规模上都更快<\/strong>——实际上 n 很小时递归与加减开销超过收益，通常要设一个阈值，小规模退回朴素乘法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：双精度浮点数的尾数（含隐含位）是多少位？\n<p>A. 24 B. 32 C. 53 D. 64 （答案：C；解析：双精度尾数 52 位加隐含的 1 位共 53 位，约 16 位十进制有效数字。）<\/p>\n<\/ol>\n<ol><li>\n填空题：快速乘法的递归式 T(n) = 3T(n/2) + O(n) 给出的复杂度指数约为 ___（填三位小数）。\n<p>（答案：1.585；解析：指数是 log2 3 ≈ 1.58496，取三位是 1.585。）<\/p>\n<\/ol>\n<ol><li>\n简答题：双精度下 1e16 + 1 − 1e16 的结果是多少？为什么？\n<p>（答案：0；解析：1e16 附近相邻可表示数的间隔 ulp 为 2，加 1 不到半个 ulp，被舍入回 1e16；再减 1e16 得 0，而数学上应为 1。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n浮点 = 符号 + 指数 + 尾数，尾数位数决定精度。\n<\/li><li>\n0.1 在二进制下无限循环，所以 0.1 + 0.2 ≠ 0.3 是必然。\n<\/li><li>\n朴素多精度乘法 O(n²)，快速乘法约 O(n^1.585)。\n<\/li><li>\n模运算的加减乘直接做，除法要先求逆元，条件是 gcd(a, m) = 1。\n<\/ul>", "kind": "chapter", "title": "第 3 章：浮点与多精度算术"}, "ch04": {"html": "<h1>第 4 章：进制、有理数与多项式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 3 章（多精度）；卷1 第 2 章（求和与数论）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「除基取余」把十进制转成任意进制，用「乘基累加」转回来。\n<\/li><li>\n说清有理数运算为什么必须先做约分，以及欧几里得算法的平均代价。\n<\/li><li>\n用秦九韶法则（Horner）在 n 次乘加内算出一个 n 次多项式的值。\n<\/li><li>\n说清多项式乘法与快速幂各自的代价。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章的所有算法都在做同一件事：<strong>把「位」和「系数」当成可以逐位处理的对象<\/strong>。进制转换处理位，多项式处理系数，形式完全同构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：进制转换（难度：基础）<\/h3>\n<p><strong>十进制转 b 进制（整数部分）<\/strong>：不断用 b 去除，记下余数，直到商为 0，再把余数倒着读。<\/p>\n<p><strong>实例<\/strong>：100 转二进制。<\/p>\n<ul><li>\n100 ÷ 2 = 50 余 0\n<\/li><li>\n50 ÷ 2 = 25 余 0\n<\/li><li>\n25 ÷ 2 = 12 余 1\n<\/li><li>\n12 ÷ 2 = 6 余 0\n<\/li><li>\n6 ÷ 2 = 3 余 0\n<\/li><li>\n3 ÷ 2 = 1 余 1\n<\/li><li>\n1 ÷ 2 = 0 余 1\n<\/ul>\n<p>余数从后往前读：1100100。核对：64 + 32 + 4 = 100 ✓。<\/p>\n<p><strong>b 进制转十进制<\/strong>：从最高位开始，每次「当前值 × b + 下一位」。 1100100 转十进制：1 → 1×2+1=3 → 3×2+0=6 → 6×2+0=12 → 12×2+1=25 → 25×2+0=50 → 50×2+0=100 ✓。<\/p>\n<p>注意这两步与多项式求值是同一个算法——1100100 就是多项式 1·2⁶ + 1·2⁵ + 0·2⁴ + … + 0·2⁰。<\/p>\n<p><strong>小数部分<\/strong>要反过来：不断乘 b，取整数部分，直到小数部分为 0 或达到所需位数。0.625 转二进制：0.625×2=1.25 取 1；0.25×2=0.5 取 0；0.5×2=1.0 取 1，得 0.101。核对：1/2 + 0 + 1/8 = 0.625 ✓。<\/p>\n<h3>概念 2：有理数算术（难度：进阶）<\/h3>\n<p>用分子分母一对整数表示分数，每次运算后约分。<\/p>\n<ul><li>\n加法：a/b + c/d = (ad + bc)/(bd)，然后约分。\n<\/li><li>\n乘法：ac/(bd)，约分。\n<\/li><li>\n比较：交叉相乘 ad 与 bc。\n<\/ul>\n<p><strong>为什么必须约分<\/strong>：不约分的话，分子分母会指数级膨胀。连加 20 个分母互不相同的分数，不约分时分母是 20 个数的乘积，位数爆炸；约分后规模可控。<\/p>\n<p><strong>约分的代价<\/strong>：一次 gcd，用欧几里得算法。它的步数平均约为 0.84 倍的自然对数（ln n），也就是说 n 有 100 位十进制时，平均只要几百步。<\/p>\n<p><strong>实例<\/strong>：1/6 + 1/4 = (4 + 6)/24 = 10/24 = 5/12。不约分是 10/24，约分后 5/12，数值相同但分母小一半。<\/p>\n<h3>概念 3：多项式的表示与求值（难度：进阶）<\/h3>\n<p>n 次多项式写成 a(n)x^n + … + a1x + a0，用系数数组表示，数组下标就是次数。<\/p>\n<p><strong>秦九韶法则（Horner）<\/strong>：从最高次开始，每次「乘 x，再加下一个系数」。<\/p>\n<p><strong>实例<\/strong>：p(x) = 2x³ + 3x² + 5x + 7，求 p(2)。<\/p>\n<ul><li>\n取最高系数 2\n<\/li><li>\n2×2 + 3 = 7\n<\/li><li>\n7×2 + 5 = 19\n<\/li><li>\n19×2 + 7 = 45\n<\/ul>\n<p>直接代入核对：2×8 + 3×4 + 5×2 + 7 = 16 + 12 + 10 + 7 = 45 ✓。<\/p>\n<p>代价：n 次乘法加 n 次加法，O(n)。若按定义逐项算幂，是 O(n²)。<\/p>\n<h3>概念 4：多项式除法与幂的计算（难度：进阶）<\/h3>\n<p><strong>多项式除法<\/strong>：像整数长除法，用被除数的最高次项除以除数的最高次项，得到商的一项，乘回去减掉，重复。<\/p>\n<p><strong>实例<\/strong>：(x² + 3x + 2) ÷ (x + 1)。<\/p>\n<ul><li>\n最高项 x² ÷ x = x，商记 x\n<\/li><li>\nx(x + 1) = x² + x，相减得 2x + 2\n<\/li><li>\n2x ÷ x = 2，商记 2\n<\/li><li>\n2(x + 1) = 2x + 2，相减得 0\n<\/ul>\n<p>商是 x + 2，余数 0。核对：(x + 1)(x + 2) = x² + 3x + 2 ✓。<\/p>\n<p><strong>快速幂<\/strong>：要算 x^15，不要连乘 15 次。用二进制展开 15 = 1111₂： x → x² → x³ → x⁶ → x⁷ → x¹⁴ → x¹⁵，共 6 次乘法（3 次平方、3 次相乘）。通用地，指数为 n 时约需 1.5 log2 n 次乘法。<\/p>\n<h3>概念 5：幂级数（难度：高难）<\/h3>\n<p>幂级数是无穷次的多项式，用来近似函数：e^x = 1 + x + x²/2! + x³/3! + …。<\/p>\n<p><strong>常见操作与代价<\/strong>：<\/p>\n<ul><li>\n求值：截断到 n 项，用秦九韶，O(n)。\n<\/li><li>\n加法、减法：逐项，O(n)。\n<\/li><li>\n乘法（卷积）：第 k 项系数是 Σ a(i)b(k−i)，O(n²)。快速傅里叶变换可降到 O(n log n)。\n<\/li><li>\n复合 f(g(x))：朴素做法 O(n²) 甚至 O(n³)。\n<\/li><li>\n求逆：已知 f 求 g 使 fg = 1，逐项递推，O(n²)。\n<\/ul>\n<p><strong>为什么算法分析关心幂级数<\/strong>：生成函数（卷1 第 2 章）就是形式幂级数。解递推式、算平均代价，最后都落到「求一个幂级数的系数」上。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 960.4375 512\" style=\"max-width: 960.4375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg14\"><style>#svg14{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg14 .error-icon{fill:#552222;}#svg14 .error-text{fill:#552222;stroke:#552222;}#svg14 .edge-thickness-normal{stroke-width:2px;}#svg14 .edge-thickness-thick{stroke-width:3.5px;}#svg14 .edge-pattern-solid{stroke-dasharray:0;}#svg14 .edge-pattern-dashed{stroke-dasharray:3;}#svg14 .edge-pattern-dotted{stroke-dasharray:2;}#svg14 .marker{fill:#333333;stroke:#333333;}#svg14 .marker.cross{stroke:#333333;}#svg14 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg14 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg14 .cluster-label text{fill:#333;}#svg14 .cluster-label span,#svg14 p{color:#333;}#svg14 .label text,#svg14 span,#svg14 p{fill:#333;color:#333;}#svg14 .node rect,#svg14 .node circle,#svg14 .node ellipse,#svg14 .node polygon,#svg14 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg14 .flowchart-label text{text-anchor:middle;}#svg14 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg14 .node .label{text-align:center;}#svg14 .node.clickable{cursor:pointer;}#svg14 .arrowheadPath{fill:#333333;}#svg14 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg14 .flowchart-link{stroke:#333333;fill:none;}#svg14 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg14 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg14 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg14 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg14 .cluster text{fill:#333;}#svg14 .cluster span,#svg14 =\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多项式</span></div></foreignObject></g></g><g transform=\"translate(262.296875, 392)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-184\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"129.6875\" y=\"-18\" x=\"-64.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-57.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"114.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">求值 秦九韶 O n</span></div></foreignObject></g></g><g transform=\"translate(452.203125, 392)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-186\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"150.125\" y=\"-18\" x=\"-75.0625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-67.5625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"135.125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘法 卷积 O n 平方</span></div></foreignObject></g></g><g transform=\"translate(662.125, 392)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-188\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"169.71875\" y=\"-18\" x=\"-84.859375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-77.359375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"154.71875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">幂 快速幂 约 1.5 log n</span></div></foreignObject></g></g><g transform=\"translate(870.7109375, 392)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-190\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">幂级数 求逆与复合</span></div></foreignObject></g></g><g transform=\"translate(168.01171875, 478)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-192\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">同一个算法换个名字</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：最后一条箭头是这张图的关键——进制转换的「乘基累加」和多项式求值的「乘 x 加系数」是同一个算法。看懂这一层，两章内容就合成一章。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：多项式像一列火车，每节车厢装一个系数，次数就是车厢编号。求值就是从头走到尾，每节车厢做一次「乘 x 再加」。\n<\/li><li>\n类比失效：火车的车厢数有限，幂级数是无限节；截断到第 n 项的误差必须单独分析，类比里没有这一层。\n<\/ul>\n<p><strong>实例（快速幂）<\/strong>：算 3^13。13 = 1101₂，即 8 + 4 + 1。<\/p>\n<ul><li>\n从 x = 3 开始（最高位 1 已计入）。\n<\/li><li>\n读到下一位 1：3² × 3 = 27（两次乘法）。\n<\/li><li>\n读到下一位 0：27² = 729（一次乘法）。\n<\/li><li>\n读到下一位 1：729² × 3 = 531441 × 3 = 1,594,323（两次乘法）。\n<\/ul>\n<p>合计 5 次乘法。核对：3^10 = 59,049，3^13 = 59,049 × 27 = 1,594,323 ✓。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为进制转换只用除法<\/strong>——整数部分用除，小数部分用乘，两者方向相反。\n<\/li><li>\n<strong>别以为多项式乘法就是系数逐个相乘<\/strong>——实际上第 k 项系数是所有下标和为 k 的乘积之和（卷积）。\n<\/li><li>\n<strong>别以为 Horner 只省时间不省空间<\/strong>——实际上它只用一个临时变量，空间也是 O(1)。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：十进制 100 的二进制表示是？\n<p>A. 1100100 B. 1001100 C. 1010100 D. 1110000 （答案：A；解析：64+32+4 = 100，对应位是第 6、5、2 位为 1，即 1100100。）<\/p>\n<\/ol>\n<ol><li>\n填空题：用秦九韶法则算 p(x) = 2x³ + 3x² + 5x + 7 在 x = 2 处的值，结果是 ___。\n<p>（答案：45；解析：2 → 2×2+3=7 → 7×2+5=19 → 19×2+7=45，与直接代入 16+12+10+7=45 一致。）<\/p>\n<\/ol>\n<ol><li>\n简答题：算 x^15 最少需要多少次乘法？给出过程。\n<p>（答案：6 次；解析：x²、x³、x⁶、x⁷、x¹⁴、x¹⁵ 各一次乘法，其中 x²、x⁶、x¹⁴ 是平方，其余是乘 x。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n整数转进制用除基取余、倒读；小数用乘基取整。\n<\/li><li>\n秦九韶：从最高次开始「乘 x 加系数」，O(n)。\n<\/li><li>\n快速幂按二进制位走，约 1.5 log2 n 次乘法。\n<\/li><li>\nHorner 与进制转换是同一个算法。\n<\/ul>", "kind": "chapter", "title": "第 4 章：进制、有理数与多项式"}, "c01": {"html": "<h1>线性同余发生器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性同余发生器用一条递推产生伪随机序列：x(n+1) = (a·x(n) + c) mod m，用模运算把状态压在 0 到 m−1 之间。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是历史上用得最广、分析得最透的伪随机数算法。理解它的三个参数如何决定周期，就理解了一个基本事实：伪随机性的质量有数论上的硬约束，不是调参调出来的。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 437.59375 87\" style=\"max-width: 437.59375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg15\"><style>#svg15{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg15 .error-icon{fill:#552222;}#svg15 .error-text{fill:#552222;stroke:#552222;}#svg15 .edge-thickness-normal{stroke-width:2px;}#svg15 .edge-thickness-thick{stroke-width:3.5px;}#svg15 .edge-pattern-solid{stroke-dasharray:0;}#svg15 .edge-pattern-dashed{stroke-dasharray:3;}#svg15 .edge-pattern-dotted{stroke-dasharray:2;}#svg15 .marker{fill:#333333;stroke:#333333;}#svg15 .marker.cross{stroke:#333333;}#svg15 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg15 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg15 .clust efault flowchart-label\"><rect height=\"33\" width=\"36.34375\" y=\"-16.5\" x=\"-18.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-10.671875, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"21.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">x n</span></div></foreignObject></g></g><g transform=\"translate(124.9609375, 18)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-196\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"77.234375\" y=\"-18\" x=\"-38.6171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-31.1171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"62.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘 a 加 c</span></div></foreignObject></g></g><g transform=\"translate(256.1875, 18)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-198\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"85.21875\" y=\"-18\" x=\"-42.609375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-35.109375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"70.21875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">对 m 取余</span></div></foreignObject></g></g><g transform=\"translate(385.1953125, 44.5)\" data-id=\"Y\" data-node=\"true\" id=\"flowchart-Y-200\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"72.796875\" y=\"-18\" x=\"-36.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-28.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"57.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">x n 加一</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看这个环：状态只有 m 个可能值，所以周期必然不超过 m。满周期就是把 m 个值全走一遍。<\/p>\n<h2>详解<\/h2>\n<p><strong>参数的作用<\/strong>：<\/p>\n<ul><li>\nm 决定状态空间大小，也就是周期的上限。\n<\/li><li>\na 决定状态怎么跳。\n<\/li><li>\nc 决定是否包含 0 这个状态；c = 0 时叫纯乘同余，0 是死点，必须避开。\n<\/ul>\n<p><strong>满周期三条件<\/strong>：gcd(c, m) = 1；a−1 被 m 的所有素因子整除；m 被 4 整除时 a−1 也被 4 整除。<\/p>\n<p><strong>实例<\/strong>：m=16、a=5、c=3、x0=1，三条全满足，序列走遍 0 到 15，周期 16。<\/p>\n<p><strong>取余的代价<\/strong>：模取 2 的幂可用按位与代替除法，但低位周期短（第 k 位周期最多 2^(k+1)）；模取素数高低位都长，但要真除法。实践里常见做法是模取 2^31−1，或用两个发生器组合。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为周期等于 m 就好：顺序可能极有规律，还要看谱检验。\n<\/li><li>\n别以为改种子能提高质量：种子只改变起点，不改周期结构。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.2.1<\/td><td>线性同余<\/td><td>递推式与满周期条件<\/td><\/tr><tr><td>3.2.1.3<\/td><td>势<\/td><td>乘数对低位的混合速度<\/td><\/tr><tr><td>3.3<\/td><td>检验<\/td><td>谱检验查多维相关性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：卷1 第 2 章的模运算\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">卡方检验<\/a>\n<\/ul>", "kind": "concept", "title": "线性同余发生器"}, "c02": {"html": "<h1>卡方检验<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>卡方检验比较观测频数与理论期望频数的偏差，把所有格子的「偏差平方除以期望」加起来得到一个统计量，再与临界值比较。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是检验伪随机数均匀性最常用的工具，也是所有「实际分布是否符合预期」问题的通用模板。理解了它，就理解了假设检验的基本逻辑：先假设「没问题」，再看数据偏离得是否离谱。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 356.453125 700\" style=\"max-width: 356.453125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg16\"><style>#svg16{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg16 .error-icon{fill:#552 rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">没有理由否定均匀</span></div></foreignObject></g></g><g transform=\"translate(266.7265625, 666)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-216\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">显著偏离 需查原因</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看最后的分叉：结论只有「没查出问题」与「查出问题」两种，不存在「证明均匀」。<\/p>\n<h2>详解<\/h2>\n<p>公式：χ² = Σ (O − E)² / E。<\/p>\n<p><strong>实例<\/strong>：骰子 60 次，六面计数 8、12、9、11、10、10，期望各 10。 χ² = (4+4+1+1+0+0)/10 = 1.0。自由度 5，5% 临界值 11.07，1.0 远小于它，不显著。<\/p>\n<p><strong>自由度<\/strong>：格子数减 1。因为频数总和被样本量固定，最后一个格子的值是推出来的。<\/p>\n<p><strong>期望频数下限<\/strong>：每格期望不小于 5，否则卡方分布近似失效，要合并格子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为卡方值小就一定好：接近 0 说明「整齐得不像抽样」。\n<\/li><li>\n别以为通过检验就证明随机：只证明这批数据没暴露问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.3.1<\/td><td>一般检验过程<\/td><td>卡方的构造与自由度<\/td><\/tr><tr><td>3.3.2<\/td><td>经验检验<\/td><td>对具体发生器做卡方<\/td><\/tr><tr><td>3.3.4<\/td><td>谱检验<\/td><td>另一种相关性的检验<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">线性同余发生器<\/a>\n<\/li><li>\n后续：卷3 排序的平均情况分析\n<\/ul>", "kind": "concept", "title": "卡方检验"}, "c03": {"html": "<h1>秦九韶法则与多精度乘法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>秦九韶法则（Horner）把 n 次多项式求值化成 n 次乘加；多精度乘法把大整数切块，用竖式逐块相乘，朴素代价 O(n²)。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两件事看起来无关，其实共享同一个思路：<strong>把高次问题拆成逐层递推<\/strong>。秦九韶把「求幂」拆成「每层乘一次 x」；多精度乘法把「大数相乘」拆成「小块相乘再进位」。后者再往前走一步，就是快速乘法。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 400.4609375 396\" style=\"max-width: 400.4609375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg17\"><style>#svg17{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg17 .error-icon{fill:#552222;}#svg17 .error-text{fill:#552222;stroke:#552222;}#svg17 .edge-thickness-normal{stroke-width:2px;}#svg17 .edge-thickness-thick{stroke-width:3.5px;}#svg17 .edge-pattern-solid{stroke-dasharray:0;}#svg17 .edge-pattern-dashed{stroke-dasharray:3;}#svg17 .edge-pattern-dotted{stroke-dasharray:2;}#svg17 .marker{fill:#333333;stroke:#333333;}#svg17 .marker.cross{stroke:#333333;}#svg17 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg17 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg17 .cluster-label text{fill:#333;}#svg17 .cluster-label span,#svg17 p{color:#333;}#svg17 .label text,#svg17 span,#svg17 p{fill:#333;color:#333;}#svg17 .node rect,#svg17 .node circle,#svg17 .node ellipse,#svg17 .node polygon,#svg17 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg17 .flowchart-label text{text-anchor:middle;}#svg17 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg17 .node .label{text-align:center;}#svg17 .node.clickable{cursor:pointer;}#svg17 .arrowheadPath{fill:#333333;}#svg17 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg17 .flowchart-link{stroke:#333333;fill:none;}#svg17 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg17 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg17 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg17 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg17 .cluster text{fill:#333;}#svg17 .cluster span,#svg17 p{color:#33
