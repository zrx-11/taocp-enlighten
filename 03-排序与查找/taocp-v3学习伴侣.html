 transform=\"translate(225.15234375, 338)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-294\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"118.140625\" y=\"-18\" x=\"-59.0703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-51.5703125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"103.140625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">二分查找 log n</span></div></foreignObject></g></g><g transform=\"translate(225.15234375, 503.5)\" data-id=\"T\" data-node=\"true\" id=\"flowchart-T-296\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-97.5,97.5)\" class=\"label-container\" points=\"97.5,0 195,-97.5 97.5,-195 0,-97.5\"></polygon><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">需要动态插入删除吗</span></div></foreignObject></g></g><g transform=\"translate(110.1875, 690)\" data-id=\"BST\" data-node=\"true\" id=\"flowchart-BST-298\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"220.375\" y=\"-18\" x=\"-110.1875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-102.6875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"205.375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">二叉查找树 平均 log n 最坏 n</span></div></foreignObject></g></g><g transform=\"translate(110.1875, 776)\" data-id=\"AVL\" data-node=\"true\" id=\"flowchart-AVL-300\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"187.5\" y=\"-18\" x=\"-93.75\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-86.25, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"172.5\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">AVL 或红黑树 最坏 log n</span></div></foreignObject></g></g><g transform=\"translate(340.1171875, 690)\" data-id=\"BT\" data-node=\"true\" id=\"flowchart-BT-302\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"139.484375\" y=\"-18\" x=\"-69.7421875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-62.2421875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"124.484375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">B 树 层数 log m n</span></div></foreignObject></g></g><g transform=\"translate(404.60546875, 167.5)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-304\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-81.5,81.5)\" class=\"label-container\" points=\"81.5,0 163,-81.5 81.5,-163 0,-81.5\"></polygon><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">键是定长数字吗</span></div></foreignObject></g></g><g transform=\"translate(404.60546875, 338)\" data-id=\"TR\" data-node=\"true\" id=\"flowchart-TR-306\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"105.671875\" y=\"-18\" x=\"-52.8359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-45.3359375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"90.671875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">trie 按位分支</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：三个判断依次收窄选择。最后一条分支提醒：键的结构本身也能当索引，不必只依赖大小比较。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：顺序查找像在一叠没编号的文件里翻；二分查找像查字典，每次翻到中间看该往前还是往后；B 树像图书馆先分楼层、再分书架、再分格子。\n<\/li><li>\n类比失效：字典的「中间」是物理页，翻页有成本；B 树把多个键塞进一个节点，正是为了把「翻页次数」压低到与层数同阶。\n<\/ul>\n<p><strong>实例（AVL 旋转）<\/strong>：插入后出现「左左」失衡（左子树的左子树过高），做一次右旋：把左孩子提为根，原根变为它的右孩子，左孩子原来的右子树挂到原根的左边。旋转后高度恢复，中序顺序不变。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为二分查找总比顺序查找快<\/strong>——实际上 n 很小时（比如小于 10），二分的前期开销与分支预测损失可能让它更慢。\n<\/li><li>\n<strong>别以为二叉查找树平均 O(log n) 就够用<\/strong>——实际上最坏会退化成链，必须加平衡机制。\n<\/li><li>\n<strong>别以为 B 树是为了「比较次数少」<\/strong>——实际上它每个节点比较次数不少，省的是磁盘 I/O 次数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：在 1 到 9 的有序数组里二分查找 7，需要多少次比较？（填数字）\n<p>（答案：2；解析：先比中间 5，7 大于 5；再在 6 到 9 中比中间 7，命中。）<\/p>\n<\/ol>\n<ol><li>\n单选题：二叉查找树最坏情况下的查找代价是？\n<p>A. O(1) B. O(log n) C. O(n) D. O(n log n) （答案：C；解析：按升序插入会退化成链，查找退化为顺序扫描。）<\/p>\n<\/ol>\n<ol><li>\n简答题：10 亿个键，B 树每个节点 100 个孩子，大约几层？为什么这很重要？\n<p>（答案：约 5 层，因为 log_100(10⁹) = 4.5。每层通常一次磁盘读，5 次读远少于二叉树的约 30 次，直接决定索引的响应时间。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n顺序查找平均 (n+1)/2；二分最坏约 log2 n，但要求有序且可随机访问。\n<\/li><li>\n二叉查找树平均 1.39 log2 n，最坏 n；AVL 把最坏压到约 1.44 log2 n。\n<\/li><li>\nB 树用高扇出把层数降到 log_m n，省的是 I/O。\n<\/ul>", "ch06": "<h1>第 6 章：散列查找与辅助键<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 5 章；模运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n选一个像样的散列函数，并说清模为什么常取素数。\n<\/li><li>\n比较链地址法与开放地址法的代价，用装载因子估算平均查找长度。\n<\/li><li>\n解释线性探测的「一次聚集」问题，以及双散列怎么缓解。\n<\/li><li>\n说清辅助键与倒排索引解决的问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>散列把「比较」换成「计算」：不靠键的大小顺序，而靠一个函数把键直接映射到位置；代价从 log n 变成常数级，前提是冲突可控。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：散列函数（难度：基础）<\/h3>\n<p>散列函数把键映射到 0 到 m−1 的槽位。理想情况下，不同键均匀落到不同槽。<\/p>\n<p><strong>除法散列<\/strong>：h(k) = k mod m。<\/p>\n<ul><li>\nm 取素数，且离 2 的幂远一些。若 m = 2^p，则只取键的低 p 位，键的低位若有规律就会集中冲突。\n<\/li><li>\n实例：m = 13，键 18、41、22、44、59 分别落到 5、2、9、5、7。44 与 18 冲突。\n<\/ul>\n<p><strong>乘法散列<\/strong>：h(k) = floor(m · frac(k · A))，A 常取黄金比例 0.618…。它对 m 的取值不敏感，m 可以取 2 的幂。<\/p>\n<h3>概念 2：链地址法（难度：基础）<\/h3>\n<p>每个槽挂一条链表，冲突的键依次挂上去。<\/p>\n<ul><li>\n装载因子 α = n/m（键数除以槽数）。\n<\/li><li>\n成功查找平均比较次数 ≈ 1 + α/2。\n<\/li><li>\n失败查找平均比较次数 ≈ α。\n<\/li><li>\n优点：实现简单，删除方便，α 可以大于 1。\n<\/li><li>\n缺点：链表指针占空间，缓存不友好。\n<\/ul>\n<p><strong>实例<\/strong>：m = 5，α = 2（10 个键），成功查找平均约 1 + 1 = 2 次比较。<\/p>\n<h3>概念 3：开放地址法（难度：进阶）<\/h3>\n<p>所有键都存在表内，冲突时按某个探测序列找下一个空槽。<\/p>\n<ul><li>\n<strong>线性探测<\/strong>：h, h+1, h+2, … 依次试。\n<\/li><li>\n<strong>二次探测<\/strong>：h, h+1², h+2², … 跳着试。\n<\/li><li>\n<strong>双散列<\/strong>：用第二个散列函数决定步长，步长与 m 互素才能遍历全表。\n<\/ul>\n<p><strong>线性探测的代价<\/strong>：成功查找平均约 (1/2)(1 + 1/(1−α))。α = 0.5 时约 1.5 次；α = 0.9 时约 5.5 次，急剧恶化。<\/p>\n<p><strong>一次聚集<\/strong>：线性探测会把连续占用的槽连成一片，新键落进去后继续加长这片区域，后面的键越来越难找。二次探测与双散列就是为了打散这种连续块。<\/p>\n<p><strong>删除的坑<\/strong>：开放地址法不能直接把槽清空，否则会截断别人的探测链。要用「墓碑」标记，查找时跳过、插入时可复用。<\/p>\n<h2>概念 4：辅助键与倒排索引（难度：进阶）<\/h2>\n<p>主键唯一标识一条记录；<strong>辅助键<\/strong>是其他可用于查找的字段（如作者、日期、标签），可以有重复。<\/p>\n<ul><li>\n<strong>倒排文件<\/strong>：为每个辅助键值建一个列表，记录包含该值的所有主键。查「作者=Knuth」就直接取出列表。\n<\/li><li>\n<strong>多键查询<\/strong>：多个条件同时用时，对各列表求交；求交的代价取决于列表长度，短的先做。\n<\/li><li>\n<strong>组合键<\/strong>：把多个字段拼成一个键再散列，适合精确匹配；范围查询仍要靠有序索引。\n<\/ul>\n<p><strong>实例<\/strong>：三篇文章的主键 1、2、3，标签分别是 {算法, 数学}、{算法}、{数学}。<\/p>\n<ul><li>\n标签「算法」的倒排表：1、2。\n<\/li><li>\n标签「数学」的倒排表：1、3。\n<\/li><li>\n查「同时有算法与数学」：两表求交得 1。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 362.5 768\" style=\"max-width: 362.5px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg23\"><style>#svg23{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg23 .error-icon{fill:#552222;}#svg23 .error-text{fill:#552222;stroke:#552222;}#svg23 .edge-thickness-normal{stroke-width:2px;}#svg23 .edge-thickn ignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">按探测序列找空槽</span></div></foreignObject></g></g><g transform=\"translate(275, 734)\" data-id=\"W\" data-node=\"true\" id=\"flowchart-W-322\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">删除需用墓碑</span></div></foreignObject></g></g><g transform=\"translate(238, 18)\" data-id=\"K2\" data-node=\"true\" id=\"flowchart-K2-323\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">辅助键</span></div></foreignObject></g></g><g transform=\"translate(238, 104)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-324\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">倒排表</span></div></foreignObject></g></g><g transform=\"translate(238, 190)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-326\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多条件求交</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：上半部分是单键查找的两条路；下半部分说明辅助键走的是完全不同的结构——不是散列到槽，而是「键值 → 主键列表」的映射。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：散列像图书馆按书名的哈希值把书放进编号柜子；冲突就是两本书算到同一个柜子，只好在柜子里再排一层。\n<\/li><li>\n类比失效：图书馆的柜子大小固定，书多了必须换馆；散列表可以扩容重散列（rehash），但扩容那一下代价是 O(n)。\n<\/ul>\n<p><strong>实例（线性探测）<\/strong>：m = 7，依次插入 10、17、24、31。<\/p>\n<ul><li>\n10 mod 7 = 3，放 3。\n<\/li><li>\n17 mod 7 = 3，冲突，试 4，放入。\n<\/li><li>\n24 mod 7 = 3，冲突，4 被占，试 5，放入。\n<\/li><li>\n31 mod 7 = 3，冲突，4、5 被占，试 6，放入。\n<p>四个键挤在 3 到 6 一段，这就是一次聚集。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为散列查找永远是 O(1)<\/strong>——实际上 α 接近 1 时开放地址法急剧退化，最坏可到 O(n)。\n<\/li><li>\n<strong>别以为 m 取 2 的幂很方便就没问题<\/strong>——实际上它只取键的低位，键低位有规律时冲突严重。\n<\/li><li>\n<strong>别以为删除可以直接清空槽<\/strong>——实际上会截断探测链，必须用墓碑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：m = 13，键 44 的除法散列槽位是多少？（填数字）\n<p>（答案：5；解析：44 = 3×13 + 5，余数为 5。）<\/p>\n<\/ol>\n<ol><li>\n单选题：链地址法在装载因子 α = 2 时，成功查找的平均比较次数约为？\n<p>A. 1 B. 2 C. 4 D. 8 （答案：B；解析：成功查找约 1 + α/2 = 1 + 1 = 2 次。）<\/p>\n<\/ol>\n<ol><li>\n简答题：开放地址法为什么不能直接删除元素？\n<p>（答案：直接清空会截断后续键的探测链，使本来能找到的键查找失败；要用墓碑标记，查找时跳过、插入时可复用。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n除法散列 m 取素数，避开 2 的幂。\n<\/li><li>\n链地址成功查找约 1 + α/2；线性探测约 (1/2)(1 + 1/(1−α))。\n<\/li><li>\n开放地址删除要用墓碑；辅助键用倒排表。\n<\/ul>", "c01": "<h1>逆序与排序代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>逆序对是排列中「前大后小」的一对位置；逆序对总数直接等于插入排序需要移动的次数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「排序有多难」从算法层面拉到了数据层面：同一份数据，逆序对少就好排，多就难排。平均逆序对数是 n(n−1)/4，这就是插入类排序平均 O(n²) 的来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\ container\"></rect><g transform=\"translate(-14.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"29.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">3 个</span></div></foreignObject></g></g><g transform=\"translate(663.9296875, 18)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-332\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"144.796875\" y=\"-18\" x=\"-72.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"129.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">插入排序移动 3 次</span></div></foreignObject></g></g><g transform=\"translate(298.78125, 104)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-334\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"296.8125\" y=\"-18\" x=\"-148.40625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-140.90625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"281.8125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均情况 对 n 个元素为 n n 减一 除以四</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看这条链：数据的一个静态属性（逆序对数）直接等于一个算法的动态工作量（移动次数）。<\/p>\n<h2>详解<\/h2>\n<p><strong>计数方法<\/strong>：对每个元素，数它右边比它小的元素个数，全部加起来。<\/p>\n<p><strong>实例<\/strong>：3, 1, 4, 2。3 右边比它小的有 1、2（2 个）；1 右边没有；4 右边有 2（1 个）；2 是最后一个。合计 3 个。<\/p>\n<p><strong>与交换排序的区别<\/strong>：一次相邻交换能消除恰好一个逆序对；但一次远距离交换可能消除两个，也可能一个都不消。所以「交换次数」不能直接等于逆序对数，只有插入排序的「挪动一格」是严格一一对应。<\/p>\n<p><strong>上界<\/strong>：完全逆序的排列有 n(n−1)/2 个逆序对，这是最大值，也是插入排序的最坏移动次数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为逆序对数相同的两个排列，排序代价也相同：快排的代价取决于基准选择，不只是逆序数。\n<\/li><li>\n别以为平均逆序对数是 n²/4 就说明「平均只比最坏快一倍」：常数确实只差一倍，但 n log n 算法能把这项彻底甩开。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.1.1<\/td><td>反序<\/td><td>逆序对的定义与平均 n(n−1)/4<\/td><\/tr><tr><td>5.2.1<\/td><td>插入排序<\/td><td>移动次数等于逆序对数<\/td><\/tr><tr><td>5.2.2<\/td><td>交换排序<\/td><td>一次交换最多消除两个逆序对<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">比较树下界<\/a>\n<\/ul>", "c02": "<h1>比较树下界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把任何比较排序的执行过程画成一棵二叉树，叶子必须覆盖 n! 种输入排列，所以树高至少 log2(n!)，这就是比较排序的比较次数下界。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是一条「不可能性」结论：不管多聪明的比较排序，最坏情况都至少要 log2(n!) 次比较。知道下界，才知道一个算法还有多少优化空间，也才知道该换思路（比如改用不比较的基数排序）。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 296.90625 310\" style=\"max-width: 296.90625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg25\"><style>#svg25{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg25 .error-icon{fill:#552222;}#svg25 .error-text{fill:#552222;stroke:#552222;}#svg25 .edge-thickness-normal{stroke-width:2px;}#svg25 .edge-thickness-thick{stroke-width:3.5px;}#svg25 .edge-pattern-solid{stroke-dasharray:0;}#svg25 .edge-pattern-dashed{stroke-dasharray:3;}#svg25 .edge-pattern-dotted{stroke-dasharray:2;}#svg25 .marker{fill:#333333;stroke:#333333;}#svg25 .marker.cross{stroke:#333333;}#svg25 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg25 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg25 .cluster-label text{fill:#333;}#svg25 .cluster-label span,#svg25 p{color:#333;}#svg25 .label text,#svg25 span,#svg25 p{fill:#333;color:#333;}#svg25 .node rect,#svg25 .node circle,#svg25 .node ellipse,#svg25 .node polygon,#svg25 .node path{fill:#EC block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">叶子 一个排列</span></div></foreignObject></g></g><g transform=\"translate(223.1796875, 276)\" data-id=\"E2\" data-node=\"true\" id=\"flowchart-E2-346\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"115.453125\" y=\"-18\" x=\"-57.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-50.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"100.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">叶子 一个排列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>每个叶子对应一种可能的输出顺序；要覆盖 n! 种顺序，叶子数不能少，树就压不下来。<\/p>\n<h2>详解<\/h2>\n<p><strong>推导<\/strong>：二叉树高度 h 最多有 2^h 个叶子。要 2^h ≥ n!，得 h ≥ log2(n!)。<\/p>\n<p><strong>数值<\/strong>：<\/p>\n<ul><li>\nn = 3：log2 6 ≈ 2.58，取整 3。\n<\/li><li>\nn = 5：log2 120 ≈ 6.91，取整 7。\n<\/li><li>\nn = 10：log2(3628800) ≈ 21.8，取整 22。\n<\/ul>\n<p><strong>近似式<\/strong>：log2(n!) ≈ n log2 n − 1.4427n + O(log n)。线性项系数 1.4427 就是 1/ln 2。<\/p>\n<p><strong>适用边界<\/strong>：只对「基于比较」的算法成立。基数排序按位分配，不受这条下界约束，可以做到 O(n)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为下界是「平均情况」：它是最坏情况的下界，平均情况可以更低（但一般仍同阶）。\n<\/li><li>\n别以为达到下界就说明算法最优：下界只约束比较次数，不约束移动次数、空间、缓存行为。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.3.1<\/td><td>比较次数最少<\/td><td>比较树模型与 log2(n!) 下界<\/td><\/tr><tr><td>5.3.4<\/td><td>排序网络<\/td><td>0-1 原理与网络规模<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">逆序与排序代价<\/a>\n<\/li><li>\n后续：第 2 章的合并排序\n<\/ul>", "c03": "<h1>散列与装载因子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>散列用一个函数把键映射到槽位；装载因子 α = 键数/槽数衡量表的拥挤程度，直接决定平均查找长度。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把查找从 O(log n) 压到常数级，是所有字典、缓存、数据库索引的基础。但它有明确的退化边界：α 一高，常数级就变成线性。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 288.0234375 550\" style=\"max-width: 288.0234375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg26\"><style>#svg26{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg26 .error-icon{fill:#552222;}#svg26 .error-text{fill:#552222;stroke:#552222;}#svg26 .edge-thickness-normal{stroke-width:2px;}#svg26 .edge-thickness-thick{stroke-width:3.5px;}#svg26 .edge-pattern-solid{stroke-dasharray:0;}#svg26 .edge-pattern-dashed{stroke-dasharray:3;}#svg26 .edge-pattern-dotted{stroke-dasharray:2;}#svg26 .marker{fill:#333333;stroke:#333333;}#svg26 .marker.cross{stroke:#333333;}#svg26 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg26 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg26 .cluster-label text{fill:#333;}#svg26 .cluster-label span,#svg26 p{color:#333;}#svg26 .label text,#svg26 span,#svg26 p{fill:#333;color:#333;}#svg26 .node rect,#svg26 .node circle,#svg26 .node ellipse,#svg26 .node polygon,#svg26 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg26 .flowchart-label text{text-anchor:middle;}#svg26 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg26 .node .label{text-align:center;}#svg26 .node.clickable{cursor:pointer;}#svg26 .arrowheadPath{fill:#333333;}#svg26 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg26 .flowchart-link{stroke:#333333;fill:none;}#svg26 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg26 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg26 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg26 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg26 .cluster text{fill:#333;}#svg26 .cluster span,#svg26 p{color:#333;}#svg26 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px "21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">冲突</span></div></foreignObject></g></g><g transform=\"translate(39.5, 430)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-354\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">直接命中</span></div></foreignObject></g></g><g transform=\"translate(184.5, 430)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-356\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">链地址或探测</span></div></foreignObject></g></g><g transform=\"translate(184.5, 516)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-358\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"175.046875\" y=\"-18\" x=\"-87.5234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-80.0234375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"160.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均长度随 alpha 上升</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>图里的关键边是最后一条：冲突处理方式不变，α 一变，平均长度就变。<\/p>\n<h2>详解<\/h2>\n<p><strong>链地址法<\/strong>：成功查找约 1 + α/2 次比较；失败查找约 α 次。α 可以大于 1。<\/p>\n<p><strong>线性探测<\/strong>：成功查找约 (1/2)(1 + 1/(1−α))。α = 0.5 时 1.5 次，α = 0.9 时 5.5 次。<\/p>\n<p><strong>实例<\/strong>：m = 7，插入 10、17、24、31，依次落在 3、4、5、6，形成一段连续占用，后续键落到这一段里要找更久。<\/p>\n<p><strong>扩容<\/strong>：α 超过阈值（常用 0.75）就加倍槽数并重新散列所有键，单次代价 O(n)，摊还后仍是常数。<\/p>\n<p><strong>删除<\/strong>：开放地址法要用墓碑，否则截断探测链。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为散列查找永远 O(1)：那是在 α 受控且散列函数均匀的前提下。\n<\/li><li>\n别以为槽数取 2 的幂总是方便：它只取键的低位，键低位有规律时冲突集中。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6.4<\/td><td>散列<\/td><td>散列函数、冲突处理与平均长度<\/td><\/tr><tr><td>6.5<\/td><td>辅助键<\/td><td>倒排表与多键查询<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">比较树下界<\/a>\n<\/li><li>\n后续：卷4 的位运算技巧\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先看清排序的组合结构<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：排序的组合性质<\/a><br>检查点：能数逆序对、算多重集排列数、说出平均游程数<\/li><li class='path-step' id='path-02'><strong>步骤 02：五类内部排序与取舍<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：内部排序——五类算法与它们的代价<\/a><br>检查点：能针对四个场景各选一种算法并说出理由<\/li><li class='path-step' id='path-03'><strong>步骤 03：下界与排序网络<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：最优排序——比较次数的下界与排序网络<\/a><br>检查点：能推出 log2 n! 下界，能用 0-1 原理验证小网络<\/li><li class='path-step' id='path-04'><strong>步骤 04：外部排序<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：外部排序——数据比内存大怎么办<\/a><br>检查点：能算合并趟数与替代选择的游程长度<\/li><li class='path-step' id='path-05'><strong>步骤 05：查找结构与 B 树<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：查找——从顺序扫到平衡树<\/a><br>检查点：能算二分与 B 树的层数，解释 AVL 的最坏保证<\/li><li class='path-step' id='path-06'><strong>步骤 06：散列与辅助键<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：散列查找与辅助键<\/a><br>检查点：能按装载因子估算平均查找长度，解释墓碑的必要性<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q19.<\/b> 综合题：一个日志系统要按时间排序 10 GB 数据，内存只有 1 GB，最合理的方案是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 直接快速排序<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 生成初始游程后用替代选择与多路合并<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 用散列表<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 用二叉查找树<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：排序的组合性质<\/h1><div class='quiz-item' data-qid='q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 排列 4, 3, 2, 1 的逆序对数是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> A、A、B、B 四个字符共有多少种不同排列？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 24<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 随机排列的期望升序游程段数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> n/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> (n+1)/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> log n<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> n<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：内部排序——五类算法与它们的代价<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 对已经升序排列的数组取首元素为基准做快排，复杂度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> O(log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 堆排序建堆的代价是 O(___)。（填字母 n 或 n log n）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 基数排序必须满足的性质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 稳定<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 原地<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 比较元素大小<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 递归<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：最优排序——比较次数的下界与排序网络<\/h1><div class='quiz-item' data-qid='q07' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 5 个元素排序，最坏情况至少需要多少次比较？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 排序网络的核心优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 比较次数最少<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 无分支、可并行<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 不需要额外空间<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 稳定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 0-1 原理的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 把任意输入化归为 0/1 输入来验证网络<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 证明快排最优<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 计算逆序对数<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 分析散列冲突<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：外部排序——数据比内存大怎么办<\/h1><div class='quiz-item' data-qid='q10' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 1000 个初始游程做 4 路合并，需要多少趟？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 替代选择在随机输入下的平均游程长度约为缓冲区容量的多少倍？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 0.5<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 多阶段合并主要解决什么问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 比较次数太多<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 磁带台数不足<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 内存太大<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 键值范围太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：查找——从顺序扫到平衡树<\/h1><div class='quiz-item' data-qid='q13' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 在 1 到 9 的有序数组里二分查找 7，需要多少次比较？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 二叉查找树最坏情况下的查找代价是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> O(n log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 10 亿个键、每节点 100 个孩子的 B 树，大约几层？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 10<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 30<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：散列查找与辅助键<\/h1><div class='quiz-item' data-qid='q16' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> m = 13，键 44 的除法散列槽位是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 链地址法在 α = 2 时，成功查找平均比较次数约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 开放地址法删除元素时为什么需要墓碑？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 为了节省空间<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 为了保持探测链不断<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 为了提高散列速度<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 为了支持排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='逆序对'>逆序对 — 排列中前一个数大于后一个数的一对位置。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='游程'>游程 — 排列中一段连续递增的最长子序列。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='对合'>对合 — 做两次回到原样的置换，循环长度只能是 1 或 2。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='稳定排序'>稳定排序 — 相等元素在排序后保持原来的相对次序。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='基准'>基准 — 快速排序中用来划分数组的元素。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='堆'>堆 — 一种完全二叉树，每个节点都不小于（或不大于）它的孩子。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='基数排序'>基数排序 — 按键的每一位分配与收集，不做元素间比较的排序。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='比较树'>比较树 — 把排序过程画成判断树，内部节点是比较，叶子是输出排列。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='排序网络'>排序网络 — 一组固定的比较器，比较顺序与输入无关，可并行执行。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='0-1 原理'>0-1 原理 — 若网络能排好所有 0/1 输入，就能排好任意输入。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='初始游程'>初始游程 — 外部排序中一块内存数据排好后写到磁盘上的有序段。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='替代选择'>替代选择 — 用堆边写边读，使平均游程长度达到缓冲区容量两倍的方法。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='多阶段合并'>多阶段合并 — 用不均匀分配让有限磁带轮流充当输出的合并策略。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='avl 树'>AVL 树 — 每个节点左右子树高度差不超过 1 的二叉查找树。 <span class=glossary-ref>（第 5 章：查找——从顺序扫到平衡树）<\/span><\/li><li data-term='b 树'>B 树 — 每个节点可存多个键、多个孩子，所有叶子同层的多路查找树。 <span class=glossary-ref>（第 5 章：查找——从顺序扫到平衡树）<\/span><\/li><li data-term='装载因子'>装载因子 — 散列表中键数与槽数之比。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='一次聚集'>一次聚集 — 线性探测把连续槽位占满、越聚越长的现象。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='墓碑'>墓碑 — 开放地址法删除后留下的标记，保证探测链不被截断。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='倒排索引'>倒排索引 — 由辅助键值指向包含该值的主键列表的结构。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：判断一个排序该用什么<\/h2>\n<ol><li>\n<strong>数据在哪<\/strong>：内存 → 内部排序；磁盘 → 外部排序。\n<\/li><li>\n<strong>要不要稳定<\/strong>：要 → 合并排序或基数排序；不要 → 快排、堆排。\n<\/li><li>\n<strong>最坏要不要保证<\/strong>：要 → 堆排序；不要 → 快排。\n<\/li><li>\n<strong>数据有无现成结构<\/strong>：近乎有序 → 插入排序；键值范围小 → 基数排序；链表 → 合并排序。\n<\/ol>\n<h2>框架：判断一个查找该用什么<\/h2>\n<ol><li>\n<strong>能不能随机访问<\/strong>：不能 → 顺序查找或跳表。\n<\/li><li>\n<strong>数据动不动<\/strong>：静态 → 有序数组加二分；动态 → 平衡树。\n<\/li><li>\n<strong>数据在不在内存<\/strong>：在磁盘 → B 树。\n<\/li><li>\n<strong>要不要范围查询<\/strong>：要 → 树；只要精确匹配 → 散列。\n<\/ol>\n<h2>决策规则：散列的装载因子<\/h2>\n<ul><li>\nα &lt; 0.5：开放地址法还很轻松。\n<\/li><li>\n0.5 ≤ α &lt; 0.75：可用，但探测长度明显上升。\n<\/li><li>\nα ≥ 0.75：必须扩容重散列，否则退化。\n<\/li><li>\n链地址法可容忍 α &gt; 1，但缓存不友好。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>对已排序数据取首元素当快排基准<\/strong>：必然 O(n²)。\n<\/li><li>\n<strong>用 2 的幂当散列表长度<\/strong>：只取键的低位，低位有规律就冲突。\n<\/li><li>\n<strong>开放地址法直接清空槽<\/strong>：截断探测链，后续查找失败。\n<\/li><li>\n<strong>用比较排序去排键值范围很小的整数<\/strong>：明明可以用基数排序到线性。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>排序代价<\/h2>\n<table><thead><tr><th>算法<\/th><th>平均<\/th><th>最坏<\/th><th>空间<\/th><th>稳定<\/th><\/tr><\/thead><tbody><tr><td>直接插入<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>是<\/td><\/tr><tr><td>希尔<\/td><td>约 n^1.3<\/td><td>依间隔序列<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>冒泡<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>是<\/td><\/tr><tr><td>快速排序<\/td><td>n log n<\/td><td>n²<\/td><td>log n<\/td><td>否<\/td><\/tr><tr><td>直接选择<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>堆排序<\/td><td>n log n<\/td><td>n log n<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>合并排序<\/td><td>n log n<\/td><td>n log n<\/td><td>n<\/td><td>是<\/td><\/tr><tr><td>基数排序<\/td><td>d(n+k)<\/td><td>d(n+k)<\/td><td>n+k<\/td><td>是<\/td><\/tr><\/tbody><\/table>\n<h2>查找代价<\/h2>\n<table><thead><tr><th>结构<\/th><th>平均<\/th><th>最坏<\/th><\/tr><\/thead><tbody><tr><td>顺序查找<\/td><td>n/2<\/td><td>n<\/td><\/tr><tr><td>二分查找<\/td><td>log n<\/td><td>log n<\/td><\/tr><tr><td>二叉查找树<\/td><td>1.39 log n<\/td><td>n<\/td><\/tr><tr><td>AVL / 红黑树<\/td><td>log n<\/td><td>1.44 log n<\/td><\/tr><tr><td>B 树<\/td><td>log_m n 层<\/td><td>同<\/td><\/tr><tr><td>散列（链地址）<\/td><td>1 + α/2<\/td><td>n<\/td><\/tr><\/tbody><\/table>\n<h2>关键公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>比较排序下界<\/td><td>log2(n!) ≈ n log2 n − 1.44n<\/td><\/tr><tr><td>外部合并趟数<\/td><td>ceil(log_k R)<\/td><\/tr><tr><td>替代选择游程<\/td><td>平均 2P<\/td><\/tr><tr><td>链地址成功查找<\/td><td>1 + α/2<\/td><\/tr><tr><td>线性探测成功查找<\/td><td>(1/2)(1 + 1/(1−α))<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
