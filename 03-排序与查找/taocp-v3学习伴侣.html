7,246.133,57.727,249.417L57.727,252.7\"></path><path marker-end=\"url(#svg25_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-G2 LE-E2\" id=\"L-G2-E2-0\" d=\"M223.18,208L223.18,212.167C223.18,216.333,223.18,224.667,223.18,232.117C223.18,239.567,223.18,246.133,223.18,249.417L223.18,252.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(140.453125, 18)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-335\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"115.453125\" y=\"-18\" x=\"-57.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-50.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"100.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">根 第一次比较</span></div></foreignObject></g></g><g transform=\"translate(57.7265625, 104)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-336\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"47\" y=\"-18\" x=\"-23.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">小于</span></div></foreignObject></g></g><g transform=\"translate(223.1796875, 104)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-338\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"47\" y=\"-18\" x=\"-23.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">大于</span></div></foreignObject></g></g><g transform=\"translate(57.7265625, 190)\" data-id=\"L2\" data-node=\"true\" id=\"flowchart-L2-340\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第二次比较</span></div></foreignObject></g></g><g transform=\"translate(223.1796875, 190)\" data-id=\"G2\" data-node=\"true\" id=\"flowchart-G2-342\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第二次比较</span></div></foreignObject></g></g><g transform=\"translate(57.7265625, 276)\" data-id=\"E1\" data-node=\"true\" id=\"flowchart-E1-344\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"115.453125\" y=\"-18\" x=\"-57.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-50.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"100.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">叶子 一个排列</span></div></foreignObject></g></g><g transform=\"translate(223.1796875, 276)\" data-id=\"E2\" data-node=\"true\" id=\"flowchart-E2-346\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"115.453125\" y=\"-18\" x=\"-57.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-50.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"100.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">叶子 一个排列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>每个叶子对应一种可能的输出顺序；要覆盖 n! 种顺序，叶子数不能少，树就压不下来。<\/p>\n<h2>详解<\/h2>\n<p><strong>推导<\/strong>：二叉树高度 h 最多有 2^h 个叶子。要 2^h ≥ n!，得 h ≥ log2(n!)。<\/p>\n<p><strong>数值<\/strong>：<\/p>\n<ul><li>\nn = 3：log2 6 ≈ 2.58，取整 3。\n<\/li><li>\nn = 5：log2 120 ≈ 6.91，取整 7。\n<\/li><li>\nn = 10：log2(3628800) ≈ 21.8，取整 22。\n<\/ul>\n<p><strong>近似式<\/strong>：log2(n!) ≈ n log2 n − 1.4427n + O(log n)。线性项系数 1.4427 就是 1/ln 2。<\/p>\n<p><strong>适用边界<\/strong>：只对「基于比较」的算法成立。基数排序按位分配，不受这条下界约束，可以做到 O(n)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为下界是「平均情况」：它是最坏情况的下界，平均情况可以更低（但一般仍同阶）。\n<\/li><li>\n别以为达到下界就说明算法最优：下界只约束比较次数，不约束移动次数、空间、缓存行为。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.3.1<\/td><td>比较次数最少<\/td><td>比较树模型与 log2(n!) 下界<\/td><\/tr><tr><td>5.3.4<\/td><td>排序网络<\/td><td>0-1 原理与网络规模<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">逆序与排序代价<\/a>\n<\/li><li>\n后续：第 2 章的合并排序\n<\/ul>", "kind": "concept", "title": "比较树下界"}, "c03": {"html": "<h1>散列与装载因子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>散列用一个函数把键映射到槽位；装载因子 α = 键数/槽数衡量表的拥挤程度，直接决定平均查找长度。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把查找从 O(log n) 压到常数级，是所有字典、缓存、数据库索引的基础。但它有明确的退化边界：α 一高，常数级就变成线性。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 288.0234375 550\" style=\"max-width: 288.0234375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg26\"><style>#svg26{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg26 .error-icon{fill:#552222;}#svg26 .error-text{fill:#552222;stroke:#552222;}#svg26 .edge-thickness-normal{stroke-width:2px;}#svg26 .edge-thickness-thick{stroke-width:3.5px;}#svg26 .edge-pattern-solid{stroke-dasharray:0;}#svg26 .edge-pattern-dashed{s s=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g transform=\"translate(39.5, 376.5)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">无</span></div></foreignObject></g></g><g transform=\"translate(184.5, 376.5)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">有</span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(112, 18)\" data-id=\"K\" data-node=\"true\" id=\"flowchart-K-347\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"31\" y=\"-18\" x=\"-15.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-8, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">键</span></div></foreignObject></g></g><g transform=\"translate(112, 104)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-348\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">散列函数</span></div></foreignObject></g></g><g transform=\"translate(112, 190)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-350\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"119.015625\" y=\"-18\" x=\"-59.5078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-52.0078125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"104.015625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">槽 0 到 m 减一</span></div></foreignObject></g></g><g transform=\"translate(112, 299.5)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-352\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-41.5,41.5)\" class=\"label-container\" points=\"41.5,0 83,-41.5 41.5,-83 0,-41.5\"></polygon><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">冲突</span></div></foreignObject></g></g><g transform=\"translate(39.5, 430)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-354\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">直接命中</span></div></foreignObject></g></g><g transform=\"translate(184.5, 430)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-356\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">链地址或探测</span></div></foreignObject></g></g><g transform=\"translate(184.5, 516)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-358\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"175.046875\" y=\"-18\" x=\"-87.5234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-80.0234375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"160.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均长度随 alpha 上升</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>图里的关键边是最后一条：冲突处理方式不变，α 一变，平均长度就变。<\/p>\n<h2>详解<\/h2>\n<p><strong>链地址法<\/strong>：成功查找约 1 + α/2 次比较；失败查找约 α 次。α 可以大于 1。<\/p>\n<p><strong>线性探测<\/strong>：成功查找约 (1/2)(1 + 1/(1−α))。α = 0.5 时 1.5 次，α = 0.9 时 5.5 次。<\/p>\n<p><strong>实例<\/strong>：m = 7，插入 10、17、24、31，依次落在 3、4、5、6，形成一段连续占用，后续键落到这一段里要找更久。<\/p>\n<p><strong>扩容<\/strong>：α 超过阈值（常用 0.75）就加倍槽数并重新散列所有键，单次代价 O(n)，摊还后仍是常数。<\/p>\n<p><strong>删除<\/strong>：开放地址法要用墓碑，否则截断探测链。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为散列查找永远 O(1)：那是在 α 受控且散列函数均匀的前提下。\n<\/li><li>\n别以为槽数取 2 的幂总是方便：它只取键的低位，键低位有规律时冲突集中。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6.4<\/td><td>散列<\/td><td>散列函数、冲突处理与平均长度<\/td><\/tr><tr><td>6.5<\/td><td>辅助键<\/td><td>倒排表与多键查询<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">比较树下界<\/a>\n<\/li><li>\n后续：卷4 的位运算技巧\n<\/ul>", "kind": "concept", "title": "散列与装载因子"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先看清排序的组合结构<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：排序的组合性质<\/a><br>检查点：能数逆序对、算多重集排列数、说出平均游程数<\/li><li class='path-step' id='path-02'><strong>步骤 02：五类内部排序与取舍<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：内部排序——五类算法与它们的代价<\/a><br>检查点：能针对四个场景各选一种算法并说出理由<\/li><li class='path-step' id='path-03'><strong>步骤 03：下界与排序网络<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：最优排序——比较次数的下界与排序网络<\/a><br>检查点：能推出 log2 n! 下界，能用 0-1 原理验证小网络<\/li><li class='path-step' id='path-04'><strong>步骤 04：外部排序<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：外部排序——数据比内存大怎么办<\/a><br>检查点：能算合并趟数与替代选择的游程长度<\/li><li class='path-step' id='path-05'><strong>步骤 05：查找结构与 B 树<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：查找——从顺序扫到平衡树<\/a><br>检查点：能算二分与 B 树的层数，解释 AVL 的最坏保证<\/li><li class='path-step' id='path-06'><strong>步骤 06：散列与辅助键<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：散列查找与辅助键<\/a><br>检查点：能按装载因子估算平均查找长度，解释墓碑的必要性<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q19.<\/b> 综合题：一个日志系统要按时间排序 10 GB 数据，内存只有 1 GB，最合理的方案是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 直接快速排序<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 生成初始游程后用替代选择与多路合并<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 用散列表<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 用二叉查找树<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：排序的组合性质<\/h1><div class='quiz-item' data-qid='q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 排列 4, 3, 2, 1 的逆序对数是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> A、A、B、B 四个字符共有多少种不同排列？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 24<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 随机排列的期望升序游程段数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> n/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> (n+1)/2<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> log n<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> n<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：内部排序——五类算法与它们的代价<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 对已经升序排列的数组取首元素为基准做快排，复杂度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> O(n log n)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> O(log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 堆排序建堆的代价是 O(___)。（填字母 n 或 n log n）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 基数排序必须满足的性质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 稳定<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 原地<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 比较元素大小<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 递归<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：最优排序——比较次数的下界与排序网络<\/h1><div class='quiz-item' data-qid='q07' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 5 个元素排序，最坏情况至少需要多少次比较？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 排序网络的核心优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 比较次数最少<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 无分支、可并行<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 不需要额外空间<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 稳定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 0-1 原理的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 把任意输入化归为 0/1 输入来验证网络<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 证明快排最优<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 计算逆序对数<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 分析散列冲突<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：外部排序——数据比内存大怎么办<\/h1><div class='quiz-item' data-qid='q10' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 1000 个初始游程做 4 路合并，需要多少趟？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 替代选择在随机输入下的平均游程长度约为缓冲区容量的多少倍？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 0.5<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 多阶段合并主要解决什么问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 比较次数太多<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 磁带台数不足<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 内存太大<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 键值范围太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：查找——从顺序扫到平衡树<\/h1><div class='quiz-item' data-qid='q13' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 在 1 到 9 的有序数组里二分查找 7，需要多少次比较？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 二叉查找树最坏情况下的查找代价是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> O(1)<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> O(log n)<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> O(n)<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> O(n log n)<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 10 亿个键、每节点 100 个孩子的 B 树，大约几层？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 3<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 5<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 10<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 30<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch06__": {"html": "<h1>测验：第 6 章：散列查找与辅助键<\/h1><div class='quiz-item' data-qid='q16' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> m = 13，键 44 的除法散列槽位是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 链地址法在 α = 2 时，成功查找平均比较次数约为？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 1<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 2<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 4<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 开放地址法删除元素时为什么需要墓碑？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 为了节省空间<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 为了保持探测链不断<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 为了提高散列速度<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 为了支持排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='逆序对'>逆序对 — 排列中前一个数大于后一个数的一对位置。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='游程'>游程 — 排列中一段连续递增的最长子序列。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='对合'>对合 — 做两次回到原样的置换，循环长度只能是 1 或 2。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='稳定排序'>稳定排序 — 相等元素在排序后保持原来的相对次序。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='基准'>基准 — 快速排序中用来划分数组的元素。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='堆'>堆 — 一种完全二叉树，每个节点都不小于（或不大于）它的孩子。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='基数排序'>基数排序 — 按键的每一位分配与收集，不做元素间比较的排序。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='比较树'>比较树 — 把排序过程画成判断树，内部节点是比较，叶子是输出排列。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='排序网络'>排序网络 — 一组固定的比较器，比较顺序与输入无关，可并行执行。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='0-1 原理'>0-1 原理 — 若网络能排好所有 0/1 输入，就能排好任意输入。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='初始游程'>初始游程 — 外部排序中一块内存数据排好后写到磁盘上的有序段。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='替代选择'>替代选择 — 用堆边写边读，使平均游程长度达到缓冲区容量两倍的方法。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='多阶段合并'>多阶段合并 — 用不均匀分配让有限磁带轮流充当输出的合并策略。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='avl 树'>AVL 树 — 每个节点左右子树高度差不超过 1 的二叉查找树。 <span class=glossary-ref>（第 5 章：查找——从顺序扫到平衡树）<\/span><\/li><li data-term='b 树'>B 树 — 每个节点可存多个键、多个孩子，所有叶子同层的多路查找树。 <span class=glossary-ref>（第 5 章：查找——从顺序扫到平衡树）<\/span><\/li><li data-term='装载因子'>装载因子 — 散列表中键数与槽数之比。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='一次聚集'>一次聚集 — 线性探测把连续槽位占满、越聚越长的现象。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='墓碑'>墓碑 — 开放地址法删除后留下的标记，保证探测链不被截断。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='倒排索引'>倒排索引 — 由辅助键值指向包含该值的主键列表的结构。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：判断一个排序该用什么<\/h2>\n<ol><li>\n<strong>数据在哪<\/strong>：内存 → 内部排序；磁盘 → 外部排序。\n<\/li><li>\n<strong>要不要稳定<\/strong>：要 → 合并排序或基数排序；不要 → 快排、堆排。\n<\/li><li>\n<strong>最坏要不要保证<\/strong>：要 → 堆排序；不要 → 快排。\n<\/li><li>\n<strong>数据有无现成结构<\/strong>：近乎有序 → 插入排序；键值范围小 → 基数排序；链表 → 合并排序。\n<\/ol>\n<h2>框架：判断一个查找该用什么<\/h2>\n<ol><li>\n<strong>能不能随机访问<\/strong>：不能 → 顺序查找或跳表。\n<\/li><li>\n<strong>数据动不动<\/strong>：静态 → 有序数组加二分；动态 → 平衡树。\n<\/li><li>\n<strong>数据在不在内存<\/strong>：在磁盘 → B 树。\n<\/li><li>\n<strong>要不要范围查询<\/strong>：要 → 树；只要精确匹配 → 散列。\n<\/ol>\n<h2>决策规则：散列的装载因子<\/h2>\n<ul><li>\nα &lt; 0.5：开放地址法还很轻松。\n<\/li><li>\n0.5 ≤ α &lt; 0.75：可用，但探测长度明显上升。\n<\/li><li>\nα ≥ 0.75：必须扩容重散列，否则退化。\n<\/li><li>\n链地址法可容忍 α &gt; 1，但缓存不友好。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>对已排序数据取首元素当快排基准<\/strong>：必然 O(n²)。\n<\/li><li>\n<strong>用 2 的幂当散列表长度<\/strong>：只取键的低位，低位有规律就冲突。\n<\/li><li>\n<strong>开放地址法直接清空槽<\/strong>：截断探测链，后续查找失败。\n<\/li><li>\n<strong>用比较排序去排键值范围很小的整数<\/strong>：明明可以用基数排序到线性。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>排序代价<\/h2>\n<table><thead><tr><th>算法<\/th><th>平均<\/th><th>最坏<\/th><th>空间<\/th><th>稳定<\/th><\/tr><\/thead><tbody><tr><td>直接插入<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>是<\/td><\/tr><tr><td>希尔<\/td><td>约 n^1.3<\/td><td>依间隔序列<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>冒泡<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>是<\/td><\/tr><tr><td>快速排序<\/td><td>n log n<\/td><td>n²<\/td><td>log n<\/td><td>否<\/td><\/tr><tr><td>直接选择<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>堆排序<\/td><td>n log n<\/td><td>n log n<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>合并排序<\/td><td>n log n<\/td><td>n log n<\/td><td>n<\/td><td>是<\/td><\/tr><tr><td>基数排序<\/td><td>d(n+k)<\/td><td>d(n+k)<\/td><td>n+k<\/td><td>是<\/td><\/tr><\/tbody><\/table>\n<h2>查找代价<\/h2>\n<table><thead><tr><th>结构<\/th><th>平均<\/th><th>最坏<\/th><\/tr><\/thead><tbody><tr><td>顺序查找<\/td><td>n/2<\/td><td>n<\/td><\/tr><tr><td>二分查找<\/td><td>log n<\/td><td>log n<\/td><\/tr><tr><td>二叉查找树<\/td><td>1.39 log n<\/td><td>n<\/td><\/tr><tr><td>AVL / 红黑树<\/td><td>log n<\/td><td>1.44 log n<\/td><\/tr><tr><td>B 树<\/td><td>log_m n 层<\/td><td>同<\/td><\/tr><tr><td>散列（链地址）<\/td><td>1 + α/2<\/td><td>n<\/td><\/tr><\/tbody><\/table>\n<h2>关键公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>比较排序下界<\/td><td>log2(n!) ≈ n log2 n − 1.44n<\/td><\/tr><tr><td>外部合并趟数<\/td><td>ceil(log_k R)<\/td><\/tr><tr><td>替代选择游程<\/td><td>平均 2P<\/td><\/tr><tr><td>链地址成功查找<\/td><td>1 + α/2<\/td><\/tr><tr><td>线性探测成功查找<\/td><td>(1/2)(1 + 1/(1−α))<\/td><\/tr><\/tbody><\/table>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451429127636482/TAOCP点化学习系统/03-排序与查找", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：排序的组合性质", "href": "#/chapter/ch01"}, {"label": "第 2 章：内部排序——五类算法与它们的代价", "href": "#/chapter/ch02"}, {"label": "第 3 章：最优排序——比较次数的下界与排序网络", "href": "#/chapter/ch03"}, {"label": "第 4 章：外部排序——数据比内存大怎么办", "href": "#/chapter/ch04"}, {"label": "第 5 章：查找——从顺序扫到平衡树", "href": "#/chapter/ch05"}, {"label": "第 6 章：散列查找与辅助键", "href": "#/chapter/ch06"}]}, {"label": "概念", "children": [{"label": "逆序与排序代价", "href": "#/concept/c01"}, {"label": "比较树下界", "href": "#/concept/c02"}, {"label": "散列与装载因子", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：排序的组合性质", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：内部排序——五类算法与它们的代价", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：最优排序——比较次数的下界与排序网络", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：外部排序——数据比内存大怎么办", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：查找——从顺序扫到平衡树", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：散列查找与辅助键", "href": "#/quiz/ch06"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：排序的组合性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：卷1 第 2 章（排列与二项式系数）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n数出一个排列里的逆序对，并说明它和插入排序移动次数的关系。\n<\/li><li>\n算多重集排列的种数。\n<\/li><li>\n说出「游程」是什么，以及随机排列的平均游程数。\n<\/li><li>\n解释研究这些组合量对分析排序算法有什么用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排序算法的平均代价，几乎都能写成「某个组合量的期望」；先把组合量算清楚，后面各节的复杂度公式才有依据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：逆序（反序）与逆序对（难度：基础）<\/h3>\n<p>在一个排列里，如果前面的数比后面的大，这一对就叫一个<strong>逆序对<\/strong>。<\/p>\n<p><strong>实例<\/strong>：排列 3, 1, 4, 2。<\/p>\n<ul><li>\n(3,1)：3 &gt; 1，是\n<\/li><li>\n(3,4)：不是\n<\/li><li>\n(3,2)：3 &gt; 2，是\n<\/li><li>\n(1,4)：不是\n<\/li><li>\n(1,2)：不是\n<\/li><li>\n(4,2)：4 &gt; 2，是\n<\/ul>\n<p>共 3 个逆序对。<\/p>\n<p><strong>它为什么重要<\/strong>：插入排序每把一个元素往左挪一格，就消除恰好一个逆序对。所以<strong>插入排序的移动次数 = 初始逆序对数<\/strong>。<\/p>\n<p><strong>平均逆序对数<\/strong>：所有 n! 个排列平均下来是 n(n−1)/4。n = 4 时是 3，正好等于上面那个排列的逆序对数（巧合而已，不是每个排列都等于 3）。<\/p>\n<h3>概念 2：多重集的排列（难度：基础）<\/h3>\n<p>如果 n 个对象里有重复，全排列数要除以重复组的阶乘：<\/p>\n<p>种数 = n! / (n1! n2! … nk!)<\/p>\n<p>其中 ni 是第 i 类重复对象的个数。<\/p>\n<p><strong>实例<\/strong>：字母 A、A、B 三个字符的排列。3!/(2!1!) = 3，实际是 AAB、ABA、BAA 三种。 <strong>实例<\/strong>：A、A、B、B 四个字符：4!/(2!2!) = 6。<\/p>\n<p><strong>为什么这样除<\/strong>：把重复的对象先当成不同的，有 n! 种；每一种真实排列被重复数了 n1!×n2!×… 次（每个重复组内部怎么换都得到同一个排列）。<\/p>\n<h3>概念 3：游程（难度：进阶）<\/h3>\n<p>把排列从左往右扫，一段连续递增的最长子序列叫一个<strong>升序游程<\/strong>。整条排列可以切成若干游程。<\/p>\n<p><strong>实例<\/strong>：3, 5, 7, 1, 2, 9, 4 的升序游程是 [3,5,7]、[1,2,9]、[4]，共 3 段。<\/p>\n<p><strong>平均游程数<\/strong>：随机排列的期望升序游程数是 (n+1)/2。n = 7 时约 4 段，与上例的 3 段接近（样本只有一个，不必强求相等）。<\/p>\n<p><strong>它为什么重要<\/strong>：自然合并排序（natural merge sort）就是先找出这些游程，再把相邻游程两两合并。初始游程越少，合并趟数越少。这就是「输入已有的有序性」被利用的地方。<\/p>\n<h3>概念 4：置换的循环结构与对合（难度：进阶）<\/h3>\n<p>任何置换都能唯一分解成若干个互不相交的循环。例如把 1→3、3→2、2→1、4→4 写成 (1 3 2)(4)。<\/p>\n<ul><li>\n一个循环里元素的个数叫循环长度。\n<\/li><li>\n长度全为 1 的置换是恒等置换。\n<\/li><li>\n<strong>对合<\/strong>是「做两次回到原样」的置换，它的循环长度只能是 1 或 2。\n<\/ul>\n<p><strong>实例<\/strong>：交换 1 与 2、固定 3 的置换是 (1 2)(3)，做两次回到原样，是对合。 <strong>用途<\/strong>：卷4 生成排列时会用到「相邻交换」的格雷码路径，那条路径正是由对合式的交换序列构成的。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 593 224\" style=\"max-width: 593px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg18\"><style>#svg18{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg18 .error-icon{fill:#552222;}#svg18 .error-text{fill:#552222;stroke:#552222;}#svg18 .edge-thickness-normal{stroke-width:2px;}#svg18 .edge-thickness-thick{stroke-width:3.5px;}#svg18 .edge-pattern-solid{stroke-dasharray:0;}#svg18 .edge-pattern-dashed{stroke-dasharray:3;}#svg18 .edge-pattern-dotted{stroke-dasharray:2;}#svg18 .marker{fill:#333333;stroke:#333333;}#svg18 .marker.cross{stroke:#333333;}#svg18 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg18 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg18 .cluster-label text{fill:#333;}#svg18 .cluster-label span,#svg18 p{color:#333;}#svg18 .label text,#svg18 span,#svg18 p{fill:#333;color:#333;}#svg18 .node rect,#svg18 .node circle,#svg18 .node ellipse,#svg18 .node polygon,#svg18 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg18 .flowchart-label text{text-anchor:middle;}#svg18 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg18 .node .label{text-align:center;}#svg18 .node.clickable{cursor:pointer;}#svg18 .arrowheadPath{fill:#333333;}#svg18 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg18 .flowchart-li "stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg18_flowchart-crossEnd\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg18_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-I\" id=\"L-P-I-0\" d=\"M249,26.127L220.75,31.939C192.5,37.751,136,49.376,107.75,58.471C79.5,67.567,79.5,74.133,79.5,77.417L79.5,80.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-R\" id=\"L-P-R-0\" d=\"M288.5,36L288.5,40.167C288.5,44.333,288.5,52.667,288.5,60.117C288.5,67.567,288.5,74.133,288.5,77.417L288.5,80.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-C\" id=\"L-P-C-0\" d=\"M328,26.127L356.25,31.939C384.5,37.751,441,49.376,469.25,58.471C497.5,67.567,497.5,74.133,497.5,77.417L497.5,80.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-I LE-S1\" id=\"L-I-S1-0\" d=\"M79.5,122L79.5,126.167C79.5,130.333,79.5,138.667,79.5,146.117C79.5,153.567,79.5,160.133,79.5,163.417L79.5,166.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-R LE-S2\" id=\"L-R-S2-0\" d=\"M288.5,122L288.5,126.167C288.5,130.333,288.5,138.667,288.5,146.117C288.5,153.567,288.5,160.133,288.5,163.417L288.5,166.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-S3\" id=\"L-C-S3-0\" d=\"M497.5,122L497.5,126.167C497.5,130.333,497.5,138.667,497.5,146.117C497.5,153.567,497.5,160.133,497.5,163.417L497.5,166.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(288.5, 18)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-231\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">一个排列</span></div></foreignObject></g></g><g transform=\"translate(79.5, 104)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-232\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数逆序对</span></div></foreignObject></g></g><g transform=\"translate(288.5, 104)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-234\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">切升序游程</span></div></foreignObject></g></g><g transform=\"translate(497.5, 104)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-236\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">分解成循环</span></div></foreignObject></g></g><g transform=\"translate(79.5, 190)\" data-id=\"S1\" data-node=\"true\" id=\"flowchart-S1-238\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">插入排序的移动次数</span></div></foreignObject></g></g><g transform=\"translate(288.5, 190)\" data-id=\"S2\" data-node=\"true\" id=\"flowchart-S2-240\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">自然合并排序的趟数</span></div></foreignObject></g></g><g transform=\"translate(497.5, 190)\" data-id=\"S3\" data-node=\"true\" id=\"flowchart-S3-242\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">生成排列的交换序列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：同一个排列可以量出三种「结构量」，各自对应一种排序或生成算法的代价。这张图说明为什么第 5 章要先把组合性质讲完再讲算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：逆序对像排队时「站错位置」的人数。每纠正一个人，就少一处错位；插入排序就是一个一个纠正。\n<\/li><li>\n类比失效：现实排队里两个人换位可能同时纠正多处错位（一次交换消除两个逆序对），逆序对与移动次数不再一一对应。这就是为什么交换类排序不能用「逆序对数」直接算代价。\n<\/ul>\n<p><strong>实例（游程与合并趟数）<\/strong>：n = 16 的排列切成 8 段游程。第一趟两两合并变 4 段，第二趟 2 段，第三趟 1 段，共 3 趟。若切成 16 段（完全无序），则要 4 趟。游程越少越省。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为逆序对数等于交换次数<\/strong>——实际上一次交换最多消除两个逆序对，也可能一个都不消除（换错位置时）。\n<\/li><li>\n<strong>别以为平均逆序对数是 n²/4 就说明「平均情况很慢」<\/strong>——实际上它恰好说明插入排序平均是 O(n²)，与实测一致。\n<\/li><li>\n<strong>别把游程当成「已经排好的段」<\/strong>——游程只要求段内递增，段与段之间没有顺序关系。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：排列 4, 3, 2, 1 的逆序对数是多少？（填数字）\n<p>（答案：6；解析：每一对都是逆序，(4,3)(4,2)(4,1)(3,2)(3,1)(2,1) 共 6 个，正好是 C(4,2)=6。）<\/p>\n<\/ol>\n<ol><li>\n单选题：A、A、B、B 四个字符共有多少种不同排列？\n<p>A. 4 B. 6 C. 12 D. 24 （答案：B；解析：4!/(2!2!) = 24/4 = 6。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么插入排序的移动次数恰好等于初始逆序对数？\n<p>（答案：每把第 i 个元素往左挪一格，它与左边那个更大的元素构成一个逆序对，挪过去就消除了这一个；挪到正确位置时它左边的都不大于它，逆序对清零。总移动次数等于被消除的逆序对总数。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆序对：前大后小的一对；平均 n(n−1)/4。\n<\/li><li>\n多重集排列数 = n! 除以各重复组阶乘。\n<\/li><li>\n升序游程的期望段数是 (n+1)/2，自然合并排序按游程工作。\n<\/ul>", "ch02": "<h1>第 2 章：内部排序——五类算法与它们的代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 1 章（逆序与游程）；卷1 第 1 章（复杂度）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按「插入、交换、选择、合并、分布」五类给常见排序算法归类。\n<\/li><li>\n说清快速排序平均 O(n log n)、最坏 O(n²) 的触发条件。\n<\/li><li>\n解释堆排序为什么最坏也是 O(n log n)，代价在哪里。\n<\/li><li>\n判断一个场景该用哪种排序：数据近乎有序、内存紧张、键值范围小。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>内部排序的全部差别，可以归结为两个问题：<strong>比较出多少信息、数据搬多少次<\/strong>。五类算法就是五种不同的取舍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插入类（难度：基础）<\/h3>\n<p><strong>直接插入<\/strong>：把第 i 个元素插进前面已经排好的部分，从后往前找位置，边找边挪。<\/p>\n<ul><li>\n最好情况（已有序）：每个元素只比较一次，O(n)。\n<\/li><li>\n最坏情况（完全逆序）：移动次数是逆序对数 n(n−1)/2，O(n²)。\n<\/li><li>\n平均：O(n²)。\n<\/li><li>\n稳定：相等元素不会交换相对次序。\n<\/ul>\n<p><strong>折半插入<\/strong>：找位置时用二分，比较次数降到 O(n log n)，但挪动仍是 O(n²)，总代价没变。<\/p>\n<p><strong>希尔排序<\/strong>：先按较大间隔分组做插入排序，再逐步缩小间隔。它是插入类里少见的能到 O(n^1.3) 左右的算法，但复杂度分析至今没有完全定论。<\/p>\n<h3>概念 2：交换类（难度：进阶）<\/h3>\n<p><strong>冒泡排序<\/strong>：相邻比较，逆序就交换，每一趟把最大值推到末尾。O(n²)，稳定，几乎没有实用价值，但它是「逆序对」最直观的演示。<\/p>\n<p><strong>快速排序<\/strong>：选一个基准（pivot），把比它小的放左边、大的放右边，再对左右两段递归。<\/p>\n<ul><li>\n平均 O(n log n)：每次划分大致对半。\n<\/li><li>\n最坏 O(n²)：每次划分都极不均衡。典型触发是「输入已经有序，却取第一个元素当基准」。\n<\/li><li>\n空间 O(log n)：递归栈深度。\n<\/li><li>\n不稳定。\n<\/ul>\n<p><strong>避免最坏的两个办法<\/strong>：随机选基准，或取头、中、尾三个数的中位数当基准。<\/p>\n<h3>概念 3：选择类（难度：进阶）<\/h3>\n<p><strong>直接选择<\/strong>：每趟从剩余元素里找最小的，与当前位置交换。比较次数固定 n(n−1)/2，与输入无关；交换次数最多 n−1。不稳定。<\/p>\n<p><strong>堆排序<\/strong>：先把数组建成大顶堆（O(n)），再反复把堆顶与末尾交换、缩小堆、下沉调整。<\/p>\n<ul><li>\n建堆 O(n)，每次下沉 O(log n)，共 n 次，总 O(n log n)。\n<\/li><li>\n最坏也是 O(n log n)，这是它相对快排的优势。\n<\/li><li>\n原地排序，空间 O(1)；但不稳定，且常数比快排大，实际常比快排慢。\n<\/ul>\n<p><strong>实例（下沉一次）<\/strong>：堆 [9, 7, 8, 3, 5]，把堆顶 9 与末尾 5 交换得 [5, 7, 8, 3, 9]，堆区缩小为前四个。5 下沉：与较大的孩子 8 交换，得 [8, 7, 5, 3]。堆恢复。<\/p>\n<h3>概念 4：合并类（难度：进阶）<\/h3>\n<p><strong>二路合并排序<\/strong>：把数组对半切，两段各自排好，再合并。合并时两个指针各扫一遍，O(n)。<\/p>\n<ul><li>\n总代价：T(n) = 2T(n/2) + O(n)，展开得 O(n log n)。\n<\/li><li>\n稳定。\n<\/li><li>\n代价是需要 O(n) 的额外空间。\n<\/ul>\n<p><strong>为什么合并能做到 O(n)<\/strong>：两段已经有序，每次只需比较两个队首，取小的那个，指针前移一格，不需要回头。<\/p>\n<h3>概念 5：分布类（难度：进阶）<\/h3>\n<p><strong>基数排序<\/strong>：不比较元素大小，而是按「位」分配。从最低位开始，每一轮按该位把元素分到若干个桶，再按桶序收集；做完最高位，整体有序。<\/p>\n<ul><li>\n代价 O(d(n + k))，d 是位数，k 是基数。\n<\/li><li>\n当 d 很小、k 不大时，是线性时间。\n<\/li><li>\n稳定（这是它能从低位往高位做的前提）。\n<\/ul>\n<p><strong>实例<\/strong>：对 12、3、25 按十进制基数排序。<\/p>\n<ul><li>\n个位分配：3 → 桶 3；12 → 桶 2；25 → 桶 5。收集：12、3、25。\n<\/li><li>\n十位分配：12 → 桶 1；3 → 桶 0；25 → 桶 2。收集：3、12、25。有序。\n<\/ul>\n<h3>概念 6：怎么选（难度：进阶）<\/h3>\n<table><thead><tr><th>场景<\/th><th>选择<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>数据近乎有序<\/td><td>直接插入<\/td><td>最好情况 O(n)<\/td><\/tr><tr><td>内存极紧、要最坏有保证<\/td><td>堆排序<\/td><td>原地，最坏 O(n log n)<\/td><\/tr><tr><td>通用、要求平均快<\/td><td>快速排序<\/td><td>常数小，缓存友好<\/td><\/tr><tr><td>要求稳定<\/td><td>合并排序<\/td><td>稳定且 O(n log n)<\/td><\/tr><tr><td>键值范围小、位数少<\/td><td>基数排序<\/td><td>线性时间<\/td><\/tr><tr><td>链表结构<\/td><td>合并排序<\/td><td>不需要随机访问<\/td><\/tr><\/tbody><\/table>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 452.33984375 696\" style=\"max-width: 452.33984375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg19\"><style>#svg19{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg19 .error-icon{fill:#552222;}#svg19 .error-text{fill:#552222;stroke:#552222;}#svg19 .edge-thickness-normal{stroke-width:2px;}#svg19 .edge-thickness-thick{stroke-width:3.5px;}#svg19 .edge-pattern-solid{stroke-dasharray:0;}#svg19 .edge-pattern-dashed{stroke-dasharray:3;}#svg19 .edge-pattern-dotted{stroke-dasharray:2;}#svg19 .marker{fill:#333333;stroke:#333333;}#svg19 .marker.cross{stroke:#333333;}#svg19 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg19 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg19 .cluster-label text{fill:#333;}#svg19 .cluster-label span,#svg19 p{color:#333;}#svg19 .label text,#svg19 span,#svg19 p{fill:#333;color:#333;}#svg19 .node rect,#svg19 .node circle,#svg19 .node ellipse,#svg19 .node polygon,#svg19 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg19 .flowchart-label text{text-anchor:middle;}#svg19 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg19 .node .label{text-align:center;}#svg19 .node.clickable{cursor:pointer;}#svg19 .arrowheadPath{fill:#333333;}#svg19 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg19 .flowchart-link{stroke:#333333;fill:none;}#svg19 .edgeLabel{background-color:#e8e8e8;text-align:center;} "5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg19_flowchart-crossEnd\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg19_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg19_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-S LE-A\" id=\"L-S-A-0\" d=\"M116,36L116,40.167C116,44.333,116,52.667,116.066,60.2C116.132,67.734,116.264,74.467,116.33,77.834L116.396,81.201\"></path><path marker-end=\"url(#svg19_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-A LE-B\" id=\"L-A-B-0\" d=\"M151.719,166.281L170.266,177.984C188.813,189.688,225.906,213.094,244.524,229.914C263.142,246.734,263.284,256.967,263.355,262.084L263.426,267.201\"></path><path marker-end=\"url(#svg19_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-B LE-M\" id=\"L-B-M-0\" d=\"M233.042,357.042L220.576,367.951C208.111,378.861,183.181,400.681,155.45,423.546C127.719,446.411,97.188,470.321,81.922,482.277L66.657,494.232\"></path><path marker-end=\"url(#svg19_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-B LE-C\" id=\"L-B-C-0\" d=\"M274.5,376.5L276.25,384.167C278,391.833,281.5,407.167,283.321,419.95C285.142,432.734,285.284,442.967,285.355,448.084L285.426,453.201\">< lock; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">合并排序</span></div></foreignObject></g></g><g transform=\"translate(285, 515.5)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-250\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-57.5,57.5)\" class=\"label-container\" points=\"57.5,0 115,-57.5 57.5,-115 0,-57.5\"></polygon><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">内存紧吗</span></div></foreignObject></g></g><g transform=\"translate(207.38671875, 662)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-252\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">堆排序</span></div></foreignObject></g></g><g transform=\"translate(362.61328125, 662)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-254\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快速排序 随机基准</span></div></foreignObject></g></g><g transform=\"translate(116, 329.5)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-258\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">基数排序</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：先问「数据在哪」再问「要不要稳定」，这两个问题基本就决定了算法。剩下的差别是常数与实现难度。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：插入排序像整理一手扑克牌，一张张插进已经排好的牌里；合并排序像两组已经排好的牌，每次从两叠顶上看一张小的；基数排序像先按个位把牌分堆，再按十位分堆。\n<\/li><li>\n类比失效：扑克牌只有 52 张，牌数一大，手就不可能同时握住；真实算法的「手」是内存，容量与访问速度才是关键约束。\n<\/ul>\n<p><strong>实例（快排一次划分）<\/strong>：数组 [5, 3, 8, 4, 2]，基准取 5。<\/p>\n<ul><li>\n3 &lt; 5，留左边；8 &gt; 5，留右边；4 &lt; 5，与 8 交换 → [5, 3, 4, 8, 2]；2 &lt; 5，与 8 交换 → [5, 3, 4, 2, 8]。\n<\/li><li>\n基准 5 与 2 交换 → [2, 3, 4, 5, 8]。\n<p>左边 [2,3,4] 全小于 5，右边 [8] 大于 5，划分完成。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为快排最坏 O(n²) 只是理论<\/strong>——实际上对已排序数据取首元素当基准，就会稳定触发。\n<\/li><li>\n<strong>别以为堆排序比快排快<\/strong>——实际上它最坏有保证，但常数大、缓存不友好，平均常慢于快排。\n<\/li><li>\n<strong>别以为基数排序不需要「比较」就更快<\/strong>——实际上它依赖键的位数与基数，键很长时 d 很大，未必比 O(n log n) 快。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：对已经升序排列的数组取首元素为基准做快排，复杂度是？\n<p>A. O(n) B. O(n log n) C. O(n²) D. O(log n) （答案：C；解析：每次划分都一边空一边全，递归深度 n，总代价 n²。）<\/p>\n<\/ol>\n<ol><li>\n填空题：堆排序建堆的代价是 O(___)。\n<p>（答案：n；解析：自底向上建堆的总代价是 O(n)，不是 O(n log n)，因为大部分节点在下层、下沉距离短。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么基数排序必须稳定？\n<p>（答案：低位排完后，高位相同的元素要保持低位的相对次序；若高位分配时打乱了低位结果，最终就不有序。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五类：插入、交换、选择、合并、分布。\n<\/li><li>\n快排平均 O(n log n)、最坏 O(n²)；堆排序最坏 O(n log n)；合并稳定但要额外空间。\n<\/li><li>\n基数排序 O(d(n+k))，稳定的前提是从低位到高位。\n<\/ul>", "ch03": "<h1>第 3 章：最优排序——比较次数的下界与排序网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2 章；log 与阶乘的估算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用比较树推出「排序至少需要约 n log2 n 次比较」。\n<\/li><li>\n算出小规模下确切的比较次数下界（如 3 个元素、5 个元素）。\n<\/li><li>\n说清 0-1 原理，并解释它为什么能把检验工作从 2^n 类输入压到一类。\n<\/li><li>\n说出排序网络与比较排序的根本差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>n log n 不是某个算法的性能，而是<strong>问题本身的信息量下限<\/strong>；任何只靠比较的排序都逃不掉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：比较树与信息下界（难度：进阶）<\/h3>\n<p>把排序过程看成一棵判断树：<\/p>\n<ul><li>\n每个内部节点是一次比较（a 与 b 谁大）。\n<\/li><li>\n每条边是一个比较结果（小于或大于）。\n<\/li><li>\n每个叶子是一个可能的输出排列。\n<\/ul>\n<p>要正确排序 n 个元素，n! 种输入排列必须分别落到能输出正确结果的叶子上，所以叶子至少 n! 个。<\/p>\n<p>一棵二叉树有 L 个叶子时，高度至少 log2 L。因此最坏情况的比较次数 ≥ log2(n!)。<\/p>\n<p><strong>实例<\/strong>：<\/p>\n<ul><li>\nn = 3：log2 6 ≈ 2.58，向上取整得 3。3 次比较够（先比 a,b，再比 b,c，再按结果补一次）。\n<\/li><li>\nn = 5：log2 120 ≈ 6.91，向上取整得 7。5 个元素最坏情况至少 7 次比较，且 7 次可以做到。\n<\/li><li>\nn = 100：log2(100!) ≈ 525，而 n log2 n = 664，两者同阶。\n<\/ul>\n<p><strong>公式近似<\/strong>：log2(n!) ≈ n log2 n − 1.4427 n + O(log n)。那个 1.44 的系数是 1/ln 2。<\/p>\n<h3>概念 2：最优排序与「节约一次比较」（难度：高难）<\/h3>\n<p>对小 n，Knuth 给出了确切的最优比较次数：<\/p>\n<table><thead><tr><th>n<\/th><th>最坏情况最少比较次数<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>3<\/td><\/tr><tr><td>4<\/td><td>5<\/td><\/tr><tr><td>5<\/td><td>7<\/td><\/tr><tr><td>6<\/td><td>10<\/td><\/tr><\/tbody><\/table>\n<p>注意 5 个元素只要 7 次，而朴素插入排序最坏要 10 次。省下来的方式是「先做几次比较收集信息，再决定后面怎么比」，而不是固定流程。<\/p>\n<p><strong>为什么 n 一大就难<\/strong>：可能的比较策略爆炸式增长，最优策略难以构造，实践里用 O(n log n) 的算法接受一点点次优。<\/p>\n<h3>概念 3：排序网络（难度：高难）<\/h3>\n<p>排序网络是一组固定的比较器，每个比较器连接两根线，把较大的送到下方、较小的送到上方。<strong>没有分支<\/strong>，所有比较同时按层进行。<\/p>\n<p><strong>它和普通排序的差别<\/strong>：<\/p>\n<ul><li>\n普通排序的比较顺序依赖前面的结果（有分支）。\n<\/li><li>\n排序网络的比较顺序完全固定，适合硬件并行、GPU 实现。\n<\/ul>\n<p><strong>0-1 原理<\/strong>：如果一个排序网络能把所有 2^n 种「只含 0 和 1」的输入排好，那么它能把任意输入排好。<\/p>\n<p><strong>为什么成立<\/strong>（直觉）：比较器的行为只取决于「谁大」。把任意输入按某个阈值切成 0/1，若网络对每种切法都排好，则原输入也排好。这条原理把检验从「所有排列」压到「2^n 种 0/1 串」，工作量小得多。<\/p>\n<p><strong>Batcher 奇偶归并网络<\/strong>：把两段已排序的序列按奇偶下标分开归并，递归构造。规模 O(n log² n)，深度 O(log² n)。<\/p>\n<p><strong>实例（4 输入网络）<\/strong>：比较 (1,2)、(3,4)，再比较 (1,3)、(2,4)，最后比较 (2,3)。四层比较器，能排好任意 4 个输入。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 725.578125 310\" style=\"max-width: 725.578125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg20\"><style>#svg20{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg20 .error-icon{fill:#552222;}#svg20 .error-text{fill:#552222;stroke:#552222;}#svg20 .edge-thickness-normal{stroke-width:2px;}#svg20 .edge-thickness-thick{stroke-width:3.5px;}#svg20 .edge-pattern-solid{stroke-dasharray:0;}#svg20 .edge-pattern-dashed{stroke-dasharray:3;}#svg20 .edge-pattern-dotted{stroke-dasharray:2;}#svg20 .marker{fill:#333333;stroke:#333333;}#svg20 .marker.cross{stroke:#333333;}#svg20 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg20 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg20 .cluster-label text{fill:#333;}#svg20 .cluster-label span,#svg20 p{color:#333;}#svg20 .label text,#svg20 span,#svg20 p{fill:#333;color:#333;}#svg20 .node rect,#svg20 .node circle,#svg20 .node ellipse,#svg20 .node polygon,#svg20 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg20 .flowchart-label text{text-anchor:middle;}#svg20 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg20 .node .label{text-align:center;}#svg20 .node.clickable{cursor:pointer;}#svg20 .arrowheadPath{fill:#333333;}#svg20 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg20 .flowchart-link{stroke:#333333;fill:none;}#svg20 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg20 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg20 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg20 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg20 .cluster text{fill:#333;}#svg20 .cluster span,#svg20 p{color:#333;}#svg20 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\ hart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-N LE-Z\" id=\"L-N-Z-0\" d=\"M505.717,208L517.847,212.167C529.978,216.333,554.239,224.667,566.369,232.117C578.5,239.567,578.5,246.133,578.5,249.417L578.5,252.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(341.45703125, translate(-58.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"116.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排序网络 无分支</span></div></foreignObject></g></g><g transform=\"translate(104.4140625, 276)\" data-id=\"O1\" data-node=\"true\" id=\"flowchart-O1-266\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"208.828125\" y=\"-18\" x=\"-104.4140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-96.9140625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"193.828125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快排 堆排 合并 达到 n log n</span></div></foreignObject></g></g><g transform=\"translate(328.125, 276)\" data-id=\"O2\" data-node=\"true\" id=\"flowchart-O2-268\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"138.59375\" y=\"-18\" x=\"-69.296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-61.796875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"123.59375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Batcher 奇偶归并</span></div></foreignObject></g></g><g transform=\"translate(578.5, 276)\" data-id=\"Z\" data-node=\"true\" id=\"flowchart-Z-270\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"262.15625\" y=\"-18\" x=\"-131.078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-123.578125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"247.15625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">0 1 原理 只需验 2 的 n 次方 种输入</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：两条分支共享同一个下界。排序网络的优势不在比较次数更少（它通常更多），而在「无分支、可并行」。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：比较排序像查字典，查到一半就知道该往左还是往右翻；排序网络像洗牌机，不管牌面是什么，固定地把指定位置的两张牌比一下、大的放右边。\n<\/li><li>\n类比失效：洗牌机的动作固定，但它的比较器数量是人工设计的；真实的排序网络规模随 n 增长，设计本身是组合难题。\n<\/ul>\n<p><strong>实例（0-1 原理的用法）<\/strong>：要验证一个 4 输入网络，不必测 24 种排列，只需测 16 种 0/1 串：0000、0001、…、1111。全部排好，就说明它对任意 4 个数字都正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 n log n 是所有排序的下限<\/strong>——实际上只是「基于比较」的下限。基数排序不比较，可以到线性。\n<\/li><li>\n<strong>别以为排序网络比较次数少<\/strong>——实际上它通常比最优比较排序多，胜在无分支和并行。\n<\/li><li>\n<strong>别以为 0-1 原理是近似<\/strong>——实际上它是严格等价的判定条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：5 个元素排序，最坏情况至少需要多少次比较？（填数字）\n<p>（答案：7；解析：log2(5!) = log2 120 ≈ 6.91，向上取整为 7，且存在 7 次比较的最优算法。）<\/p>\n<\/ol>\n<ol><li>\n单选题：排序网络的核心优势是？\n<p>A. 比较次数最少 B. 无分支、可并行 C. 不需要额外空间 D. 稳定 （答案：B；解析：网络结构固定，所有比较按层同时进行，适合硬件实现；比较次数通常反而更多。）<\/p>\n<\/ol>\n<ol><li>\n简答题：0-1 原理为什么能把验证工作大幅减少？\n<p>（答案：只需验证 2^n 种 0/1 输入，而不是 n! 种排列；任意输入可按阈值切成 0/1，若每种切法都被排好，原输入也必被排好。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较排序下界 log2(n!)，约 n log2 n。\n<\/li><li>\n小 n 的最优比较次数：3 个元素 3 次，5 个元素 7 次。\n<\/li><li>\n0-1 原理：验 2^n 种 0/1 输入即可判定整个网络。\n<\/ul>", "ch04": "<h1>第 4 章：外部排序——数据比内存大怎么办<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2 章（合并排序）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清外部排序为什么以「读写次数」而不是「比较次数」衡量代价。\n<\/li><li>\n算出给定初始游程数与路数时的合并趟数。\n<\/li><li>\n解释替代选择为什么能把平均游程长度做到缓冲区容量的两倍。\n<\/li><li>\n说出多阶段合并解决的现实问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>外部排序的瓶颈不在 CPU，在磁盘；所以一切设计都围绕<strong>减少读写趟数<\/strong>，哪怕多花比较。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：初始游程（难度：基础）<\/h3>\n<p>内存装不下全部数据，先分块读进来，每块内部排好，写回磁盘，形成一个<strong>有序游程<\/strong>（run）。这一步叫「生成初始游程」。<\/p>\n<p>若内存能放 P 条记录，朴素做法每块产生长度 P 的游程；数据总量 N 条，就有 N/P 个游程。<\/p>\n<p><strong>代价<\/strong>：读一遍、写一遍，各 N 条。<\/p>\n<h3>概念 2：替代选择（难度：进阶）<\/h3>\n<p>朴素分块浪费了内存：块与块之间没有利用「刚写出去的最小元素可能比下一块的最大元素还小」这个事实。<\/p>\n<p><strong>替代选择<\/strong>的做法：把内存当成一个堆，先装满 P 条。每次取出堆顶（最小）写出，再从输入读一条进来：<\/p>\n<ul><li>\n若新读的比刚写的大，它可以留在当前游程里，堆调整后继续。\n<\/li><li>\n若新读的比刚写的小，它不能进当前游程，先存到「保留区」，等下一个游程用。\n<\/ul>\n<p><strong>效果<\/strong>：随机输入下，平均游程长度约为 2P，也就是游程数减半，合并趟数少一趟。<\/p>\n<p><strong>实例<\/strong>：P = 4，输入序列 5, 2, 9, 1, 7, 3。<\/p>\n<ul><li>\n装满 [5,2,9,1] 建堆，堆顶 1。写出 1，读 7（7 &gt; 1，可进当前游程）。\n<\/li><li>\n堆顶 2，写出 2，读 3（3 &gt; 2，可进）。\n<\/li><li>\n堆顶 5，写出 5，输入已空，当前游程继续把堆里剩下的 7、9 写完 → 游程 [1,2,5,7,9]，长度 5，超过 P = 4。\n<\/ul>\n<h3>概念 3：k 路合并与趟数（难度：基础）<\/h3>\n<p>把 k 个游程同时合并成一个：每次从 k 个游程的队首取最小的。用败者树或堆，每次取最小是 O(log k)。<\/p>\n<p><strong>趟数公式<\/strong>：R 个初始游程，k 路合并，趟数 = 向上取整的 log_k R。<\/p>\n<p><strong>实例<\/strong>：R = 1000，k = 4。 4⁴ = 256 &lt; 1000，4⁵ = 1024 ≥ 1000，所以要 5 趟。<\/p>\n<p><strong>每趟代价<\/strong>：读 N 条、写 N 条（最后一遍只读不写）。总读写量约为 2N × 趟数。<\/p>\n<p><strong>k 是不是越大越好<\/strong>：k 大则趟数少，但 k 个输入缓冲区要占内存，每个缓冲区太小又会增加读块次数。实践里 k 常取几十到几百。<\/p>\n<h3>概念 4：多阶段合并（难度：高难）<\/h3>\n<p>磁带只能顺序读写，台数有限（历史上常见 3 到 6 台）。k 路合并需要 k 台输入加 1 台输出，台数一紧就做不了。<\/p>\n<p><strong>多阶段合并<\/strong>用「不均匀分配」解决：不要求每台磁带的游程数一样，而是按 Fibonacci 数分配，让合并过程中始终有一台空带可以当输出，轮流使用。<\/p>\n<p><strong>实例（3 台磁带、Fibonacci 分配）<\/strong>：初始游程数按 1、2、3、5、8… 分配，合并时把最短的两段并到空带上，始终维持「有一段空带」的状态。<\/p>\n<p><strong>级联合并<\/strong>是它的推广：允许更多磁带、更复杂的分配表，减少「空转」。<\/p>\n<h3>概念 5：反向读取与振荡（难度：高难）<\/h3>\n<p>磁带合并时，若能把上一次写的磁带反着读，就不必倒带，直接接着上一趟的尾部继续。<strong>振荡排序<\/strong>（oscillating sort）利用这一点，让读的方向在趟与趟之间交替，省掉倒带时间。<\/p>\n<p><strong>这几节为什么今天还要看<\/strong>：思路仍然适用于现代存储。SSD 虽然随机访问快，但顺序读写仍远快于随机；「减少趟数、尽量顺序」的原则没变。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 303.453125 786\" style=\"max-width: 303.453125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg21\"><style>#svg21{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg21 .error-icon{fill:#552222;}#svg21 .error-text{fill:#552222;stroke:#552222;}#svg21 .edge-thickness-normal{stroke \" data-node=\"true\" id=\"flowchart-G-272\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">分块读入内存</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 190)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-274\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">生成初始游程</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 331.5)\" data-id=\"RS\" data-node=\"true\" id=\"flowchart-RS-276\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-73.5,73.5)\" class=\"label-container\" points=\"73.5,0 147,-73.5 73.5,-147 0,-73.5\"></polygon><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">用替代选择吗</span></div></foreignObject></g></g><g transform=\"translate(225.8671875, 494)\" data-id=\"R2\" data-node=\"true\" id=\"flowchart-R2-278\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"123.171875\" y=\"-18\" x=\"-61.5859375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-54.0859375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"108.171875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均游程 2P 条</span></div></foreignObject></g></g><g transform=\"translate(57.140625, 494)\" data-id=\"R1\" data-node=\"true\" id=\"flowchart-R1-280\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"114.28125\" y=\"-18\" x=\"-57.140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.640625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"99.28125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">游程长度 P 条</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 580)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-282\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多路合并</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 666)\" data-id=\"P1\" data-node=\"true\" id=\"flowchart-P1-286\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"101.25\" y=\"-18\" x=\"-50.625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-43.125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"86.25\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">趟数 log k R</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 752)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-288\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">有序输出</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：两个箭头最终汇到同一个合并环节，但游程数不同——替代选择把 R 减半，直接省下一整趟读写。这就是它值得单独讲的原因。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：外部排序像整理一屋子书，桌子只能放 100 本。先把每 100 本排好堆成一摞，再把几摞同时摊开，每次取最小的一本放成大摞。\n<\/li><li>\n类比失效：书可以随手抽，磁盘不行；磁盘按块读，随机访问有寻道开销，所以「块大小」也是设计参数。\n<\/ul>\n<p><strong>实例（算总代价）<\/strong>：N = 10⁸ 条，P = 10⁶ 条，k = 10。<\/p>\n<ul><li>\n朴素游程数 R = 100，趟数 log10 100 = 2。\n<\/li><li>\n用替代选择，R = 50，趟数 log10 50 ≈ 1.7，向上取整仍是 2 趟，但第二趟的输入少了一半。\n<\/li><li>\n总读写量：朴素约 2×10⁸×2 = 4×10⁸ 条记录，替代选择约 3×10⁸ 条。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为外部排序比内部排序「算法更复杂」<\/strong>——实际上核心就是合并排序加缓冲区管理，复杂的是调度。\n<\/li><li>\n<strong>别以为 k 越大越好<\/strong>——实际上 k 受内存限制，缓冲区太小会让每次读的块变碎，反而更慢。\n<\/li><li>\n<strong>别以为多阶段合并已经过时<\/strong>——实际上「不均匀分配 + 轮流用空带」的思想在分布式归并与日志合并树里仍在用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：1000 个初始游程做 4 路合并，需要多少趟？（填数字）\n<p>（答案：5；解析：4⁴ = 256 不够，4⁵ = 1024 够，所以 5 趟。）<\/p>\n<\/ol>\n<ol><li>\n单选题：替代选择在随机输入下的平均游程长度约为内存容量的多少倍？\n<p>A. 0.5 B. 1 C. 2 D. 4 （答案：C；解析：Knuth 的分析给出平均约 2P，P 为缓冲区可容纳的记录数。）<\/p>\n<\/ol>\n<ol><li>\n简答题：多阶段合并要解决的是什么问题？\n<p>（答案：磁带台数有限，k 路合并需要 k 台输入加 1 台输出，台数不够；多阶段用 Fibonacci 式的不均匀分配，让合并过程中始终有一台空带可作输出。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n外部排序以读写趟数计代价；趟数 = log_k R。\n<\/li><li>\n替代选择让平均游程达 2P，游程数减半。\n<\/li><li>\n多阶段合并用不均匀分配解决磁带台数不足。\n<\/ul>", "ch05": "<h1>第 5 章：查找——从顺序扫到平衡树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2 章；卷1 第 2 章（树的数学性质）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算出顺序查找与二分查找的平均、最坏比较次数。\n<\/li><li>\n解释二叉查找树平均 O(log n)、最坏 O(n) 的原因。\n<\/li><li>\n说清 AVL 树靠什么把高度控制在约 1.44 log2 n。\n<\/li><li>\n算出 B 树的层数，并解释为什么数据库索引用它而不是二叉树。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>查找的代价取决于<strong>数据怎么组织<\/strong>：无序只能扫，有序能折半，树把折半变成动态结构，多路树把「层数」换成「扇出」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：顺序查找（难度：基础）<\/h3>\n<p>从第一个元素开始逐个比较，找到就返回。<\/p>\n<ul><li>\n成功查找平均比较次数：(n+1)/2（假设每个位置等概率被查）。\n<\/li><li>\n失败查找：n 次。\n<\/li><li>\n<strong>哨兵技巧<\/strong>：把要查的键放在数组末尾当哨兵，循环里就不必每次判断「是否越界」，比较次数不变但每轮少一次判断。\n<\/ul>\n<p><strong>适用<\/strong>：数据量小、无序、或只在链表上查找。<\/p>\n<h3>概念 2：二分查找（难度：基础）<\/h3>\n<p>要求数据<strong>有序且能随机访问<\/strong>。每次比较中间元素，排除一半。<\/p>\n<ul><li>\n最坏比较次数：约 log2 n 次（准确说是向上取整的 log2(n+1)）。\n<\/li><li>\n前提：有序；数组（链表不行，因为取中间要 O(n)）。\n<\/ul>\n<p><strong>实例<\/strong>：在 1 到 9 中查 7。<\/p>\n<ul><li>\n中间是 5，7 &gt; 5，看右半 6 到 9。\n<\/li><li>\n右半中间是 7（取下中位数），命中。共 2 次比较。\n<\/li><li>\n最坏是查 9 或 1，需要 4 次。\n<\/ul>\n<h3>概念 3：二叉查找树（难度：进阶）<\/h3>\n<p>每个节点满足：左子树所有键小于它，右子树所有键大于它。查找时一路向下比较。<\/p>\n<ul><li>\n平均查找长度约 2 ln n ≈ 1.39 log2 n。\n<\/li><li>\n最坏 O(n)：按升序依次插入，树退化成一条链。\n<\/li><li>\n删除节点分三种情况：叶子直接删；只有一个孩子用孩子顶替；有两个孩子用中序后继（右子树最小）顶替。\n<\/ul>\n<p><strong>实例<\/strong>：依次插入 3、1、5、2 得到：<\/p>\n<ul><li>\n3 为根，1 在左，5 在右，2 在 1 的右边。\n<p>查 2：3 → 1 → 2，3 次比较。<\/p>\n<\/ul>\n<h3>概念 4：平衡树（难度：高难）<\/h3>\n<p>AVL 树要求每个节点的左右子树高度差不超过 1。插入或删除破坏了平衡，就通过<strong>旋转<\/strong>恢复。<\/p>\n<ul><li>\n高度上界：约 1.44 log2(n+2) − 0.33，比二叉查找树的平均情况只差一点，但<strong>最坏也有保证<\/strong>。\n<\/li><li>\n四种失衡情形：左左、左右、右左、右右；左右与右左需要双旋。\n<\/li><li>\n代价：每次插入/删除最多 O(log n) 次旋转，常数比普通二叉查找树大。\n<\/ul>\n<p><strong>红黑树<\/strong>是另一种平衡方案，平衡条件更松（最长路径不超过最短的两倍），插入删除的旋转次数更少，工程里更常用。<\/p>\n<h3>概念 5：多路树与 B 树（难度：高难）<\/h3>\n<p>二叉树的每个节点只有两个孩子，树高 log2 n；如果每个节点能有 m 个孩子，树高就是 log_m n。<\/p>\n<p><strong>B 树<\/strong>：每个节点存多个键、多个孩子，所有叶子在同一层。查找时在每个节点内部做一次二分或顺序比较，然后下到某个孩子。<\/p>\n<p><strong>实例<\/strong>：10 亿个键，每个节点 100 个孩子。 层数 ≈ log_100(10⁹) = 9/2 = 4.5，也就是 5 层左右。若用二叉树，要约 30 层。<\/p>\n<p><strong>为什么数据库用 B 树<\/strong>：每一层通常对应一次磁盘读。5 次读 vs 30 次读，差距是 6 倍。把「层数」压下来，就是把 I/O 次数压下来。<\/p>\n<h3>概念 6：数字查找（难度：进阶）<\/h3>\n<p>键是数字或字符串时，可以按「位」分支，而不是按大小比较。<\/p>\n<ul><li>\n<strong>基数查找树（trie）<\/strong>：每个节点对应一位数字，路径拼起来就是键。查找代价与键长成正比，与元素个数关系不大。\n<\/li><li>\n<strong>数字查找树<\/strong>：按键的二进制位分支，类似 trie 但更紧凑。\n<\/ul>\n<p><strong>适用<\/strong>：键长固定、集合很大、需要前缀查询（如 IP 路由表、词典）。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 502.10546875 810\" style=\"max-width: 502.10546875px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg22\"><style>#svg22{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg22 .error-icon{fill:#552222;}#svg22 .error-text{fill:#552222;stroke:#552222;}#svg22 .edge-thickness-normal{stroke-width:2px;}#svg22 .edge-thickness-thick{stroke-width:3.5px;}#svg22 .edge-pattern-solid{stroke-dasharray:0;}#svg22 .edge-pattern-dashed{stroke-dasharray:3;}#svg22 .edge-pattern-dotted{stroke-dasharray:2;}#svg22 .marker{fill:#333333;stroke:#333333;}#svg22 .marker.cross{stroke:#333333;}#svg22 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg22 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg22 .cluster-label text{fill:#333;}#svg22 .cluster-label span,#svg22 p{color:#333;}#svg22 .label text,#svg22 span,#svg22 p{fill:#333;color:#333;}#svg22 .node rect,#svg22 .node circle,#svg22 .node ellipse,#svg22 .node polygon,#svg22 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg22 .flowchart-label text{text-anchor:middle;}#svg22 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg22 .node .label{text-align:center;}#svg22 .node.clickable{cursor:pointer;}#svg22 .arrowheadPath{fill:#333333;}#svg22 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg22 .flowchart-link{stroke:#333333;fill:none;}#svg22 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg22 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg22 .labelBkg{backgr
