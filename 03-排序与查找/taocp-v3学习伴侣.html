<style>

}
[data-theme="dark"]{

.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}

.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}

.quiz-feedback{margin-left:12px;font-size:13px}

.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>

.diagram-rendered{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;margin:14px 0;overflow-x:auto}

02", "type": "single", "question": "对已经升序排列的数组取首元素为基准做快排，复杂度是？", "options": ["O(n)", "O(n log n)", "O(n²)", "O(log n)"], "answer": 2, "explain": "每次划分一边空一边全，递归深度 n，总代价 n²。"}, {"id": "q05", "chapterId": "ch02", "type": "blank", "question": "堆排序建堆的代价是 O(___)。（填字母 n 或 n log n）", "options": [], "answer": "n", "explain": "自底向上建堆总代价 O(n)，因为大部分节点在下层、下沉距离短。"}, {"id": "q06", "chapterId": "ch02", "type": "single", "question": "基数排序必须满足的性质是？", "options": ["稳定", "原地", "比较元素大小", "递归"], "answer": 0, "explain": "从低位到高位，高位分配时必须保持低位结果的相对次序，所以必须稳定。"}, {"id": "q07", "chapterId": "ch03", "type": "blank", "question": "5 个元素排序，最坏情况至少需要多少次比较？（填数字）", "options": [], "answer": "7", "explain": "log2(5!) = log2 120 ≈ 6.91，向上取整 7，且 7 次可做到。"}, {"id": "q08", "chapterId": "ch03", "type": "single", "question": "排序网络的核心优势是？", "options": ["比较次数最少", "无分支、可并行", "不需要额外空间", "稳定"], "answer": 1, "explain": "网络结构固定，所有比较按层同时执行，适合硬件；比较次数通常更多。"}, {"id": "q09", "chapterId": "ch03", "type": "single", "question": "0-1 原理的作用是？", "options": ["把任意输入化归为 0/1 输入来验证网络", "证明快排最优", "计算逆序对数", "分析散列冲突"], "answer": 0, "explain": "只需验证 2^n 种 0/1 输入，若全排好则任意输入都排好。"}, {"id": "q10", "chapterId": "ch04", "type": "blank", "question": "1000 个初始游程做 4 路合并，需要多少趟？（填数字）", "options": [], "answer": "5", "explain": "4⁴=256 不够，4⁵=1024 够，所以 5 趟。"}, {"id": "q11", "chapterId": "ch04", "type": "single", "question": "替代选择在随机输入下的平均游程长度约为缓冲区容量的多少倍？", "options": ["0.5", "1", "2", "4"], "answer": 2, "explain": "Knuth 的分析给出平均约 2P，P 为缓冲区记录数，游程数因此减半。"}, {"id": "q12", "chapterId": "ch04", "type": "single", "question": "多阶段合并主要解决什么问题？", "options": ["比较次数太多", "磁带台数不足", "内存太大", "键值范围太小"], "answer": 1, "explain": "k 路合并需 k 台输入加 1 台输出，台数不够时用不均匀分配轮流用空带。"}, {"id": "q13", "chapterId": "ch05", "type": "blank", "question": "在 1 到 9 的有序数组里二分查找 7，需要多少次比较？（填数字）", "options": [], "answer": "2", "explain": "先比中间 5，7 大于 5；再在 6 到 9 中比中间 7，命中。"}, {"id": "q14", "chapterId": "ch05", "type": "single", "question": "二叉查找树最坏情况下的查找代价是？", "options": ["O(1)", "O(log n)", "O(n)", "O(n log n)"], "answer": 2, "explain": "按升序插入退化成链，查找退化为顺序扫描。"}, {"id": "q15", "chapterId": "ch05", "type": "single", "question": "10 亿个键、每节点 100 个孩子的 B 树，大约几层？", "options": ["3", "5", "10", "30"], "answer": 1, "explain": "log_100(10⁹) = 4.5，约 5 层；每层通常对应一次磁盘读。"}, {"id": "q16", "chapterId": "ch06", "type": "blank", "question": "m = 13，键 44 的除法散列槽位是多少？（填数字）", "options": [], "answer": "5", "explain": "44 = 3×13 + 5，余数 5。"}, {"id": "q17", "chapterId": "ch06", "type": "single", "question": "链地址法在 α = 2 时，成功查找平均比较次数约为？", "options": ["1", "2", "4", "8"], "answer": 1, "explain": "成功查找约 1 + α/2 = 2 次。"}, {"id": "q18", "chapterId": "ch06", "type": "single", "question": "开放地址法删除元素时为什么需要墓碑？", "options": ["为了节省空间", "为了保持探测链不断", "为了提高散列速度", "为了支持排序"], "answer": 1, "explain": "直接清空会截断后续键的探测链，使本来存在的键查找失败。"}, {"id": "q19", "chapterId": "__all__", "type": "single", "question": "综合题：一个日志系统要按时间排序 10 GB 数据，内存只有 1 GB，最合理的方案是？", "options": ["直接快速排序", "生成初始游程后用替代选择与多路合并", "用散列表", "用二叉查找树"], "answer": 1, "explain": "数据远大于内存必须外部排序；替代选择把平均游程做到 2P，多路合并减少趟数。快排装不下，散列与二叉查找树不解决排序。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "逆序对是什么？平均有多少个？", "back": "前大后小的一对位置；n 个元素的平均逆序对数为 n(n−1)/4。", "tags": ["组合性质"]}, {"id": "f02", "chapterId": "ch01", "front": "插入排序的移动次数等于什么？", "back": "等于初始逆序对数，每次左移一格消除恰好一个逆序对。", "tags": ["组合性质"]}, {"id": "f03", "chapterId": "ch01", "front": "多重集排列的种数公式？", "back": "n! 除以各重复组阶乘之积，n!/(n1!n2!…nk!)。", "tags": ["组合性质"]}, {"id": "f04", "chapterId": "ch02", "front": "五类内部排序是哪五类？", "back": "插入、交换、选择、合并、分布。", "tags": ["排序"]}, {"id": "f05", "chapterId": "ch02", "front": "快排最坏 O(n²) 的典型触发条件？", "back": "输入已有序却取首元素当基准，每次划分极不均衡。", "tags": ["排序"]}, {"id": "f06", "chapterId": "ch02", "front": "堆排序为什么最坏也是 O(n log n)？", "back": "建堆 O(n)，之后每次下沉 O(log n)，共 n 次，与输入无关。", "tags": ["排序"]}, {"id": "f07", "chapterId": "ch02", "front": "哪种排序稳定且 O(n log n)，代价是什么？", "back": "合并排序；代价是需要 O(n) 额外空间。", "tags": ["排序"]}, {"id": "f08", "chapterId": "ch03", "front": "比较排序的下界怎么推？", "back": "比较树至少 n! 个叶子，高度 ≥ log2(n!)，约 n log2 n − 1.44n。", "tags": ["下界"]}, {"id": "f09", "chapterId": "ch03", "front": "5 个元素最坏最少比较几次？", "back": "7 次，因为 log2 120 ≈ 6.91，向上取整。", "tags": ["下界"]}, {"id": "f10", "chapterId": "ch03", "front": "0-1 原理说的是什么？", "back": "若排序网络能排好所有 2^n 种 0/1 输入，就能排好任意输入。", "tags": ["排序网络"]}, {"id": "f11", "chapterId": "ch04", "front": "外部排序的趟数公式？", "back": "ceil(log_k R)，R 是初始游程数，k 是合并路数。", "tags": ["外部排序"]}, {"id": "f12", "chapterId": "ch04", "front": "替代选择的平均游程长度是多少？", "back": "约 2P，P 是缓冲区可容纳的记录数。", "tags": ["外部排序"]}, {"id": "f13", "chapterId": "ch04", "front": "多阶段合并为什么需要不均匀分配？", "back": "磁带台数有限，需要始终留一台空带当输出，按 Fibonacci 式分配可做到。", "tags": ["外部排序"]}, {"id": "f14", "chapterId": "ch05", "front": "顺序查找与二分查找的平均代价？", "back": "顺序 (n+1)/2；二分约 log2 n，但要求有序且可随机访问。", "tags": ["查找"]}, {"id": "f15", "chapterId": "ch05", "front": "AVL 树的高度上界？", "back": "约 1.44 log2(n+2) − 0.33，最坏也有对数级保证。", "tags": ["查找"]}, {"id": "f16", "chapterId": "ch05", "front": "B 树为什么适合数据库索引？", "back": "扇出 m 大使层数为 log_m n，每层一次磁盘读，I/O 次数远少于二叉树。", "tags": ["查找"]}, {"id": "f17", "chapterId": "ch06", "front": "链地址法的平均查找长度？", "back": "成功约 1 + α/2，失败约 α，α 是装载因子。", "tags": ["散列"]}, {"id": "f18", "chapterId": "ch06", "front": "线性探测的平均查找长度与 α 的关系？", "back": "成功约 (1/2)(1 + 1/(1−α))，α 趋近 1 时急剧恶化。", "tags": ["散列"]}]}, "pages": {"ch01": {"html": "<h1>第 1 章：排序的组合性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：卷1 第 2 章（排列与二项式系数）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n数出一个排列里的逆序对，并说明它和插入排序移动次数的关系。\n<\/li><li>\n算多重集排列的种数。\n<\/li><li>\n说出「游程」是什么，以及随机排列的平均游程数。\n<\/li><li>\n解释研究这些组合量对分析排序算法有什么用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排序算法的平均代价，几乎都能写成「某个组合量的期望」；先把组合量算清楚，后面各节的复杂度公式才有依据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：逆序（反序）与逆序对（难度：基础）<\/h3>\n<p>在一个排列里，如果前面的数比后面的大，这一对就叫一个<strong>逆序对<\/strong>。<\/p>\n<p><strong>实例<\/strong>：排列 3, 1, 4, 2。<\/p>\n<ul><li>\n(3,1)：3 &gt; 1，是\n<\/li><li>\n(3,4)：不是\n<\/li><li>\n(3,2)：3 &gt; 2，是\n<\/li><li>\n(1,4)：不是\n<\/li><li>\n(1,2)：不是\n<\/li><li>\n(4,2)：4 &gt; 2，是\n<\/ul>\n<p>共 3 个逆序对。<\/p>\n<p><strong>它为什么重要<\/strong>：插入排序每把一个元素往左挪一格，就消除恰好一个逆序对。所以<strong>插入排序的移动次数 = 初始逆序对数<\/strong>。<\/p>\n<p><strong>平均逆序对数<\/strong>：所有 n! 个排列平均下来是 n(n−1)/4。n = 4 时是 3，正好等于上面那个排列的逆序对数（巧合而已，不是每个排列都等于 3）。<\/p>\n<h3>概念 2：多重集的排列（难度：基础）<\/h3>\n<p>如果 n 个对象里有重复，全排列数要除以重复组的阶乘：<\/p>\n<p>种数 = n! / (n1! n2! … nk!)<\/p>\n<p>其中 ni 是第 i 类重复对象的个数。<\/p>\n<p><strong>实例<\/strong>：字母 A、A、B 三个字符的排列。3!/(2!1!) = 3，实际是 AAB、ABA、BAA 三种。 <strong>实例<\/strong>：A、A、B、B 四个字符：4!/(2!2!) = 6。<\/p>\n<p><strong>为什么这样除<\/strong>：把重复的对象先当成不同的，有 n! 种；每一种真实排列被重复数了 n1!×n2!×… 次（每个重复组内部怎么换都得到同一个排列）。<\/p>\n<h3>概念 3：游程（难度：进阶）<\/h3>\n<p>把排列从左往右扫，一段连续递增的最长子序列叫一个<strong>升序游程<\/strong>。整条排列可以切成若干游程。<\/p>\n<p><strong>实例<\/strong>：3, 5, 7, 1, 2, 9, 4 的升序游程是 [3,5,7]、[1,2,9]、[4]，共 3 段。<\/p>\n<p><strong>平均游程数<\/strong>：随机排列的期望升序游程数是 (n+1)/2。n = 7 时约 4 段，与上例的 3 段接近（样本只有一个，不必强求相等）。<\/p>\n<p><strong>它为什么重要<\/strong>：自然合并排序（natural merge sort）就是先找出这些游程，再把相邻游程两两合并。初始游程越少，合并趟数越少。这就是「输入已有的有序性」被利用的地方。<\/p>\n<h3>概念 4：置换的循环结构与对合（难度：进阶）<\/h3>\n<p>任何置换都能唯一分解成若干个互不相交的循环。例如把 1→3、3→2、2→1、4→4 写成 (1 3 2)(4)。<\/p>\n<ul><li>\n一个循环里元素的个数叫循环长度。\n<\/li><li>\n长度全为 1 的置换是恒等置换。\n<\/li><li>\n<strong>对合<\/strong>是「做两次回到原样」的置换，它的循环长度只能是 1 或 2。\n<\/ul>\n<p><strong>实例<\/strong>：交换 1 与 2、固定 3 的置换是 (1 2)(3)，做两次回到原样，是对合。 <strong>用途<\/strong>：卷4 生成排列时会用到「相邻交换」的格雷码路径，那条路径正是由对合式的交换序列构成的。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 593 224\" style=\"max-width: 593px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg18\"><style>#svg18{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg18 .error-icon{fill:#552222;}#svg18 .error-text{fill:#552222;stroke:#552222;}#svg18 .edge-thickness-normal{stroke-width:2px;}#svg18 .edge-thickness-thick{stroke-width:3.5px;}#svg18 .edge-pattern-solid{stroke-dasharray:0;}#svg18 .edge-pattern-dashed{stroke p://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(288.5, 18)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-231\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">一个排列</span></div></foreignObject></g></g><g transform=\"translate(79.5, 104)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-232\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数逆序对</span></div></foreignObject></g></g><g transform=\"translate(288.5, 104)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-234\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">切升序游程</span></div></foreignObject></g></g><g transform=\"translate(497.5, 104)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-236\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">分解成循环</span></div></foreignObject></g></g><g transform=\"translate(79.5, 190)\" data-id=\"S1\" data-node=\"true\" id=\"flowchart-S1-238\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">插入排序的移动次数</span></div></foreignObject></g></g><g transform=\"translate(288.5, 190)\" data-id=\"S2\" data-node=\"true\" id=\"flowchart-S2-240\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">自然合并排序的趟数</span></div></foreignObject></g></g><g transform=\"translate(497.5, 190)\" data-id=\"S3\" data-node=\"true\" id=\"flowchart-S3-242\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">生成排列的交换序列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：同一个排列可以量出三种「结构量」，各自对应一种排序或生成算法的代价。这张图说明为什么第 5 章要先把组合性质讲完再讲算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：逆序对像排队时「站错位置」的人数。每纠正一个人，就少一处错位；插入排序就是一个一个纠正。\n<\/li><li>\n类比失效：现实排队里两个人换位可能同时纠正多处错位（一次交换消除两个逆序对），逆序对与移动次数不再一一对应。这就是为什么交换类排序不能用「逆序对数」直接算代价。\n<\/ul>\n<p><strong>实例（游程与合并趟数）<\/strong>：n = 16 的排列切成 8 段游程。第一趟两两合并变 4 段，第二趟 2 段，第三趟 1 段，共 3 趟。若切成 16 段（完全无序），则要 4 趟。游程越少越省。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为逆序对数等于交换次数<\/strong>——实际上一次交换最多消除两个逆序对，也可能一个都不消除（换错位置时）。\n<\/li><li>\n<strong>别以为平均逆序对数是 n²/4 就说明「平均情况很慢」<\/strong>——实际上它恰好说明插入排序平均是 O(n²)，与实测一致。\n<\/li><li>\n<strong>别把游程当成「已经排好的段」<\/strong>——游程只要求段内递增，段与段之间没有顺序关系。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：排列 4, 3, 2, 1 的逆序对数是多少？（填数字）\n<p>（答案：6；解析：每一对都是逆序，(4,3)(4,2)(4,1)(3,2)(3,1)(2,1) 共 6 个，正好是 C(4,2)=6。）<\/p>\n<\/ol>\n<ol><li>\n单选题：A、A、B、B 四个字符共有多少种不同排列？\n<p>A. 4 B. 6 C. 12 D. 24 （答案：B；解析：4!/(2!2!) = 24/4 = 6。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么插入排序的移动次数恰好等于初始逆序对数？\n<p>（答案：每把第 i 个元素往左挪一格，它与左边那个更大的元素构成一个逆序对，挪过去就消除了这一个；挪到正确位置时它左边的都不大于它，逆序对清零。总移动次数等于被消除的逆序对总数。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆序对：前大后小的一对；平均 n(n−1)/4。\n<\/li><li>\n多重集排列数 = n! 除以各重复组阶乘。\n<\/li><li>\n升序游程的期望段数是 (n+1)/2，自然合并排序按游程工作。\n<\/ul>", "kind": "chapter", "title": "第 1 章：排序的组合性质"}, "ch02": {"html": "<h1>第 2 章：内部排序——五类算法与它们的代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 1 章（逆序与游程）；卷1 第 1 章（复杂度）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按「插入、交换、选择、合并、分布」五类给常见排序算法归类。\n<\/li><li>\n说清快速排序平均 O(n log n)、最坏 O(n²) 的触发条件。\n<\/li><li>\n解释堆排序为什么最坏也是 O(n log n)，代价在哪里。\n<\/li><li>\n判断一个场景该用哪种排序：数据近乎有序、内存紧张、键值范围小。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>内部排序的全部差别，可以归结为两个问题：<strong>比较出多少信息、数据搬多少次<\/strong>。五类算法就是五种不同的取舍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插入类（难度：基础）<\/h3>\n<p><strong>直接插入<\/strong>：把第 i 个元素插进前面已经排好的部分，从后往前找位置，边找边挪。<\/p>\n<ul><li>\n最好情况（已有序）：每个元素只比较一次，O(n)。\n<\/li><li>\n最坏情况（完全逆序）：移动次数是逆序对数 n(n−1)/2，O(n²)。\n<\/li><li>\n平均：O(n²)。\n<\/li><li>\n稳定：相等元素不会交换相对次序。\n<\/ul>\n<p><strong>折半插入<\/strong>：找位置时用二分，比较次数降到 O(n log n)，但挪动仍是 O(n²)，总代价没变。<\/p>\n<p><strong>希尔排序<\/strong>：先按较大间隔分组做插入排序，再逐步缩小间隔。它是插入类里少见的能到 O(n^1.3) 左右的算法，但复杂度分析至今没有完全定论。<\/p>\n<h3>概念 2：交换类（难度：进阶）<\/h3>\n<p><strong>冒泡排序<\/strong>：相邻比较，逆序就交换，每一趟把最大值推到末尾。O(n²)，稳定，几乎没有实用价值，但它是「逆序对」最直观的演示。<\/p>\n<p><strong>快速排序<\/strong>：选一个基准（pivot），把比它小的放左边、大的放右边，再对左右两段递归。<\/p>\n<ul><li>\n平均 O(n log n)：每次划分大致对半。\n<\/li><li>\n最坏 O(n²)：每次划分都极不均衡。典型触发是「输入已经有序，却取第一个元素当基准」。\n<\/li><li>\n空间 O(log n)：递归栈深度。\n<\/li><li>\n不稳定。\n<\/ul>\n<p><strong>避免最坏的两个办法<\/strong>：随机选基准，或取头、中、尾三个数的中位数当基准。<\/p>\n<h3>概念 3：选择类（难度：进阶）<\/h3>\n<p><strong>直接选择<\/strong>：每趟从剩余元素里找最小的，与当前位置交换。比较次数固定 n(n−1)/2，与输入无关；交换次数最多 n−1。不稳定。<\/p>\n<p><strong>堆排序<\/strong>：先把数组建成大顶堆（O(n)），再反复把堆顶与末尾交换、缩小堆、下沉调整。<\/p>\n<ul><li>\n建堆 O(n)，每次下沉 O(log n)，共 n 次，总 O(n log n)。\n<\/li><li>\n最坏也是 O(n log n)，这是它相对快排的优势。\n<\/li><li>\n原地排序，空间 O(1)；但不稳定，且常数比快排大，实际常比快排慢。\n<\/ul>\n<p><strong>实例（下沉一次）<\/strong>：堆 [9, 7, 8, 3, 5]，把堆顶 9 与末尾 5 交换得 [5, 7, 8, 3, 9]，堆区缩小为前四个。5 下沉：与较大的孩子 8 交换，得 [8, 7, 5, 3]。堆恢复。<\/p>\n<h3>概念 4：合并类（难度：进阶）<\/h3>\n<p><strong>二路合并排序<\/strong>：把数组对半切，两段各自排好，再合并。合并时两个指针各扫一遍，O(n)。<\/p>\n<ul><li>\n总代价：T(n) = 2T(n/2) + O(n)，展开得 O(n log n)。\n<\/li><li>\n稳定。\n<\/li><li>\n代价是需要 O(n) 的额外空间。\n<\/ul>\n<p><strong>为什么合并能做到 O(n)<\/strong>：两段已经有序，每次只需比较两个队首，取小的那个，指针前移一格，不需要回头。<\/p>\n<h3>概念 5：分布类（难度：进阶）<\/h3>\n<p><strong>基数排序<\/strong>：不比较元素大小，而是按「位」分配。从最低位开始，每一轮按该位把元素分到若干个桶，再按桶序收集；做完最高位，整体有序。<\/p>\n<ul><li>\n代价 O(d(n + k))，d 是位数，k 是基数。\n<\/li><li>\n当 d 很小、k 不大时，是线性时间。\n<\/li><li>\n稳定（这是它能从低位往高位做的前提）。\n<\/ul>\n<p><strong>实例<\/strong>：对 12、3、25 按十进制基数排序。<\/p>\n<ul><li>\n个位分配：3 → 桶 3；12 → 桶 2；25 → 桶 5。收集：12、3、25。\n<\/li><li>\n十位分配：12 → 桶 1；3 → 桶 0；25 → 桶 2。收集：3、12、25。有序。\n<\/ul>\n<h3>概念 6：怎么选（难度：进阶）<\/h3>\n<table><thead><tr><th>场景<\/th><th>选择<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>数据近乎有序<\/td><td>直接插入<\/td><td>最好情况 O(n)<\/td><\/tr><tr><td>内存极紧、要最坏有保证<\/td><td>堆排序<\/td><td>原地，最坏 O(n log n)<\/td><\/tr><tr><td>通用、要求平均快<\/td><td>快速排序<\/td><td>常数小，缓存友好<\/td><\/tr><tr><td>要求稳定<\/td><td>合并排序<\/td><td>稳定且 O(n log n)<\/td><\/tr><tr><td>键值范围小、位数少<\/td><td>基数排序<\/td><td>线性时间<\/td><\/tr><tr><td>链表结构<\/td><td>合并排序<\/td><td>不需要随机访问<\/td><\/tr><\/tbody><\/table>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 452.33984375 696\" style=\"max-width: 452.33984375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg19\"><style>#svg19{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg19 .error-icon{fill:#552222;}#svg19 .error-text{fill:#552222;stroke:#552222;}#svg19 .edge-thickness-normal{stroke-width:2px;}#svg19 .edge-thickness-thick{stroke-width:3.5px;}#svg19 .edge-pattern-solid{stroke-dasharray:0;}#svg19 .edge-pattern-dashed{stroke-dasharray:3;}#svg19 .edge-pattern-d 63, 329.5)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-246\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-57.5,57.5)\" class=\"label-container\" points=\"57.5,0 115,-57.5 57.5,-115 0,-57.5\"></polygon><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">要稳定吗</span></div></foreignObject></g></g><g transform=\"translate(39.5, 515.5)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-248\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">合并排序</span></div></foreignObject></g></g><g transform=\"translate(285, 515.5)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-250\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-57.5,57.5)\" class=\"label-container\" points=\"57.5,0 115,-57.5 57.5,-115 0,-57.5\"></polygon><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">内存紧吗</span></div></foreignObject></g></g><g transform=\"translate(207.38671875, 662)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-252\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">堆排序</span></div></foreignObject></g></g><g transform=\"translate(362.61328125, 662)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-254\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快速排序 随机基准</span></div></foreignObject></g></g><g transform=\"translate(116, 329.5)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-258\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">基数排序</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：先问「数据在哪」再问「要不要稳定」，这两个问题基本就决定了算法。剩下的差别是常数与实现难度。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：插入排序像整理一手扑克牌，一张张插进已经排好的牌里；合并排序像两组已经排好的牌，每次从两叠顶上看一张小的；基数排序像先按个位把牌分堆，再按十位分堆。\n<\/li><li>\n类比失效：扑克牌只有 52 张，牌数一大，手就不可能同时握住；真实算法的「手」是内存，容量与访问速度才是关键约束。\n<\/ul>\n<p><strong>实例（快排一次划分）<\/strong>：数组 [5, 3, 8, 4, 2]，基准取 5。<\/p>\n<ul><li>\n3 &lt; 5，留左边；8 &gt; 5，留右边；4 &lt; 5，与 8 交换 → [5, 3, 4, 8, 2]；2 &lt; 5，与 8 交换 → [5, 3, 4, 2, 8]。\n<\/li><li>\n基准 5 与 2 交换 → [2, 3, 4, 5, 8]。\n<p>左边 [2,3,4] 全小于 5，右边 [8] 大于 5，划分完成。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为快排最坏 O(n²) 只是理论<\/strong>——实际上对已排序数据取首元素当基准，就会稳定触发。\n<\/li><li>\n<strong>别以为堆排序比快排快<\/strong>——实际上它最坏有保证，但常数大、缓存不友好，平均常慢于快排。\n<\/li><li>\n<strong>别以为基数排序不需要「比较」就更快<\/strong>——实际上它依赖键的位数与基数，键很长时 d 很大，未必比 O(n log n) 快。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：对已经升序排列的数组取首元素为基准做快排，复杂度是？\n<p>A. O(n) B. O(n log n) C. O(n²) D. O(log n) （答案：C；解析：每次划分都一边空一边全，递归深度 n，总代价 n²。）<\/p>\n<\/ol>\n<ol><li>\n填空题：堆排序建堆的代价是 O(___)。\n<p>（答案：n；解析：自底向上建堆的总代价是 O(n)，不是 O(n log n)，因为大部分节点在下层、下沉距离短。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么基数排序必须稳定？\n<p>（答案：低位排完后，高位相同的元素要保持低位的相对次序；若高位分配时打乱了低位结果，最终就不有序。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五类：插入、交换、选择、合并、分布。\n<\/li><li>\n快排平均 O(n log n)、最坏 O(n²)；堆排序最坏 O(n log n)；合并稳定但要额外空间。\n<\/li><li>\n基数排序 O(d(n+k))，稳定的前提是从低位到高位。\n<\/ul>", "kind": "chapter", "title": "第 2 章：内部排序——五类算法与它们的代价"}, "ch03": {"html": "<h1>第 3 章：最优排序——比较次数的下界与排序网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2 章；log 与阶乘的估算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用比较树推出「排序至少需要约 n log2 n 次比较」。\n<\/li><li>\n算出小规模下确切的比较次数下界（如 3 个元素、5 个元素）。\n<\/li><li>\n说清 0-1 原理，并解释它为什么能把检验工作从 2^n 类输入压到一类。\n<\/li><li>\n说出排序网络与比较排序的根本差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>n log n 不是某个算法的性能，而是<strong>问题本身的信息量下限<\/strong>；任何只靠比较的排序都逃不掉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：比较树与信息下界（难度：进阶）<\/h3>\n<p>把排序过程看成一棵判断树：<\/p>\n<ul><li>\n每个内部节点是一次比较（a 与 b 谁大）。\n<\/li><li>\n每条边是一个比较结果（小于或大于）。\n<\/li><li>\n每个叶子是一个可能的输出排列。\n<\/ul>\n<p>要正确排序 n 个元素，n! 种输入排列必须分别落到能输出正确结果的叶子上，所以叶子至少 n! 个。<\/p>\n<p>一棵二叉树有 L 个叶子时，高度至少 log2 L。因此最坏情况的比较次数 ≥ log2(n!)。<\/p>\n<p><strong>实例<\/strong>：<\/p>\n<ul><li>\nn = 3：log2 6 ≈ 2.58，向上取整得 3。3 次比较够（先比 a,b，再比 b,c，再按结果补一次）。\n<\/li><li>\nn = 5：log2 120 ≈ 6.91，向上取整得 7。5 个元素最坏情况至少 7 次比较，且 7 次可以做到。\n<\/li><li>\nn = 100：log2(100!) ≈ 525，而 n log2 n = 664，两者同阶。\n<\/ul>\n<p><strong>公式近似<\/strong>：log2(n!) ≈ n log2 n − 1.4427 n + O(log n)。那个 1.44 的系数是 1/ln 2。<\/p>\n<h3>概念 2：最优排序与「节约一次比较」（难度：高难）<\/h3>\n<p>对小 n，Knuth 给出了确切的最优比较次数：<\/p>\n<table><thead><tr><th>n<\/th><th>最坏情况最少比较次数<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>3<\/td><\/tr><tr><td>4<\/td><td>5<\/td><\/tr><tr><td>5<\/td><td>7<\/td><\/tr><tr><td>6<\/td><td>10<\/td><\/tr><\/tbody><\/table>\n<p>注意 5 个元素只要 7 次，而朴素插入排序最坏要 10 次。省下来的方式是「先做几次比较收集信息，再决定后面怎么比」，而不是固定流程。<\/p>\n<p><strong>为什么 n 一大就难<\/strong>：可能的比较策略爆炸式增长，最优策略难以构造，实践里用 O(n log n) 的算法接受一点点次优。<\/p>\n<h3>概念 3：排序网络（难度：高难）<\/h3>\n<p>排序网络是一组固定的比较器，每个比较器连接两根线，把较大的送到下方、较小的送到上方。<strong>没有分支<\/strong>，所有比较同时按层进行。<\/p>\n<p><strong>它和普通排序的差别<\/strong>：<\/p>\n<ul><li>\n普通排序的比较顺序依赖前面的结果（有分支）。\n<\/li><li>\n排序网络的比较顺序完全固定，适合硬件并行、GPU 实现。\n<\/ul>\n<p><strong>0-1 原理<\/strong>：如果一个排序网络能把所有 2^n 种「只含 0 和 1」的输入排好，那么它能把任意输入排好。<\/p>\n<p><strong>为什么成立<\/strong>（直觉）：比较器的行为只取决于「谁大」。把任意输入按某个阈值切成 0/1，若网络对每种切法都排好，则原输入也排好。这条原理把检验从「所有排列」压到「2^n 种 0/1 串」，工作量小得多。<\/p>\n<p><strong>Batcher 奇偶归并网络<\/strong>：把两段已排序的序列按奇偶下标分开归并，递归构造。规模 O(n log² n)，深度 O(log² n)。<\/p>\n<p><strong>实例（4 输入网络）<\/strong>：比较 (1,2)、(3,4)，再比较 (1,3)、(2,4)，最后比较 (2,3)。四层比较器，能排好任意 4 个输入。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 725.578125 310\" style=\"max-width: 725.578125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg20\"><style>#svg20{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg20 .error-icon{fill:#552222;}#svg20 .error-text{fill:#552222;stroke:#552222;}#svg20 .edge-thickness-normal{stroke-width:2px;}#svg20 .edge-thickness-thick{stroke-width:3.5px;}#svg20 .edge-pattern-solid{stroke-dasharray:0;}#svg20 .edge-pattern-dashed{stroke-dasharray:3;}#svg20 .edge-pattern-dotted{stroke-dasharray:2;}#svg20 .marker{fill:#333333;stroke:#333333;}#svg20 .marker.cross{stroke:#333333;}#svg20 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg20 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg20 .cluster-label text{fill:#333;}#svg20 . -space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">信息下界 log n 阶乘</span></div></foreignObject></g></g><g transform=\"translate(104.4140625, 190)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-262\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"131.453125\" y=\"-18\" x=\"-65.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-58.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"116.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">普通算法 有分支</span></div></foreignObject></g></g><g transform=\"translate(453.3125, 190)\" data-id=\"N\" data-node=\"true\" id=\"flowchart-N-264\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"131.453125\" y=\"-18\" x=\"-65.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-58.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"116.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排序网络 无分支</span></div></foreignObject></g></g><g transform=\"translate(104.4140625, 276)\" data-id=\"O1\" data-node=\"true\" id=\"flowchart-O1-266\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"208.828125\" y=\"-18\" x=\"-104.4140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-96.9140625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"193.828125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快排 堆排 合并 达到 n log n</span></div></foreignObject></g></g><g transform=\"translate(328.125, 276)\" data-id=\"O2\" data-node=\"true\" id=\"flowchart-O2-268\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"138.59375\" y=\"-18\" x=\"-69.296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-61.796875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"123.59375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Batcher 奇偶归并</span></div></foreignObject></g></g><g transform=\"translate(578.5, 276)\" data-id=\"Z\" data-node=\"true\" id=\"flowchart-Z-270\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"262.15625\" y=\"-18\" x=\"-131.078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-123.578125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"247.15625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">0 1 原理 只需验 2 的 n 次方 种输入</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：两条分支共享同一个下界。排序网络的优势不在比较次数更少（它通常更多），而在「无分支、可并行」。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：比较排序像查字典，查到一半就知道该往左还是往右翻；排序网络像洗牌机，不管牌面是什么，固定地把指定位置的两张牌比一下、大的放右边。\n<\/li><li>\n类比失效：洗牌机的动作固定，但它的比较器数量是人工设计的；真实的排序网络规模随 n 增长，设计本身是组合难题。\n<\/ul>\n<p><strong>实例（0-1 原理的用法）<\/strong>：要验证一个 4 输入网络，不必测 24 种排列，只需测 16 种 0/1 串：0000、0001、…、1111。全部排好，就说明它对任意 4 个数字都正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 n log n 是所有排序的下限<\/strong>——实际上只是「基于比较」的下限。基数排序不比较，可以到线性。\n<\/li><li>\n<strong>别以为排序网络比较次数少<\/strong>——实际上它通常比最优比较排序多，胜在无分支和并行。\n<\/li><li>\n<strong>别以为 0-1 原理是近似<\/strong>——实际上它是严格等价的判定条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：5 个元素排序，最坏情况至少需要多少次比较？（填数字）\n<p>（答案：7；解析：log2(5!) = log2 120 ≈ 6.91，向上取整为 7，且存在 7 次比较的最优算法。）<\/p>\n<\/ol>\n<ol><li>\n单选题：排序网络的核心优势是？\n<p>A. 比较次数最少 B. 无分支、可并行 C. 不需要额外空间 D. 稳定 （答案：B；解析：网络结构固定，所有比较按层同时进行，适合硬件实现；比较次数通常反而更多。）<\/p>\n<\/ol>\n<ol><li>\n简答题：0-1 原理为什么能把验证工作大幅减少？\n<p>（答案：只需验证 2^n 种 0/1 输入，而不是 n! 种排列；任意输入可按阈值切成 0/1，若每种切法都被排好，原输入也必被排好。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较排序下界 log2(n!)，约 n log2 n。\n<\/li><li>\n小 n 的最优比较次数：3 个元素 3 次，5 个元素 7 次。\n<\/li><li>\n0-1 原理：验 2^n 种 0/1 输入即可判定整个网络。\n<\/ul>", "kind": "chapter", "title": "第 3 章：最优排序——比较次数的下界与排序网络"}, "ch04": {"html": "<h1>第 4 章：外部排序——数据比内存大怎么办<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2 章（合并排序）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清外部排序为什么以「读写次数」而不是「比较次数」衡量代价。\n<\/li><li>\n算出给定初始游程数与路数时的合并趟数。\n<\/li><li>\n解释替代选择为什么能把平均游程长度做到缓冲区容量的两倍。\n<\/li><li>\n说出多阶段合并解决的现实问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>外部排序的瓶颈不在 CPU，在磁盘；所以一切设计都围绕<strong>减少读写趟数<\/strong>，哪怕多花比较。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：初始游程（难度：基础）<\/h3>\n<p>内存装不下全部数据，先分块读进来，每块内部排好，写回磁盘，形成一个<strong>有序游程<\/strong>（run）。这一步叫「生成初始游程」。<\/p>\n<p>若内存能放 P 条记录，朴素做法每块产生长度 P 的游程；数据总量 N 条，就有 N/P 个游程。<\/p>\n<p><strong>代价<\/strong>：读一遍、写一遍，各 N 条。<\/p>\n<h3>概念 2：替代选择（难度：进阶）<\/h3>\n<p>朴素分块浪费了内存：块与块之间没有利用「刚写出去的最小元素可能比下一块的最大元素还小」这个事实。<\/p>\n<p><strong>替代选择<\/strong>的做法：把内存当成一个堆，先装满 P 条。每次取出堆顶（最小）写出，再从输入读一条进来：<\/p>\n<ul><li>\n若新读的比刚写的大，它可以留在当前游程里，堆调整后继续。\n<\/li><li>\n若新读的比刚写的小，它不能进当前游程，先存到「保留区」，等下一个游程用。\n<\/ul>\n<p><strong>效果<\/strong>：随机输入下，平均游程长度约为 2P，也就是游程数减半，合并趟数少一趟。<\/p>\n<p><strong>实例<\/strong>：P = 4，输入序列 5, 2, 9, 1, 7, 3。<\/p>\n<ul><li>\n装满 [5,2,9,1] 建堆，堆顶 1。写出 1，读 7（7 &gt; 1，可进当前游程）。\n<\/li><li>\n堆顶 2，写出 2，读 3（3 &gt; 2，可进）。\n<\/li><li>\n堆顶 5，写出 5，输入已空，当前游程继续把堆里剩下的 7、9 写完 → 游程 [1,2,5,7,9]，长度 5，超过 P = 4。\n<\/ul>\n<h3>概念 3：k 路合并与趟数（难度：基础）<\/h3>\n<p>把 k 个游程同时合并成一个：每次从 k 个游程的队首取最小的。用败者树或堆，每次取最小是 O(log k)。<\/p>\n<p><strong>趟数公式<\/strong>：R 个初始游程，k 路合并，趟数 = 向上取整的 log_k R。<\/p>\n<p><strong>实例<\/strong>：R = 1000，k = 4。 4⁴ = 256 &lt; 1000，4⁵ = 1024 ≥ 1000，所以要 5 趟。<\/p>\n<p><strong>每趟代价<\/strong>：读 N 条、写 N 条（最后一遍只读不写）。总读写量约为 2N × 趟数。<\/p>\n<p><strong>k 是不是越大越好<\/strong>：k 大则趟数少，但 k 个输入缓冲区要占内存，每个缓冲区太小又会增加读块次数。实践里 k 常取几十到几百。<\/p>\n<h3>概念 4：多阶段合并（难度：高难）<\/h3>\n<p>磁带只能顺序读写，台数有限（历史上常见 3 到 6 台）。k 路合并需要 k 台输入加 1 台输出，台数一紧就做不了。<\/p>\n<p><strong>多阶段合并<\/strong>用「不均匀分配」解决：不要求每台磁带的游程数一样，而是按 Fibonacci 数分配，让合并过程中始终有一台空带可以当输出，轮流使用。<\/p>\n<p><strong>实例（3 台磁带、Fibonacci 分配）<\/strong>：初始游程数按 1、2、3、5、8… 分配，合并时把最短的两段并到空带上，始终维持「有一段空带」的状态。<\/p>\n<p><strong>级联合并<\/strong>是它的推广：允许更多磁带、更复杂的分配表，减少「空转」。<\/p>\n<h3>概念 5：反向读取与振荡（难度：高难）<\/h3>\n<p>磁带合并时，若能把上一次写的磁带反着读，就不必倒带，直接接着上一趟的尾部继续。<strong>振荡排序<\/strong>（oscillating sort）利用这一点，让读的方向在趟与趟之间交替，省掉倒带时间。<\/p>\n<p><strong>这几节为什么今天还要看<\/strong>：思路仍然适用于现代存储。SSD 虽然随机访问快，但顺序读写仍远快于随机；「减少趟数、尽量顺序」的原则没变。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 303.453125 786\" style=\"max-width: 303.453125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg21\"><style>#svg21{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg21 .error-icon{fill:#552222;}#svg21 .error-text{fill:#552222;stroke:#552222;}#svg21 .edge-thickness-normal{stroke-width:2px;}#svg21 .edge-thickness-thick{stroke-width:3.5px;}#svg21 .edge-pattern-solid{stroke-dasharray:0;}#svg21 .edge-pattern-dashed{stroke-dasharray:3;}#svg21 .edge-pattern-dotted{stroke-dasharray:2;}#svg21 .marker{fill:#333333;stroke:#333333;}#svg21 .marker.cross{stroke:#333333;}#svg21 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg21 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg21 .cluster-label text{fill:#333;}#svg21 .cluster-label span,#svg21 p{color:#333;}#svg21 .label text,#svg21 span,#svg21 p{fill:#333;color:#333;}#svg21 .node rect,#svg21 .node circle,#svg21 .node ellipse,#svg21 .node polygon,#svg21 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg21 .flowchart-label text{text-anchor:middle;}#svg21 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg21 .node .label{text-align:center;}#svg21 .node.clickable splay: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">生成初始游程</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 331.5)\" data-id=\"RS\" data-node=\"true\" id=\"flowchart-RS-276\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-73.5,73.5)\" class=\"label-container\" points=\"73.5,0 147,-73.5 73.5,-147 0,-73.5\"></polygon><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">用替代选择吗</span></div></foreignObject></g></g><g transform=\"translate(225.8671875, 494)\" data-id=\"R2\" data-node=\"true\" id=\"flowchart-R2-278\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"123.171875\" y=\"-18\" x=\"-61.5859375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-54.0859375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"108.171875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均游程 2P 条</span></div></foreignObject></g></g><g transform=\"translate(57.140625, 494)\" data-id=\"R1\" data-node=\"true\" id=\"flowchart-R1-280\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"114.28125\" y=\"-18\" x=\"-57.140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.640625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"99.28125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">游程长度 P 条</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 580)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-282\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多路合并</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 666)\" data-id=\"P1\" data-node=\"true\" id=\"flowchart-P1-286\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"101.25\" y=\"-18\" x=\"-50.625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-43.125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"86.25\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">趟数 log k R</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 752)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-288\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">有序输出</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：两个箭头最终汇到同一个合并环节，但游程数不同——替代选择把 R 减半，直接省下一整趟读写。这就是它值得单独讲的原因。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：外部排序像整理一屋子书，桌子只能放 100 本。先把每 100 本排好堆成一摞，再把几摞同时摊开，每次取最小的一本放成大摞。\n<\/li><li>\n类比失效：书可以随手抽，磁盘不行；磁盘按块读，随机访问有寻道开销，所以「块大小」也是设计参数。\n<\/ul>\n<p><strong>实例（算总代价）<\/strong>：N = 10⁸ 条，P = 10⁶ 条，k = 10。<\/p>\n<ul><li>\n朴素游程数 R = 100，趟数 log10 100 = 2。\n<\/li><li>\n用替代选择，R = 50，趟数 log10 50 ≈ 1.7，向上取整仍是 2 趟，但第二趟的输入少了一半。\n<\/li><li>\n总读写量：朴素约 2×10⁸×2 = 4×10⁸ 条记录，替代选择约 3×10⁸ 条。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为外部排序比内部排序「算法更复杂」<\/strong>——实际上核心就是合并排序加缓冲区管理，复杂的是调度。\n<\/li><li>\n<strong>别以为 k 越大越好<\/strong>——实际上 k 受内存限制，缓冲区太小会让每次读的块变碎，反而更慢。\n<\/li><li>\n<strong>别以为多阶段合并已经过时<\/strong>——实际上「不均匀分配 + 轮流用空带」的思想在分布式归并与日志合并树里仍在用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：1000 个初始游程做 4 路合并，需要多少趟？（填数字）\n<p>（答案：5；解析：4⁴ = 256 不够，4⁵ = 1024 够，所以 5 趟。）<\/p>\n<\/ol>\n<ol><li>\n单选题：替代选择在随机输入下的平均游程长度约为内存容量的多少倍？\n<p>A. 0.5 B. 1 C. 2 D. 4 （答案：C；解析：Knuth 的分析给出平均约 2P，P 为缓冲区可容纳的记录数。）<\/p>\n<\/ol>\n<ol><li>\n简答题：多阶段合并要解决的是什么问题？\n<p>（答案：磁带台数有限，k 路合并需要 k 台输入加 1 台输出，台数不够；多阶段用 Fibonacci 式的不均匀分配，让合并过程中始终有一台空带可作输出。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n外部排序以读写趟数计代价；趟数 = log_k R。\n<\/li><li>\n替代选择让平均游程达 2P，游程数减半。\n<\/li><li>\n多阶段合并用不均匀分配解决磁带台数不足。\n<\/ul>", "kind": "chapter", "title": "第 4 章：外部排序——数据比内存大怎么办"}, "ch05": {"html": "<h1>第 5 章：查找——从顺序扫到平衡树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2 章；卷1 第 2 章（树的数学性质）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算出顺序查找与二分查找的平均、最坏比较次数。\n<\/li><li>\n解释二叉查找树平均 O(log n)、最坏 O(n) 的原因。\n<\/li><li>\n说清 AVL 树靠什么把高度控制在约 1.44 log2 n。\n<\/li><li>\n算出 B 树的层数，并解释为什么数据库索引用它而不是二叉树。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>查找的代价取决于<strong>数据怎么组织<\/strong>：无序只能扫，有序能折半，树把折半变成动态结构，多路树把「层数」换成「扇出」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：顺序查找（难度：基础）<\/h3>\n<p>从第一个元素开始逐个比较，找到就返回。<\/p>\n<ul><li>\n成功查找平均比较次数：(n+1)/2（假设每个位置等概率被查）。\n<\/li><li>\n失败查找：n 次。\n<\/li><li>\n<strong>哨兵技巧<\/strong>：把要查的键放在数组末尾当哨兵，循环里就不必每次判断「是否越界」，比较次数不变但每轮少一次判断。\n<\/ul>\n<p><strong>适用<\/strong>：数据量小、无序、或只在链表上查找。<\/p>\n<h3>概念 2：二分查找（难度：基础）<\/h3>\n<p>要求数据<strong>有序且能随机访问<\/strong>。每次比较中间元素，排除一半。<\/p>\n<ul><li>\n最坏比较次数：约 log2 n 次（准确说是向上取整的 log2(n+1)）。\n<\/li><li>\n前提：有序；数组（链表不行，因为取中间要 O(n)）。\n<\/ul>\n<p><strong>实例<\/strong>：在 1 到 9 中查 7。<\/p>\n<ul><li>\n中间是 5，7 &gt; 5，看右半 6 到 9。\n<\/li><li>\n右半中间是 7（取下中位数），命中。共 2 次比较。\n<\/li><li>\n最坏是查 9 或 1，需要 4 次。\n<\/ul>\n<h3>概念 3：二叉查找树（难度：进阶）<\/h3>\n<p>每个节点满足：左子树所有键小于它，右子树所有键大于它。查找时一路向下比较。<\/p>\n<ul><li>\n平均查找长度约 2 ln n ≈ 1.39 log2 n。\n<\/li><li>\n最坏 O(n)：按升序依次插入，树退化成一条链。\n<\/li><li>\n删除节点分三种情况：叶子直接删；只有一个孩子用孩子顶替；有两个孩子用中序后继（右子树最小）顶替。\n<\/ul>\n<p><strong>实例<\/strong>：依次插入 3、1、5、2 得到：<\/p>\n<ul><li>\n3 为根，1 在左，5 在右，2 在 1 的右边。\n<p>查 2：3 → 1 → 2，3 次比较。<\/p>\n<\/ul>\n<h3>概念 4：平衡树（难度：高难）<\/h3>\n<p>AVL 树要求每个节点的左右子树高度差不超过 1。插入或删除破坏了平衡，就通过<strong>旋转<\/strong>恢复。<\/p>\n<ul><li>\n高度上界：约 1.44 log2(n+2) − 0.33，比二叉查找树的平均情况只差一点，但<strong>最坏也有保证<\/strong>。\n<\/li><li>\n四种失衡情形：左左、左右、右左、右右；左右与右左需要双旋。\n<\/li><li>\n代价：每次插入/删除最多 O(log n) 次旋转，常数比普通二叉查找树大。\n<\/ul>\n<p><strong>红黑树<\/strong>是另一种平衡方案，平衡条件更松（最长路径不超过最短的两倍），插入删除的旋转次数更少，工程里更常用。<\/p>\n<h3>概念 5：多路树与 B 树（难度：高难）<\/h3>\n<p>二叉树的每个节点只有两个孩子，树高 log2 n；如果每个节点能有 m 个孩子，树高就是 log_m n。<\/p>\n<p><strong>B 树<\/strong>：每个节点存多个键、多个孩子，所有叶子在同一层。查找时在每个节点内部做一次二分或顺序比较，然后下到某个孩子。<\/p>\n<p><strong>实例<\/strong>：10 亿个键，每个节点 100 个孩子。 层数 ≈ log_100(10⁹) = 9/2 = 4.5，也就是 5 层左右。若用二叉树，要约 30 层。<\/p>\n<p><strong>为什么数据库用 B 树<\/strong>：每一层通常对应一次磁盘读。5 次读 vs 30 次读，差距是 6 倍。把「层数」压下来，就是把 I/O 次数压下来。<\/p>\n<h3>概念 6：数字查找（难度：进阶）<\/h3>\n<p>键是数字或字符串时，可以按「位」分支，而不是按大小比较。<\/p>\n<ul><li>\n<strong>基数查找树（trie）<\/strong>：每个节点对应一位数字，路径拼起来就是键。查找代价与键长成正比，与元素个数关系不大。\n<\/li><li>\n<strong>数字查找树<\/strong>：按键的二进制位分支，类似 trie 但更紧凑。\n<\/ul>\n<p><strong>适用<\/strong>：键长固定、集合很大、需要前缀查询（如 IP 路由表、词典）。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 502.10546875 810\" style=\"max-width: 502.10546875px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg22\"><style>#svg22{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg22 .error-icon{fill:#552222;}#svg22 .error-text{fill:#552222;stroke:#552222;}#svg22 .edge-thickness-normal{stroke-width:2px;}#svg22 .edge-thickness-thick{stroke-width:3.5px;}#svg22 .edge-pattern- form=\"translate(147.53125, 167.5)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-290\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数据有序吗</span></div></foreignObject></g></g><g transform=\"translate(69.91015625, 338)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-292\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"92.34375\" y=\"-18\" x=\"-46.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-38.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"77.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">顺序查找 n</span></div></foreignObject></g></g><g transform=\"translate(225.15234375, 338)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-294\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"118.140625\" y=\"-18\" x=\"-59.0703125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-51.5703125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"103.140625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">二分查找 log n</span></div></foreignObject></g></g><g transform=\"translate(225.15234375, 503.5)\" data-id=\"T\" data-node=\"true\" id=\"flowchart-T-296\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-97.5,97.5)\" class=\"label-container\" points=\"97.5,0 195,-97.5 97.5,-195 0,-97.5\"></polygon><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">需要动态插入删除吗</span></div></foreignObject></g></g><g transform=\"translate(110.1875, 690)\" data-id=\"BST\" data-node=\"true\" id=\"flowchart-BST-298\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"220.375\" y=\"-18\" x=\"-110.1875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-102.6875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"205.375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">二叉查找树 平均 log n 最坏 n</span></div></foreignObject></g></g><g transform=\"translate(110.1875, 776)\" data-id=\"AVL\" data-node=\"true\" id=\"flowchart-AVL-300\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"187.5\" y=\"-18\" x=\"-93.75\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-86.25, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"172.5\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">AVL 或红黑树 最坏 log n</span></div></foreignObject></g></g><g transform=\"translate(340.1171875, 690)\" data-id=\"BT\" data-node=\"true\" id=\"flowchart-BT-302\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"139.484375\" y=\"-18\" x=\"-69.7421875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-62.2421875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"124.484375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">B 树 层数 log m n</span></div></foreignObject></g></g><g transform=\"translate(404.60546875, 167.5)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-304\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-81.5,81.5)\" class=\"label-container\" points=\"81.5,0 163,-81.5 81.5,-163 0,-81.5\"></polygon><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">键是定长数字吗</span></div></foreignObject></g></g><g transform=\"translate(404.60546875, 338)\" data-id=\"TR\" data-node=\"true\" id=\"flowchart-TR-306\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"105.671875\" y=\"-18\" x=\"-52.8359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-45.3359375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"90.671875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">trie 按位分支</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：三个判断依次收窄选择。最后一条分支提醒：键的结构本身也能当索引，不必只依赖大小比较。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：顺序查找像在一叠没编号的文件里翻；二分查找像查字典，每次翻到中间看该往前还是往后；B 树像图书馆先分楼层、再分书架、再分格子。\n<\/li><li>\n类比失效：字典的「中间」是物理页，翻页有成本；B 树把多个键塞进一个节点，正是为了把「翻页次数」压低到与层数同阶。\n<\/ul>\n<p><strong>实例（AVL 旋转）<\/strong>：插入后出现「左左」失衡（左子树的左子树过高），做一次右旋：把左孩子提为根，原根变为它的右孩子，左孩子原来的右子树挂到原根的左边。旋转后高度恢复，中序顺序不变。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为二分查找总比顺序查找快<\/strong>——实际上 n 很小时（比如小于 10），二分的前期开销与分支预测损失可能让它更慢。\n<\/li><li>\n<strong>别以为二叉查找树平均 O(log n) 就够用<\/strong>——实际上最坏会退化成链，必须加平衡机制。\n<\/li><li>\n<strong>别以为 B 树是为了「比较次数少」<\/strong>——实际上它每个节点比较次数不少，省的是磁盘 I/O 次数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：在 1 到 9 的有序数组里二分查找 7，需要多少次比较？（填数字）\n<p>（答案：2；解析：先比中间 5，7 大于 5；再在 6 到 9 中比中间 7，命中。）<\/p>\n<\/ol>\n<ol><li>\n单选题：二叉查找树最坏情况下的查找代价是？\n<p>A. O(1) B. O(log n) C. O(n) D. O(n log n) （答案：C；解析：按升序插入会退化成链，查找退化为顺序扫描。）<\/p>\n<\/ol>\n<ol><li>\n简答题：10 亿个键，B 树每个节点 100 个孩子，大约几层？为什么这很重要？\n<p>（答案：约 5 层，因为 log_100(10⁹) = 4.5。每层通常一次磁盘读，5 次读远少于二叉树的约 30 次，直接决定索引的响应时间。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n顺序查找平均 (n+1)/2；二分最坏约 log2 n，但要求有序且可随机访问。\n<\/li><li>\n二叉查找树平均 1.39 log2 n，最坏 n；AVL 把最坏压到约 1.44 log2 n。\n<\/li><li>\nB 树用高扇出把层数降到 log_m n，省的是 I/O。\n<\/ul>", "kind": "chapter", "title": "第 5 章：查找——从顺序扫到平衡树"}, "ch06": {"html": "<h1>第 6 章：散列查找与辅助键<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 5 章；模运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n选一个像样的散列函数，并说清模为什么常取素数。\n<\/li><li>\n比较链地址法与开放地址法的代价，用装载因子估算平均查找长度。\n<\/li><li>\n解释线性探测的「一次聚集」问题，以及双散列怎么缓解。\n<\/li><li>\n说清辅助键与倒排索引解决的问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>散列把「比较」换成「计算」：不靠键的大小顺序，而靠一个函数把键直接映射到位置；代价从 log n 变成常数级，前提是冲突可控。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：散列函数（难度：基础）<\/h3>\n<p>散列函数把键映射到 0 到 m−1 的槽位。理想情况下，不同键均匀落到不同槽。<\/p>\n<p><strong>除法散列<\/strong>：h(k) = k mod m。<\/p>\n<ul><li>\nm 取素数，且离 2 的幂远一些。若 m = 2^p，则只取键的低 p 位，键的低位若有规律就会集中冲突。\n<\/li><li>\n实例：m = 13，键 18、41、22、44、59 分别落到 5、2、9、5、7。44 与 18 冲突。\n<\/ul>\n<p><strong>乘法散列<\/strong>：h(k) = floor(m · frac(k · A))，A 常取黄金比例 0.618…。它对 m 的取值不敏感，m 可以取 2 的幂。<\/p>\n<h3>概念 2：链地址法（难度：基础）<\/h3>\n<p>每个槽挂一条链表，冲突的键依次挂上去。<\/p>\n<ul><li>\n装载因子 α = n/m（键数除以槽数）。\n<\/li><li>\n成功查找平均比较次数 ≈ 1 + α/2。\n<\/li><li>\n失败查找平均比较次数 ≈ α。\n<\/li><li>\n优点：实现简单，删除方便，α 可以大于 1。\n<\/li><li>\n缺点：链表指针占空间，缓存不友好。\n<\/ul>\n<p><strong>实例<\/strong>：m = 5，α = 2（10 个键），成功查找平均约 1 + 1 = 2 次比较。<\/p>\n<h3>概念 3：开放地址法（难度：进阶）<\/h3>\n<p>所有键都存在表内，冲突时按某个探测序列找下一个空槽。<\/p>\n<ul><li>\n<strong>线性探测<\/strong>：h, h+1, h+2, … 依次试。\n<\/li><li>\n<strong>二次探测<\/strong>：h, h+1², h+2², … 跳着试。\n<\/li><li>\n<strong>双散列<\/strong>：用第二个散列函数决定步长，步长与 m 互素才能遍历全表。\n<\/ul>\n<p><strong>线性探测的代价<\/strong>：成功查找平均约 (1/2)(1 + 1/(1−α))。α = 0.5 时约 1.5 次；α = 0.9 时约 5.5 次，急剧恶化。<\/p>\n<p><strong>一次聚集<\/strong>：线性探测会把连续占用的槽连成一片，新键落进去后继续加长这片区域，后面的键越来越难找。二次探测与双散列就是为了打散这种连续块。<\/p>\n<p><strong>删除的坑<\/strong>：开放地址法不能直接把槽清空，否则会截断别人的探测链。要用「墓碑」标记，查找时跳过、插入时可复用。<\/p>\n<h2>概念 4：辅助键与倒排索引（难度：进阶）<\/h2>\n<p>主键唯一标识一条记录；<strong>辅助键<\/strong>是其他可用于查找的字段（如作者、日期、标签），可以有重复。<\/p>\n<ul><li>\n<strong>倒排文件<\/strong>：为每个辅助键值建一个列表，记录包含该值的所有主键。查「作者=Knuth」就直接取出列表。\n<\/li><li>\n<strong>多键查询<\/strong>：多个条件同时用时，对各列表求交；求交的代价取决于列表长度，短的先做。\n<\/li><li>\n<strong>组合键<\/strong>：把多个字段拼成一个键再散列，适合精确匹配；范围查询仍要靠有序索引。\n<\/ul>\n<p><strong>实例<\/strong>：三篇文章的主键 1、2、3，标签分别是 {算法, 数学}、{算法}、{数学}。<\/p>\n<ul><li>\n标签「算法」的倒排表：1、2。\n<\/li><li>\n标签「数学」的倒排表：1、3。\n<\/li><li>\n查「同时有算法与数学」：两表求交得 1。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 362.5 768\" style=\"max-width: 362.5px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg23\"><style>#svg23{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg23 .error-icon{fill:#552222;}#svg23 .error-text{fill:#552222;stroke:#552222;}#svg23 .edge-thickness-normal{stroke-width:2px;}#svg23 .edge-thickness-thick{stroke-width:3.5px;}#svg23 .edge-pattern-solid{stroke-dasharray:0;}#svg23 .edge-pattern-dashed{stroke-dasharray:3;}#svg23 .edge-pattern-dotted{stroke-dasharray:2;}#svg23 .marker{fill:#333333;stroke:#333333;}#svg23 .marker.cross{stroke:#333333;}#svg23 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg23 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg23 .cluster-label text{fill:#333;}#svg23 .cluster-label span,#svg23 p{color:#333;}#svg23 .label text,#svg23 span,#svg23 p{fill:#333;color:#333;}#svg23 .node rect,#svg23 .node circle,#svg23 .node ellipse,#svg23 .node polygon,#svg23 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg23 .flowchart-label text{text-anchor:middle;}#svg23 .node .katex path{fill:#000 ,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">用哪种方法</span></div></foreignObject></g></g><g transform=\"translate(114, 648)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-318\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">挂到链表</span></div></foreignObject></g></g><g transform=\"translate(275, 648)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-320\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">按探测序列找空槽</span></div></foreignObject></g></g><g transform=\"translate(275, 734)\" data-id=\"W\" data-node=\"true\" id=\"flowchart-W-322\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">删除需用墓碑</span></div></foreignObject></g></g><g transform=\"translate(238, 18)\" data-id=\"K2\" data-node=\"true\" id=\"flowchart-K2-323\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">辅助键</span></div></foreignObject></g></g><g transform=\"translate(238, 104)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-324\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">倒排表</span></div></foreignObject></g></g><g transform=\"translate(238, 190)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-326\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多条件求交</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：上半部分是单键查找的两条路；下半部分说明辅助键走的是完全不同的结构——不是散列到槽，而是「键值 → 主键列表」的映射。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：散列像图书馆按书名的哈希值把书放进编号柜子；冲突就是两本书算到同一个柜子，只好在柜子里再排一层。\n<\/li><li>\n类比失效：图书馆的柜子大小固定，书多了必须换馆；散列表可以扩容重散列（rehash），但扩容那一下代价是 O(n)。\n<\/ul>\n<p><strong>实例（线性探测）<\/strong>：m = 7，依次插入 10、17、24、31。<\/p>\n<ul><li>\n10 mod 7 = 3，放 3。\n<\/li><li>\n17 mod 7 = 3，冲突，试 4，放入。\n<\/li><li>\n24 mod 7 = 3，冲突，4 被占，试 5，放入。\n<\/li><li>\n31 mod 7 = 3，冲突，4、5 被占，试 6，放入。\n<p>四个键挤在 3 到 6 一段，这就是一次聚集。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为散列查找永远是 O(1)<\/strong>——实际上 α 接近 1 时开放地址法急剧退化，最坏可到 O(n)。\n<\/li><li>\n<strong>别以为 m 取 2 的幂很方便就没问题<\/strong>——实际上它只取键的低位，键低位有规律时冲突严重。\n<\/li><li>\n<strong>别以为删除可以直接清空槽<\/strong>——实际上会截断探测链，必须用墓碑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：m = 13，键 44 的除法散列槽位是多少？（填数字）\n<p>（答案：5；解析：44 = 3×13 + 5，余数为 5。）<\/p>\n<\/ol>\n<ol><li>\n单选题：链地址法在装载因子 α = 2 时，成功查找的平均比较次数约为？\n<p>A. 1 B. 2 C. 4 D. 8 （答案：B；解析：成功查找约 1 + α/2 = 1 + 1 = 2 次。）<\/p>\n<\/ol>\n<ol><li>\n简答题：开放地址法为什么不能直接删除元素？\n<p>（答案：直接清空会截断后续键的探测链，使本来能找到的键查找失败；要用墓碑标记，查找时跳过、插入时可复用。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n除法散列 m 取素数，避开 2 的幂。\n<\/li><li>\n链地址成功查找约 1 + α/2；线性探测约 (1/2)(1 + 1/(1−α))。\n<\/li><li>\n开放地址删除要用墓碑；辅助键用倒排表。\n<\/ul>", "kind": "chapter", "title": "第 6 章：散列查找与辅助键"}, "c01": {"html": "<h1>逆序与排序代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>逆序对是排列中「前大后小」的一对位置；逆序对总数直接等于插入排序需要移动的次数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「排序有多难」从算法层面拉到了数据层面：同一份数据，逆序对少就好排，多就难排。平均逆序对数是 n(n−1)/4，这就是插入类排序平均 O(n²) 的来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 752.328125 138\" style=\"max-width: 752.328125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg24\"><style>#svg24{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg24 .error-icon{fill:#552222;}#svg24 .error-text{fill:#552222;stroke:#552222;}#svg24 .edge-thickness-normal{stroke-width:2px;}#svg24 .edge-thickness-thick{stroke-width:3.5px;}#svg24 .edge-pattern-solid{stroke-dasharray:0;}#svg24 .edge-pattern-dashed{stroke-dasharray:3;}#svg24 .edge-pattern-dotted{stroke-dasharray:2;}#svg24 .marker{fill:#333333;stroke:#333333;}#svg24 .marker.cross{stroke:#333333;}#svg24 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg24 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg24 .cluster-label text{fill:#333;}#svg24 .cluster-label span,#svg24 p{color:#333;}#svg24 .label text,#svg24 span,#svg24 p{fill:#333;color:#333;}#svg24 .node rect,#svg24 .node circle,#svg24 .node ellipse,#svg24 .node polygon,#svg24 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg24 .flowchart-label text{text-anchor:middle;}#svg24 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg24 .node .label{text-align:center;}#svg24 .node.clickable{cursor:pointer;}#svg24 .arrowheadPath{fill:#333333;}#svg24 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg24 .flowchart-link{stroke:#333333;fill:none;}#svg24 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg24 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg24 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg24 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg24 .cluster text{fill:#333;}#svg24 .cluster span,#svg24 p{color:#333;}#svg24 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg24 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg24 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg24_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg24_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 5 L 10 10 L 10 0 z\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"11\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg24_flowchart-circleEnd\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"-1\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg24_flowchart-circleStart\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg24_flowchart-crossEnd\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg24_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg24_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-C\" id=\"L-P-C-0\" d=\"M81.661,43L88.947,38.833C96.233,34.667,110.804,26.333,139.524,22.167C168.244,18,211.112,18,232.547,18L253.981,18\"></path><path marker-end=\"url(#svg24_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-N\" id=\"L-C-N-0\" d=\"M338.281,18L360.599,18C382.917,18,427.552,18,453.153,18C478.754,18,485.321,18,488.604,18L491.888,18\"></path><path marker-end=\"url(#svg24_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-N LE-M\" id=\"L-N-M-0\" d=\"M541.531,18L545.698,18C549.865,18,558.198,18,565.648,18C573.098,18,579.665,18,582.948,18L586.231,18\"></path><path marker-end=\"url(#svg24_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-O\" id=\"L-P-O-0\" d=\"M81.661,79L88.947,83.167C96.233,87.333,110.804,95.667,121.373,99.833C131.942,104,138.508,104,141.792,104L145.075,104\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(50.1875, 61)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-327\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"100.375\" y=\"-18\" x=\"-50.1875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-42.6875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"85.375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排列 3 1 4 2</span></div></foreignObject></g></g><g transform=\"translate(298.78125, 18)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-328\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数逆序对</span></div></foreignObject></g></g><g transform=\"translate(519.359375, 18)\" data-id=\"N\" data-node=\"true\" id=\"flowchart-N-330\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"44.34375\" y=\"-18\" x=\"-22.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-14.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"29.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">3 个</span></div></foreignObject></g></g><g transform=\"translate(663.9296875, 18)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-332\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"144.796875\" y=\"-18\" x=\"-72.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"129.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">插入排序移动 3 次</span></div></foreignObject></g></g><g transform=\"translate(298.78125, 104)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-334\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"296.8125\" y=\"-18\" x=\"-148.40625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-140.90625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"281.8125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均情况 对 n 个元素为 n n 减一 除以四</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看这条链：数据的一个静态属性（逆序对数）直接等于一个算法的动态工作量（移动次数）。<\/p>\n<h2>详解<\/h2>\n<p><strong>计数方法<\/strong>：对每个元素，数它右边比它小的元素个数，全部加起来。<\/p>\n<p><strong>实例<\/strong>：3, 1, 4, 2。3 右边比它小的有 1、2（2 个）；1 右边没有；4 右边有 2（1 个）；2 是最后一个。合计 3 个。<\/p>\n<p><strong>与交换排序的区别<\/strong>：一次相邻交换能消除恰好一个逆序对；但一次远距离交换可能消除两个，也可能一个都不消。所以「交换次数」不能直接等于逆序对数，只有插入排序的「挪动一格」是严格一一对应。<\/p>\n<p><strong>上界<\/strong>：完全逆序的排列有 n(n−1)/2 个逆序对，这是最大值，也是插入排序的最坏移动次数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为逆序对数相同的两个排列，排序代价也相同：快排的代价取决于基准选择，不只是逆序数。\n<\/li><li>\n别以为平均逆序对数是 n²/4 就说明「平均只比最坏快一倍」：常数确实只差一倍，但 n log n 算法能把这项彻底甩开。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.1.1<\/td><td>反序<\/td><td>逆序对的定义与平均 n(n−1)/4<\/td><\/tr><tr><td>5.2.1<\/td><td>插入排序<\/td><td>移动次数等于逆序对数<\/td><\/tr><tr><td>5.2.2<\/td><td>交换排序<\/td><td>一次交换最多消除两个逆序对<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">比较树下界<\/a>\n<\/ul>", "kind": "concept", "title": "逆序与排序代价"}, "c02": {"html": "<h1>比较树下界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把任何比较排序的执行过程画成一棵二叉树，叶子必须覆盖 n! 种输入排列，所以树高至少 log2(n!)，这就是比较排序的比较次数下界。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是一条「不可能性」结论：不管多聪明的比较排序，最坏情况都至少要 log2(n!) 次比较。知道下界，才知道一个算法还有多少优化空间，也才知道该换思路（比如改用不比较的基数排序）。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 296.90625 310\" style=\"max-width: 296.90625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg25\"><style>#svg25{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg25 .error-icon{fill:#552222;}#svg25 .error-text{fill:#552222;stroke:#552222;}#svg25 .edge-thickness-normal{stroke-width:2px;}#svg25 .edge-thickness-thick{stroke-width:3.5px;}#svg25 .edge-pattern-solid{stroke-dasharray:0;}#svg25 .edge-pattern-dashed{stroke-dasharray:3;}#svg25 .edge-pattern-dotted{stroke-dasharray:2;}#svg25 .marker{fill:#333333;stroke:#333333;}#svg25 .marker.cross{stroke:#333333;}#svg25 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg25 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg25 .cluster-label text{fill:#333;}#svg25 .cluster-label span,#svg25 p{color:#333;}#svg25 .label text,#svg25 span,#svg25 p{fill:#333;color:#333;}#svg25 .node rect,#svg25 .node circle,#svg25 .node ellipse,#svg25 .node polygon,#svg25 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg25 .flowchart-label text{text-anchor:middle;}#svg25 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg25 .node .label{text-align:center;}#svg25 .node.clickable{cursor:pointer;}#svg25 .arrowheadPath{fill:#333333;}#svg25 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg25 .flowchart-link{stroke:#333333;fill:none;}#svg25 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg25 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg25 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg25 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg25 .cluster text{fill:#333;}#svg25 .cluster s
