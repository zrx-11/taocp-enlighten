ode>、<code>ADD<\/code>、<code>JMP<\/code> 能说出它做什么。\n<\/li><li>\n说明子程序、协同程序、解释程序三者的区别，以及 MIX 没有硬件栈时子程序靠什么返回。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>MIX 是为了<strong>让算法可被精确描述、又不绑死在任何一台真实机器上<\/strong>而设计的虚构计算机。它的寄存器少得可怜，正因为少，才逼你把「算法到底要存什么」想清楚。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：MIX 的机器结构（难度：基础）<\/h3>\n<p>MIX 是一台「理想化」的机器，规格如下。<\/p>\n<ul><li>\n<strong>字（word）<\/strong>：1 个符号位加 5 个字节。字节是 6 位，取值 0 到 63。所以一个字能表示 −(64⁵−1) 到 +(64⁵−1) 之间的整数，约正负 10.7 亿。\n<\/li><li>\n<strong>字节为什么是 0 到 63<\/strong>：6 位二进制正好 64 种组合。MIX 用「一个字节装一个字符」的方式处理文本，64 个码位刚好够一套大写字母、数字和标点。\n<\/li><li>\n<strong>寄存器<\/strong>：A 与 X 各 1 个字（5 字节加符号），I1 到 I6 各 2 字节加符号（存地址，所以最大 4095），J 是 2 字节加符号（存返回地址）。另外有一个溢出开关和一个比较指示器（小于、等于、大于三态）。\n<\/li><li>\n<strong>内存<\/strong>：按字编址，每个字有一个地址。地址可以放进 I 寄存器，说明它的范围受 2 字节限制。\n<\/ul>\n<p><strong>类比<\/strong>：MIX 像一张只有六个抽屉的办公桌。抽屉少，你就必须决定哪些纸必须留在桌面（寄存器），哪些丢进柜子（内存）。真实 CPU 有几十个寄存器，反而让人不必做这种取舍。 <strong>类比失效<\/strong>：真实 CPU 有缓存层级和流水线，MIX 完全没有。所以 MIX 上数出的指令次数只能比较算法，不能直接换算成现代机器上的耗时。<\/p>\n<h3>概念 2：指令与汇编语言（难度：基础）<\/h3>\n<p>一条 MIX 指令占一个字，包含四样东西：<strong>操作码<\/strong>（做什么）、<strong>地址<\/strong>（对哪个内存字做）、<strong>变址<\/strong>（用哪个 I 寄存器加到地址上）、<strong>域<\/strong>（只取该字的哪几个字节）。<\/p>\n<p>常见指令族：<\/p>\n<ul><li>\n装入/存储：<code>LDA<\/code>、<code>LDX<\/code>、<code>LD1<\/code>…<code>LD6<\/code>，<code>STA<\/code>、<code>STX<\/code>…，把内存的字搬进寄存器或搬回去。\n<\/li><li>\n算术：<code>ADD<\/code>、<code>SUB<\/code>、<code>MUL<\/code>、<code>DIV<\/code>。乘法结果占 A 和 X 两个寄存器，除法用 A 和 X 拼成的被除数。\n<\/li><li>\n比较与跳转：<code>CMPA<\/code> 设置比较指示器，<code>JMP<\/code> 无条件跳，<code>JGE<\/code>、<code>JNE<\/code> 等按指示器跳。\n<\/li><li>\n地址算术：<code>ENTA<\/code>、<code>ENT1<\/code>、<code>INCA<\/code>、<code>INC1<\/code> 等，直接给寄存器赋常数或加减。\n<\/ul>\n<p>一个小例子，求 A 的绝对值：<\/p>\n<pre><code>        CMPA  ZERO     比较 A 与内存里的 0\n        JGE   DONE     A 大于等于 0 就跳走\n        ENNA  0       否则 A 取负，A = -A\nDONE    ...           继续<\/code><\/pre>\n<p><code>ENNA 0<\/code> 的意思是「把 A 的相反数放回 A」，后面的 0 是占位地址，这条指令不需要地址。<\/p>\n<p><strong>MIXAL<\/strong> 是 MIX 的汇编语言，除了指令还有几条伪指令：<code>ORIG<\/code> 指定代码起点，<code>EQU<\/code> 给符号赋值，<code>CON<\/code> 定义常量，<code>ALF<\/code> 把五个字符打包成一个字，<code>END<\/code> 表示程序结束。<\/p>\n<h3>概念 3：子程序怎么返回（难度：进阶）<\/h3>\n<p>MIX 没有硬件栈。如果像现代编译器那样「调用时压栈、返回时弹栈」，MIX 做不到。它用的是<strong>链接字<\/strong>。<\/p>\n<p>做法是：调用方先把「返回后该从哪继续」这个地址存到一个约定的位置，再跳到子程序入口。子程序执行完，从那个位置取出地址跳回去。<\/p>\n<ul><li>\nMIX 里有一个专门的 J 寄存器，执行跳转指令时硬件顺手把「下一条指令的地址」存进 J。所以调用只写一条 <code>JMP SUB<\/code>，J 就自动记住了返回点。\n<\/li><li>\n子程序最后执行一条「跳到 J 所指地址」的指令返回。书中把这条写成 <code>JMP 0<\/code>，地址 0 是「取 J 的值」的约定。\n<\/li><li>\n如果子程序里还要再调用别的子程序，J 会被覆盖，所以必须先把 J 存进内存（这叫保存链接字），返回前再取回来。\n<\/ul>\n<p><strong>实例<\/strong>：主程序在地址 100 处调用子程序，子程序入口是 500。<\/p>\n<ol><li>\n执行 <code>JMP 500<\/code>，硬件把 101 存进 J，跳到 500。\n<\/li><li>\n子程序里如果想再调用别人，先把 J 的值（101）存到内存某个格子，比如 <code>STJ RET<\/code>。\n<\/li><li>\n子程序结束前 <code>LDJ RET<\/code> 把 101 取回 J，再 <code>JMP 0<\/code> 跳回 101。\n<\/ol>\n<h3>概念 4：协同程序与解释程序（难度：进阶）<\/h3>\n<p><strong>协同程序<\/strong>：两段程序彼此平等，谁都可以跳到对方，没有「调用者/被调用者」的上下级关系。经典例子是「生产者—消费者」：生产者算出一批数据就跳给消费者，消费者处理完再跳回来，两边各自保留自己的进度。<\/p>\n<p>它和子程序的区别：子程序每次被调用都从入口重新开始，协同程序从上次停下的地方继续。<\/p>\n<p><strong>解释程序<\/strong>：用软件模拟另一台机器。它反复做三段：<\/p>\n<ol><li>\n<strong>取指<\/strong>：从「被模拟机器的程序计数器」所指的内存取出下一条指令。\n<\/li><li>\n<strong>译码<\/strong>：拆出操作码、地址、变址、域。\n<\/li><li>\n<strong>执行<\/strong>：按译码结果修改被模拟机器的寄存器与内存。\n<\/ol>\n<p>MIX 的模拟程序就属于这一类。它的意义在于：MIX 是虚构机器，没有硬件能直接跑，靠解释程序才能验证书里的程序。<\/p>\n<p><strong>类比<\/strong>：解释程序像一个翻译跟着演讲者逐句翻译；编译器像提前把整篇稿子翻译好再上台。 <strong>类比失效<\/strong>：解释程序不一定慢，现代解释器会做即时编译；这里的类比只强调「逐条处理」这一点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    subgraph MIX 机器\n    A[寄存器 A 与 X] --&gt; ALU[算术单元]\n    I[寄存器 I1 到 I6] --&gt; ADDR[地址计算]\n    J[寄存器 J] --&gt; RET[返回地址]\n    end\n    MEM[内存 按字编址] --&gt; FETCH[取指]\n    FETCH --&gt; DECODE[译码]\n    DECODE --&gt; EXEC[执行]\n    EXEC --&gt; MEM<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：看三层关系。内存与「取指—译码—执行」构成指令循环；寄存器 A、X 是数据通路；I 寄存器只参与地址计算，不参与运算。这张图解释了一个常见困惑：为什么 MIX 的数组访问要先算地址再取数——地址计算和数据运算是两条路。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：MIX 像一套只有六个抽屉、一张桌子、一个大柜子的办公室。你把当前要用的纸摊在桌上（A、X），把「第几个抽屉」记在便签上（I 寄存器），其余的进柜子（内存）。\n<\/li><li>\n类比失效：办公室的柜子可以无限加，MIX 的内存地址被 2 字节的 I 寄存器卡死在 4095，超出就得分段或换机器（这也是后来 MMIX 把地址扩到 64 位的原因）。\n<\/ul>\n<p><strong>实例（算一次指令周期）<\/strong>：执行 <code>LDA 1000<\/code>。<\/p>\n<ol><li>\n取指：从程序计数器所指地址取出这条指令。\n<\/li><li>\n译码：操作码是 LDA，地址 1000，无变址，域是整字。\n<\/li><li>\n执行：把内存 1000 号字复制进 A，其他寄存器不变。\n<\/li><li>\n程序计数器加 1，取下一条。\n<\/ol>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 MIX 是真实存在的机器<\/strong>——实际上它是虚构的，只有模拟程序。书上所有 MIX 程序都要靠解释程序才能跑。\n<\/li><li>\n<strong>别以为 MIX 的字节是 0 到 255<\/strong>——实际上是 0 到 63，因为一个字节只有 6 位。按现代「字节 = 8 位」的直觉去算会全错。\n<\/li><li>\n<strong>别以为子程序返回靠硬件栈<\/strong>——实际上靠 J 寄存器和内存里的链接字。这也是为什么「递归」在 MIX 上必须自己造栈。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：MIX 的一个字节取值范围是？\n<p>A. 0 到 63 B. 0 到 255 C. −32 到 31 D. 0 到 4095 （答案：A；解析：字节是 6 位，2⁶ = 64 个值，从 0 到 63。）<\/p>\n<\/ol>\n<ol><li>\n填空题：MIX 子程序返回时，返回地址通常存在 ___ 寄存器。\n<p>（答案：J；解析：跳转指令执行时硬件把下一条指令地址存进 J，子程序据此返回；嵌套调用要先把它存进内存。）<\/p>\n<\/ol>\n<ol><li>\n简答题：协同程序和子程序最本质的区别是什么？\n<p>（答案：协同程序从上次停下的地方继续，两边地位平等；子程序每次调用都从入口重新开始，有明确的调用者与被调用者。解析：前者靠保留各自的位置实现交替推进，后者靠链接字实现一进一出。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n字 = 符号 + 5 字节，字节 6 位取 0 到 63。\n<\/li><li>\n指令四要素：操作码、地址、变址、域。\n<\/li><li>\nMIX 无硬件栈，子程序靠 J 与链接字返回；协同程序靠各自保存位置交替推进。\n<\/ul>", "ch04": "<h1>第 4 章：线性表<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章（代价分析）、第 3 章（地址概念）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出栈、队列、双端队列各自允许在哪一端操作，并判断一个实际问题该用哪个。\n<\/li><li>\n在数组上实现栈，写清入栈、出栈与溢出判断。\n<\/li><li>\n画出单链表插入与删除的指针变化，说清每一步为什么不能交换顺序。\n<\/li><li>\n解释循环链表与双链表分别省掉了什么操作，什么时候值得多花一个链字段。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>线性表的全部争论只有一个：<strong>数据在内存里要不要挨着放<\/strong>。挨着放换访问速度，散着放换插入删除的自由。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：栈、队列与双端队列（难度：基础）<\/h3>\n<p>三者都是「只允许在特定位置插入删除」的线性表，区别在于允许的位置：<\/p>\n<ul><li>\n<strong>栈<\/strong>：只在一端进出，后进先出。像一摞盘子，只能从顶上拿、往顶上放。\n<\/li><li>\n<strong>队列<\/strong>：一端进、另一端出，先进先出。像排队买票，从队尾进、队首出。\n<\/li><li>\n<strong>双端队列<\/strong>：两端都可以进出。栈和队列都是它的特例。\n<\/ul>\n<p><strong>实例<\/strong>：依次压入 1、2、3 再全部弹出，顺序是 3、2、1。若入队 1、2、3，出队顺序是 1、2、3。 <strong>用途<\/strong>：栈用于表达式求值、递归的模拟、撤销操作；队列用于广度优先搜索、打印任务排队。<\/p>\n<h3>概念 2：顺序分配（难度：基础）<\/h3>\n<p>用一段连续的内存加一个指针实现栈：<\/p>\n<ul><li>\n数组 <code>V[1..m]<\/code> 存元素，整数 <code>TOP<\/code> 记录栈顶位置，初值 0 表示空栈。\n<\/li><li>\n<strong>入栈<\/strong>：先判断 <code>TOP = m<\/code> 吗？是则上溢，拒绝；否则 <code>TOP = TOP + 1<\/code>，<code>V[TOP] = X<\/code>。\n<\/li><li>\n<strong>出栈<\/strong>：先判断 <code>TOP = 0<\/code> 吗？是则下溢，拒绝；否则取出 <code>V[TOP]<\/code>，再 <code>TOP = TOP - 1<\/code>。\n<\/ul>\n<p>顺序分配的代价：按下标访问是 O(1)，但在中间插入要搬动后面所有元素，最坏 O(n)。<\/p>\n<p><strong>队列的顺序实现有个坑<\/strong>：用普通数组做队列，队首不断后移，前面会出现永远用不上的空位（假溢出）。解法是循环数组：<code>rear<\/code> 和 <code>front<\/code> 走到末尾就绕回 0，用「(rear + 1) mod m = front」判断满。<\/p>\n<h3>概念 3：链接分配（难度：进阶）<\/h3>\n<p>每个节点自己带一个「下一个节点在哪」的链，节点在内存里可以散着放。<\/p>\n<p>一个节点记作 <code>INFO + LINK<\/code>：<code>INFO<\/code> 存数据，<code>LINK<\/code> 存下一个节点的地址。最后一个节点的 <code>LINK<\/code> 记 0（空链）。<\/p>\n<p><strong>在 P 之后插入 Q<\/strong>（顺序不能反）：<\/p>\n<ol><li>\n<code>Q.LINK = P.LINK<\/code>（先把 Q 接到 P 原来的后继上）\n<\/li><li>\n<code>P.LINK = Q<\/code>（再让 P 指向 Q）\n<\/ol>\n<p>如果先做第 2 步，P 原来的后继地址就丢了，链断在那里。<\/p>\n<p><strong>删除 P 之后的 Q<\/strong>：<\/p>\n<ol><li>\n<code>P.LINK = Q.LINK<\/code>（让 P 直接指向 Q 的后继）\n<\/li><li>\n释放 Q\n<\/ol>\n<p><strong>实例<\/strong>：链 A → B → C，在 A 之后插入 X。<\/p>\n<ol><li>\n<code>X.LINK = A.LINK<\/code>，此时 X 指向 B。\n<\/li><li>\n<code>A.LINK = X<\/code>，链变成 A → X → B → C。\n<p>若反过来先 <code>A.LINK = X<\/code>，A 原来的 <code>LINK<\/code>（指向 B）被覆盖，B 和 C 就找不回来了。<\/p>\n<\/ol>\n<h3>概念 4：循环链表与双链表（难度：进阶）<\/h3>\n<p><strong>循环链表<\/strong>：最后一个节点指回第一个，整条链成一个环。好处是一个指针就能走遍所有节点，且「在尾部插入」不需要从头找尾部——只要指针指向尾节点，尾节点的 <code>LINK<\/code> 就是头。<\/p>\n<p><strong>双链表<\/strong>：每个节点存两个链，<code>LLINK<\/code> 指向前驱、<code>RLINK<\/code> 指向后继。好处是删除一个节点时不必先找到它的前驱。<\/p>\n<p>删除节点 Q 的两步：<\/p>\n<ol><li>\n<code>Q.LLINK.RLINK = Q.RLINK<\/code>\n<\/li><li>\n<code>Q.RLINK.LLINK = Q.LLINK<\/code>\n<\/ol>\n<p><strong>代价<\/strong>：每个节点多一个链字段，空间换时间。单链表删除必须先遍历找到前驱，最坏 O(n)；双链表是 O(1)。<\/p>\n<h3>概念 5：数组与正交表（难度：进阶）<\/h3>\n<p>二维表如果大部分格子是空的（稀疏），开满 <code>m×n<\/code> 数组会浪费大量空间。正交表用三个一维数组表示非零元素：<\/p>\n<ul><li>\n<code>ROW[i]<\/code>：第 i 个非零元素的行号\n<\/li><li>\n<code>COL[i]<\/code>：列号\n<\/li><li>\n<code>VAL[i]<\/code>：值\n<\/ul>\n<p>再按行、按列各串一条链，就能从「某一行」或「某一列」快速找到非零项。稀疏矩阵转置、图的邻接表都用这个思路。<\/p>\n<p><strong>实例<\/strong>：3×3 矩阵只有 (1,2)=5、(2,3)=7、(3,1)=9 三个非零项。开满数组要 9 个格子，正交表只要 3 组三元组加两条链。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    Q[要存一批数据] --&gt; R{操作发生在哪}\n    R -- 只在末端后进先出 --&gt; S[栈 数组加 TOP]\n    R -- 两端分工先进先出 --&gt; QU[队列 循环数组]\n    R -- 中间频繁插入删除 --&gt; L[链表]\n    L --&gt; L1{需要 O(1) 找前驱吗}\n    L1 -- 需要 --&gt; D[双链表]\n    L1 -- 不需要 --&gt; C[单链表或循环链表]\n    R -- 极稀疏的二维表 --&gt; O[正交表]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：顺着「操作发生在哪」往下走，四个出口对应四类结构。注意最后一条分支不是按操作位置分的，而是按数据形状分的——稀疏性本身就是一种结构信息。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：顺序分配像一排固定座位的电影院，找第 5 排第 3 座一秒钟到位，但要在中间加一个人，后面所有人都得挪。链接分配像每个人手里牵着下一位的手，插入只要换两只手，但找第 100 个人得从头一个个数。\n<\/li><li>\n类比失效：电影院座位挪动是「物理搬人」，数组插入是复制数据；真实内存搬数据比搬人快得多，所以小数组上顺序分配往往比链表更快，这一点类比体现不出来。\n<\/ul>\n<p><strong>实例（栈操作复核）<\/strong>：容量 m = 3 的栈，依次入栈 7、8、9，再出栈一次，再入栈 5。<\/p>\n<ul><li>\n入 7：TOP=1，V[1]=7\n<\/li><li>\n入 8：TOP=2，V[2]=8\n<\/li><li>\n入 9：TOP=3，V[3]=9\n<\/li><li>\n出栈：返回 V[3]=9，TOP=2\n<\/li><li>\n入 5：TOP=3，V[3]=5\n<p>最终栈内从底到顶是 7、8、5。若此时再入栈，TOP 已是 3 = m，触发上溢。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为链表插入一定比数组快<\/strong>——实际上「已经拿到插入位置」时链表才是 O(1)。若还要先按位置找到那个节点，查找本身是 O(n)，总代价并不比数组低。\n<\/li><li>\n<strong>别以为队列用数组实现只要两个下标就行<\/strong>——实际上不循环就会假溢出，队列会越用越短。\n<\/li><li>\n<strong>别以为双链表删除只要改一条链<\/strong>——实际上要改两条：前驱的 <code>RLINK<\/code> 和后继的 <code>LLINK<\/code>，漏一条链就断了。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：依次入栈 1、2、3、4，再连续出栈两次，得到的两个数是？\n<p>A. 1、2 B. 4、3 C. 3、4 D. 2、1 （答案：B；解析：栈后进先出，最先弹出的是最后压入的 4，然后是 3。）<\/p>\n<\/ol>\n<ol><li>\n填空题：在单链表中删除 P 之后的节点 Q，第一步应执行 ___。\n<p>（答案：P.LINK = Q.LINK；解析：先让 P 越过 Q 指向 Q 的后继，链不断；再释放 Q。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么循环数组能解决队列的假溢出？\n<p>（答案：因为下标走到数组末端后绕回 0，把前面出队留下的空位重新用起来；判满条件改为 (rear + 1) mod m = front。解析：假溢出的根源是「队首后移造成前端空洞」，循环把线性空间变成了环，空洞被复用。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n栈后进先出、队列先进先出，双端队列两端都行。\n<\/li><li>\n链表插入两步：先接新节点的链，再改前驱的链。\n<\/li><li>\n双链表删除改两条链；循环链表用一个指针访问首尾。\n<\/ul>", "ch05": "<h1>第 5 章：树、多链结构与动态存储<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 4 章（链接分配）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n判断一个结构是不是树，并用「节点数 = 边数 + 1」做快速校验。\n<\/li><li>\n写出同一棵二叉树的先序、中序、后序序列。\n<\/li><li>\n把一棵一般树用「左孩子—右兄弟」表示成二叉树，并说清映射规则。\n<\/li><li>\n算扩充二叉树的外部路径长度 E 与内部路径长度 I，用 E = I + 2n 复核。\n<\/li><li>\n解释标记-清扫、边界标记、伙伴系统各自解决什么问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>树把「一对多」的关系压成「每个节点只有一个上级」，于是任何节点到根只有一条路；存储管理的全部麻烦，都来自节点的生死不由一个人说了算。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：树的定义与基本术语（难度：基础）<\/h3>\n<p><strong>有根树<\/strong>是一组节点加一组「父子」关系，满足：<\/p>\n<ul><li>\n恰有一个节点没有父节点，称为根；\n<\/li><li>\n除根以外每个节点恰有一个父节点；\n<\/li><li>\n从根出发能走到所有节点，且不走重复的路。\n<\/ul>\n<p>后两条合起来等价于「任意两个节点之间的路径唯一」，也就是<strong>没有环<\/strong>。<\/p>\n<p>术语：节点的<strong>层<\/strong>是从根到它的边数（根在第 0 层）；<strong>度<\/strong>是它子节点的个数；度为 0 的节点叫<strong>叶<\/strong>；从根到某节点的节点序列叫<strong>路径<\/strong>，路径上的边数叫<strong>路径长度<\/strong>。<\/p>\n<p><strong>快速校验<\/strong>：一棵有 n 个节点的树恰有 n−1 条边。因为除根以外每个节点都恰好贡献一条「连向父节点」的边。<\/p>\n<h3>概念 2：二叉树与三种遍历（难度：基础）<\/h3>\n<p><strong>二叉树<\/strong>是每个节点最多有两棵子树的树，而且左右子树<strong>有顺序<\/strong>：左为空、右不空，和反过来，是两棵不同的树。<\/p>\n<p>三种遍历的区别只在「什么时候访问根」：<\/p>\n<ul><li>\n<strong>先序<\/strong>：根 → 左子树 → 右子树\n<\/li><li>\n<strong>中序<\/strong>：左子树 → 根 → 右子树\n<\/li><li>\n<strong>后序<\/strong>：左子树 → 右子树 → 根\n<\/ul>\n<p><strong>实例<\/strong>：这棵树<\/p>\n<pre><code>        A\n       / \\\n      B   C\n     / \\   \\\n    D   E   F<\/code><\/pre>\n<ul><li>\n先序：A、B、D、E、C、F\n<\/li><li>\n中序：D、B、E、A、C、F\n<\/li><li>\n后序：D、E、B、F、C、A\n<\/ul>\n<p>核对方法：先序的第一个必是根 A；后序的最后一个必是根 A；中序里 A 左边的 D、B、E 全在左子树，右边的 C、F 全在右子树。<\/p>\n<h3>概念 3：一般树怎么表示（难度：进阶）<\/h3>\n<p>二叉树每个节点只有两个链位，一般树的节点可能有任意多个孩子。常用两种表示：<\/p>\n<ol><li>\n<strong>每个节点开一个孩子数组<\/strong>：节点存「孩子个数 + 孩子指针数组」。找第 k 个孩子是 O(1)，但节点大小不一，浪费空间。\n<\/li><li>\n<strong>左孩子—右兄弟<\/strong>：每个节点只存两个链，<code>LCHILD<\/code> 指向第一个孩子，<code>RSIB<\/code> 指向下一个兄弟。一般树就此变成二叉树。\n<\/ol>\n<p>映射规则：原树中「父 → 第一个孩子」变成左链，「同级兄弟」变成右链。这条规则是一一对应的，所以一般树的遍历可以完全借用二叉树的三序。<\/p>\n<p><strong>实例<\/strong>：A 有三个孩子 B、C、D。映射后 A 的左链指向 B，B 的右链指向 C，C 的右链指向 D。于是「A 的所有孩子」变成「B 这一条右链」。<\/p>\n<h3>概念 4：路径长度与扩充二叉树（难度：进阶）<\/h3>\n<p>把二叉树里所有空链都换成方形节点，得到的叫<strong>扩充二叉树<\/strong>，方形节点叫外部节点，原来的节点叫内部节点。<\/p>\n<ul><li>\n<strong>内部路径长度 I<\/strong>：所有内部节点的深度之和。\n<\/li><li>\n<strong>外部路径长度 E<\/strong>：所有外部节点的深度之和。\n<\/li><li>\n<strong>恒等式<\/strong>：E = I + 2n，n 是内部节点数。\n<\/ul>\n<p><strong>为什么成立<\/strong>（不跳步）：每个内部节点有 2 个孩子链位，n 个内部节点共 2n 个链位。其中 n−1 个被「连向子节点」占用，剩下 2n − (n−1) = n+1 个变成外部节点。而每条从根到外部节点的路径，比到它父节点的路径多一条边，把所有外部节点的深度加起来，正好等于「所有内部节点的 2 倍深度之和」再加 2n……更直接的算法是逐层数：设第 d 层有 n_d 个内部节点，则第 d+1 层的外部节点数等于 2n_d 减去第 d+1 层的内部节点数，逐层累加即得 E = I + 2n。<\/p>\n<p><strong>实例（用上面的树复核）<\/strong>：n = 6，深度分别是 A 0、B 1、C 1、D 2、E 2、F 2，I = 0+1+1+2+2+2 = 8。 外部节点 7 个，深度分别是：D 的两个孩子 3、3；E 的两个孩子 3、3；C 缺的左孩子 2；F 的两个孩子 3、3。E = 3+3+3+3+2+3+3 = 20。 核对恒等式：I + 2n = 8 + 12 = 20，与直接数出来的一致。<\/p>\n<p><strong>它有什么用<\/strong>：哈夫曼编码、最优二叉搜索树的代价，都能写成「外部路径长度最小化」的问题。<\/p>\n<h3>概念 5：表与垃圾回收（难度：进阶）<\/h3>\n<p>链表节点被删除后，空间要还回去。麻烦在于节点可能被多处共享，甚至互相指向成环，这时「没人用了」很难判断。<\/p>\n<p>两种做法：<\/p>\n<ul><li>\n<strong>引用计数<\/strong>：每个节点记一个「有多少人指向我」的计数。计数归零就回收。问题是<strong>环<\/strong>：两个节点互相指向，计数永远不为零，谁也回收不了。\n<\/li><li>\n<strong>标记-清扫<\/strong>：从根（程序的活跃指针）出发，把所有能走到的节点打上标记；走完后，没标记的一律回收。它能处理环，代价是要暂停程序扫一遍。\n<\/ul>\n<p><strong>实例<\/strong>：节点 P 与 Q 互相指向，外部已无指针指向它们。引用计数：P 的计数是 1（来自 Q），Q 的计数是 1（来自 P），都不归零，泄漏。标记-清扫：从根出发根本走不到 P、Q，两者都无标记，一起回收。<\/p>\n<h3>概念 6：动态存储分配（难度：高难）<\/h3>\n<p>程序运行时按需申请大小不一的块。内存池要同时解决「找一块够大的空地」与「归还后怎么合并」。<\/p>\n<ul><li>\n<strong>首次适配<\/strong>：从头扫，遇到第一个够大的空闲块就切。快，但会在低地址留下很多小碎片。\n<\/li><li>\n<strong>最佳适配<\/strong>：找所有够大的块里最小的那个。省空间，但要扫全表。\n<\/li><li>\n<strong>边界标记<\/strong>：在每个块的头部和尾部各存一份块大小。释放时看「物理相邻的下一个块」是否空闲，是就合并。没有尾部标记，就只能单向找前一个块，合并效率低。\n<\/li><li>\n<strong>伙伴系统<\/strong>：只按 2 的幂切分。申请 5 个单位就向上取到 8；释放时只与「同尺寸的伙伴」合并。伙伴的地址可以用异或算出来，合并极快。\n<\/ul>\n<p><strong>实例（伙伴系统）<\/strong>：总容量 16，申请 5 个单位。<\/p>\n<ol><li>\n16 对半切成两个 8，取左边 8。\n<\/li><li>\n8 对半切成两个 4，但 4 不够 5，于是退回上一层，用整个 8。\n<\/li><li>\n返回地址 0、长度 8。释放时检查地址 8 的伙伴 8 是否空闲；若空闲，合并成 16。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    T[树的存储] --&gt; B[二叉树 左孩子右兄弟]\n    T --&gt; A[孩子数组]\n    B --&gt; W[遍历 先序 中序 后序]\n    W --&gt; P[路径长度 I 与 E]\n    P --&gt; H[哈夫曼与最优树]\n    T --&gt; G[节点回收]\n    G --&gt; RC[引用计数 怕环]\n    G --&gt; MS[标记清扫 能处理环]\n    T --&gt; M[内存池]\n    M --&gt; FF[首次适配 加边界标记]\n    M --&gt; BS[伙伴系统 按 2 的幂]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：这棵树有三条主线——表示（怎么存）、度量（路径长度）、回收（怎么还）。三条线共同指向同一个问题：节点是动态生灭的，结构必须能在运行中改变。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：树像公司的组织架构，每个员工只有一个直属上级，汇报线唯一。左孩子—右兄弟的表示法像「先找我第一个下属，再让他介绍同级的同事」。\n<\/li><li>\n类比失效：公司里可以有一个人向两个上级汇报（矩阵式管理），树不允许；这种「多上级」关系必须用多链结构或图来表示。\n<\/ul>\n<p><strong>实例（多链结构）<\/strong>：稀疏矩阵的每个非零元素既要挂在「所在行」的链上，又要挂在「所在列」的链上。于是节点有两个链字段 <code>ROW-LINK<\/code> 与 <code>COL-LINK<\/code>，这就是多链结构：同一个节点同时属于两条链。它比正交表更进一步，不再需要单独的行列头数组，行列头本身也是节点。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为「树」和「二叉树」是一回事<\/strong>——实际上二叉树允许左子树为空而右子树不空，这种形态在一般树里不合法（不能有「没有第一个孩子却有第二个孩子」）。\n<\/li><li>\n<strong>别以为中序序列能唯一确定一棵二叉树<\/strong>——实际上只给中序不够，必须配先序或后序才能重建。\n<\/li><li>\n<strong>别以为标记-清扫一定比引用计数慢<\/strong>——实际上引用计数的写入开销摊在每次指针赋值上，标记-清扫的开销集中在回收那一刻；哪种更好取决于分配频率与暂停能否接受。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：一棵有 10 个节点的树有多少条边？\n<p>A. 9 B. 10 C. 11 D. 取决于形状 （答案：A；解析：除根以外每个节点贡献一条连向父节点的边，所以是 n−1 = 9。）<\/p>\n<\/ol>\n<ol><li>\n填空题：对上面的示例树做后序遍历，序列的最后一个节点是 ___。\n<p>（答案：A；解析：后序最后访问根，根是 A。）<\/p>\n<\/ol>\n<ol><li>\n简答题：n = 4 的扩充二叉树，若 I = 6，E 等于多少？\n<p>（答案：14；解析：E = I + 2n = 6 + 8 = 14。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么引用计数无法回收互相指向的两个节点？\n<p>（答案：因为两者的计数都来自对方，外部已无引用但计数仍为 1，永远不归零；标记-清扫从根出发判定可达性，能识别这种环。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n树：n 个节点、n−1 条边、路径唯一、无环。\n<\/li><li>\n三序遍历的差别只在访问根的时机；先序首项与后序末项都是根。\n<\/li><li>\n一般树用左孩子—右兄弟变成二叉树；E = I + 2n。\n<\/li><li>\n回收：引用计数怕环，标记-清扫怕暂停；分配：首次适配快、最佳适配省、伙伴系统合并快。\n<\/ul>", "c01": "<h1>算法五准则<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>一个计算过程要被称为算法，必须同时满足有限性、确定性、输入、输出、可行性五条。<\/p>\n<h2>为什么重要<\/h2>\n<p>这五条是整套 TAOCP 的准入标准。后面讨论的所有算法分析、数据结构、复杂度，都默认「对象已经是一个算法」。缺了其中任何一条，讨论的对象就换类别了——可能是一个程序、一个启发式、或者一个数学构造。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    F[有限性] --&gt; ALG[算法]\n    D[确定性] --&gt; ALG\n    I[输入] --&gt; ALG\n    O[输出] --&gt; ALG\n    E[可行性] --&gt; ALG<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图看五点是否都连到同一个中心：任何一条断开，都不成立。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>有限性<\/strong>：存在一个有限的步数上界。证明时不要只说「显然会停」，要指出一个每轮严格减小、又有下界的量。\n<\/li><li>\n<strong>确定性<\/strong>：同一输入，每一步的状态都唯一。注意「依赖随机数」的算法要先固定随机源，才能算确定。\n<\/li><li>\n<strong>输入<\/strong>：0 个或多个，且限定取值范围。范围本身是算法的一部分。\n<\/li><li>\n<strong>输出<\/strong>：至少 1 个，且与输入有指定关系。\n<\/li><li>\n<strong>可行性<\/strong>：每一步都能在有限时间内完成。这一条是理想化的——它不要求快，只要求做得到。\n<\/ul>\n<p><strong>实例对照<\/strong>：求 gcd 的过程五条全满足；一个「不断打印当前时间」的进程缺有限性；一个「按感觉判断这串数字是不是质数」的过程缺确定性。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「程序 = 算法」——程序可能不终止、可能依赖环境，算法是程序里满足五条的那部分。\n<\/li><li>\n别以为可行性要求「快」——可行只要求有限时间，实际快慢归算法分析管。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.1<\/td><td>定义<\/td><td>五条准则首次给出<\/td><\/tr><tr><td>1.1 末<\/td><td>算法分析<\/td><td>可行性之上再加「代价要合理」<\/td><\/tr><tr><td>全书的算法描述<\/td><td>记号约定<\/td><td>每步用字母加编号，便于引用与证明<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">渐近记号与大 O<\/a>\n<\/ul>", "c02": "<h1>渐近记号与大 O<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>大 O 记号描述一个函数的增长速度上界：f(n) = O(g(n)) 表示 n 足够大时，f 的增长不会超过 g 的某个常数倍。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是比较算法的通用语言。两个排序算法，一个 O(n²) 一个 O(n log n)，在 n 很大时的高下不用实测就能判断。没有这套记号，算法分析只能停在「跑起来试试」。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[原始表达式] --&gt; B[按次数排序]\n    B --&gt; C[只留最高次项]\n    C --&gt; D[去掉常数系数]\n    D --&gt; E[得到 O 形式]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图是一条单向流水线：每一步都丢掉不影响趋势的信息。<\/p>\n<h2>详解<\/h2>\n<p>严格定义：存在正常数 c 与 n₀，使所有 n ≥ n₀ 都有 f(n) ≤ c·g(n)。<\/p>\n<p><strong>为什么可以只留最高次项<\/strong>：以 3n² + 5n + 7 为例，取 n₀ = 1，则 5n ≤ 5n²、7 ≤ 7n²，于是整体 ≤ 15n²，c = 15 就满足定义。<\/p>\n<p><strong>常见阶的关系<\/strong>：O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n³) &lt; O(2^n)。<\/p>\n<p><strong>实例<\/strong>：n = 1000 时，log2 n 约 10，n log2 n 约 10000，n² 是 100 万。三者差了五个数量级，这就是为什么 O(n²) 排序在百万级数据上不可用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别把 O 当成「大约等于」，它是上界，不是等号。\n<\/li><li>\n别以为 O 越小一定越快，小 n 时常数项可能翻盘。\n<\/li><li>\n别把 O 和 Θ 混为一谈，Θ 要求上下界同时成立。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.2.11<\/td><td>引入<\/td><td>大 O 与欧拉求和<\/td><\/tr><tr><td>1.2.11.3<\/td><td>渐近计算<\/td><td>常用展开式<\/td><\/tr><tr><td>后续各卷<\/td><td>算法分析<\/td><td>每次给出复杂度都用这套记号<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">算法五准则<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">生成函数<\/a>\n<\/ul>", "c03": "<h1>生成函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>生成函数把一整条数列打包成一个关于 z 的级数：G(z) = a0 + a1z + a2z² + …，数列的第 n 项就是 z^n 的系数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是解递推式的标准工具。算法分析里大量出现「a(n) 等于前几项的组合」，直接求通项很难；转成生成函数后，递推变成一个代数方程，解方程比猜通项可靠。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    R[递推关系] --&gt; M[两边乘 z 的 n 次方再求和]\n    M --&gt; G[得到 G 的代数方程]\n    G --&gt; S[解出 G]\n    S --&gt; X[展开成幂级数]\n    X --&gt; T[第 n 项系数就是通项]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图的重点是中间那一步：递推为什么会变成方程，因为「n 变成 n−1」在幂级数里就是「乘一个 z」。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n常数数列 1, 1, 1, …：G(z) = 1/(1−z)。\n<\/li><li>\n自然数列 0, 1, 2, 3, …：G(z) = z/(1−z)²。\n<\/li><li>\n斐波那契：F(n) = F(n−1) + F(n−2)，可得 G(z) = z/(1 − z − z²)，再分解部分分式就能读出 φ^n 的主项。\n<\/ul>\n<p><strong>完整实例<\/strong>：a(n) = a(n−1) + 1，a(0) = 0。 设 G = Σa(n)z^n。对 n ≥ 1 求和：G − a(0) = zG + z/(1−z)。 代入 a(0) = 0：G = zG + z/(1−z)，即 G(1−z) = z/(1−z)，G = z/(1−z)²。 展开得 a(n) = n。代 n = 3 核对：数列 0, 1, 2, 3，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为生成函数要求级数收敛才能用——形式幂级数不关心收敛，只关心系数。\n<\/li><li>\n别把 z 当成一个具体的数——它只是「位置标记」，用来区分第几项。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.2.9<\/td><td>引入<\/td><td>生成函数的定义与基本运算<\/td><\/tr><tr><td>1.2.10<\/td><td>典型分析<\/td><td>用生成函数解递推<\/td><\/tr><tr><td>卷3 排序分析<\/td><td>平均情况<\/td><td>排列计数用指数生成函数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">渐近记号与大 O<\/a>\n<\/li><li>\n后续：卷3 的排序代价分析\n<\/ul>", "c04": "<h1>栈、队列与链接分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>栈和队列是「只允许在固定端点操作」的线性表；链接分配是让每个节点自带下一个节点地址的存储方式，节点不必相邻。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两件事合起来回答了「数据放在哪、怎么动」。栈是递归与表达式求值的底层结构，队列是广度优先搜索的底层结构，链接分配则是所有动态数据结构的起点——树、图、散列表的节点都靠它串起来。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    S[栈 后进先出] --&gt; A[数组加 TOP]\n    Q[队列 先进先出] --&gt; B[循环数组]\n    L[链接分配] --&gt; C[节点 INFO 加 LINK]\n    C --&gt; D[插入 先接新链再改旧链]\n    C --&gt; E[删除 让前驱越过被删节点]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看两条路径的差别：数组靠下标定位，链表靠链定位；前者快在访问，后者快在插入删除。<\/p>\n<h2>详解<\/h2>\n<p><strong>栈<\/strong>：<code>TOP<\/code> 指向栈顶，入栈先判满再 <code>TOP+1<\/code>，出栈先判空再 <code>TOP−1<\/code>。 <strong>队列<\/strong>：循环数组，<code>front<\/code> 指队首、<code>rear<\/code> 指队尾，判满用 <code>(rear+1) mod m = front<\/code>。 <strong>链接分配<\/strong>：<\/p>\n<ul><li>\n在 P 后插入 Q：<code>Q.LINK = P.LINK<\/code>，然后 <code>P.LINK = Q<\/code>。\n<\/li><li>\n删除 P 后的 Q：<code>P.LINK = Q.LINK<\/code>，再释放 Q。\n<\/ul>\n<p><strong>实例<\/strong>：链 A→B→C，在 A 后插入 X。先 <code>X.LINK = A.LINK<\/code>（X 指向 B），再 <code>A.LINK = X<\/code>，得 A→X→B→C。若顺序颠倒，B 的地址丢失，链断。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为链表插入永远 O(1)——按位置查找那一步是 O(n)。\n<\/li><li>\n别以为数组做队列只要两个下标——不循环就会假溢出。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.2.1<\/td><td>栈与队列<\/td><td>端点的限制决定行为<\/td><\/tr><tr><td>2.2.2<\/td><td>顺序分配<\/td><td>溢出与假溢出<\/td><\/tr><tr><td>2.2.3<\/td><td>链接分配<\/td><td>指针三步操作<\/td><\/tr><tr><td>2.2.4–2.2.5<\/td><td>循环与双链<\/td><td>用额外链换操作便利<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">算法五准则<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">二叉树遍历<\/a>\n<\/ul>", "c05": "<h1>二叉树遍历<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>遍历是按固定次序访问树中每个节点恰好一次；先序、中序、后序的区别只在「什么时候访问根」。<\/p>\n<h2>为什么重要<\/h2>\n<p>树的很多操作都必须先遍历：统计节点数、复制一棵树、释放整棵树、把树表达式还原成中缀式。遍历顺序选错，结果就错——例如释放节点必须用后序，否则先释放了父节点就找不到子节点。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    R[根] --&gt; V{何时访问根}\n    V -- 最先 --&gt; P[先序 根 左 右]\n    V -- 中间 --&gt; I[中序 左 根 右]\n    V -- 最后 --&gt; O[后序 左 右 根]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图只需盯住根的三个位置：前、中、后，序列自然就出来了。<\/p>\n<h2>详解<\/h2>\n<p>示例树：<\/p>\n<pre><code>        A\n       / \\\n      B   C\n     / \\   \\\n    D   E   F<\/code><\/pre>\n<ul><li>\n先序 A、B、D、E、C、F\n<\/li><li>\n中序 D、B、E、A、C、F\n<\/li><li>\n后序 D、E、B、F、C、A\n<\/ul>\n<p><strong>复核方法<\/strong>：先序首项 = 后序末项 = 根 A。在中序里找到 A，左边三个是左子树，右边两个是右子树。递归套用，三者互相验证。<\/p>\n<p><strong>中序的特殊用途<\/strong>：在二叉搜索树里，中序遍历得到升序序列。这也是「搜索树有序」这句话的准确含义。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为只给中序就能重建树——必须再给先序或后序之一。\n<\/li><li>\n别以为三种遍历只是「输出顺序不同」——它们的用途完全不同：先序用于复制，中序用于排序输出，后序用于释放。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.3.1<\/td><td>遍历<\/td><td>三序定义与递归实现<\/td><\/tr><tr><td>2.3.2<\/td><td>二叉树表示<\/td><td>遍历依赖 LCHILD 与 RCHILD<\/td><\/tr><tr><td>2.3.4<\/td><td>数学性质<\/td><td>路径长度与遍历深度相关<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">栈、队列与链接分配<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">动态存储分配<\/a>\n<\/ul>", "c06": "<h1>动态存储分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>动态存储分配是程序运行期间按需从内存池切出、并在用完后归还大小不一的块的过程。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有动态数据结构都依赖它。链表每插入一个节点就要申请一块，删除就要归还。分配策略选错，会出现「明明还有空间却申请不到」的碎片问题；回收策略选错，会泄漏或长时间暂停。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n    A[申请 size] --&gt; B{策略}\n    B -- 首次适配 --&gt; C[从头找第一个够大的块]\n    B -- 最佳适配 --&gt; D[找够大的块里最小的]\n    B -- 伙伴系统 --&gt; E[按 2 的幂切分]\n    C --&gt; F[切下所需 余下留作空闲]\n    D --&gt; F\n    E --&gt; G[只与同尺寸伙伴合并]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图注意：三种策略的差别不在「能不能分」，而在「分完剩下的碎片长什么样」。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>首次适配<\/strong>：扫描到第一个够大的块就切。快，但低地址容易积累小碎片。\n<\/li><li>\n<strong>最佳适配<\/strong>：找最小的够大块。剩余碎片最小，但要扫全表。\n<\/li><li>\n<strong>边界标记<\/strong>：每个块的头部与尾部各存块大小。释放时检查物理相邻的下一个块是否空闲，是则合并。没有尾部标记，就无法 O(1) 找到前一个块。\n<\/li><li>\n<strong>伙伴系统<\/strong>：容量按 2 的幂。申请 5 得 8；释放时只与地址异或得到的「伙伴」合并。\n<\/ul>\n<p><strong>实例（伙伴系统）<\/strong>：容量 16，申请 5。16 切成 8+8，取左 8；8 切成 4+4，4 不够，退回用 8。返回地址 0、长度 8。释放后若地址 8 空闲，合并回 16。<\/p>\n<p><strong>碎片为什么不可避免<\/strong>：申请与释放的顺序不可预知，空闲块会被已分配的块隔开，即使总空闲量够，也未必有一块连续空间够大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「总空闲空间够」就能分配成功——必须有一块连续空间够大。\n<\/li><li>\n别以为最佳适配一定最省——它留下的碎片太小，往往无法再用，反而更差。\n<\/li><li>\n别以为边界标记只是为了调试——它是 O(1) 合并相邻块的前提。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.5<\/td><td>动态存储分配<\/td><td>首次适配与最佳适配<\/td><\/tr><tr><td>2.5 后半<\/td><td>边界标记<\/td><td>双向合并<\/td><\/tr><tr><td>习题<\/td><td>伙伴系统<\/td><td>按 2 的幂切分与合并<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">二叉树遍历<\/a>\n<\/li><li>\n后续：卷3 外部排序的缓冲区管理\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先弄懂「算法」这两个字<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：算法是什么，怎么衡量它<\/a><br>检查点：能对任意流程判定是否满足五条准则，并手算 gcd(119, 544)<\/li><li class='path-step' id='path-02'><strong>步骤 02：补齐分析算法的数学<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：分析算法要用的数学工具箱<\/a><br>检查点：能独立证明 1+2+…+n 的求和公式，写出 F10 与 H10 的数值<\/li><li class='path-step' id='path-03'><strong>步骤 03：看懂机器层的算法<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：MIX 与基本程序设计技术<\/a><br>检查点：能解释 MIX 的字结构、子程序如何靠链接字返回、解释程序的三段循环<\/li><li class='path-step' id='path-04'><strong>步骤 04：线性表：栈、队列与链接<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：线性表<\/a><br>检查点：能画出链表插入删除的指针变化，说清循环链表与双链表各解决了什么问题<\/li><li class='path-step' id='path-05'><strong>步骤 05：树与存储管理<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：树、多链结构与动态存储<\/a><br>检查点：能写出三种遍历序列，算对扩充二叉树的 E 与 I，解释标记-清扫与伙伴系统<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q16.<\/b> 综合题：要给一个稀疏矩阵同时支持「按行找非零项」与「按列找非零项」，最合适的结构是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 开满二维数组<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 单链表<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 十字正交表或多链结构<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 栈<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：算法是什么，怎么衡量它<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一条不属于算法的五条准则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input typ 'radio' name='q05' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 3<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> H4 = 1 + 1/2 + 1/3 + 1/4 约等于多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 2.083<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 1.963<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 5.187<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 1.386<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：MIX 与基本程序设计技术<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> MIX 的一个字节取值范围是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 0 到 63<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 0 到 255<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> −32 到 31<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 0 到 4095<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> MIX 子程序返回时，返回地址通常存在哪个寄存器？（填寄存器名）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 协同程序与子程序最本质的区别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 协同程序更快<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 协同程序从上次停下的地方继续，地位平等<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 协同程序不能用 J 寄存器<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 协同程序必须有栈<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：线性表<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 依次入栈 1、2、3、4，再连续出栈两次，得到的两个数是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 1、2<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 4、3<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 3、4<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 2、1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 在单链表中删除 P 之后的节点 Q，第一步应做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 释放 Q<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> P.LINK = Q.LINK<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> Q.LINK = P.LINK<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> P.LINK = Q<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 用长度为 m 的循环数组实现队列，判断队满的条件是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> (rear+1) mod m = front<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> front = rear<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> rear = m − 1<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> front = 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：树、多链结构与动态存储<\/h1><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 一棵有 10 个节点的树有多少条边？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 9<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 10<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 11<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 取决于形状<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> n = 4 的扩充二叉树，若内部路径长度 I = 6，外部路径长度 E 是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 引用计数为什么回收不了互相指向的两个节点？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 因为两个节点太大<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 因为计数都来自对方，永不归零<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 因为没有根节点<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 因为标记位丢失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法'>算法 — 满足有限性、确定性、输入、输出、可行性的有限计算过程。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='确定性'>确定性 — 每一步的动作唯一确定，不依赖执行者的常识或临时判断。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='算法分析'>算法分析 — 确定一个算法在各类输入上要执行多少次基本操作。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='大 o 记号'>大 O 记号 — 描述增长速度的上界，表示 f 增长不快于某个参照函数。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='数学归纳法'>数学归纳法 — 先验证起点，再由 n 成立推出 n+1 成立的证明方法。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='二项式系数'>二项式系数 — 从 n 个对象中选 k 个的方案数，记作 C(n, k)。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='调和数'>调和数 — 1 到 n 的倒数之和，增长极慢，约等于 ln n 加常数。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='斐波那契数'>斐波那契数 — 每项等于前两项之和的数列，按约 1.618 的比例指数增长。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='生成函数'>生成函数 — 把数列的每一项挂到 z 的各次幂上得到的多项式或级数。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='mix'>MIX — 高德纳设计的虚构计算机，用来把算法写成可执行的机器指令。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='子程序'>子程序 — 可被反复调用的一段程序，调用点与返回点靠链接信息对接。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='协同程序'>协同程序 — 彼此平等、可以互相跳转而不形成调用栈的两段程序。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='解释程序'>解释程序 — 逐条读取、译码并执行另一台机器指令的程序。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='栈'>栈 — 只在一端插入和删除的线性表，后进先出。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='队列'>队列 — 一端插入、另一端删除的线性表，先进先出。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='链接分配'>链接分配 — 每个节点自带指向下一个节点的链，节点在内存中不必相邻。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='循环链表'>循环链表 — 尾节点指回头节点的链表，用一个指针就能走到任意节点。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='双链表'>双链表 — 每个节点同时保存前驱与后继地址的链表，删除时无需再找前驱。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='正交表'>正交表 — 用行号、列号、值三元组表示稀疏二维表的存储方式。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='二叉树'>二叉树 — 每个节点最多有两个有序子节点的树。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='遍历'>遍历 — 按某种固定次序访问树中每个节点恰好一次。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='扩充二叉树'>扩充二叉树 — 把二叉树的所有空链换成方形外部节点后得到的树。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='垃圾回收'>垃圾回收 — 自动找出程序中再也访问不到的表节点并回收其空间。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='动态存储分配'>动态存储分配 — 程序运行期间按需从内存池切出与归还大小不一的块。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='边界标记'>边界标记 — 在每个存储块两端记录块大小，使相邻空闲块能迅速合并。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='伙伴系统'>伙伴系统 — 按 2 的幂大小切分内存，回收时只合并同尺寸的伙伴块。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='多链结构'>多链结构 — 一个节点同时挂在多条链上的结构，用来表示稀疏矩阵等关系。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：算法分析四步<\/h2>\n<ol><li>\n<strong>定基本操作<\/strong>：选一个在循环里反复出现、能代表代价的动作（比较、求余、赋值）。\n<\/li><li>\n<strong>定输入规模<\/strong>：写清 n 是什么，取值范围是什么。平均值必须连同取值范围一起说。\n<\/li><li>\n<strong>写代价函数<\/strong>：数出该操作在每类输入上的执行次数，得到 T(n)。\n<\/li><li>\n<strong>化简与比较<\/strong>：化成渐近形式，只留最高次项；再对不同算法在同一 n 上比较。\n<\/ol>\n<h2>决策规则：线性结构怎么选<\/h2>\n<ul><li>\n只在末端进出，后进先出 → 栈，用数组加一个 TOP 指针即可。\n<\/li><li>\n两端分工，先进先出 → 队列，注意用循环数组避免“假溢出”。\n<\/li><li>\n中间频繁插入删除 → 链表，代价是每个节点多一个链字段、访问要顺着走。\n<\/li><li>\n需要 O(1) 找到前驱 → 双链表；只需要首尾相接 → 循环链表。\n<\/li><li>\n二维表极稀疏 → 正交表（行、列、值三元组），不要开满二维数组。\n<\/ul>\n<h2>决策规则：存储管理怎么选<\/h2>\n<ul><li>\n块大小固定、要求快 → 伙伴系统，切分与合并都只跟二进制位打交道。\n<\/li><li>\n块大小差异大、要省空间 → 首次适配加边界标记，回收时与相邻空闲块合并。\n<\/li><li>\n存在大量共享节点、无法判断何时可删 → 标记-清扫，先标出可达节点再整体回收。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用“显然会停”代替终止性证明<\/strong>。正确做法是指出一个随每轮严格减小、又有下界的量（欧几里得算法里就是余数 r）。\n<\/li><li>\n<strong>把平均值当成与范围无关的常数<\/strong>。换一个取值范围，平均值就变了。\n<\/li><li>\n<strong>在链表上做按下标访问<\/strong>。链表没有随机访问能力，按下标访问是 O(n)，要频繁按下标取就换数组。\n<\/li><li>\n<strong>给每个节点都开满链字段<\/strong>。多链结构应按实际关系开链，稀疏矩阵更是要用正交表。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>常用求和与闭式<\/h2>\n<table><thead><tr><th>场景<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>1 + 2 + … + n<\/td><td>n(n+1)/2<\/td><\/tr><tr><td>1 + x + x² + … + x^n<\/td><td>(1 − x^(n+1))/(1 − x)，x ≠ 1<\/td><\/tr><tr><td>Σ C(n, k)，k 从 0 到 n<\/td><td>2^n<\/td><\/tr><tr><td>调和数 H_n<\/td><td>约等于 ln n + 0.5772<\/td><\/tr><tr><td>斐波那契 F(n)<\/td><td>约等于 φ^n / √5，φ = 1.618<\/td><\/tr><\/tbody><\/table>\n<h2>复杂度对照<\/h2>\n<table><thead><tr><th>增长阶<\/th><th>n = 1000 时的量级<\/th><th>典型来源<\/th><\/tr><\/thead><tbody><tr><td>O(1)<\/td><td>1<\/td><td>数组按下标取<\/td><\/tr><tr><td>O(log n)<\/td><td>约 10<\/td><td>折半查找、平衡树<\/td><\/tr><tr><td>O(n)<\/td><td>1000<\/td><td>顺序扫描、链表遍历<\/td><\/tr><tr><td>O(n log n)<\/td><td>约 10000<\/td><td>归并排序、堆排序<\/td><\/tr><tr><td>O(n²)<\/td><td>100 万<\/td><td>双重循环、朴素排序<\/td><\/tr><\/tbody><\/table>\n<h2>指针操作三步<\/h2>\n<table><thead><tr><th>操作<\/th><th>步骤<\/th><\/tr><\/thead><tbody><tr><td>在 P 之后插入 Q<\/td><td>Q.LINK = P.LINK；P.LINK = Q<\/td><\/tr><tr><td>删除 P 之后的 Q<\/td><td>P.LINK = Q.LINK；释放 Q<\/td><\/tr><tr><td>双链表删除 Q<\/td><td>Q.LLINK.RLINK = Q.RLINK；Q.RLINK.LLINK = Q.LLINK<\/td><\/tr><\/tbody><\/table>\n<h2>树的遍历口诀<\/h2>\n<table><thead><tr><th>遍历<\/th><th>访问根的时机<\/th><th>序列特征<\/th><\/tr><\/thead><tbody><tr><td>前序<\/td><td>先根，再左，再右<\/td><td>根排第一<\/td><\/tr><tr><td>中序<\/td><td>先左，再根，再右<\/td><td>排序树里得到升序<\/td><\/tr><tr><td>后序<\/td><td>先左，再右，再根<\/td><td>根排最后，适合释放节点<\/td><\/tr><\/tbody><\/table>\n<h2>扩充二叉树<\/h2>\n<ul><li>\n内部路径长度 I = 各内部节点深度之和。\n<\/li><li>\n外部路径长度 E = 各外部节点深度之和。\n<\/li><li>\n恒等式：E = I + 2n（n 为内部节点数）。\n<\/ul>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
