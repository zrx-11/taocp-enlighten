mlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">1 001</span></div></foreignObject></g></g><g transform=\"translate(237.0234375, 16.5)\" data-id=\"B2\" data-node=\"true\" id=\"flowchart-B2-471\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"53.859375\" y=\"-16.5\" x=\"-26.9296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-19.4296875, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"38.859375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">3 011</span></div></foreignObject></g></g><g transform=\"translate(341.4765625, 16.5)\" data-id=\"B3\" data-node=\"true\" id=\"flowchart-B3-472\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"55.046875\" y=\"-16.5\" x=\"-27.5234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-20.0234375, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"40.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">2 010</span></div></foreignObject></g></g><g transform=\"translate(445.9296875, 16.5)\" data-id=\"B4\" data-node=\"true\" id=\"flowchart-B4-474\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"53.859375\" y=\"-16.5\" x=\"-26.9296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-19.4296875, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"38.859375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">6 110</span></div></foreignObject></g></g><g transform=\"translate(549.1953125, 16.5)\" data-id=\"B5\" data-node=\"true\" id=\"flowchart-B5-475\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"52.671875\" y=\"-16.5\" x=\"-26.3359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-18.8359375, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"37.671875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">7 111</span></div></foreignObject></g></g><g transform=\"translate(653.0546875, 16.5)\" data-id=\"B6\" data-node=\"true\" id=\"flowchart-B6-476\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"55.046875\" y=\"-16.5\" x=\"-27.5234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-20.0234375, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"40.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">5 101</span></div></foreignObject></g></g><g transform=\"translate(758.1015625, 16.5)\" data-id=\"B7\" data-node=\"true\" id=\"flowchart-B7-477\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"55.046875\" y=\"-16.5\" x=\"-27.5234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-20.0234375, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"40.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">4 100</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看图：每一步只有一个位翻转，走完一圈回到起点也只差一位。<\/p>\n<h2>详解<\/h2>\n<p><strong>转换<\/strong>：g = b ⊕ (b &gt;&gt; 1)。 <strong>逆转换<\/strong>：从最高位开始，b 的最高位等于 g 的最高位；逐位往下，b(i) = b(i+1) ⊕ g(i)。<\/p>\n<p><strong>实例<\/strong>：b = 6（110），b&gt;&gt;1 = 011，g = 101（5）。<\/p>\n<p><strong>反射构造<\/strong>：n 位格雷码 = 0 前缀的 (n−1) 位格雷码 + 1 前缀的 (n−1) 位格雷码倒序。3 位得 000、001、011、010、110、111、101、100。<\/p>\n<p><strong>代价<\/strong>：生成下一个只需翻转一位，O(1)；总翻转次数约 2^n，摊还 O(1)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为格雷码是「另一种数值」：它只是编码序列，数值不变，写法变了。\n<\/li><li>\n别以为任意长度都能「相邻只差一位且首尾也差一位」：循环格雷码需要额外的构造（如平衡格雷码）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.2.1.1<\/td><td>生成 n 元组<\/td><td>二进制计数与格雷码<\/td><\/tr><tr><td>7.2.1.2<\/td><td>生成排列<\/td><td>相邻交换的思想来源<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">相邻交换生成<\/a>\n<\/ul>", "c02": "<h1>字典序与阶乘数系统<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>字典序按「第一个不同位置的大小」排序；阶乘数系统用「右边比它小的元素个数 × 阶乘权」给排列编号，使「第几个排列」可算。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「遍历所有排列」和「直接取第 k 个排列」统一起来：遍历用 next，随机访问用编号。密码学、组合测试、随机抽样都要用到。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 199.03125 482\" style=\"max-width: 199.03125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg37\"><style>#svg37{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg37 .error-icon{fill:#552222;}#svg37 .error-text{fill:#552222;stroke:#552222;}#svg37 .edge-thickness-normal{stroke-width:2px;}#svg37 .edge-thickness-thick{stroke-width:3.5px;}#svg37 .edge-pattern-solid{stroke-dasharray:0;}#svg37 .edge-pattern-dashed{stroke-dasharray:3;}#svg37 .edge-pattern-dotted{stroke-dasharray:2;}#svg37 .marker{fill:#333333;stroke:#333333;}#svg37 .marker.cross{stroke:#333333;}#svg37 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg37 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg37 .cluster-label text{fill:#333;}#svg37 .cluster-label span,#svg37 p{color:#333;}#svg37 .label text,#svg37 span,#svg37 p{fill:#333;color:#333;}#svg37 .node rect,#svg37 .node circle,#svg37 .node ellipse,#svg37 .node poly \"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(91.515625, 18)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-478\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"87.03125\" y=\"-18\" x=\"-43.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-36.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"72.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排列 2 3 1</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 104)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-479\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">逐位数右边比它小的</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 190)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-481\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"57.6875\" y=\"-18\" x=\"-28.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-21.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"42.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">1 和 1</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 276)\" data-id=\"W\" data-node=\"true\" id=\"flowchart-W-483\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"183.03125\" y=\"-18\" x=\"-91.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-84.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"168.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘 2 的阶乘 与 1 的阶乘</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 362)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-485\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"60.34375\" y=\"-18\" x=\"-30.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-22.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"45.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排名 3</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 448)\" data-id=\"N\" data-node=\"true\" id=\"flowchart-N-487\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127\" y=\"-18\" x=\"-63.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从排名还原排列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看这条链：排列 → 数字 → 排列，两个方向都可算。<\/p>\n<h2>详解<\/h2>\n<p><strong>next 四步<\/strong>：找最右升序对 i；找最右大于 a[i] 的 j；交换；反转 i 右侧。<\/p>\n<p><strong>排名公式<\/strong>：rank = Σ c(i)×(n−i)!，c(i) 是位置 i 右边比 a[i] 小的元素数。<\/p>\n<p><strong>实例<\/strong>：2 3 1 的排名 = 1×2! + 1×1! + 0 = 3（从 0 开始），是第四个排列。<\/p>\n<p><strong>还原<\/strong>：依次用 rank 除以 (n−1)!、(n−2)!…，商是「未用元素中的下标」。<\/p>\n<p><strong>边界<\/strong>：n ≤ 20 时 n! 还在 64 位范围内；再大就要用大整数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 next 要重排后缀：后缀递减，反转即可。\n<\/li><li>\n别以为排名从 1 开始：Knuth 的编号从 0 开始，差一位就会错开整个序列。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.2.1.2<\/td><td>生成排列<\/td><td>字典序 next 算法<\/td><\/tr><tr><td>7.2.1.2<\/td><td>排名<\/td><td>阶乘数系统<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">格雷码<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">相邻交换生成<\/a>\n<\/ul>", "c03": "<h1>相邻交换生成<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>相邻交换生成让每两个相邻排列只差一次元素交换；Heap 算法用恰好 n!−1 次交换走遍全部 n! 个排列。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「每个排列的生成代价」压到一次交换，且不需要额外空间。对需要逐状态处理、状态间差异要小的场景（如旅行商问题的局部搜索、排列编码的硬件测试）特别合适。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 289.8125 509\" style=\"max-width: 289.8125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg38\"><style>#svg38{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg38 .error-icon{fill:#552222;}#svg38 .error-text{fill:#552222;stroke:#552222;}#svg38 .edge-thickness-normal{stroke-width:2px;}#svg38 .edge-thickness-thick{stroke-width:3.5px;}#svg38 .edge-pattern-solid{stroke-dasharray:0;}#svg38 .edge-pattern-dashed{stroke-dasharray:3;}#svg38 .edge-pattern-dotted{stroke-dasharray:2;}#svg38 .marker{fill:#333333;stroke:#333333;}#svg38 .marker.cross{stroke:#333333;}#svg38 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg38 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg38 .cluster-label text{fill:#333;}#svg38 .cluster-label span,#svg38 p{color:#333;}#svg38 .label text,#svg38 span,#svg38 p{fill:#333;color:#333;}#svg38 .node rect,#svg38 .node circle,#svg38 .node display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">递归生成前 n 减一 个</span></div></foreignObject></g></g><g transform=\"translate(138.2421875, 234.5)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-491\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">交换哪两个</span></div></foreignObject></g></g><g transform=\"translate(57.2890625, 389)\" data-id=\"S1\" data-node=\"true\" id=\"flowchart-S1-493\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"114.578125\" y=\"-18\" x=\"-57.2890625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.7890625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"99.578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第 1 与第 n 个</span></div></foreignObject></g></g><g transform=\"translate(219.1953125, 389)\" data-id=\"S2\" data-node=\"true\" id=\"flowchart-S2-495\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"109.234375\" y=\"-18\" x=\"-54.6171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-47.1171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"94.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第 i 与第 n 个</span></div></foreignObject></g></g><g transform=\"translate(138.2421875, 475)\" data-id=\"R2\" data-node=\"true\" id=\"flowchart-R2-497\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">递归下一轮</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>图中的判断是 Heap 算法唯一「反直觉」的地方：奇偶决定交换对象。<\/p>\n<h2>详解<\/h2>\n<p><strong>结构<\/strong>：n = 1 输出唯一排列；n &gt; 1 时循环 i，每次递归生成前 n−1 个的排列，然后按奇偶交换。<\/p>\n<p><strong>交换次数<\/strong>：n!−1。理由：每次交换都产生一个新排列，而新排列总数是 n!−1。<\/p>\n<p><strong>实例（n=3）<\/strong>：123、213（递归 n=2）；交换 1 与 3 得 321，递归得 321、231；再交换 1 与 3 得 132，递归得 132、312。共 6 个，5 次交换。<\/p>\n<p><strong>与字典序的差别<\/strong>：字典序的相邻排列可能差多个位置；Heap 的相邻排列只差一次交换。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Heap 算法需要额外数组：它原地交换，空间 O(n) 只是递归栈。\n<\/li><li>\n别以为交换次数越少运行越快：递归调用与输出本身也有代价。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.2.1.2<\/td><td>生成排列<\/td><td>相邻交换与 Heap 算法<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">字典序与阶乘数系统<\/a>\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：生成所有 n 元组<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：生成所有 n 元组<\/a><br>检查点：能手写 3 位格雷码，说明它相对二进制计数的优势<\/li><li class='path-step' id='path-02'><strong>步骤 02：生成所有排列<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：生成所有排列<\/a><br>检查点：能用 next 算法从 1 2 3 走到 3 2 1，能算一个排列的排名<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 综合题：要随机取 10 个元素全排列中的第 500000 个，最直接的做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 用 next 算法走 500000 步<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 用阶乘数系统按排名直接还原<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 用 Heap 算法生成后取第 500000 个<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 随机洗牌直到命中<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：生成所有 n 元组<\/h1><div class='quiz-item' data-qid='q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 3 位二进制元组共有多少个？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 3 位格雷码序列的第五个（从 0 数）编码是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 010<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 110<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 111<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 100<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 格雷码相对普通二进制计数的主要优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 数值更小<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 相邻只差一位<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 位数更少<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 可以排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：生成所有排列<\/h1><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 1 2 3 的字典序下一个排列是什么？（写成三个数字，不加空格）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 4 个元素的圆排列有多少种？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 24<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Heap 算法生成 n 个元素的全排列，共做多少次交换？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> n<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> n!−1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> n!<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> n log n<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='n 元组'>n 元组 — 由 n 个位置组成、每个位置取一个值的序列，各位置独立。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='混合基'>混合基 — 每个位置有不同进制，例如小时与分钟。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='格雷码'>格雷码 — 相邻两个编码只差一位的编码序列。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='反射构造'>反射构造 — n 位格雷码由 n−1 位格雷码加 0 前缀与倒序加 1 前缀拼成。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='字典序'>字典序 — 按第一个不同位置的元素大小决定先后。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='阶乘数系统'>阶乘数系统 — 第 i 位权为 i! 的进位制，用来给排列编号。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='排名'>排名 — 一个排列在字典序中的序号，从 0 开始。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='相邻交换'>相邻交换 — 每次只交换相邻两个元素的生成方式。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='heap 算法'>Heap 算法 — 用 n!−1 次相邻交换生成全部排列的递归算法。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='圆排列'>圆排列 — 把首尾视为相邻的排列，种数为 (n−1)!。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：选一种生成方式<\/h2>\n<ol><li>\n<strong>只需要全部对象、不关心顺序<\/strong> → 二进制计数或递归，最简单。\n<\/li><li>\n<strong>相邻对象要尽量相似<\/strong> → 格雷码或相邻交换。\n<\/li><li>\n<strong>需要随机访问第 k 个对象<\/strong> → 阶乘数系统直接算排名与还原。\n<\/li><li>\n<strong>每位进制不同<\/strong> → 混合基计数。\n<\/ol>\n<h2>决策规则：判断「下一个」是否唯一<\/h2>\n<ul><li>\n字典序：下一个是「最右可增位加一、右侧重置为最小」。\n<\/li><li>\n格雷码：下一个是「翻转哪一位由当前步数的二进制决定」。\n<\/li><li>\n相邻交换：下一个是「按递归结构决定交换哪一对」。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用递归生成排列却不撤销交换<\/strong>：后续分支会基于错误状态。\n<\/li><li>\n<strong>格雷码与二进制码混用<\/strong>：转回普通二进制要异或前缀，忘了就全错。\n<\/li><li>\n<strong>用 n! 直接算排名<\/strong>：大 n 会溢出，要用阶乘数系统逐位算。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>n 元组<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>总数<\/td><td>k^n（每位 k 种取值）<\/td><\/tr><tr><td>二进制计数<\/td><td>从 0 到 2^n−1<\/td><\/tr><tr><td>格雷码<\/td><td>g = b ⊕ (b &gt;&gt; 1)<\/td><\/tr><tr><td>逆转换<\/td><td>b = g ⊕ (g &gt;&gt; 1) ⊕ (g &gt;&gt; 2) …<\/td><\/tr><\/tbody><\/table>\n<h2>排列<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>总数<\/td><td>n!<\/td><\/tr><tr><td>圆排列<\/td><td>(n−1)!<\/td><\/tr><tr><td>字典序下一个<\/td><td>找最右升序对、交换、反转右侧<\/td><\/tr><tr><td>排名<\/td><td>阶乘数系统逐位累加<\/td><\/tr><tr><td>Heap 算法交换次数<\/td><td>n! − 1<\/td><\/tr><\/tbody><\/table>\n<h2>3 位格雷码<\/h2>\n<p>000 → 001 → 011 → 010 → 110 → 111 → 101 → 100<\/p>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
