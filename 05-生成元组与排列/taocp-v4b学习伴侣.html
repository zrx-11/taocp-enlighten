tags": ["排列"]}, {"id": "f06", "chapterId": "ch02", "front": "Heap 算法做多少次交换？为什么？", "back": "n!−1 次；每次交换都产生一个新排列，新排列总数是 n!−1。", "tags": ["排列"]}, {"id": "f07", "chapterId": "ch02", "front": "圆排列与带重复元素排列的种数？", "back": "圆排列 (n−1)!；带重复 n!/(n1!n2!…)。", "tags": ["排列"]}]}, "pages": {"ch01": {"html": "<h1>第 1 章：生成所有 n 元组<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：卷4A 第 4 章；二进制\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 k 进制 n 位元组的总数，并用「里程表」方式逐一生成。\n<\/li><li>\n用 g = b ⊕ (b&gt;&gt;1) 把普通二进制转成格雷码，并说明反向转换。\n<\/li><li>\n解释格雷码为什么让「生成下一个」的代价摊还到常数。\n<\/li><li>\n处理每一位进制不同的混合基计数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>n 元组的生成本质就是<strong>计数器<\/strong>：每一位独立进位。全部技巧都围绕「怎样让每次进位只改一位」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：元组与计数（难度：基础）<\/h3>\n<p>n 元组是 n 个位置各取一个值的序列。若每位有 k 种取值，总数是 k^n。<\/p>\n<p><strong>实例<\/strong>：3 位二进制元组，k=2、n=3，共 8 个：000、001、010、011、100、101、110、111。<\/p>\n<p><strong>里程表方式<\/strong>：把最低位加一，满 k 进位到高位。汽车里程表就是这么工作的。<\/p>\n<p><strong>代价<\/strong>：单次「加一」平均摊还 O(1)。因为最低位每步都变、次低位每两步变一次、第 i 位每 k^i 步变一次，总变化次数是 n + n/k + n/k² + … &lt; 2n。<\/p>\n<h3>概念 2：格雷码（难度：进阶）<\/h3>\n<p>二进制计数有时一次要改多位（011 → 100 改了三位）。格雷码要求相邻只差一位。<\/p>\n<p><strong>3 位格雷码<\/strong>：000、001、011、010、110、111、101、100。<\/p>\n<p><strong>转换公式<\/strong>：g = b ⊕ (b &gt;&gt; 1)。也就是格雷码的第 i 位 = 二进制第 i 位与第 i+1 位的异或。<\/p>\n<p><strong>实例<\/strong>：b = 6（110）。b&gt;&gt;1 = 011，异或得 101 = 5。序列里第 6 个（从 0 数）正是 101 ✓。<\/p>\n<p><strong>反向转换<\/strong>：b 的最高位等于 g 的最高位；之后 b 的第 i 位 = b 的第 i+1 位 ⊕ g 的第 i 位。写成循环就是不断「异或右移」。<\/p>\n<p><strong>为什么省<\/strong>：相邻格雷码只差一位，生成时只需翻转一个元素，O(1)；而且这一位是哪一位可以直接从步数算出来。<\/p>\n<h3>概念 3：反射构造（难度：进阶）<\/h3>\n<p>不用公式也能生成：n 位格雷码由两部分拼成——<\/p>\n<ol><li>\nn−1 位格雷码，前面加 0；\n<\/li><li>\nn−1 位格雷码<strong>倒序<\/strong>，前面加 1。\n<\/ol>\n<p><strong>实例<\/strong>：1 位是 0、1；2 位是 00、01、11、10；3 位是 000、001、011、010、110、111、101、100 ✓。<\/p>\n<p><strong>为什么倒序<\/strong>：正序末尾是 0 开头的最大的一个，倒序开头是 1 开头的最大的一个，两者只差最高位，衔接处也只改一位。<\/p>\n<h3>概念 4：混合基（难度：进阶）<\/h3>\n<p>每一位的进制不同，例如时间：时（24）、分（60）、秒（60）。总数是各位进制之积。<\/p>\n<p><strong>实例<\/strong>：两位、第一位 3 种取值、第二位 4 种取值，共 12 个元组。生成时低位满 4 进一，高位满 3 归零。<\/p>\n<p><strong>用途<\/strong>：多维数组的下标展开、密码表遍历、参数组合枚举。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 324.453125 410.890625\" style=\"max-width: 324.453125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg34\"><style>#svg34{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg34 .error-icon{fill:#552222;}#svg34 .error-text{fill:#552222;stroke:#552222;}#svg34 .edge-thickness-normal{stroke-width:2px;}#svg34 .edge-thickness-thick{stroke-width:3.5px;}#svg34 .edge-pattern-solid{stroke-dasharray:0;}#svg34 .edge-pattern-dashed{stroke-dasharray:3;}#svg34 .edge-pattern-dotted{stroke-dasharray:2;}#svg34 .marker{fill:#333333;stroke:#333333;}#svg34 .marker.cross{stroke:#333333;}#svg34 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg34 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg34 .cluster-label text{fill:#333;}#svg34 .cluster-label span,#svg34 p{color:#333;}#svg34 .label text,#svg34 span,#svg34 p{fill:#333;color:#333;}#svg34 .node rect,#svg34 .node circle,#svg34 .node ellipse,#svg34 .node polygon,#svg34 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg34 .flowchart-label text{text-anchor:middle;}#svg34 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg34 .node .label{text-align:center;}#svg34 .node.clickable{cursor:pointer;}#svg34 .arrowheadPath{fill:#333333;}#svg34 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg34 .flowchart-link{stroke:#333333;fill:none;}#svg34 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg34 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg34 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg34 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg34 .cluster text{fill:#333;}#svg34 .cluster span,#svg34 p{color:#333;}#svg34 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg34 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg34 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 5 L 10 10 L 10 0 z\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"11\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-circleEnd\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"-1\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-circleStart\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg34_flowchart-cro 352.974C194.863,347.057,182.225,335.224,178.276,322.018C174.328,308.812,179.07,294.234,181.441,286.945L183.813,279.656\"></path><path marker-end=\"url(#svg34_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-O LE-S\" id=\"L-O-S-0\" d=\"M42.79,358.891L41.241,352.974C39.693,347.057,36.597,335.224,35.048,313.733C33.5,292.242,33.5,261.094,33.5,231.695C33.5,202.297,33.5,174.648,33.5,153.658C33.5,132.667,33.5,118.333,33.5,104C33.5,89.667,33.5,75.333,37.355,64.6C41.21,53.866,48.919,46.733,52.774,43.166L56.629,39.599\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g transform=\"translate(123.11328125, 323.390625)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">否</span></div></foreignObject></g></g><g transform=\"translate(240.7265625, 323.390625)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">是</span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(79.97265625, 18)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-443\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">当前元组</span></div></foreignObject></g></g><g transform=\"translate(198.7265625, 104)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-444\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">最低位加一</span></div></foreignObject></g></g><g transform=\"translate(198.7265625, 229.9453125)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-446\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-57.9453125,57.9453125)\" class=\"label-container\" points=\"57.9453125,0 115.890625,-57.9453125 57.9453125,-115.890625 0,-57.9453125\"></polygon><g transform=\"translate(-32.4453125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64.890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">满 k 了吗</span></div></foreignObject></g></g><g transform=\"translate(47.5, 376.890625)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-448\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">输出新元组</span></div></foreignObject></g></g><g transform=\"translate(226.7265625, 376.890625)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-450\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"163.453125\" y=\"-18\" x=\"-81.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-74.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"148.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">本位归零 进位到高位</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：进位可能连续发生，但摊还下来每次输出只改常数位。这就是「摊还 O(1)」的来源。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：n 元组生成像里程表，低位转一圈高位进一格；格雷码像一种特制的表，每转一格只有一个数字变化。\n<\/li><li>\n类比失效：里程表的数字是十进制，格雷码的「一位变化」是二进制位；十进制下不存在「相邻只改一个数字」的完整循环（除了一部分特殊构造）。\n<\/ul>\n<p><strong>实例（格雷码生成）<\/strong>：从 0 数到 7，用 g = b⊕(b&gt;&gt;1) 得 0、1、3、2、6、7、5、4，写成三位二进制就是 000、001、011、010、110、111、101、100，相邻确实只差一位。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为格雷码是「另一种二进制数」<\/strong>——实际上它只是一个编码序列，同一个数值在格雷码下写法不同。\n<\/li><li>\n<strong>别以为二进制计数每次只改一位<\/strong>——实际上 011 到 100 改了三位，这正是格雷码要解决的问题。\n<\/li><li>\n<strong>别以为混合基很少用<\/strong>——实际上多维数组、日期时间、参数组合都是混合基。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：3 位二进制元组共有多少个？（填数字）\n<p>（答案：8；解析：2^3 = 8，从 000 到 111。）<\/p>\n<\/ol>\n<ol><li>\n单选题：3 位格雷码序列的第五个（从 0 数）编码是？\n<p>A. 010 B. 110 C. 111 D. 100 （答案：B；解析：序列 000、001、011、010、110、111、101、100，第五个是 110。）<\/p>\n<\/ol>\n<ol><li>\n简答题：格雷码相对普通二进制计数，优势在哪？\n<p>（答案：相邻两个编码只差一位，生成下一个只需翻转一个元素，代价 O(1)，且硬件上不会出现多位同时跳变的毛刺。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nk 进制 n 位元组共 k^n 个，按里程表进位。\n<\/li><li>\n格雷码 g = b⊕(b&gt;&gt;1)，相邻只差一位。\n<\/li><li>\n反射构造：0 前缀正序 + 1 前缀倒序。\n<\/ul>", "kind": "chapter", "title": "第 1 章：生成所有 n 元组"}, "ch02": {"html": "<h1>第 2 章：生成所有排列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章；阶乘\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用字典序的 next 算法从 1 2 3 一路走到 3 2 1。\n<\/li><li>\n用阶乘数系统给任意排列算排名，也能从排名还原排列。\n<\/li><li>\n说清 Heap 算法为什么只用 n!−1 次交换。\n<\/li><li>\n区分全排列、圆排列、带重复元素的排列。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排列生成的两条主线是<strong>字典序<\/strong>（能排名、能随机访问）与<strong>相邻交换<\/strong>（每次改动最小）；两者的交点就是阶乘数系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：总数与字典序（难度：基础）<\/h3>\n<p>n 个不同元素有 n! 种排列。字典序按第一个不同位置的大小决定先后。<\/p>\n<p><strong>1 2 3 的六个排列<\/strong>：123、132、213、231、312、321。<\/p>\n<p><strong>next 算法<\/strong>（求字典序的下一个）：<\/p>\n<ol><li>\n从右往左找第一个「比右边小」的位置 i（即 a[i] &lt; a[i+1]）。\n<\/li><li>\n从右往左找第一个「比 a[i] 大」的位置 j。\n<\/li><li>\n交换 a[i] 与 a[j]。\n<\/li><li>\n把 i 右边的部分整体反转（原来递减，反转后递增）。\n<\/ol>\n<p><strong>实例<\/strong>：从 1 2 3 出发。<\/p>\n<ul><li>\ni = 2（2 &lt; 3），j = 3，交换得 1 3 2，右侧只有一个元素，反转不变 → 132 ✓。\n<\/li><li>\n从 1 3 2：i = 1（1 &lt; 3），j = 3（2 &gt; 1），交换得 2 3 1，反转右侧 3 1 得 1 3 → 231 ✓。\n<\/ul>\n<p><strong>为什么第 4 步是反转<\/strong>：i 右边原本是递减的（因为 i 是最右的升序对），反转后变成递增，正是字典序最小的后缀。<\/p>\n<h3>概念 2：阶乘数系统与排名（难度：进阶）<\/h3>\n<p>给排列编号，用「第 i 位有几个比它小的元素还在右边」作为该位的数字。<\/p>\n<p><strong>排名公式<\/strong>：rank = Σ c(i) × (n−i)!，其中 c(i) 是位置 i 右边比 a[i] 小的元素个数。<\/p>\n<p><strong>实例<\/strong>：排列 2 3 1。<\/p>\n<ul><li>\n位置 1 是 2，右边比它小的有 1，c=1，权 (3−1)! = 2 → 2\n<\/li><li>\n位置 2 是 3，右边比它小的有 1，c=1，权 (3−2)! = 1 → 1\n<\/li><li>\n位置 3 是 1，右边没有，c=0\n<\/li><li>\n排名 = 2 + 1 = 3（从 0 开始），即第 4 个，与 123、132、213、231 的顺序一致 ✓。\n<\/ul>\n<p><strong>反向<\/strong>：已知排名 r，从高位开始，第 i 位取「第 r / (n−i)! 个还没用过的元素」，余数继续。<\/p>\n<p><strong>为什么用阶乘数系统<\/strong>：它把「第几个排列」变成一个可计算的数，不需要从头数。n = 10 时 10! = 3,628,800，仍在整数范围内；n = 20 就超出 64 位。<\/p>\n<h3>概念 3：Heap 算法（难度：高难）<\/h3>\n<p>Heap 算法递归生成排列，只用相邻交换，总交换次数恰好 n!−1。<\/p>\n<p><strong>结构<\/strong>：<\/p>\n<ul><li>\nn = 1 时输出唯一排列。\n<\/li><li>\nn &gt; 1 时，对 i 从 1 到 n：先递归生成前 n−1 个元素的排列；若 n 为奇数，交换第 1 与第 n 个；若 n 为偶数，交换第 i 与第 n 个。\n<\/ul>\n<p><strong>为什么交换次数正好 n!−1<\/strong>：每输出一个新排列至少需要一次交换，而算法每次交换都产生一个新排列，所以交换次数等于「排列数减一」。<\/p>\n<p><strong>实例<\/strong>：n = 3。递归 n=2 输出 123、213；交换 1 与 3 得 321，递归输出 321、231；交换 1 与 3 得 132，递归输出 132、312。共 6 个，5 次交换 ✓。<\/p>\n<h3>概念 4：圆排列与重复元素（难度：进阶）<\/h3>\n<ul><li>\n<strong>圆排列<\/strong>：首尾相接，旋转视为同一种，种数为 (n−1)!。因为固定一个元素的位置后，其余 (n−1) 个随便排。\n<\/li><li>\n<strong>带重复元素<\/strong>：n 个元素中有重复组，种数为 n!/(n1!n2!…)。生成时要跳过重复分支，否则会输出重复排列。\n<\/ul>\n<p><strong>实例<\/strong>：A、A、B 的排列是 3!/2! = 3，即 AAB、ABA、BAA。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 385.796875 482\" style=\"max-width: 385.796875px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg35\"><style>#svg35{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg35 .error-icon{fill:#552222;}#svg35 .error-text{fill:#552222;stroke:#552222;}#svg35 .edge-thickness-normal{stroke-width:2px;}#svg35 .edge-thickness-thick{stroke-width:3.5px;}#svg35 .edge-pattern-solid{stroke-dasharray:0;}#svg35 .edge-pattern-dashed{stroke-dasharray:3;}#svg35 .edge-pattern-dotted{stroke-dasharray:2;}#svg35 .marker{fill:#333333;stroke:#333333;}#svg35 .marker.cross{stroke:#333333;}#svg35 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg35 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg35 .cluster-label text{fill:#333;}#svg35 .cluster-label span,#svg35 p{color:#333;}#svg35 .label text,#svg35 span,#svg35 p{fill:#333;color:#333;}#svg35 .node rect,#svg35 .node circle,#svg35 .node ellipse,#svg35 .node polygon,#svg35 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg35 .flowchart-label text{text-anchor:middle;}#svg35 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg35 .node .label{text-align:center;}#svg35 .node.clickable{cursor:pointer;}#svg35 .arrowheadPath{fill:#333333;}#svg35 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg35 .flowchart-link{stroke:#333333;fill:none;}#svg35 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg35 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg35 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg35 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg35 .cluster text{fill:#333;}#svg35 .cluster span,#svg35 p{color:#333;}#svg35 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg35 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg35 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg35_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg35_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 5 L 10 10 L 10 0 z\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" class=\"nodeLabel\">当前排列</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 104)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-456\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"167\" y=\"-18\" x=\"-83.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-76, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"152\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从右找第一个升序对 i</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 190)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-458\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"224.796875\" y=\"-18\" x=\"-112.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-104.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"209.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从右找第一个大于 a i 的位置 j</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 276)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-460\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"83.453125\" y=\"-18\" x=\"-41.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-34.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"68.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">交换 i 与 j</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 362)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-462\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"91.453125\" y=\"-18\" x=\"-45.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-38.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"76.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">反转 i 右侧</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 448)\" data-id=\"N\" data-node=\"true\" id=\"flowchart-N-464\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">得到字典序下一个</span></div></foreignObject></g></g><g transform=\"translate(322.296875, 104)\" data-id=\"K\" data-node=\"true\" id=\"flowchart-K-466\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">阶乘数系统</span></div></foreignObject></g></g><g transform=\"translate(322.296875, 190)\" data-id=\"ID\" data-node=\"true\" id=\"flowchart-ID-468\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排名与还原</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：左侧是「一步一步走」，右侧是「直接跳到第 k 个」。两条路都可行，选哪条取决于你要遍历还是要随机访问。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：字典序生成像翻字典，每次只改动尽量靠后的部分；阶乘数系统像给每个词编一个号码，不用翻就能直接跳到那一页。\n<\/li><li>\n类比失效：字典的编号是人为定的，排列的编号由阶乘权决定；n 一大，号码就超过整数范围。\n<\/ul>\n<p><strong>实例（还原排列）<\/strong>：n = 4，排名 5（从 0 开始），还原。<\/p>\n<ul><li>\n5 / 3! = 0 余 5，第 1 位取第 0 个未用元素 → 1\n<\/li><li>\n5 / 2! = 2 余 1，第 2 位取第 2 个未用元素（未用 2,3,4，第 2 个是 4）→ 4\n<\/li><li>\n1 / 1! = 1 余 0，第 3 位取第 1 个未用元素（未用 2,3，第 1 个是 3）→ 3\n<\/li><li>\n最后剩 2 → 2\n<p>排列为 1 4 3 2。核对：4 个元素排名 5，前五个是 1234、1243、1324、1342、1423，第六个是 1432 ✓。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 next 算法要重新排序后缀<\/strong>——实际上后缀原本递减，只需反转，O(n) 而不是 O(n log n)。\n<\/li><li>\n<strong>别以为 Heap 算法交换次数多<\/strong>——实际上恰好 n!−1 次，已经是最少。\n<\/li><li>\n<strong>别以为圆排列就是「少一个元素」<\/strong>——实际上它是把旋转视为等价，除以 n，得 (n−1)!。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：1 2 3 的字典序下一个排列是什么？（写成三个数字，不加空格）\n<p>（答案：132；解析：最右升序对是 2&lt;3，交换得 132，右侧单元素无需反转。）<\/p>\n<\/ol>\n<ol><li>\n单选题：4 个元素的圆排列有多少种？\n<p>A. 4 B. 6 C. 12 D. 24 （答案：B；解析：(4−1)! = 3! = 6，旋转视为同一种。）<\/p>\n<\/ol>\n<ol><li>\n简答题：Heap 算法生成 n 个元素的全排列，一共做多少次交换？\n<p>（答案：n!−1 次。每输出一个新排列至少一次交换，而算法每次交换都产生新排列，故交换次数等于排列数减一。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全排列 n!，圆排列 (n−1)!，带重复 n!/(n1!…)。\n<\/li><li>\nnext：找最右升序对、交换、反转后缀。\n<\/li><li>\n排名用阶乘数系统，n 一大就溢出。\n<\/ul>", "kind": "chapter", "title": "第 2 章：生成所有排列"}, "c01": {"html": "<h1>格雷码<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>格雷码是一种二进制编码序列，任意相邻两个编码只差一位；把普通二进制 b 转成格雷码用 g = b ⊕ (b&gt;&gt;1)。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「计数器每次可能改多位」变成「每次只改一位」。这既省生成代价，也避免硬件多位同时跳变产生的毛刺；在旋转编码器、卡诺图、状态机编码里都能见到。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 801.625 49\" style=\"max-width: 801.625px;\" xmlns=\"http://www.w3.org/ ansform=\"translate(-20.0234375, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"40.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">5 101</span></div></foreignObject></g></g><g transform=\"translate(758.1015625, 16.5)\" data-id=\"B7\" data-node=\"true\" id=\"flowchart-B7-477\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"55.046875\" y=\"-16.5\" x=\"-27.5234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-20.0234375, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"40.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">4 100</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看图：每一步只有一个位翻转，走完一圈回到起点也只差一位。<\/p>\n<h2>详解<\/h2>\n<p><strong>转换<\/strong>：g = b ⊕ (b &gt;&gt; 1)。 <strong>逆转换<\/strong>：从最高位开始，b 的最高位等于 g 的最高位；逐位往下，b(i) = b(i+1) ⊕ g(i)。<\/p>\n<p><strong>实例<\/strong>：b = 6（110），b&gt;&gt;1 = 011，g = 101（5）。<\/p>\n<p><strong>反射构造<\/strong>：n 位格雷码 = 0 前缀的 (n−1) 位格雷码 + 1 前缀的 (n−1) 位格雷码倒序。3 位得 000、001、011、010、110、111、101、100。<\/p>\n<p><strong>代价<\/strong>：生成下一个只需翻转一位，O(1)；总翻转次数约 2^n，摊还 O(1)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为格雷码是「另一种数值」：它只是编码序列，数值不变，写法变了。\n<\/li><li>\n别以为任意长度都能「相邻只差一位且首尾也差一位」：循环格雷码需要额外的构造（如平衡格雷码）。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.2.1.1<\/td><td>生成 n 元组<\/td><td>二进制计数与格雷码<\/td><\/tr><tr><td>7.2.1.2<\/td><td>生成排列<\/td><td>相邻交换的思想来源<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">相邻交换生成<\/a>\n<\/ul>", "kind": "concept", "title": "格雷码"}, "c02": {"html": "<h1>字典序与阶乘数系统<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>字典序按「第一个不同位置的大小」排序；阶乘数系统用「右边比它小的元素个数 × 阶乘权」给排列编号，使「第几个排列」可算。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「遍历所有排列」和「直接取第 k 个排列」统一起来：遍历用 next，随机访问用编号。密码学、组合测试、随机抽样都要用到。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 199.03125 482\" style=\"max-width: 199.03125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg37\"><style>#svg37{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg37 .error-icon{fill:#552222;}#svg37 .error-text{fill:#552222;stroke:#552222;}#svg37 .edge-thickness-normal{stroke-width:2px;}#svg37 .edge-thickness-thick{stroke-width:3.5px;}#svg37 .edge-pattern-solid{stroke-dasharray:0;}#svg37 .edge-pattern-dashed{stroke-dasharray:3;}#svg37 .edge-pattern-dotted{stroke-dasharray:2;}#svg37 .marker{fill:#333333;stroke:#333333;}#svg37 .marker.cross{stroke:#333333;}#svg37 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg37 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg37 .cluster-label text{fill:#333;}#svg37 .cluster-label span,#svg37 p{color:#333;}#svg37 .label text,#svg37 span,#svg37 p{fill:#333;color:#333;}#svg37 .node rect,#svg37 .node circle,#svg37 .node ellipse,#svg37 .node polygon,#svg37 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg37 .flowchart-label text{text-anchor:middle;}#svg37 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg37 .node .label{text-align:center;}#svg37 .node.clickable{cursor:pointer;}#svg37 .arrowheadPath{fill:#333333;}#svg37 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg37 .flowchart-link{stroke:#333333;fill:none;}#svg37 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg37 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg37 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg37 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg37 .cluster text{fill:#333;}#svg37 .c .516,418.133,91.516,421.417L91.516,424.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(91.515625, 18)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-478\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"87.03125\" y=\"-18\" x=\"-43.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-36.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"72.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排列 2 3 1</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 104)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-479\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">逐位数右边比它小的</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 190)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-481\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"57.6875\" y=\"-18\" x=\"-28.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-21.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"42.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">1 和 1</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 276)\" data-id=\"W\" data-node=\"true\" id=\"flowchart-W-483\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"183.03125\" y=\"-18\" x=\"-91.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-84.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"168.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘 2 的阶乘 与 1 的阶乘</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 362)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-485\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"60.34375\" y=\"-18\" x=\"-30.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-22.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"45.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排名 3</span></div></foreignObject></g></g><g transform=\"translate(91.515625, 448)\" data-id=\"N\" data-node=\"true\" id=\"flowchart-N-487\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127\" y=\"-18\" x=\"-63.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从排名还原排列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看这条链：排列 → 数字 → 排列，两个方向都可算。<\/p>\n<h2>详解<\/h2>\n<p><strong>next 四步<\/strong>：找最右升序对 i；找最右大于 a[i] 的 j；交换；反转 i 右侧。<\/p>\n<p><strong>排名公式<\/strong>：rank = Σ c(i)×(n−i)!，c(i) 是位置 i 右边比 a[i] 小的元素数。<\/p>\n<p><strong>实例<\/strong>：2 3 1 的排名 = 1×2! + 1×1! + 0 = 3（从 0 开始），是第四个排列。<\/p>\n<p><strong>还原<\/strong>：依次用 rank 除以 (n−1)!、(n−2)!…，商是「未用元素中的下标」。<\/p>\n<p><strong>边界<\/strong>：n ≤ 20 时 n! 还在 64 位范围内；再大就要用大整数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 next 要重排后缀：后缀递减，反转即可。\n<\/li><li>\n别以为排名从 1 开始：Knuth 的编号从 0 开始，差一位就会错开整个序列。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.2.1.2<\/td><td>生成排列<\/td><td>字典序 next 算法<\/td><\/tr><tr><td>7.2.1.2<\/td><td>排名<\/td><td>阶乘数系统<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">格雷码<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">相邻交换生成<\/a>\n<\/ul>", "kind": "concept", "title": "字典序与阶乘数系统"}, "c03": {"html": "<h1>相邻交换生成<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>相邻交换生成让每两个相邻排列只差一次元素交换；Heap 算法用恰好 n!−1 次交换走遍全部 n! 个排列。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「每个排列的生成代价」压到一次交换，且不需要额外空间。对需要逐状态处理、状态间差异要小的场景（如旅行商问题的局部搜索、排列编码的硬件测试）特别合适。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 289.8125 509\" style=\"max-width: 289.8125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg38\"><style>#svg38{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg38 .error-icon{fill:#552222;}#svg38 .error-text{fill:#552222;stroke:#552222;}#svg38 .edge-thickness-normal{stroke-width:2px;}#svg38 .edge-thickness-thick{stroke-width:3.5px;}#svg38 .edge-pattern-solid{stroke-dasharray:0;}#svg38 .edge-pattern-dashed{stroke-dasharray:3;}#svg38 .edge-pattern-dotted{stroke-dasharray:2;}#svg38 .marker{fill:#333333;stroke:#333333;}#svg38 .marker.cross{stroke:#333333;}#svg38 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg38 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg38 .cluster-label text{fill:#333;}#svg38 .cluster-label span,#svg38 p{color:#333;}#svg38 .label text,#svg38 span,#svg38 p{fill:#333;color:#333;}#svg38 .node rect,#svg38 .node circle,#svg38 .node ellipse,#svg38 .node polygon,#svg38 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg38 .flowchart-label text{text-anchor:middle;}#svg38 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg38 .node .label{text-align:center;}#svg38 .node.clickable{cursor:pointer;}#svg38 .arrowheadPath{fill:#333333;}#svg38 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg38 .flowchart-link{stroke:#333333;fill:none;}#svg38 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg38 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg38 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg38 .cluster rect{fill:#ffff LS-S1 LE-R2\" id=\"L-S1-R2-0\" d=\"M57.289,407L57.289,411.167C57.289,415.333,57.289,423.667,64.353,431.586C71.417,439.505,85.546,447.009,92.61,450.761L99.674,454.514\"></path><path marker-end=\"url(#svg38_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-S2 LE-R2\" id=\"L-S2-R2-0\" d=\"M219.195,407L219.195,411.167C219.195,415.333,219.195,423.667,212.131,431.586C205.067,439.505,190.939,447.009,183.874,450.761L176.81,454.514\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g transform=\"translate(57.2890625, 335.5)\" class=\"edgeLabel\"><g transform=\"translate(-30.671875, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"61.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">n 为奇数</span></div></foreignObject></g></g><g transform=\"translate(219.1953125, 335.5)\" class=\"edgeLabel\"><g transform=\"translate(-30.671875, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"61.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">n 为偶数</span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(138.2421875, 16.5)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-488\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"66.59375\" y=\"-16.5\" x=\"-33.296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-25.796875, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"51.59375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Heap n</span></div></foreignObject></g></g><g transform=\"translate(138.2421875, 101)\" data-id=\"R1\" data-node=\"true\" id=\"flowchart-R1-489\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"165.234375\" y=\"-18\" x=\"-82.6171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-75.1171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"150.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">递归生成前 n 减一 个</span></div></foreignObject></g></g><g transform=\"translate(138.2421875, 234.5)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-491\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">交换哪两个</span></div></foreignObject></g></g><g transform=\"translate(57.2890625, 389)\" data-id=\"S1\" data-node=\"true\" id=\"flowchart-S1-493\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"114.578125\" y=\"-18\" x=\"-57.2890625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.7890625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"99.578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第 1 与第 n 个</span></div></foreignObject></g></g><g transform=\"translate(219.1953125, 389)\" data-id=\"S2\" data-node=\"true\" id=\"flowchart-S2-495\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"109.234375\" y=\"-18\" x=\"-54.6171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-47.1171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"94.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第 i 与第 n 个</span></div></foreignObject></g></g><g transform=\"translate(138.2421875, 475)\" data-id=\"R2\" data-node=\"true\" id=\"flowchart-R2-497\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">递归下一轮</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>图中的判断是 Heap 算法唯一「反直觉」的地方：奇偶决定交换对象。<\/p>\n<h2>详解<\/h2>\n<p><strong>结构<\/strong>：n = 1 输出唯一排列；n &gt; 1 时循环 i，每次递归生成前 n−1 个的排列，然后按奇偶交换。<\/p>\n<p><strong>交换次数<\/strong>：n!−1。理由：每次交换都产生一个新排列，而新排列总数是 n!−1。<\/p>\n<p><strong>实例（n=3）<\/strong>：123、213（递归 n=2）；交换 1 与 3 得 321，递归得 321、231；再交换 1 与 3 得 132，递归得 132、312。共 6 个，5 次交换。<\/p>\n<p><strong>与字典序的差别<\/strong>：字典序的相邻排列可能差多个位置；Heap 的相邻排列只差一次交换。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Heap 算法需要额外数组：它原地交换，空间 O(n) 只是递归栈。\n<\/li><li>\n别以为交换次数越少运行越快：递归调用与输出本身也有代价。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.2.1.2<\/td><td>生成排列<\/td><td>相邻交换与 Heap 算法<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">字典序与阶乘数系统<\/a>\n<\/ul>", "kind": "concept", "title": "相邻交换生成"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：生成所有 n 元组<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：生成所有 n 元组<\/a><br>检查点：能手写 3 位格雷码，说明它相对二进制计数的优势<\/li><li class='path-step' id='path-02'><strong>步骤 02：生成所有排列<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：生成所有排列<\/a><br>检查点：能用 next 算法从 1 2 3 走到 3 2 1，能算一个排列的排名<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q7.<\/b> 综合题：要随机取 10 个元素全排列中的第 500000 个，最直接的做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 用 next 算法走 500000 步<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 用阶乘数系统按排名直接还原<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 用 Heap 算法生成后取第 500000 个<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 随机洗牌直到命中<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：生成所有 n 元组<\/h1><div class='quiz-item' data-qid='q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 3 位二进制元组共有多少个？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 3 位格雷码序列的第五个（从 0 数）编码是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 010<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 110<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 111<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 100<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 格雷码相对普通二进制计数的主要优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 数值更小<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 相邻只差一位<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 位数更少<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 可以排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：生成所有排列<\/h1><div class='quiz-item' data-qid='q04' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 1 2 3 的字典序下一个排列是什么？（写成三个数字，不加空格）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 4 个元素的圆排列有多少种？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 24<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Heap 算法生成 n 个元素的全排列，共做多少次交换？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> n<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> n!−1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> n!<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> n log n<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='n 元组'>n 元组 — 由 n 个位置组成、每个位置取一个值的序列，各位置独立。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='混合基'>混合基 — 每个位置有不同进制，例如小时与分钟。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='格雷码'>格雷码 — 相邻两个编码只差一位的编码序列。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='反射构造'>反射构造 — n 位格雷码由 n−1 位格雷码加 0 前缀与倒序加 1 前缀拼成。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='字典序'>字典序 — 按第一个不同位置的元素大小决定先后。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='阶乘数系统'>阶乘数系统 — 第 i 位权为 i! 的进位制，用来给排列编号。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='排名'>排名 — 一个排列在字典序中的序号，从 0 开始。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='相邻交换'>相邻交换 — 每次只交换相邻两个元素的生成方式。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='heap 算法'>Heap 算法 — 用 n!−1 次相邻交换生成全部排列的递归算法。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='圆排列'>圆排列 — 把首尾视为相邻的排列，种数为 (n−1)!。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：选一种生成方式<\/h2>\n<ol><li>\n<strong>只需要全部对象、不关心顺序<\/strong> → 二进制计数或递归，最简单。\n<\/li><li>\n<strong>相邻对象要尽量相似<\/strong> → 格雷码或相邻交换。\n<\/li><li>\n<strong>需要随机访问第 k 个对象<\/strong> → 阶乘数系统直接算排名与还原。\n<\/li><li>\n<strong>每位进制不同<\/strong> → 混合基计数。\n<\/ol>\n<h2>决策规则：判断「下一个」是否唯一<\/h2>\n<ul><li>\n字典序：下一个是「最右可增位加一、右侧重置为最小」。\n<\/li><li>\n格雷码：下一个是「翻转哪一位由当前步数的二进制决定」。\n<\/li><li>\n相邻交换：下一个是「按递归结构决定交换哪一对」。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用递归生成排列却不撤销交换<\/strong>：后续分支会基于错误状态。\n<\/li><li>\n<strong>格雷码与二进制码混用<\/strong>：转回普通二进制要异或前缀，忘了就全错。\n<\/li><li>\n<strong>用 n! 直接算排名<\/strong>：大 n 会溢出，要用阶乘数系统逐位算。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>n 元组<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>总数<\/td><td>k^n（每位 k 种取值）<\/td><\/tr><tr><td>二进制计数<\/td><td>从 0 到 2^n−1<\/td><\/tr><tr><td>格雷码<\/td><td>g = b ⊕ (b &gt;&gt; 1)<\/td><\/tr><tr><td>逆转换<\/td><td>b = g ⊕ (g &gt;&gt; 1) ⊕ (g &gt;&gt; 2) …<\/td><\/tr><\/tbody><\/table>\n<h2>排列<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>总数<\/td><td>n!<\/td><\/tr><tr><td>圆排列<\/td><td>(n−1)!<\/td><\/tr><tr><td>字典序下一个<\/td><td>找最右升序对、交换、反转右侧<\/td><\/tr><tr><td>排名<\/td><td>阶乘数系统逐位累加<\/td><\/tr><tr><td>Heap 算法交换次数<\/td><td>n! − 1<\/td><\/tr><\/tbody><\/table>\n<h2>3 位格雷码<\/h2>\n<p>000 → 001 → 011 → 010 → 110 → 111 → 101 → 100<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38451429127636482/TAOCP点化学习系统/05-生成元组与排列", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：生成所有 n 元组", "href": "#/chapter/ch01"}, {"label": "第 2 章：生成所有排列", "href": "#/chapter/ch02"}]}, {"label": "概念", "children": [{"label": "格雷码", "href": "#/concept/c01"}, {"label": "字典序与阶乘数系统", "href": "#/concept/c02"}, {"label": "相邻交换生成", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：生成所有 n 元组", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：生成所有排列", "href": "#/quiz/ch02"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：生成所有 n 元组<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：卷4A 第 4 章；二进制\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 k 进制 n 位元组的总数，并用「里程表」方式逐一生成。\n<\/li><li>\n用 g = b ⊕ (b&gt;&gt;1) 把普通二进制转成格雷码，并说明反向转换。\n<\/li><li>\n解释格雷码为什么让「生成下一个」的代价摊还到常数。\n<\/li><li>\n处理每一位进制不同的混合基计数。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>n 元组的生成本质就是<strong>计数器<\/strong>：每一位独立进位。全部技巧都围绕「怎样让每次进位只改一位」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：元组与计数（难度：基础）<\/h3>\n<p>n 元组是 n 个位置各取一个值的序列。若每位有 k 种取值，总数是 k^n。<\/p>\n<p><strong>实例<\/strong>：3 位二进制元组，k=2、n=3，共 8 个：000、001、010、011、100、101、110、111。<\/p>\n<p><strong>里程表方式<\/strong>：把最低位加一，满 k 进位到高位。汽车里程表就是这么工作的。<\/p>\n<p><strong>代价<\/strong>：单次「加一」平均摊还 O(1)。因为最低位每步都变、次低位每两步变一次、第 i 位每 k^i 步变一次，总变化次数是 n + n/k + n/k² + … &lt; 2n。<\/p>\n<h3>概念 2：格雷码（难度：进阶）<\/h3>\n<p>二进制计数有时一次要改多位（011 → 100 改了三位）。格雷码要求相邻只差一位。<\/p>\n<p><strong>3 位格雷码<\/strong>：000、001、011、010、110、111、101、100。<\/p>\n<p><strong>转换公式<\/strong>：g = b ⊕ (b &gt;&gt; 1)。也就是格雷码的第 i 位 = 二进制第 i 位与第 i+1 位的异或。<\/p>\n<p><strong>实例<\/strong>：b = 6（110）。b&gt;&gt;1 = 011，异或得 101 = 5。序列里第 6 个（从 0 数）正是 101 ✓。<\/p>\n<p><strong>反向转换<\/strong>：b 的最高位等于 g 的最高位；之后 b 的第 i 位 = b 的第 i+1 位 ⊕ g 的第 i 位。写成循环就是不断「异或右移」。<\/p>\n<p><strong>为什么省<\/strong>：相邻格雷码只差一位，生成时只需翻转一个元素，O(1)；而且这一位是哪一位可以直接从步数算出来。<\/p>\n<h3>概念 3：反射构造（难度：进阶）<\/h3>\n<p>不用公式也能生成：n 位格雷码由两部分拼成——<\/p>\n<ol><li>\nn−1 位格雷码，前面加 0；\n<\/li><li>\nn−1 位格雷码<strong>倒序<\/strong>，前面加 1。\n<\/ol>\n<p><strong>实例<\/strong>：1 位是 0、1；2 位是 00、01、11、10；3 位是 000、001、011、010、110、111、101、100 ✓。<\/p>\n<p><strong>为什么倒序<\/strong>：正序末尾是 0 开头的最大的一个，倒序开头是 1 开头的最大的一个，两者只差最高位，衔接处也只改一位。<\/p>\n<h3>概念 4：混合基（难度：进阶）<\/h3>\n<p>每一位的进制不同，例如时间：时（24）、分（60）、秒（60）。总数是各位进制之积。<\/p>\n<p><strong>实例<\/strong>：两位、第一位 3 种取值、第二位 4 种取值，共 12 个元组。生成时低位满 4 进一，高位满 3 归零。<\/p>\n<p><strong>用途<\/strong>：多维数组的下标展开、密码表遍历、参数组合枚举。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 324.453125 410.890625\" style=\"max-width: 324.453125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg34\"><style>#svg34{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg34 .error-icon{fill:#552222;}#svg34 .error-text{fill:#552222;stroke:#552222;}#svg34 .edge-thickness-normal{stroke-width:2px;}#svg34 .edge-thickness-thick{stroke-width:3.5px;}#svg34 .edge-pattern-solid{stroke-dasharray:0;}#svg34 .edge-pattern-dashed{stroke-dasharray:3;}#svg34 .edge-pattern-dotted{stroke-dasharray:2;}#svg34 .marker{fill:#333333;stroke:#333333;}#svg34 .marker.cross{stroke:#333333;}#svg34 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg34 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg34 .cluster-label text{fill:#333;}#svg34 .cluster-label span,#svg34 p{color:#333;}#svg34 .label text,#svg34 span,#svg34 p{fill:#333;color:#333;}#svg34 .node rect,#svg34 .node circle,#svg34 .node ellipse,#svg34 .node polygon,#svg34 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg34 .flowchart-label text{text-anchor:middle;}#svg34 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg34 .node .label{text-align:center;}#svg34 .node.clickable{cursor:pointer;}#svg34 .arrowheadPath{fill:#333333;}#svg34 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg34 .flowchart-link{stroke:#333333;fill:none;}#svg34 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg34 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg34 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg34 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg34 .cluster text{fill:#333;}#svg34 .cluster span,#svg34 p{color:#333;}#svg34 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg34 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg34 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 5 L 10 10 L 10 0 z\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"11\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-circleEnd\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"-1\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg34_flowchart-circleStart\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg34_flowchart-crossEnd\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg34_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg34_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-S LE-L\" id=\"L-S-L-0\" d=\"M119.473,32.303L132.682,37.086C145.891,41.868,172.309,51.434,185.518,59.5C198.727,67.567,198.727,74.133,198.727,77.417L198.727,80.7\"></path><path marker-end=\"url(#svg34_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-L LE-C\" id=\"L-L-C-0\" d=\"M198.727,122L198.727,126.167C198.727,130.333,198.727,138.667,198.793,146.2C198.859,153.734,198.991,160.467,199.057,163.834L199.123,167.201\"></path><path marker-end=\"url(#svg34_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-O\" id=\"L-C-O-0\" d=\"M173.31,262.474L164.944,272.627C156.578,282.78,139.845,303.085,123.838,318.644C107.831,334.204,92.549,345.016,84.908,350.423L77.267,355.829\"></path><path marker-end=\"url(#svg34_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-R\" id=\"L-C-R-0\" d=\"M217.195,270.422L221.117,279.25C225.039,288.079,232.883,305.735,235.48,319.625C238.077,333.515,235.428,343.639,234.103,348.701L232.779,353.763\"></path><path marker-end=\"url(#svg34_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-R LE-C\" id=\"L-R-C-0\" d=\"M207.502,358.891L201.182,352.974C194.863,347.057,182.225,335.224,178.276,322.018C174.328,308.812,179.07,294.234,181.441,286.945L183.813,279.656\"></path><path marker-end=\"url(#svg34_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-O LE-S\" id=\"L-O-S-0\" d=\"M42.79,358.891L41.241,352.974C39.693,347.057,36.597,335.224,35.048,313.733C33.5,292.242,33.5,261.094,33.5,231.695C33.5,202.297,33.5,174.648,33.5,153.658C33.5,132.667,33.5,118.333,33.5,104C33.5,89.667,33.5,75.333,37.355,64.6C41.21,53.866,48.919,46.733,52.774,43.166L56.629,39.599\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g transform=\"translate(123.11328125, 323.390625)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">否</span></div></foreignObject></g></g><g transform=\"translate(240.7265625, 323.390625)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">是</span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(79.97265625, 18)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-443\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">当前元组</span></div></foreignObject></g></g><g transform=\"translate(198.7265625, 104)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-444\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">最低位加一</span></div></foreignObject></g></g><g transform=\"translate(198.7265625, 229.9453125)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-446\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-57.9453125,57.9453125)\" class=\"label-container\" points=\"57.9453125,0 115.890625,-57.9453125 57.9453125,-115.890625 0,-57.9453125\"></polygon><g transform=\"translate(-32.4453125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64.890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">满 k 了吗</span></div></foreignObject></g></g><g transform=\"translate(47.5, 376.890625)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-448\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">输出新元组</span></div></foreignObject></g></g><g transform=\"translate(226.7265625, 376.890625)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-450\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"163.453125\" y=\"-18\" x=\"-81.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-74.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"148.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">本位归零 进位到高位</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：进位可能连续发生，但摊还下来每次输出只改常数位。这就是「摊还 O(1)」的来源。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：n 元组生成像里程表，低位转一圈高位进一格；格雷码像一种特制的表，每转一格只有一个数字变化。\n<\/li><li>\n类比失效：里程表的数字是十进制，格雷码的「一位变化」是二进制位；十进制下不存在「相邻只改一个数字」的完整循环（除了一部分特殊构造）。\n<\/ul>\n<p><strong>实例（格雷码生成）<\/strong>：从 0 数到 7，用 g = b⊕(b&gt;&gt;1) 得 0、1、3、2、6、7、5、4，写成三位二进制就是 000、001、011、010、110、111、101、100，相邻确实只差一位。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为格雷码是「另一种二进制数」<\/strong>——实际上它只是一个编码序列，同一个数值在格雷码下写法不同。\n<\/li><li>\n<strong>别以为二进制计数每次只改一位<\/strong>——实际上 011 到 100 改了三位，这正是格雷码要解决的问题。\n<\/li><li>\n<strong>别以为混合基很少用<\/strong>——实际上多维数组、日期时间、参数组合都是混合基。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：3 位二进制元组共有多少个？（填数字）\n<p>（答案：8；解析：2^3 = 8，从 000 到 111。）<\/p>\n<\/ol>\n<ol><li>\n单选题：3 位格雷码序列的第五个（从 0 数）编码是？\n<p>A. 010 B. 110 C. 111 D. 100 （答案：B；解析：序列 000、001、011、010、110、111、101、100，第五个是 110。）<\/p>\n<\/ol>\n<ol><li>\n简答题：格雷码相对普通二进制计数，优势在哪？\n<p>（答案：相邻两个编码只差一位，生成下一个只需翻转一个元素，代价 O(1)，且硬件上不会出现多位同时跳变的毛刺。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nk 进制 n 位元组共 k^n 个，按里程表进位。\n<\/li><li>\n格雷码 g = b⊕(b&gt;&gt;1)，相邻只差一位。\n<\/li><li>\n反射构造：0 前缀正序 + 1 前缀倒序。\n<\/ul>", "ch02": "<h1>第 2 章：生成所有排列<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章；阶乘\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用字典序的 next 算法从 1 2 3 一路走到 3 2 1。\n<\/li><li>\n用阶乘数系统给任意排列算排名，也能从排名还原排列。\n<\/li><li>\n说清 Heap 算法为什么只用 n!−1 次交换。\n<\/li><li>\n区分全排列、圆排列、带重复元素的排列。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排列生成的两条主线是<strong>字典序<\/strong>（能排名、能随机访问）与<strong>相邻交换<\/strong>（每次改动最小）；两者的交点就是阶乘数系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：总数与字典序（难度：基础）<\/h3>\n<p>n 个不同元素有 n! 种排列。字典序按第一个不同位置的大小决定先后。<\/p>\n<p><strong>1 2 3 的六个排列<\/strong>：123、132、213、231、312、321。<\/p>\n<p><strong>next 算法<\/strong>（求字典序的下一个）：<\/p>\n<ol><li>\n从右往左找第一个「比右边小」的位置 i（即 a[i] &lt; a[i+1]）。\n<\/li><li>\n从右往左找第一个「比 a[i] 大」的位置 j。\n<\/li><li>\n交换 a[i] 与 a[j]。\n<\/li><li>\n把 i 右边的部分整体反转（原来递减，反转后递增）。\n<\/ol>\n<p><strong>实例<\/strong>：从 1 2 3 出发。<\/p>\n<ul><li>\ni = 2（2 &lt; 3），j = 3，交换得 1 3 2，右侧只有一个元素，反转不变 → 132 ✓。\n<\/li><li>\n从 1 3 2：i = 1（1 &lt; 3），j = 3（2 &gt; 1），交换得 2 3 1，反转右侧 3 1 得 1 3 → 231 ✓。\n<\/ul>\n<p><strong>为什么第 4 步是反转<\/strong>：i 右边原本是递减的（因为 i 是最右的升序对），反转后变成递增，正是字典序最小的后缀。<\/p>\n<h3>概念 2：阶乘数系统与排名（难度：进阶）<\/h3>\n<p>给排列编号，用「第 i 位有几个比它小的元素还在右边」作为该位的数字。<\/p>\n<p><strong>排名公式<\/strong>：rank = Σ c(i) × (n−i)!，其中 c(i) 是位置 i 右边比 a[i] 小的元素个数。<\/p>\n<p><strong>实例<\/strong>：排列 2 3 1。<\/p>\n<ul><li>\n位置 1 是 2，右边比它小的有 1，c=1，权 (3−1)! = 2 → 2\n<\/li><li>\n位置 2 是 3，右边比它小的有 1，c=1，权 (3−2)! = 1 → 1\n<\/li><li>\n位置 3 是 1，右边没有，c=0\n<\/li><li>\n排名 = 2 + 1 = 3（从 0 开始），即第 4 个，与 123、132、213、231 的顺序一致 ✓。\n<\/ul>\n<p><strong>反向<\/strong>：已知排名 r，从高位开始，第 i 位取「第 r / (n−i)! 个还没用过的元素」，余数继续。<\/p>\n<p><strong>为什么用阶乘数系统<\/strong>：它把「第几个排列」变成一个可计算的数，不需要从头数。n = 10 时 10! = 3,628,800，仍在整数范围内；n = 20 就超出 64 位。<\/p>\n<h3>概念 3：Heap 算法（难度：高难）<\/h3>\n<p>Heap 算法递归生成排列，只用相邻交换，总交换次数恰好 n!−1。<\/p>\n<p><strong>结构<\/strong>：<\/p>\n<ul><li>\nn = 1 时输出唯一排列。\n<\/li><li>\nn &gt; 1 时，对 i 从 1 到 n：先递归生成前 n−1 个元素的排列；若 n 为奇数，交换第 1 与第 n 个；若 n 为偶数，交换第 i 与第 n 个。\n<\/ul>\n<p><strong>为什么交换次数正好 n!−1<\/strong>：每输出一个新排列至少需要一次交换，而算法每次交换都产生一个新排列，所以交换次数等于「排列数减一」。<\/p>\n<p><strong>实例<\/strong>：n = 3。递归 n=2 输出 123、213；交换 1 与 3 得 321，递归输出 321、231；交换 1 与 3 得 132，递归输出 132、312。共 6 个，5 次交换 ✓。<\/p>\n<h3>概念 4：圆排列与重复元素（难度：进阶）<\/h3>\n<ul><li>\n<strong>圆排列<\/strong>：首尾相接，旋转视为同一种，种数为 (n−1)!。因为固定一个元素的位置后，其余 (n−1) 个随便排。\n<\/li><li>\n<strong>带重复元素<\/strong>：n 个元素中有重复组，种数为 n!/(n1!n2!…)。生成时要跳过重复分支，否则会输出重复排列。\n<\/ul>\n<p><strong>实例<\/strong>：A、A、B 的排列是 3!/2! = 3，即 AAB、ABA、BAA。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 385.796875 482\" style=\"max-width: 385.796875px;\" xmlns=\"http://www.w3.org/2000/s bject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(217.34765625, 18)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-455\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">当前排列</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 104)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-456\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"167\" y=\"-18\" x=\"-83.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-76, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"152\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从右找第一个升序对 i</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 190)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-458\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"224.796875\" y=\"-18\" x=\"-112.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-104.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"209.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从右找第一个大于 a i 的位置 j</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 276)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-460\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"83.453125\" y=\"-18\" x=\"-41.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-34.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"68.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">交换 i 与 j</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 362)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-462\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"91.453125\" y=\"-18\" x=\"-45.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-38.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"76.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">反转 i 右侧</span></div></foreignObject></g></g><g transform=\"translate(112.3984375, 448)\" data-id=\"N\" data-node=\"true\" id=\"flowchart-N-464\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">得到字典序下一个</span></div></foreignObject></g></g><g transform=\"translate(322.296875, 104)\" data-id=\"K\" data-node=\"true\" id=\"flowchart-K-466\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">阶乘数系统</span></div></foreignObject></g></g><g transform=\"translate(322.296875, 190)\" data-id=\"ID\" data-node=\"true\" id=\"flowchart-ID-468\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排名与还原</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：左侧是「一步一步走」，右侧是「直接跳到第 k 个」。两条路都可行，选哪条取决于你要遍历还是要随机访问。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：字典序生成像翻字典，每次只改动尽量靠后的部分；阶乘数系统像给每个词编一个号码，不用翻就能直接跳到那一页。\n<\/li><li>\n类比失效：字典的编号是人为定的，排列的编号由阶乘权决定；n 一大，号码就超过整数范围。\n<\/ul>\n<p><strong>实例（还原排列）<\/strong>：n = 4，排名 5（从 0 开始），还原。<\/p>\n<ul><li>\n5 / 3! = 0 余 5，第 1 位取第 0 个未用元素 → 1\n<\/li><li>\n5 / 2! = 2 余 1，第 2 位取第 2 个未用元素（未用 2,3,4，第 2 个是 4）→ 4\n<\/li><li>\n1 / 1! = 1 余 0，第 3 位取第 1 个未用元素（未用 2,3，第 1 个是 3）→ 3\n<\/li><li>\n最后剩 2 → 2\n<p>排列为 1 4 3 2。核对：4 个元素排名 5，前五个是 1234、1243、1324、1342、1423，第六个是 1432 ✓。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 next 算法要重新排序后缀<\/strong>——实际上后缀原本递减，只需反转，O(n) 而不是 O(n log n)。\n<\/li><li>\n<strong>别以为 Heap 算法交换次数多<\/strong>——实际上恰好 n!−1 次，已经是最少。\n<\/li><li>\n<strong>别以为圆排列就是「少一个元素」<\/strong>——实际上它是把旋转视为等价，除以 n，得 (n−1)!。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：1 2 3 的字典序下一个排列是什么？（写成三个数字，不加空格）\n<p>（答案：132；解析：最右升序对是 2&lt;3，交换得 132，右侧单元素无需反转。）<\/p>\n<\/ol>\n<ol><li>\n单选题：4 个元素的圆排列有多少种？\n<p>A. 4 B. 6 C. 12 D. 24 （答案：B；解析：(4−1)! = 3! = 6，旋转视为同一种。）<\/p>\n<\/ol>\n<ol><li>\n简答题：Heap 算法生成 n 个元素的全排列，一共做多少次交换？\n<p>（答案：n!−1 次。每输出一个新排列至少一次交换，而算法每次交换都产生新排列，故交换次数等于排列数减一。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n全排列 n!，圆排列 (n−1)!，带重复 n!/(n1!…)。\n<\/li><li>\nnext：找最右升序对、交换、反转后缀。\n<\/li><li>\n排名用阶乘数系统，n 一大就溢出。\n<\/ul>", "c01": "<h1>格雷码<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>格雷码是一种二进制编码序列，任意相邻两个编码只差一位；把普通二进制 b 转成格雷码用 g = b ⊕ (b&gt;&gt;1)。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「计数器每次可能改多位」变成「每次只改一位」。这既省生成代价，也避免硬件多位同时跳变产生的毛刺；在旋转编码器、卡诺图、状态机编码里都能见到。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 801.625 49\" style=\"max-width: 801.625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg36\"><style>#svg36{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg36 .error-icon{fill:#552222;}#svg36 .error-text{fill:#552222;stroke:#552222;}#svg36 .edge-thickness-normal{stroke-width:2px;}#svg36 .edge-thickness-thick{stroke-width:3.5px;}#svg36 .edge-pattern-solid{stroke-dasharray:0;}#svg36 .edge-pattern-dashed{stroke-dasharray:3;}#svg36 .edge-pattern-dotted{stroke-dasharray:2;}#svg36 .marker{fill:#333333;stroke:#333333;}#svg36 .marker.cross{stroke:#333333;}#svg36 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg36 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg36 .cluster-label text{fill:#333;}#svg36 .cluster-label span,#svg36 p{color:#333;}#svg36 .label text,#svg36 span,#svg36 p{fill:#333;color:#333;}#svg36 .node rect,#svg36 .node circle,#svg36 .node ellipse,#svg36 .node polygon,#svg36 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg36 .flowchart-label text{text-anchor:middle;}#svg36 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg36 .node .label{text-align:center;}#svg36 .node.clickable{cursor:pointer;}#svg36 .arrowheadPath{fill:#333333;}#svg36 .edgePath .path{stroke:#3
