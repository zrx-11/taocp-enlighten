rm=\"translate(-49.7890625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"99.578125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第 1 与第 n 个</span></div></foreignObject></g></g><g transform=\"translate(219.1953125, 389)\" data-id=\"S2\" data-node=\"true\" id=\"flowchart-S2-495\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"109.234375\" y=\"-18\" x=\"-54.6171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-47.1171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"94.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第 i 与第 n 个</span></div></foreignObject></g></g><g transform=\"translate(138.2421875, 475)\" data-id=\"R2\" data-node=\"true\" id=\"flowchart-R2-497\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">递归下一轮</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>图中的判断是 Heap 算法唯一「反直觉」的地方：奇偶决定交换对象。<\/p>\n<h2>详解<\/h2>\n<p><strong>结构<\/strong>：n = 1 输出唯一排列；n &gt; 1 时循环 i，每次递归生成前 n−1 个的排列，然后按奇偶交换。<\/p>\n<p><strong>交换次数<\/strong>：n!−1。理由：每次交换都产生一个新排列，而新排列总数是 n!−1。<\/p>\n<p><strong>实例（n=3）<\/strong>：123、213（递归 n=2）；交换 1 与 3 得 321，递归得 321、231；再交换 1 与 3 得 132，递归得 132、312。共 6 个，5 次交换。<\/p>\n<p><strong>与字典序的差别<\/strong>：字典序的相邻排列可能差多个位置；Heap 的相邻排列只差一次交换。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Heap 算法需要额外数组：它原地交换，空间 O(n) 只是递归栈。\n<\/li><li>\n别以为交换次数越少运行越快：递归调用与输出本身也有代价。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>7.2.1.2<\/td><td>生成排列<\/td><td>相邻交换与 Heap 算法<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">字典序与阶乘数系统<\/a>\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：生成所有 n 元组<\/strong><br>阅读：<a href=\"#/book/taocp-v4b/chapter/ch01\">第 1 章：生成所有 n 元组<\/a><br>检查点：能手写 3 位格雷码，说明它相对二进制计数的优势<\/li><li class='path-step' id='path-02'><strong>步骤 02：生成所有排列<\/strong><br>阅读：<a href=\"#/book/taocp-v4b/chapter/ch02\">第 2 章：生成所有排列<\/a><br>检查点：能用 next 算法从 1 2 3 走到 3 2 1，能算一个排列的排名<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：生成所有 n 元组<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 3 位二进制元组共有多少个？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 3 位格雷码序列的第五个（从 0 数）编码是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 010<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 110<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 111<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 100<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 格雷码相对普通二进制计数的主要优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> 数值更小<\/label><label class='quiz- pe='radio' name='ch01-q03' value='3'> 可以排序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：生成所有排列<\/h1><div class='quiz-item' data-qid='ch02-q04' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 1 2 3 的字典序下一个排列是什么？（写成三个数字，不加空格）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q05' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 4 个元素的圆排列有多少种？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q05' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch02-q05' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch02-q05' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='ch02-q05' value='3'> 24<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Heap 算法生成 n 个元素的全排列，共做多少次交换？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q06' value='0'> n<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='1'> n!−1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='2'> n!<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='3'> n log n<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='n 元组'>n 元组 — 由 n 个位置组成、每个位置取一个值的序列，各位置独立。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='混合基'>混合基 — 每个位置有不同进制，例如小时与分钟。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='格雷码'>格雷码 — 相邻两个编码只差一位的编码序列。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='反射构造'>反射构造 — n 位格雷码由 n−1 位格雷码加 0 前缀与倒序加 1 前缀拼成。 <span class=glossary-ref>（第 1 章：生成所有 n 元组）<\/span><\/li><li data-term='字典序'>字典序 — 按第一个不同位置的元素大小决定先后。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='阶乘数系统'>阶乘数系统 — 第 i 位权为 i! 的进位制，用来给排列编号。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='排名'>排名 — 一个排列在字典序中的序号，从 0 开始。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='相邻交换'>相邻交换 — 每次只交换相邻两个元素的生成方式。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='heap 算法'>Heap 算法 — 用 n!−1 次相邻交换生成全部排列的递归算法。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><li data-term='圆排列'>圆排列 — 把首尾视为相邻的排列，种数为 (n−1)!。 <span class=glossary-ref>（第 2 章：生成所有排列）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：选一种生成方式<\/h2>\n<ol><li>\n<strong>只需要全部对象、不关心顺序<\/strong> → 二进制计数或递归，最简单。\n<\/li><li>\n<strong>相邻对象要尽量相似<\/strong> → 格雷码或相邻交换。\n<\/li><li>\n<strong>需要随机访问第 k 个对象<\/strong> → 阶乘数系统直接算排名与还原。\n<\/li><li>\n<strong>每位进制不同<\/strong> → 混合基计数。\n<\/ol>\n<h2>决策规则：判断「下一个」是否唯一<\/h2>\n<ul><li>\n字典序：下一个是「最右可增位加一、右侧重置为最小」。\n<\/li><li>\n格雷码：下一个是「翻转哪一位由当前步数的二进制决定」。\n<\/li><li>\n相邻交换：下一个是「按递归结构决定交换哪一对」。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用递归生成排列却不撤销交换<\/strong>：后续分支会基于错误状态。\n<\/li><li>\n<strong>格雷码与二进制码混用<\/strong>：转回普通二进制要异或前缀，忘了就全错。\n<\/li><li>\n<strong>用 n! 直接算排名<\/strong>：大 n 会溢出，要用阶乘数系统逐位算。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>n 元组<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>总数<\/td><td>k^n（每位 k 种取值）<\/td><\/tr><tr><td>二进制计数<\/td><td>从 0 到 2^n−1<\/td><\/tr><tr><td>格雷码<\/td><td>g = b ⊕ (b &gt;&gt; 1)<\/td><\/tr><tr><td>逆转换<\/td><td>b = g ⊕ (g &gt;&gt; 1) ⊕ (g &gt;&gt; 2) …<\/td><\/tr><\/tbody><\/table>\n<h2>排列<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>总数<\/td><td>n!<\/td><\/tr><tr><td>圆排列<\/td><td>(n−1)!<\/td><\/tr><tr><td>字典序下一个<\/td><td>找最右升序对、交换、反转右侧<\/td><\/tr><tr><td>排名<\/td><td>阶乘数系统逐位累加<\/td><\/tr><tr><td>Heap 算法交换次数<\/td><td>n! − 1<\/td><\/tr><\/tbody><\/table>\n<h2>3 位格雷码<\/h2>\n<p>000 → 001 → 011 → 010 → 110 → 111 → 101 → 100<\/p>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：生成所有 n 元组", "href": "#/chapter/ch01"}, {"label": "第 2 章：生成所有排列", "href": "#/chapter/ch02"}]}, {"label": "概念", "children": [{"label": "格雷码", "href": "#/concept/c01"}, {"label": "字典序与阶乘数系统", "href": "#/concept/c02"}, {"label": "相邻交换生成", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：生成所有 n 元组", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：生成所有排列", "href": "#/quiz/ch02"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true}},"mmix":{"manifest": {"slug": "mmix", "title": "计算机程序设计艺术 MMIX 增补", "subtitle": "用一台 64 位机器，把前几卷的算法真正跑起来", "book": {"title": "计算机程序设计艺术 MMIX 增补", "author": "Donald E. Knuth（高德纳）著", "source": ["计算机程序设计艺术 MMIX增补.pdf（扫描版 319 页）"]}, "audience": "读完卷1 至卷3、想看懂 Knuth 的机器级实现", "goal": "系统掌握：能读懂 MMIX 指令与汇编、能解释子程序与协同程序的 lank", "question": "MMIX 有多少个通用寄存器？（填数字）", "options": [], "answer": "256", "explain": "编号 0 到 255，每个 64 位，其中 0 号恒为 0。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "LDO $1, $2, 16 中 16 的单位是？", "options": ["位", "字节", "字（8 字节）", "页"], "answer": 1, "explain": "MMIX 偏移量按字节计，访问第 k 个 8 字节元素要写 k×8。"}, {"id": "ch01-q03", "chapterId": "ch01", "type": "single", "question": "MMIX 的 0 号寄存器有什么特殊之处？", "options": ["存返回地址", "恒为 0，写无效", "存栈指针", "存程序计数器"], "answer": 1, "explain": "读 $0 恒得 0，写 $0 不生效，可当常数零使用。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "PUSHJ $9, SUB 的作用是？", "options": ["只跳转", "压栈 $9 旧值、写返回地址、跳转", "只压栈", "只保存返回地址"], "answer": 1, "explain": "PUSHJ 同时完成压栈、写返回地址与跳转三件事。"}, {"id": "ch02-q05", "chapterId": "ch02", "type": "blank", "question": "两层嵌套调用时，栈里最少保存几份返回地址？（填数字）", "options": [], "answer": "2", "explain": "每层各存一份，否则内层会覆盖外层的返回地址。"}, {"id": "ch02-q06", "chapterId": "ch02", "type": "single", "question": "协同程序与子程序的根本差别是？", "options": ["协同程序更快", "协同程序是对称交替、双方状态都保留", "协同程序不能返回", "协同程序必须多线程"], "answer": 1, "explain": "子程序是调用—返回的单向关系；协同程序双方都能暂停与恢复，各自有独立栈。"}, {"id": "ch03-q07", "chapterId": "ch03", "type": "single", "question": "MMIX 相比 MIX，字长与字节宽度的变化是？", "options": ["32 位到 64 位，6 位字节到 8 位字节", "16 位到 32 位", "不变", "64 位到 128 位"], "answer": 0, "explain": "MMIX 是 64 位机器，字节 8 位；MIX 是 32 位、6 位字节。"}, {"id": "ch03-q08", "chapterId": "ch03", "type": "blank", "question": "双链表删除一个已知节点需要修改几个指针？（填数字）", "options": [], "answer": "2", "explain": "前驱的 next 与后继的 prev，两条赋值即可。"}, {"id": "ch03-q09", "chapterId": "ch03", "type": "single", "question": "为什么 64 位下链表相对数组更不划算？", "options": ["指针占 8 字节且节点分散，空间与缓存都更差", "链表不能存 64 位数据", "链表不能删除", "数组不能随机访问"], "answer": 0, "explain": "指针开销翻倍，节点分散导致缓存命中率低；数组连续存放更省空间也更快。"}, {"id": "q10", "chapterId": "__all__", "type": "single", "question": "综合题：要把卷3 的外部排序移植到 MMIX，最需要重新考虑的是？", "options": ["比较次数公式", "块大小、缓冲区数量与 I/O 合并", "趟数公式", "记录的逻辑顺序"], "answer": 1, "explain": "趟数公式不变；变的是每趟耗时，由块大小、缓冲区与 I/O 合并方式决定。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "MMIX 的寄存器与内存规格？", "back": "256 个 64 位通用寄存器（$0 恒为 0）；内存 2^64 字节，按字节编址、大端序。", "tags": ["架构"]}, {"id": "f02", "chapterId": "ch01", "front": "MMIX 指令的四个字段？", "back": "opcode、x、y、z 各 8 位；x 通常是目的寄存器，y、z 是源或立即数。", "tags": ["架构"]}, {"id": "f03", "chapterId": "ch01", "front": "数组第 k 个 8 字节元素的偏移是多少？", "back": "k×8 字节；偏移量按字节计，不是按元素计。", "tags": ["架构"]}, {"id": "f04", "chapterId": "ch02", "front": "PUSHJ 做哪三件事？", "back": "压入 $X 旧值、把返回地址写进 $X、跳到目标地址。", "tags": ["调用"]}, {"id": "f05", "chapterId": "ch02", "front": "栈帧里通常存什么？", "back": "返回地址、被调用者保存的寄存器旧值、局部变量。", "tags": ["调用"]}, {"id": "f06", "chapterId": "ch02", "front": "协同程序与子程序的区别？", "back": "子程序单向调用返回；协同程序对称交替，切换时双方状态都保留。", "tags": ["协同程序"]}, {"id": "f07", "chapterId": "ch03", "front": "64 位下链表为什么相对更贵？", "back": "指针占 8 字节、节点分散、缓存命中率低；同样数据用数组更省也更快。", "tags": ["增补"]}]}, "rendered": {"ch01": "<h1>第 1 章：MMIX 的寄存器、内存与指令<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：二进制与十六进制\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 MMIX 的寄存器数量、位宽与内存规模。\n<\/li><li>\n解释三地址指令的三个操作数字段各指什么。\n<\/li><li>\n写出「加载—相加—存储」三条指令，并说清偏移量的单位。\n<\/li><li>\n用比较加条件跳转写出一个循环的骨架。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>MMIX 是一台极简的 64 位机器：<strong>256 个寄存器、2^64 字节内存、每条指令 32 位<\/strong>；所有算法都要落成「加载、运算、存储、跳转」这四类动作。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：寄存器与内存（难度：基础）<\/h3>\n<p>MMIX 有 256 个通用寄存器，每个 64 位，编号 0 到 255。<\/p>\n<p><strong>0 号寄存器恒为 0<\/strong>：读它永远得 0，写它不生效。这不是缺陷，是设计——需要一个常数零时不必单独加载。<\/p>\n<p>内存按字节编址，共 2^64 字节，采用大端序（高位字节放在低地址）。一个字是 8 字节，所以相邻两个字地址差 8。<\/p>\n<p><strong>实例<\/strong>：地址 0x100 处存着 8 字节的数，下一个数在 0x108，不是 0x101。地址算术里最容易错的就是这个「乘 8」。<\/p>\n<p><strong>为什么用 64 位<\/strong>：Knuth 设计 MMIX 时，32 位已经不够表示大整数与大数据集；64 位让「一个寄存器装一个指针」成为常态。<\/p>\n<h3>概念 2：指令格式（难度：基础）<\/h3>\n<p>一条 MMIX 指令 32 位，分四个字段：opcode、x、y、z，各 8 位（opcode 占高 8 位）。<\/p>\n<ul><li>\nopcode 说明做什么。\n<\/li><li>\nx 通常是目的寄存器。\n<\/li><li>\ny、z 是源寄存器，或 y 是源、z 是立即数。\n<\/ul>\n<p><strong>三地址的含义<\/strong>：一条指令同时给出两个源和一个目的，例如 <code>ADD $1, $2, $3<\/code> 表示 $1 = $2 + $3。<\/p>\n<p><strong>立即数变体<\/strong>：<code>ADD $1, $2, 5<\/code> 表示 $1 = $2 + 5，省掉一个寄存器。<\/p>\n<p><strong>实例<\/strong>：<code>ADD $3, $1, $2<\/code> 把 $1 与 $2 相加放进 $3，$1、$2 不变。三地址让「不破坏源操作数」成为默认。<\/p>\n<h3>概念 3：加载与存储（难度：基础）<\/h3>\n<ul><li>\n<code>LDO $1, $2, 16<\/code>：把内存地址（$2 + 16）处的 8 字节读进 $1。\n<\/li><li>\n<code>STO $1, $2, 16<\/code>：把 $1 的 8 字节写到（$2 + 16）。\n<\/ul>\n<p><strong>偏移量单位是字节<\/strong>，不是字。访问数组第 i 个 8 字节元素，偏移是 i×8。<\/p>\n<p><strong>实例<\/strong>：数组基址在 $2，读第 3 个元素（下标从 0 起）： 偏移 = 3×8 = 24，指令是 <code>LDO $1, $2, 24<\/code>。<\/p>\n<h3>概念 4：比较与分支（难度：基础）<\/h3>\n<p><code>CMP $1, $2, $3<\/code> 比较 $2 与 $3，把结果（小于、等于、大于）记在 $1 里。<\/p>\n<p>条件跳转：<\/p>\n<ul><li>\n<code>BZ $1, 标签<\/code>：$1 为 0 时跳。\n<\/li><li>\n<code>BP $1, 标签<\/code>：$1 为正时跳。\n<\/li><li>\n<code>BN $1, 标签<\/code>：$1 为负时跳。\n<\/ul>\n<p><strong>循环骨架<\/strong>（求数组前 n 项之和，$1 是首地址，$2 是 n）：<\/p>\n<pre><code>      SET  $3, 0          # 和清零\n      SET  $4, $2         # 计数 = n\nLOOP  BZ   $4, DONE       # 计数为 0 就结束\n      SUB  $4, $4, 1      # 计数减一\n      LDO  $5, $1, 0      # 取当前元素\n      ADD  $3, $3, $5     # 累加\n      ADD  $1, $1, 8      # 指针后移一个元素\n      JMP  LOOP\nDONE  ...<\/code><\/pre>\n<p><strong>为什么用倒计数<\/strong>：BZ 只判断「等于零」，倒着数到 0 正好是结束条件，省掉一次比较。正着数要判「下标 &lt; n」，就得多一条 CMP 加 BP。这个技巧在汇编里很常见。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 476.031005859375 310\" style=\"max-width: 476.031005859375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg39\"><style>#svg39{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg39 .error-icon{fill:#552222;}#svg39 .error-text{fill:#552222;stroke:#552222;}#svg39 .edge-thickness-normal{stroke-width:2px;}#svg39 .edge-thickness-thick{stroke-width:3.5px;}#svg39 .edge-pattern-solid{stroke-dasharray:0;}#svg39 .edge-pattern-dashed{stroke-dasharray:3;}#svg39 .edge- late(385.53125, 104)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-501\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">算术与比较</span></div></foreignObject></g></g><g transform=\"translate(83.515625, 190)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-502\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"167.03125\" y=\"-18\" x=\"-83.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-76.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"152.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">2 的 64 次方字节内存</span></div></foreignObject></g></g><g transform=\"translate(385.53125, 276)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-503\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">加载与存储</span></div></foreignObject></g></g><g transform=\"translate(256.53125, 190)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-507\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">存回内存</span></div></foreignObject></g></g><g transform=\"translate(385.53125, 190)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-509\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">条件跳转</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：数据在寄存器和内存之间往返，运算只在寄存器里做。这就是 load-store 架构的基本循环。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：寄存器像工作台，内存像仓库；所有加工都在工作台上，仓库只负责存取。\n<\/li><li>\n类比失效：工作台只有 256 个格子，仓库有 2^64 字节；真实程序要不停地在台面与仓库之间搬，搬运次数往往决定速度。\n<\/ul>\n<p><strong>实例（一次访存加法）<\/strong>：把内存 0x100 与 0x108 的两个数相加，结果存到 0x110。<\/p>\n<pre><code>LDO $1, $0, 0x100\nLDO $2, $0, 0x108\nADD $3, $1, $2\nSTO $3, $0, 0x110<\/code><\/pre>\n<p>$0 恒为 0，所以「基址 + 偏移」直接就是绝对地址。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 $0 可以当普通寄存器用<\/strong>——实际上它恒为 0，写进去的数据读不出来。\n<\/li><li>\n<strong>别以为地址加一就是下一个元素<\/strong>——实际上元素是 8 字节，地址要加 8。\n<\/li><li>\n<strong>别以为 MMIX 的指令很长<\/strong>——实际上每条只有 32 位，操作数靠寄存器编号塞进 8 位字段。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：MMIX 有多少个通用寄存器？（填数字）\n<p>（答案：256；解析：编号 0 到 255，每个 64 位，0 号恒为 0。）<\/p>\n<\/ol>\n<ol><li>\n单选题：<code>LDO $1, $2, 16<\/code> 中 16 的单位是？\n<p>A. 位 B. 字节 C. 字（8 字节） D. 页 （答案：B；解析：MMIX 的偏移量按字节计，访问第 k 个 8 字节元素要写 k×8。）<\/p>\n<\/ol>\n<ol><li>\n简答题：三地址指令的好处是什么？\n<p>（答案：一条指令同时给出两个源与一个目的，源操作数不被破坏，减少为保存中间值而做的搬移。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n256 个 64 位寄存器，$0 恒为 0；内存 2^64 字节，大端，按字节编址。\n<\/li><li>\n指令 32 位，opcode + x + y + z。\n<\/li><li>\n偏移量按字节，元素间隔 8。\n<\/ul>", "ch02": "<h1>第 2 章：汇编、子程序与协同程序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n读懂一段 MMIX 汇编的标签、指令与伪指令。\n<\/li><li>\n说清 PUSHJ 与 POP 如何配合栈保存返回地址。\n<\/li><li>\n画出一个栈帧的布局，说明参数、返回地址、局部变量各在哪。\n<\/li><li>\n说出协同程序与子程序的根本差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>调用不是「跳过去再跳回来」这么简单：<strong>返回地址必须压栈<\/strong>，否则嵌套调用立刻覆盖；协同程序则把「执行到一半的状态」也保存下来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：汇编的基本写法（难度：基础）<\/h3>\n<p>一行汇编通常三段：标签、助记符、操作数。<\/p>\n<pre><code>LOOP  ADD  $1, $1, $2    # 注释<\/code><\/pre>\n<p><strong>伪指令<\/strong>：不生成机器码，只告诉汇编器怎么安排内存。<\/p>\n<ul><li>\n<code>LOC 数据地址<\/code>：设定后续代码或数据的地址。\n<\/li><li>\n<code>GREG 名称<\/code>：申请一个全局寄存器。\n<\/li><li>\n<code>BYTE<\/code>、<code>WYDE<\/code>、<code>TETRA<\/code>、<code>OCTA<\/code>：依次定义 1、2、4、8 字节的数据。\n<\/ul>\n<p><strong>实例<\/strong>：<\/p>\n<pre><code>X     GREG  0\nY     OCTA  100<\/code><\/pre>\n<p>X 是一个全局寄存器，Y 是一片 8 字节内存，初值 100。<\/p>\n<h3>概念 2：子程序与返回地址（难度：进阶）<\/h3>\n<p><code>PUSHJ $X, 标签<\/code> 做三件事：<\/p>\n<ol><li>\n把 $X 的旧值压栈。\n<\/li><li>\n把返回地址（下一条指令的地址）写进 $X。\n<\/li><li>\n跳到标签。\n<\/ol>\n<p><code>POP $X, 0<\/code> 从栈顶弹回 $X，恢复旧值。<\/p>\n<p><strong>为什么要压栈<\/strong>：如果返回地址存在固定寄存器里，A 调用 B、B 又调用 C，C 的返回地址会覆盖 B 的返回地址，B 就回不去了。压栈让每一层各存一份。<\/p>\n<p><strong>实例（两层调用）<\/strong>：<\/p>\n<ul><li>\nA 执行 PUSHJ $9, B：$9 的旧值入栈，$9 变成 A 的返回地址。\n<\/li><li>\nB 执行 PUSHJ $9, C：$9 再次入栈（现在栈里有两份），$9 变成 B 的返回地址。\n<\/li><li>\nC 执行 POP $9, 0：弹回 B 的返回地址，跳回 B。\n<\/li><li>\nB 执行 POP $9, 0：弹回 A 的返回地址，跳回 A。\n<\/ul>\n<h3>概念 3：栈帧布局（难度：进阶）<\/h3>\n<p>一次调用在栈上占一块区域，叫栈帧。典型布局（从高地址到低地址）：<\/p>\n<table><thead><tr><th>区域<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>调用者的栈帧<\/td><td>参数、局部变量<\/td><\/tr><tr><td>返回地址<\/td><td>PUSHJ 压入<\/td><\/tr><tr><td>被调用者保存的寄存器<\/td><td>旧值<\/td><\/tr><tr><td>被调用者的局部变量<\/td><td>数组、临时值<\/td><\/tr><\/tbody><\/table>\n<p><strong>约定<\/strong>：参数放在高编号寄存器里传，超过寄存器数量的参数走栈；返回值放固定寄存器。<\/p>\n<p><strong>为什么要有约定<\/strong>：调用方与被调用方必须对「参数在哪、返回值在哪、哪些寄存器会被破坏」达成一致，否则各写各的就对不上。<\/p>\n<h3>概念 4：协同程序（难度：高难）<\/h3>\n<p>普通子程序是「调用—执行—返回」的关系；协同程序是<strong>对称<\/strong>的：A 运行到一半暂停，切到 B；B 运行到一半暂停，切回 A，两边都从上次停的地方继续。<\/p>\n<p><strong>实现要点<\/strong>：<\/p>\n<ul><li>\n每个协同程序有自己的栈与寄存器保存区。\n<\/li><li>\n切换时保存当前栈指针与关键寄存器，恢复对方的。\n<\/li><li>\n切换动作可以写成一个宏，本质是「换栈 + 跳转」。\n<\/ul>\n<p><strong>实例<\/strong>：生产者—消费者。生产者生成一个数据就暂停，切给消费者；消费者取走后再切回生产者。两边代码都写成顺序流程，不必写成状态机。<\/p>\n<p><strong>与子程序的区别<\/strong>：子程序返回后，调用点的局部状态还在；协同程序切换后，对方的局部状态也还在，两边的「执行到一半」都要保留。<\/p>\n<h3>概念 5：解释程序（难度：进阶）<\/h3>\n<p>解释程序逐条读取指令、解析字段、执行对应操作。它本身是一段程序，用 MMIX 指令模拟 MMIX 指令。<\/p>\n<p><strong>代价<\/strong>：模拟一条指令通常要几条到几十条真实指令；所以解释执行比直接运行慢一个数量级。<\/p>\n<p><strong>用途<\/strong>：Knuth 用它来跑 MIX 程序、做教学演示、调试。理解它的构造，就理解了「指令」到底是怎么被机器执行的。<\/p>\n<h3>概念 6：输入输出（难度：进阶）<\/h3>\n<p>MMIX 用文件操作指令打开、读、写文件，设备通过特殊寄存器交互。字符设备与块设备的差别体现在「一次读多少」上。<\/p>\n<p><strong>实践要点<\/strong>：I/O 是整台机器里最慢的部分，算法设计要尽量把 I/O 合并成大块（这与卷3 外部排序的思想一致）。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 503.43359375 331\" style=\"max-width: 503.43359375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg40\"><style>#svg40{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg40 .error-icon{fill:#552222;}#svg40 .error-text{fill:#552222;stroke:#552222;}#svg40 .edge-thickness-normal{stroke-width:2px;}#svg40 .edge-thickness-thick{stroke-width:3.5px;}#svg40 .edge-pattern-solid{stroke-dasharray:0;}#svg40 .edge-pattern-dashed{stroke-dasharray:3;}#svg40 .edge-pattern-dotted{stroke-dasharray:2;}#svg40 .marker{fill:#333333;stroke:#333333;}#svg40 .marker.cross{stroke:#333333;}#svg40 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg40 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg40 .cluster-label text{fill:#333;}#svg40 .cluster-label span,#svg40 p{color:#333;}#svg40 .label text,#svg40 span,#svg40 p{fill:#333;color:#333;}#svg40 .node rect,#svg40 .node circle,#svg Object></g></g><g transform=\"translate(256.6796875, 297)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-521\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"115.453125\" y=\"-18\" x=\"-57.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-50.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"100.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">栈帧 局部变量</span></div></foreignObject></g></g><g transform=\"translate(384.98046875, 18)\" data-id=\"C1\" data-node=\"true\" id=\"flowchart-C1-522\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"92.34375\" y=\"-18\" x=\"-46.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-38.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"77.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">协同程序 1</span></div></foreignObject></g></g><g transform=\"translate(384.98046875, 125)\" data-id=\"C2\" data-node=\"true\" id=\"flowchart-C2-523\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"92.34375\" y=\"-18\" x=\"-46.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-38.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"77.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">协同程序 2</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：上半是「一去一回」的调用，下半是「来回交替」的切换。两者的共同点是都要保存上下文，差别在保存多少。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：子程序像打电话问一件事，问完挂断；协同程序像两个人接力写同一份文档，一个人写累了交给另一个，交接时把笔和纸的位置都交代清楚。\n<\/li><li>\n类比失效：电话挂断后你可以做别的事，协同程序切换后两边都停在原地等对方；真实程序里协同程序的栈是各自独立的，不能共用。\n<\/ul>\n<p><strong>实例（PLUS 子程序）<\/strong>：<\/p>\n<pre><code>PLUS  LDO  $1, $0, X     # 取 X\n      LDO  $2, $0, Y     # 取 Y\n      ADD  $3, $1, $2    # 相加\n      STO  $3, $0, Z     # 存结果\n      POP  $9, 0         # 返回<\/code><\/pre>\n<p>调用方写 <code>PUSHJ $9, PLUS<\/code>，返回后从下一条继续。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 PUSHJ 只是跳转<\/strong>——实际上它同时压栈并写入返回地址，是「调用」而不是「跳转」。\n<\/li><li>\n<strong>别以为协同程序就是多线程<\/strong>——实际上它是单线程内的显式切换，没有并发与抢占。\n<\/li><li>\n<strong>别以为解释程序很慢就没用<\/strong>——实际上它让「换一台机器」变成「换一段解释代码」，是虚拟机的雏形。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：PUSHJ $9, SUB 的作用是？\n<p>A. 只跳转 B. 压栈 $9 的旧值、写入返回地址、跳转 C. 只压栈 D. 只保存返回地址 （答案：B；解析：PUSHJ 同时完成压栈、写返回地址与跳转三件事。）<\/p>\n<\/ol>\n<ol><li>\n填空题：两层嵌套调用时，栈里最少保存几份返回地址？（填数字）\n<p>（答案：2；解析：每一层各存一份，否则内层会覆盖外层的返回地址。）<\/p>\n<\/ol>\n<ol><li>\n简答题：协同程序与子程序的根本差别是什么？\n<p>（答案：子程序是调用—返回的单向关系；协同程序是对称的交替关系，切换时双方的执行状态都要保留，各自有独立的栈。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nPUSHJ：压栈、写返回地址、跳转；POP 恢复。\n<\/li><li>\n栈帧存返回地址、保存的寄存器、局部变量。\n<\/li><li>\n协同程序 = 显式切换 + 双方状态保留。\n<\/ul>", "ch03": "<h1>第 3 章：卷1 至卷3 的 MMIX 重写<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1、2 章；卷1 至卷3 的相关章节\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说出 MMIX 重写相比 MIX 多出的三类机器级工作。\n<\/li><li>\n解释 64 位字长对多精度算术与随机数发生器的影响。\n<\/li><li>\n说清链接结构在 64 位地址下的新问题。\n<\/li><li>\n把卷3 的外部排序映射到 MMIX 的 I/O 与内存约束上。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>算法本身没变，变的是<strong>常数与边界<\/strong>：地址宽了 4 倍、字长长了一倍、寄存器多了，但「每条指令只能做一件事」这条约束没变，所以抽象算法落到机器上总要补一堆搬运与检查。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么要有「增补」（难度：基础）<\/h3>\n<p>卷1 至卷3 的早期版本用 MIX，一种 32 位、6 位字节的假想机器。MIX 的字节是 6 位，不能直接表示 ASCII；地址空间也小。MMIX 换成 64 位、8 位字节、256 个寄存器，原来的程序要按新规格重写。<\/p>\n<p><strong>增补的内容<\/strong>：卷1 的 1.3.3 排列的应用、1.4.4 输入输出；卷2 的信息结构（顺序分配、链接分配、循环链表、双链表、数组、二叉树遍历与表示、垃圾回收、动态存储）；卷3 的随机数、算术、排序各章。<\/p>\n<p><strong>为什么值得读<\/strong>：它把「数据结构在真实机器上长什么样」讲清楚了。链表不只是一种抽象，它还涉及指针宽度、对齐、缓存行。<\/p>\n<h3>概念 2：链接结构在 64 位地址下（难度：进阶）<\/h3>\n<p><strong>链接分配<\/strong>：每个节点存数据加一个指向下一个节点的指针。<\/p>\n<ul><li>\nMIX 时代指针占 2 字节左右，节点很小；MMIX 下指针占 8 字节，一个节点的开销翻了几倍。\n<\/li><li>\n地址对齐：8 字节的数最好放在 8 的倍数地址上，否则某些访问会变慢。\n<\/li><li>\n空指针用 0 表示，但 0 也是合法地址，所以要有约定：地址 0 保留不用。\n<\/ul>\n<p><strong>实例<\/strong>：存 100 万个 8 字节整数。<\/p>\n<ul><li>\n用数组：约 8 MB，连续存放，缓存友好。\n<\/li><li>\n用链表：每个节点 8 字节数据加 8 字节指针，约 16 MB，且节点分散，遍历时缓存命中率低。\n<\/ul>\n<p><strong>结论<\/strong>：64 位下链表的相对开销比 32 位更明显，「能用数组就别用链表」这句话更有分量。<\/p>\n<h3>概念 3：循环链表与双链表（难度：进阶）<\/h3>\n<ul><li>\n<strong>循环链表<\/strong>：尾节点指回头节点，删除时不必特判「是不是最后一个」。\n<\/li><li>\n<strong>双链表<\/strong>：每个节点存前驱与后继两个指针，删除已知节点是 O(1)；代价是每个节点多 8 字节，插入删除要改四个指针。\n<\/ul>\n<p><strong>实例（双链表删除）<\/strong>：设节点 p，前驱 prev、后继 next。 <code>prev.next = next; next.prev = prev;<\/code> 两条赋值，O(1)。单链表做不到，因为找不到前驱。<\/p>\n<h3>概念 4：二叉树与垃圾回收（难度：高难）<\/h3>\n<p><strong>二叉树表示<\/strong>：每个节点存左指针、右指针、数据。也可以只存两个指针加一个「线索」标志，用空指针指向中序前驱/后继（线索二叉树），省掉递归栈。<\/p>\n<p><strong>遍历<\/strong>：递归遍历要用栈；Morris 遍历用线索把树临时改成链表，空间 O(1)。<\/p>\n<p><strong>垃圾回收<\/strong>：MMIX 的堆没有自动回收，要自己标记—清除或引用计数。<\/p>\n<ul><li>\n标记—清除：从根出发标记所有可达节点，再扫一遍释放未标记的。\n<\/li><li>\n引用计数：每个节点记被引用次数，归零就释放；循环引用会泄漏。\n<\/ul>\n<h3>概念 5：随机数与算术（难度：进阶）<\/h3>\n<p><strong>随机数<\/strong>：MMIX 是 64 位机器，线性同余可以直接用 2^64 取模（溢出自动截断）。取高位比取低位好，这与卷2 的结论一致。<\/p>\n<p><strong>多精度<\/strong>：一个字 64 位，n 位十进制数只需 n/19 个左右的字（因为 2^64 约 1.8×10^19）。乘法仍是 O(n²)，但 n 是以 64 位为单位计的，实际常数比按十进制位算小得多。<\/p>\n<h3>概念 6：排序与 I/O（难度：进阶）<\/h3>\n<p>卷3 的外部排序在 MMIX 上要处理：<\/p>\n<ul><li>\n记录大小与块大小的匹配（一次读一个块，块内多条记录）。\n<\/li><li>\n缓冲区数量受 256 个寄存器与内存限制。\n<\/li><li>\n比较用 CMP 加条件跳转，或专用比较指令。\n<\/ul>\n<p><strong>映射关系<\/strong>：卷3 的「趟数 = log_k R」不变；变的是每趟的实际耗时，由 I/O 带宽与块大小决定。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 649.90625 310\" style=\"max-width: 649.90625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg41\"><style>#svg41{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg41 .error-icon{fi " width=\"121.6875\" y=\"-18\" x=\"-60.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-53.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"106.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">地址宽度 64 位</span></div></foreignObject></g></g><g transform=\"translate(335.1796875, 104)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-529\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"89.6875\" y=\"-18\" x=\"-44.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-37.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"74.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">字长 64 位</span></div></foreignObject></g></g><g transform=\"translate(562.40625, 104)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-531\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"114.59375\" y=\"-18\" x=\"-57.296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.796875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"99.59375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">寄存器 256 个</span></div></foreignObject></g></g><g transform=\"translate(89.7265625, 190)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-533\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"179.453125\" y=\"-18\" x=\"-89.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-82.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"164.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">指针开销变大 对齐要求</span></div></foreignObject></g></g><g transform=\"translate(335.1796875, 190)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-535\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"211.453125\" y=\"-18\" x=\"-105.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-98.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"196.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多精度块变大 随机数取高位</span></div></foreignObject></g></g><g transform=\"translate(562.40625, 190)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-537\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">参数尽量走寄存器</span></div></foreignObject></g></g><g transform=\"translate(335.1796875, 276)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-539\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数据结构选择要重算</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：三条约束各自影响不同层面，最后都汇到「数据结构与算法选择要按新常数重算」这一步。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：把 32 位程序改写成 64 位，像把一间 30 平米的房子换成 60 平米——家具（算法）没变，但摆放方式（数据结构）与走动路线（缓存）都要重新考虑。\n<\/li><li>\n类比失效：房子换大只是空间变多，64 位还改变了「一个字能装多少东西」，多精度与随机数的实现细节都跟着变。\n<\/ul>\n<p><strong>实例（估算）<\/strong>：10 万条记录、每条 64 字节、内存 64 MB。<\/p>\n<ul><li>\n内存能放 100 万条，整批一次读入即可，不需要外部排序。\n<\/li><li>\n若记录变成 1024 字节，10 万条就是 100 MB，超过内存，必须走外部排序。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 64 位只是「地址更大」<\/strong>——实际上字长、寄存器数量、对齐要求都变了，实现细节全要重算。\n<\/li><li>\n<strong>别以为链表在 64 位下更好用<\/strong>——实际上指针开销翻倍，缓存更不友好。\n<\/li><li>\n<strong>别以为增补只是「换个指令集」<\/strong>——实际上它把抽象数据结构的机器代价讲清楚了，是卷1 至卷3 的落地注解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：MMIX 相比 MIX，字长与字节宽度的变化是？\n<p>A. 32 位到 64 位，6 位字节到 8 位字节 B. 16 位到 32 位 C. 不变 D. 64 位到 128 位 （答案：A；解析：MMIX 是 64 位机器，字节 8 位；MIX 是 32 位、6 位字节。）<\/p>\n<\/ol>\n<ol><li>\n填空题：双链表删除一个已知节点需要修改几个指针？（填数字）\n<p>（答案：2；解析：前驱的 next 与后继的 prev，两条赋值。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么 64 位下「能用数组就别用链表」这句话更有分量？\n<p>（答案：指针从约 2 字节变成 8 字节，节点开销成倍增加；节点分散导致缓存命中率低，遍历更慢；数组连续存放，空间与缓存都更省。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMMIX 重写改变的是常数与边界：地址 64 位、字长 64 位、寄存器 256 个。\n<\/li><li>\n链接结构的指针开销在 64 位下显著变大。\n<\/li><li>\n外部排序的趟数公式不变，变的是每趟的实际耗时。\n<\/ul>", "c01": "<h1>MMIX 指令格式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>MMIX 每条指令 32 位，由 opcode 与三个 8 位字段（x、y、z）组成，常见形式是三地址：目的寄存器、两个源。<\/p>\n<h2>为什么重要<\/h2>\n<p>读懂格式，才能读懂汇编、估算指令条数、理解「为什么 MMIX 的常数零寄存器很关键」。它也是 RISC 设计思想的典型样本：定长指令、字段规整、load-store 分离。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 437.671875 52\" style=\"max-width: 437.671875px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg42\"><style>#svg42{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg42 .error-icon{fill:#552222;}#svg42 .error-text{fill:#552222;stroke:#552222;}#svg42 .edge-thickness-normal{stroke-width:2px;}#svg42 .edge-thickness-thick{stroke-wid  white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">opcode 8 位</span></div></foreignObject></g></g><g transform=\"translate(179.6796875, 18)\" data-id=\"X\" data-node=\"true\" id=\"flowchart-X-545\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"56.796875\" y=\"-18\" x=\"-28.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-20.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"41.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">x 8 位</span></div></foreignObject></g></g><g transform=\"translate(286.4765625, 18)\" data-id=\"Y\" data-node=\"true\" id=\"flowchart-Y-547\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"56.796875\" y=\"-18\" x=\"-28.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-20.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"41.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">y 8 位</span></div></foreignObject></g></g><g transform=\"translate(393.2734375, 18)\" data-id=\"Z\" data-node=\"true\" id=\"flowchart-Z-549\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"56.796875\" y=\"-18\" x=\"-28.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-20.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"41.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">z 8 位</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>四个字段拼成 32 位；x 通常是目的，y、z 是源或「源加立即数」。<\/p>\n<h2>详解<\/h2>\n<p><strong>三种常见形态<\/strong>：<\/p>\n<ul><li>\n三寄存器：<code>ADD $1, $2, $3<\/code>。\n<\/li><li>\n寄存器加立即数：<code>ADD $1, $2, 5<\/code>。\n<\/li><li>\n加载/存储：<code>LDO $1, $2, 16<\/code>，基址加字节偏移。\n<\/ul>\n<p><strong>$0 恒为 0<\/strong>：读恒为 0、写无效，可当常数零用。<\/p>\n<p><strong>字节寻址<\/strong>：地址按字节计，8 字节元素间隔为 8。<\/p>\n<p><strong>实例<\/strong>：读两个数相加存回：<\/p>\n<pre><code>LDO $1, $0, 0x100\nLDO $2, $0, 0x108\nADD $3, $1, $2\nSTO $3, $0, 0x110<\/code><\/pre>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为一条指令能做多件事：RISC 风格下，运算与访存严格分开。\n<\/li><li>\n别以为偏移量是元素下标：它是字节偏移，要乘 8。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.3.1&#x27;<\/td><td>MMIX 概述<\/td><td>寄存器、内存、指令格式<\/td><\/tr><tr><td>1.3.2&#x27;<\/td><td>汇编语言<\/td><td>格式与助记符的对应<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">子程序与栈帧<\/a>\n<\/ul>", "c02": "<h1>子程序与栈帧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>子程序调用靠 PUSHJ 把返回地址与旧寄存器压栈，靠 POP 恢复；每次调用在栈上占一块区域，叫栈帧。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是「函数」这个抽象在机器上的真实形态。理解栈帧，才能理解递归为什么耗栈、尾调用为什么能优化、栈溢出是怎么发生的。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 159 482\" style=\"max-width: 159px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg43\"><style>#svg43{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg43 .error-icon{fill:#552222;}#svg43 .error-text{fill:#552222;stroke:#552222;}#svg43 .edge-thickness-normal{stroke-width:2px;}#svg43 .edge-thickness-thick{stroke-width:3.5px;}#svg43 .edge-pattern-solid{stroke-dasharray:0;}#svg43 .edge-pattern-dashed{stroke-dasharray:3;}#svg43 .edge-pattern-dotted{stroke-dasharray:2;}#svg43 .marker{fill:#333333;stroke:#333333;}#svg43 .marker.cross{stroke:#333333;}#svg43 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg43 .label{font-fam ,71.5,138.667,71.5,146.117C71.5,153.567,71.5,160.133,71.5,163.417L71.5,166.7\"></path><path marker-end=\"url(#svg43_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-R LE-SV\" id=\"L-R-SV-0\" d=\"M71.5,208L71.5,212.167C71.5,216.333,71.5,224.667,71.5,232.117C71.5,239.567,71.5,246.133,71.5,249.417L71.5,252.7\"></path><path marker-end=\"url(#svg43_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-SV LE-LV\" id=\"L-SV-LV-0\" d=\"M71.5,294L71.5,298.167C71.5,302.333,71.5,310.667,71.5,318.117C71.5,325.567,71.5,332.133,71.5,335.417L71.5,338.7\"></path><path marker-end=\"url(#svg43_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-LV LE-S2\" id=\"L-LV-S2-0\" d=\"M71.5,380L71.5,384.167C71.5,388.333,71.5,396.667,71.5,404.117C71.5,411.567,71.5,418.133,71.5,421.417L71.5,424.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(71.5, 18)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-550\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"99.453125\" y=\"-18\" x=\"-49.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-42.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"84.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">栈顶 高地址</span></div></foreignObject></g></g><g transform=\"translate(71.5, 104)\" data-id=\"F1\" data-node=\"true\" id=\"flowchart-F1-551\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">调用者栈帧</span></div></foreignObject></g></g><g transform=\"translate(71.5, 190)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-553\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">返回地址</span></div></foreignObject></g></g><g transform=\"translate(71.5, 276)\" data-id=\"SV\" data-node=\"true\" id=\"flowchart-SV-555\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">保存的寄存器</span></div></foreignObject></g></g><g transform=\"translate(71.5, 362)\" data-id=\"LV\" data-node=\"true\" id=\"flowchart-LV-557\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">被调用者局部变量</span></div></foreignObject></g></g><g transform=\"translate(71.5, 448)\" data-id=\"S2\" data-node=\"true\" id=\"flowchart-S2-559\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"99.453125\" y=\"-18\" x=\"-49.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-42.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"84.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">栈底 低地址</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>从高到低依次是：调用者区域、返回地址、保存的寄存器、局部变量。<\/p>\n<h2>详解<\/h2>\n<p><strong>PUSHJ 三件事<\/strong>：压入 $X 旧值、把返回地址写进 $X、跳转。 <strong>POP 一件事<\/strong>：从栈顶弹回 $X。<\/p>\n<p><strong>嵌套调用<\/strong>：每层各存一份返回地址，内层不会覆盖外层。<\/p>\n<p><strong>参数与返回值<\/strong>：按约定放寄存器或栈；返回值放固定寄存器。<\/p>\n<p><strong>实例<\/strong>：PLUS 子程序取 X、Y 相加存 Z，最后 <code>POP $9, 0<\/code> 返回。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为返回地址存固定寄存器就行：嵌套调用会覆盖，必须压栈。\n<\/li><li>\n别以为栈帧只有局部变量：返回地址与保存的寄存器也占空间。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.4.1&#x27;<\/td><td>子程序<\/td><td>PUSHJ/POP 与栈帧<\/td><\/tr><tr><td>1.4.2&#x27;<\/td><td>协同程序<\/td><td>栈的切换<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">MMIX 指令格式<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">协同程序<\/a>\n<\/ul>", "c03": "<h1>协同程序<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>协同程序是两个（或多个）可以互相暂停、互相恢复的过程，各自有独立的栈，切换时双方状态都保留。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让「对称交替」的流程不必写成状态机。生产者—消费者、两遍扫描、语法分析与词法分析的交接，用协同程序写就是两段顺序代码。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 344.046875 78\" style=\"max-width: 344.046875px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg44\"><style>#svg44{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg44 .error-icon{fill:#552222;}#svg44 .error-text{fill:#552222;stroke:#552222;}#svg44 .edge-thickness-normal{stroke-width:2px;}#svg44 .edge-thickness-thick{stroke-width:3.5px;}#svg44 .edge-pattern-solid{stroke-dasharray:0;}#svg44 .edge-pattern-dashed{stroke-dasharray:3;}#svg44 .edge-pattern-dotted{stroke-dasharray:2;}#svg44 .marker{fill:#333333;stroke:#333333;}#svg44 .marker.cross{stroke:#333333;}#svg44 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg44 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg44 .cluster-label text{fill:#333;}#svg44 .cluster-label span,#svg44 p{color:#333;}#svg44 .label text,#svg44 span,#svg44 p{fill:#333;color:#333;}#svg44 5\" refX=\"11\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg44_flowchart-circleEnd\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"-1\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg44_flowchart-circleStart\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg44_flowchart-crossEnd\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg44_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg44_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-A LE-B\" id=\"L-A-B-0\" d=\"M96.797,22.419L108.001,20.433C119.206,18.446,141.615,14.473,163.154,14.319C184.693,14.165,205.362,17.829,215.697,19.662L226.031,21.494\"></path><path marker-end=\"url(#svg44_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-B LE-A\" id=\"L-B-A-0\" d=\"M231.25,39.581L220.046,41.567C208.841,43.554,186.432,47.527,164.893,47.681C143.354,47.835,122.685,44.171,112.35,42.338L102.015,40.506\"></path></g><g class=\"edgeLabels\"><g transform=\"translate(164.0234375, 10.5)\" class=\"edgeLabel\"><g transform=\"translate(-42.2265625, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"84.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">暂停 保存栈</span></div></foreignObject></g></g><g transform=\"translate(164.0234375, 51.5)\" class=\"edgeLabel\"><g transform=\"translate(-42.2265625, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"84.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">暂停 保存栈</span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(48.3984375, 31)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-560\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"96.796875\" y=\"-18\" x=\"-48.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"81.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">协同 1 运行</span></div></foreignObject></g></g><g transform=\"translate(279.6484375, 31)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-561\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"96.796875\" y=\"-18\" x=\"-48.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"81.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">协同 2 运行</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>箭头是双向的：谁都可以是主动方，这一点与子程序的单向调用不同。<\/p>\n<h2>详解<\/h2>\n<p><strong>与子程序的区别<\/strong>：<\/p>\n<ul><li>\n子程序：调用方等被调用方返回，返回后调用方继续。\n<\/li><li>\n协同程序：切换后两边都停在原地，下一次谁被恢复取决于对方。\n<\/ul>\n<p><strong>实现<\/strong>：切换 = 保存当前栈指针与关键寄存器 + 恢复对方的值 + 跳转。可以写成一个 swap 宏。<\/p>\n<p><strong>实例<\/strong>：生产者生成一个数据就切换；消费者取走后切换回来。两边各写一个循环，逻辑清晰。<\/p>\n<p><strong>代价<\/strong>：每个协同程序要独立的栈空间；切换有保存恢复开销。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为协同程序是多线程：它是单线程显式切换，没有并发与抢占。\n<\/li><li>\n别以为协同程序一定更快：它省的是「状态机改写」的复杂度，不省切换开销。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.4.2&#x27;<\/td><td>协同程序<\/td><td>栈切换与对称控制<\/td><\/tr><tr><td>1.4.3&#x27;<\/td><td>解释程序<\/td><td>用协程分离取指与执行<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">子程序与栈帧<\/a>\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：MMIX 的寄存器与指令<\/strong><br>阅读：<a href=\"#/book/mmix/chapter/ch01\">第 1 章：MMIX 的寄存器、内存与指令<\/a><br>检查点：能解释三地址指令各字段，能写出一次加载加一次加法<\/li><li class='path-step' id='path-02'><strong>步骤 02：汇编、子程序与协同程序<\/strong><br>阅读：<a href=\"#/book/mmix/chapter/ch02\">第 2 章：汇编、子程序与协同程序<\/a><br>检查点：能说清 pushj/pop 如何保存返回地址，能解释协同程序与子程序的区别<\/li><li class='path-step' id='path-03'><strong>步骤 03：卷1 至卷3 的 MMIX 重写<\/strong><br>阅读：<a href=\"#/book/mmix/chapter/ch03\">第 3 章：卷1 至卷3 的 MMIX 重写<\/a><br>检查点：能说出链接分配、随机数、排序在 MMIX 上各多了哪些机器级操作<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：MMIX 的寄存器、内存与指令<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> MMIX 有多少个通用寄存器？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> LDO $1, $2, 16 中 16 的单位是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 字节<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 字（8 字节）<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 页<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> MMIX 的 0 号寄存器有什么特殊之处？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> 存返回地址<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='1'> 恒为 0，写无效<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='2'> 存栈指针<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='3'> 存程序计数器<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：汇编、子程序与协同程序<\/h2><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> PUSHJ $9, SUB 的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 只跳转<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 压栈 $9 旧值、写返回地址、跳转<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 只压栈<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 只保存返回地址<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q05' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 两层嵌套调用时，栈里最少保存几份返回地址？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 协同程序与子程序的根本差别是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q06' value='0'> 协同程序更快<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='1'> 协同程序是对称交替、双方状态都保留<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='2'> 协同程序不能返回<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='3'> 协同程序必须多线程<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：卷1 至卷3 的 MMIX 重写<\/h2><div class='quiz-item' data-qid='ch03-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> MMIX 相比 MIX，字长与字节宽度的变化是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q07' value='0'> 32 位到 64 位，6 位字节到 8 位字节<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='1'> 16 位到 32 位<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='3'> 64 位到 128 位<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q08' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 双链表删除一个已知节点需要修改几个指针？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 为什么 64 位下链表相对数组更不划算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q09' value='0'> 指针占 8 字节且节点分散，空间与缓存都更差<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='1'> 链表不能存 64 位数据<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='2'> 链表不能删除<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='3'> 数组不能随机访问<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>综合测验（多章联考）<\/h2><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q10.<\/b> 综合题：要把卷3 的外部排序移植到 MMIX，最需要重新考虑的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 比较次数公式<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 块大小、缓冲区数量与 I/O 合并<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 趟数公式<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 记录的逻辑顺序<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：MMIX 的寄存器、内存与指令<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> MMIX 有多少个通用寄存器？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> LDO $1, $2, 16 中 16 的单位是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 字节<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 字（8 字节）<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 页<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> MMIX 的 0 号寄存器有什么特殊之处？<\/p><
