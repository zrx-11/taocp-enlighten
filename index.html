sic label-container\"></rect><g transform=\"translate(-70.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"141.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">浮点 符号 指数 尾数</span></div></foreignObject></g></g><g transform=\"translate(119.34765625, 306)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-168\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"131.453125\" y=\"-18\" x=\"-65.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-58.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"116.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多精度 数组切块</span></div></foreignObject></g></g><g transform=\"translate(38.6171875, 392)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-170\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"77.234375\" y=\"-18\" x=\"-38.6171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-31.1171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"62.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">加法 O n</span></div></foreignObject></g></g><g transform=\"translate(200.078125, 392)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-172\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"145.6875\" y=\"-18\" x=\"-72.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-65.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"130.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">朴素乘法 O n 平方</span></div></foreignObject></g></g><g transform=\"translate(200.078125, 478)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-174\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"163.453125\" y=\"-18\" x=\"-81.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-74.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"148.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快速乘法 三次半规模</span></div></foreignObject></g></g><g transform=\"translate(389.76171875, 392)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-176\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"125.25\" y=\"-18\" x=\"-62.625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-55.125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"110.25\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">注意 ulp 与抵消</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：左边是「精度够用」的路径，右边是「精度必须自己管」的路径。两条路径的交界不在数值大小，而在所需有效位数——几百位的整数用浮点存，尾数根本不够。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：浮点像用科学计数法记测量值，只保留固定几位；多精度像用算盘，一位一位地拨，位子有多少就能算多少位。\n<\/li><li>\n类比失效：算盘的位数是硬件固定的，多精度数组可以按需加长；而浮点的尾数位数是硬性上限，加长不了。\n<\/ul>\n<p><strong>实例（多精度加法）<\/strong>：按千进制算 987654 + 123456。<\/p>\n<ul><li>\n低位块：654 + 456 = 1110，写 110，进位 1\n<\/li><li>\n高位块：987 + 123 + 1 = 1111，写 1111\n<\/li><li>\n结果 1111110。核对十进制：987654 + 123456 = 1,111,110，对得上。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为浮点误差是「程序写错了」<\/strong>——实际上是二进制表示十进制小数的固有损失。\n<\/li><li>\n<strong>别以为 double 比 float 精确两倍<\/strong>——实际上双精度尾数 53 位、单精度 24 位，有效位数差了约一倍，可表示的数值范围也差很多。\n<\/li><li>\n<strong>别以为快速乘法在所有规模上都更快<\/strong>——实际上 n 很小时递归与加减开销超过收益，通常要设一个阈值，小规模退回朴素乘法。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：双精度浮点数的尾数（含隐含位）是多少位？\n<p>A. 24 B. 32 C. 53 D. 64 （答案：C；解析：双精度尾数 52 位加隐含的 1 位共 53 位，约 16 位十进制有效数字。）<\/p>\n<\/ol>\n<ol><li>\n填空题：快速乘法的递归式 T(n) = 3T(n/2) + O(n) 给出的复杂度指数约为 ___（填三位小数）。\n<p>（答案：1.585；解析：指数是 log2 3 ≈ 1.58496，取三位是 1.585。）<\/p>\n<\/ol>\n<ol><li>\n简答题：双精度下 1e16 + 1 − 1e16 的结果是多少？为什么？\n<p>（答案：0；解析：1e16 附近相邻可表示数的间隔 ulp 为 2，加 1 不到半个 ulp，被舍入回 1e16；再减 1e16 得 0，而数学上应为 1。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n浮点 = 符号 + 指数 + 尾数，尾数位数决定精度。\n<\/li><li>\n0.1 在二进制下无限循环，所以 0.1 + 0.2 ≠ 0.3 是必然。\n<\/li><li>\n朴素多精度乘法 O(n²)，快速乘法约 O(n^1.585)。\n<\/li><li>\n模运算的加减乘直接做，除法要先求逆元，条件是 gcd(a, m) = 1。\n<\/ul>", "ch04": "<h1>第 4 章：进制、有理数与多项式<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 3 章（多精度）；卷1 第 2 章（求和与数论）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用「除基取余」把十进制转成任意进制，用「乘基累加」转回来。\n<\/li><li>\n说清有理数运算为什么必须先做约分，以及欧几里得算法的平均代价。\n<\/li><li>\n用秦九韶法则（Horner）在 n 次乘加内算出一个 n 次多项式的值。\n<\/li><li>\n说清多项式乘法与快速幂各自的代价。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>这一章的所有算法都在做同一件事：<strong>把「位」和「系数」当成可以逐位处理的对象<\/strong>。进制转换处理位，多项式处理系数，形式完全同构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：进制转换（难度：基础）<\/h3>\n<p><strong>十进制转 b 进制（整数部分）<\/strong>：不断用 b 去除，记下余数，直到商为 0，再把余数倒着读。<\/p>\n<p><strong>实例<\/strong>：100 转二进制。<\/p>\n<ul><li>\n100 ÷ 2 = 50 余 0\n<\/li><li>\n50 ÷ 2 = 25 余 0\n<\/li><li>\n25 ÷ 2 = 12 余 1\n<\/li><li>\n12 ÷ 2 = 6 余 0\n<\/li><li>\n6 ÷ 2 = 3 余 0\n<\/li><li>\n3 ÷ 2 = 1 余 1\n<\/li><li>\n1 ÷ 2 = 0 余 1\n<\/ul>\n<p>余数从后往前读：1100100。核对：64 + 32 + 4 = 100 ✓。<\/p>\n<p><strong>b 进制转十进制<\/strong>：从最高位开始，每次「当前值 × b + 下一位」。 1100100 转十进制：1 → 1×2+1=3 → 3×2+0=6 → 6×2+0=12 → 12×2+1=25 → 25×2+0=50 → 50×2+0=100 ✓。<\/p>\n<p>注意这两步与多项式求值是同一个算法——1100100 就是多项式 1·2⁶ + 1·2⁵ + 0·2⁴ + … + 0·2⁰。<\/p>\n<p><strong>小数部分<\/strong>要反过来：不断乘 b，取整数部分，直到小数部分为 0 或达到所需位数。0.625 转二进制：0.625×2=1.25 取 1；0.25×2=0.5 取 0；0.5×2=1.0 取 1，得 0.101。核对：1/2 + 0 + 1/8 = 0.625 ✓。<\/p>\n<h3>概念 2：有理数算术（难度：进阶）<\/h3>\n<p>用分子分母一对整数表示分数，每次运算后约分。<\/p>\n<ul><li>\n加法：a/b + c/d = (ad + bc)/(bd)，然后约分。\n<\/li><li>\n乘法：ac/(bd)，约分。\n<\/li><li>\n比较：交叉相乘 ad 与 bc。\n<\/ul>\n<p><strong>为什么必须约分<\/strong>：不约分的话，分子分母会指数级膨胀。连加 20 个分母互不相同的分数，不约分时分母是 20 个数的乘积，位数爆炸；约分后规模可控。<\/p>\n<p><strong>约分的代价<\/strong>：一次 gcd，用欧几里得算法。它的步数平均约为 0.84 倍的自然对数（ln n），也就是说 n 有 100 位十进制时，平均只要几百步。<\/p>\n<p><strong>实例<\/strong>：1/6 + 1/4 = (4 + 6)/24 = 10/24 = 5/12。不约分是 10/24，约分后 5/12，数值相同但分母小一半。<\/p>\n<h3>概念 3：多项式的表示与求值（难度：进阶）<\/h3>\n<p>n 次多项式写成 a(n)x^n + … + a1x + a0，用系数数组表示，数组下标就是次数。<\/p>\n<p><strong>秦九韶法则（Horner）<\/strong>：从最高次开始，每次「乘 x，再加下一个系数」。<\/p>\n<p><strong>实例<\/strong>：p(x) = 2x³ + 3x² + 5x + 7，求 p(2)。<\/p>\n<ul><li>\n取最高系数 2\n<\/li><li>\n2×2 + 3 = 7\n<\/li><li>\n7×2 + 5 = 19\n<\/li><li>\n19×2 + 7 = 45\n<\/ul>\n<p>直接代入核对：2×8 + 3×4 + 5×2 + 7 = 16 + 12 + 10 + 7 = 45 ✓。<\/p>\n<p>代价：n 次乘法加 n 次加法，O(n)。若按定义逐项算幂，是 O(n²)。<\/p>\n<h3>概念 4：多项式除法与幂的计算（难度：进阶）<\/h3>\n<p><strong>多项式除法<\/strong>：像整数长除法，用被除数的最高次项除以除数的最高次项，得到商的一项，乘回去减掉，重复。<\/p>\n<p><strong>实例<\/strong>：(x² + 3x + 2) ÷ (x + 1)。<\/p>\n<ul><li>\n最高项 x² ÷ x = x，商记 x\n<\/li><li>\nx(x + 1) = x² + x，相减得 2x + 2\n<\/li><li>\n2x ÷ x = 2，商记 2\n<\/li><li>\n2(x + 1) = 2x + 2，相减得 0\n<\/ul>\n<p>商是 x + 2，余数 0。核对：(x + 1)(x + 2) = x² + 3x + 2 ✓。<\/p>\n<p><strong>快速幂<\/strong>：要算 x^15，不要连乘 15 次。用二进制展开 15 = 1111₂： x → x² → x³ → x⁶ → x⁷ → x¹⁴ → x¹⁵，共 6 次乘法（3 次平方、3 次相乘）。通用地，指数为 n 时约需 1.5 log2 n 次乘法。<\/p>\n<h3>概念 5：幂级数（难度：高难）<\/h3>\n<p>幂级数是无穷次的多项式，用来近似函数：e^x = 1 + x + x²/2! + x³/3! + …。<\/p>\n<p><strong>常见操作与代价<\/strong>：<\/p>\n<ul><li>\n求值：截断到 n 项，用秦九韶，O(n)。\n<\/li><li>\n加法、减法：逐项，O(n)。\n<\/li><li>\n乘法（卷积）：第 k 项系数是 Σ a(i)b(k−i)，O(n²)。快速傅里叶变换可降到 O(n log n)。\n<\/li><li>\n复合 f(g(x))：朴素做法 O(n²) 甚至 O(n³)。\n<\/li><li>\n求逆：已知 f 求 g 使 fg = 1，逐项递推，O(n²)。\n<\/ul>\n<p><strong>为什么算法分析关心幂级数<\/strong>：生成函数（卷1 第 2 章）就是形式幂级数。解递推式、算平均代价，最后都落到「求一个幂级数的系数」上。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 9 eLabel\">多项式</span></div></foreignObject></g></g><g transform=\"translate(262.296875, 392)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-184\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"129.6875\" y=\"-18\" x=\"-64.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-57.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"114.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">求值 秦九韶 O n</span></div></foreignObject></g></g><g transform=\"translate(452.203125, 392)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-186\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"150.125\" y=\"-18\" x=\"-75.0625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-67.5625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"135.125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘法 卷积 O n 平方</span></div></foreignObject></g></g><g transform=\"translate(662.125, 392)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-188\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"169.71875\" y=\"-18\" x=\"-84.859375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-77.359375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"154.71875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">幂 快速幂 约 1.5 log n</span></div></foreignObject></g></g><g transform=\"translate(870.7109375, 392)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-190\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">幂级数 求逆与复合</span></div></foreignObject></g></g><g transform=\"translate(168.01171875, 478)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-192\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">同一个算法换个名字</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：最后一条箭头是这张图的关键——进制转换的「乘基累加」和多项式求值的「乘 x 加系数」是同一个算法。看懂这一层，两章内容就合成一章。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：多项式像一列火车，每节车厢装一个系数，次数就是车厢编号。求值就是从头走到尾，每节车厢做一次「乘 x 再加」。\n<\/li><li>\n类比失效：火车的车厢数有限，幂级数是无限节；截断到第 n 项的误差必须单独分析，类比里没有这一层。\n<\/ul>\n<p><strong>实例（快速幂）<\/strong>：算 3^13。13 = 1101₂，即 8 + 4 + 1。<\/p>\n<ul><li>\n从 x = 3 开始（最高位 1 已计入）。\n<\/li><li>\n读到下一位 1：3² × 3 = 27（两次乘法）。\n<\/li><li>\n读到下一位 0：27² = 729（一次乘法）。\n<\/li><li>\n读到下一位 1：729² × 3 = 531441 × 3 = 1,594,323（两次乘法）。\n<\/ul>\n<p>合计 5 次乘法。核对：3^10 = 59,049，3^13 = 59,049 × 27 = 1,594,323 ✓。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为进制转换只用除法<\/strong>——整数部分用除，小数部分用乘，两者方向相反。\n<\/li><li>\n<strong>别以为多项式乘法就是系数逐个相乘<\/strong>——实际上第 k 项系数是所有下标和为 k 的乘积之和（卷积）。\n<\/li><li>\n<strong>别以为 Horner 只省时间不省空间<\/strong>——实际上它只用一个临时变量，空间也是 O(1)。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：十进制 100 的二进制表示是？\n<p>A. 1100100 B. 1001100 C. 1010100 D. 1110000 （答案：A；解析：64+32+4 = 100，对应位是第 6、5、2 位为 1，即 1100100。）<\/p>\n<\/ol>\n<ol><li>\n填空题：用秦九韶法则算 p(x) = 2x³ + 3x² + 5x + 7 在 x = 2 处的值，结果是 ___。\n<p>（答案：45；解析：2 → 2×2+3=7 → 7×2+5=19 → 19×2+7=45，与直接代入 16+12+10+7=45 一致。）<\/p>\n<\/ol>\n<ol><li>\n简答题：算 x^15 最少需要多少次乘法？给出过程。\n<p>（答案：6 次；解析：x²、x³、x⁶、x⁷、x¹⁴、x¹⁵ 各一次乘法，其中 x²、x⁶、x¹⁴ 是平方，其余是乘 x。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n整数转进制用除基取余、倒读；小数用乘基取整。\n<\/li><li>\n秦九韶：从最高次开始「乘 x 加系数」，O(n)。\n<\/li><li>\n快速幂按二进制位走，约 1.5 log2 n 次乘法。\n<\/li><li>\nHorner 与进制转换是同一个算法。\n<\/ul>", "c01": "<h1>线性同余发生器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>线性同余发生器用一条递推产生伪随机序列：x(n+1) = (a·x(n) + c) mod m，用模运算把状态压在 0 到 m−1 之间。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是历史上用得最广、分析得最透的伪随机数算法。理解它的三个参数如何决定周期，就理解了一个基本事实：伪随机性的质量有数论上的硬约束，不是调参调出来的。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 437.59375 87\" style=\"max-width: 437.59375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg15\"><style>#svg15{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg15 .error-icon{fill:#552222;}#svg15 .error-text{fill:#552222;stroke:#552222;}#svg15 .edge-thickness-normal{stroke-width:2px;}#svg15 .edge-thickness-thick{stroke-width:3.5px;}#svg15 .edge-pattern-solid{stroke-dasharray:0;}#svg15 .edge-pattern-dashed{stroke-dasharray:3;}#svg15 .edge-pattern-dotted{stroke-dasharray:2;}#svg15 .marker{fill:#333333;stroke:#333333;}#svg15 .marker.cross{stroke:#333333;}#svg15 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg15 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg15 .cluster-label text{fill:#333;}#svg15 .cluster-label span,#svg15 p{color:#333;}#svg15 .label text,#svg15 span,#svg15 p{fill:#333;color:#333;}#svg15 .node rect,#svg15 .node circle,#svg15 .node ellipse,#svg15 .node polygon,#svg15 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg15 .flowchart-label text{text-anchor:middle;}#svg15 .nod ntEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-Y LE-X\" id=\"L-Y-X-0\" d=\"M348.797,60.21L344.63,62.008C340.464,63.807,332.13,67.403,316.695,69.202C301.26,71,278.724,71,256.188,71C233.651,71,211.115,71,189.243,71C167.372,71,146.167,71,124.961,71C103.755,71,82.549,71,68.533,68.904C54.516,66.809,47.688,62.618,44.275,60.522L40.861,58.427\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(18.171875, 44.5)\" data-id=\"X\" data-node=\"true\" id=\"flowchart-X-195\" class=\"node default default flowchart-label\"><rect height=\"33\" width=\"36.34375\" y=\"-16.5\" x=\"-18.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-10.671875, -9)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"18\" width=\"21.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">x n</span></div></foreignObject></g></g><g transform=\"translate(124.9609375, 18)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-196\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"77.234375\" y=\"-18\" x=\"-38.6171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-31.1171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"62.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘 a 加 c</span></div></foreignObject></g></g><g transform=\"translate(256.1875, 18)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-198\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"85.21875\" y=\"-18\" x=\"-42.609375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-35.109375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"70.21875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">对 m 取余</span></div></foreignObject></g></g><g transform=\"translate(385.1953125, 44.5)\" data-id=\"Y\" data-node=\"true\" id=\"flowchart-Y-200\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"72.796875\" y=\"-18\" x=\"-36.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-28.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"57.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">x n 加一</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看这个环：状态只有 m 个可能值，所以周期必然不超过 m。满周期就是把 m 个值全走一遍。<\/p>\n<h2>详解<\/h2>\n<p><strong>参数的作用<\/strong>：<\/p>\n<ul><li>\nm 决定状态空间大小，也就是周期的上限。\n<\/li><li>\na 决定状态怎么跳。\n<\/li><li>\nc 决定是否包含 0 这个状态；c = 0 时叫纯乘同余，0 是死点，必须避开。\n<\/ul>\n<p><strong>满周期三条件<\/strong>：gcd(c, m) = 1；a−1 被 m 的所有素因子整除；m 被 4 整除时 a−1 也被 4 整除。<\/p>\n<p><strong>实例<\/strong>：m=16、a=5、c=3、x0=1，三条全满足，序列走遍 0 到 15，周期 16。<\/p>\n<p><strong>取余的代价<\/strong>：模取 2 的幂可用按位与代替除法，但低位周期短（第 k 位周期最多 2^(k+1)）；模取素数高低位都长，但要真除法。实践里常见做法是模取 2^31−1，或用两个发生器组合。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为周期等于 m 就好：顺序可能极有规律，还要看谱检验。\n<\/li><li>\n别以为改种子能提高质量：种子只改变起点，不改周期结构。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.2.1<\/td><td>线性同余<\/td><td>递推式与满周期条件<\/td><\/tr><tr><td>3.2.1.3<\/td><td>势<\/td><td>乘数对低位的混合速度<\/td><\/tr><tr><td>3.3<\/td><td>检验<\/td><td>谱检验查多维相关性<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：卷1 第 2 章的模运算\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">卡方检验<\/a>\n<\/ul>", "c02": "<h1>卡方检验<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>卡方检验比较观测频数与理论期望频数的偏差，把所有格子的「偏差平方除以期望」加起来得到一个统计量，再与临界值比较。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是检验伪随机数均匀性最常用的工具，也是所有「实际分布是否符合预期」问题的通用模板。理解了它，就理解了假设检验的基本逻辑：先假设「没问题」，再看数据偏离得是否离谱。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 356.453125 700\" style=\"max-width: 356.453125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg16\"><style>#svg16{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg16 .error-icon{fill:#552222;}#svg16 .error-text{fill:#552222;stroke:#552222;}#svg16 .edge-thickness-normal{stroke-width:2px;}#svg16 .edge-thickness-thick{stroke-width:3.5px;}#svg16 .edge-pattern-solid{stroke-dasharray:0;}#svg16 .edge-pattern-dashed{stroke-dasharray:3;}#svg16 .edge-pattern-dotted{stroke-dasharray:2;}#svg16 .marker{fill:#333333;stroke:#333333;}#svg16 .marker.cross{stroke:#333333;}#svg16 svg{fon 6\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">显著偏离 需查原因</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看最后的分叉：结论只有「没查出问题」与「查出问题」两种，不存在「证明均匀」。<\/p>\n<h2>详解<\/h2>\n<p>公式：χ² = Σ (O − E)² / E。<\/p>\n<p><strong>实例<\/strong>：骰子 60 次，六面计数 8、12、9、11、10、10，期望各 10。 χ² = (4+4+1+1+0+0)/10 = 1.0。自由度 5，5% 临界值 11.07，1.0 远小于它，不显著。<\/p>\n<p><strong>自由度<\/strong>：格子数减 1。因为频数总和被样本量固定，最后一个格子的值是推出来的。<\/p>\n<p><strong>期望频数下限<\/strong>：每格期望不小于 5，否则卡方分布近似失效，要合并格子。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为卡方值小就一定好：接近 0 说明「整齐得不像抽样」。\n<\/li><li>\n别以为通过检验就证明随机：只证明这批数据没暴露问题。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>3.3.1<\/td><td>一般检验过程<\/td><td>卡方的构造与自由度<\/td><\/tr><tr><td>3.3.2<\/td><td>经验检验<\/td><td>对具体发生器做卡方<\/td><\/tr><tr><td>3.3.4<\/td><td>谱检验<\/td><td>另一种相关性的检验<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">线性同余发生器<\/a>\n<\/li><li>\n后续：卷3 排序的平均情况分析\n<\/ul>", "c03": "<h1>秦九韶法则与多精度乘法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3、4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>秦九韶法则（Horner）把 n 次多项式求值化成 n 次乘加；多精度乘法把大整数切块，用竖式逐块相乘，朴素代价 O(n²)。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两件事看起来无关，其实共享同一个思路：<strong>把高次问题拆成逐层递推<\/strong>。秦九韶把「求幂」拆成「每层乘一次 x」；多精度乘法把「大数相乘」拆成「小块相乘再进位」。后者再往前走一步，就是快速乘法。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 400.4609375 396\" style=\"max-width: 400.4609375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg17\"><style>#svg17{font-family:\"trebuchet ms\",verdana,a ect height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(63.9453125, 18)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-217\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多项式求值</span></div></foreignObject></g></g><g transform=\"translate(63.9453125, 104)\" data-id=\"H1\" data-node=\"true\" id=\"flowchart-H1-218\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127\" y=\"-18\" x=\"-63.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从最高系数开始</span></div></foreignObject></g></g><g transform=\"translate(63.9453125, 190)\" data-id=\"H2\" data-node=\"true\" id=\"flowchart-H2-220\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"127.890625\" y=\"-18\" x=\"-63.9453125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-56.4453125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112.890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">乘 x 加下一系数</span></div></foreignObject></g></g><g transform=\"translate(63.9453125, 276)\" data-id=\"H3\" data-node=\"true\" id=\"flowchart-H3-222\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">重复到常数项</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 18)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-223\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">大数相乘</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 104)\" data-id=\"M1\" data-node=\"true\" id=\"flowchart-M1-224\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">按基数切块</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 190)\" data-id=\"M2\" data-node=\"true\" id=\"flowchart-M2-226\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">逐块相乘 错位相加</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 276)\" data-id=\"M3\" data-node=\"true\" id=\"flowchart-M3-228\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"113.6875\" y=\"-18\" x=\"-56.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"98.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">朴素 O n 平方</span></div></foreignObject></g></g><g transform=\"translate(251.6171875, 362)\" data-id=\"M4\" data-node=\"true\" id=\"flowchart-M4-230\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"265.6875\" y=\"-18\" x=\"-132.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-125.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"250.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">对半切开 三次乘法 约 n 一点五八五</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看两条线的共同点：都是「从一端开始，每步只做一次小运算，把结果交给下一步」。<\/p>\n<h2>详解<\/h2>\n<p><strong>Horner 实例<\/strong>：p(x)=2x³+3x²+5x+7，x=2。 2 → 2×2+3=7 → 7×2+5=19 → 19×2+7=45。直接代入也是 45，两条路必须对上。<\/p>\n<p><strong>多精度实例<\/strong>：按十进制竖式算 47×23。 3×47=141；2×47=94 左移一位得 940；141+940=1081。<\/p>\n<p><strong>代价对照<\/strong>：Horner 是 O(n)；朴素多精度乘法是 O(n²)；快速乘法用三次半规模乘法替代四次，得 T(n)=3T(n/2)+O(n)，即 O(n^1.585)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Horner 只适用于多项式：进制转换的「乘基累加」就是它。\n<\/li><li>\n别以为快速乘法总要更快：小规模时递归开销超过收益，要设阈值。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>4.3.1<\/td><td>经典算法<\/td><td>竖式乘法与进位<\/td><\/tr><tr><td>4.3.3<\/td><td>乘法有多快<\/td><td>快速乘法的递归式<\/td><\/tr><tr><td>4.6.4<\/td><td>多项式求值<\/td><td>秦九韶法则<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">卡方检验<\/a>\n<\/li><li>\n后续：卷4 组合计数的生成函数\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：伪随机数怎么造<\/strong><br>阅读：<a href=\"#/book/taocp-v2/chapter/ch01\">第 1 章：随机数是怎么造出来的<\/a><br>检查点：能手算一个模 16 的线性同余序列并数出周期，说清满周期的三个条件<\/li><li class='path-step' id='path-02'><strong>步骤 02：怎么证明它像随机数<\/strong><br>阅读：<a href=\"#/book/taocp-v2/chapter/ch02\">第 2 章：检验随机性，并把随机数用起来<\/a><br>检查点：能算一次卡方统计量并与临界值比较，能写出逆变换法与洗牌的正确做法<\/li><li class='path-step' id='path-03'><strong>步骤 03：浮点与多精度算术<\/strong><br>阅读：<a href=\"#/book/taocp-v2/chapter/ch03\">第 3 章：浮点与多精度算术<\/a><br>检查点：能解释 0.1 加 0.2 为何不等于 0.3，能算出两个 n 位整数朴素乘法的次数<\/li><li class='path-step' id='path-04'><strong>步骤 04：进制、有理数与多项式<\/strong><br>阅读：<a href=\"#/book/taocp-v2/chapter/ch04\">第 4 章：进制、有理数与多项式<\/a><br>检查点：能用秦九韶法则手算一个四次多项式，能说清快速乘法的递归式<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：随机数是怎么造出来的<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性同余法满周期的条件不包括下列哪一条？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> c 与 m 互素<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> a−1 被 m 的所有素因子整除<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> m 必须是素数<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> m 被 4 整除时 a−1 也被 4 整除<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> m=16、a=5、c=3、x0=1 的线性同余序列，周期是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 模取 2 的幂时，线性同余序列的哪一部分质量最差？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> 最高位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='1'> 最低位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='2'> 中间位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='3'> 都一样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：检验随机性，并把随机数用起来<\/h2><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 掷骰子 60 次，六面各出现 10 次，卡方统计量是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 10<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q05' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 卡方检验分成 6 个格子，自由度是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 正确的洗牌做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q06' va  模取素数或组合两个发生器，并做谱检验<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 平方取中法<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 固定种子重复使用同一段序列<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div>", "__quiz_ch01__": "<h1>测验：第 1 章：随机数是怎么造出来的<\/h1><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 线性同余法满周期的条件不包括下列哪一条？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> c 与 m 互素<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> a−1 被 m 的所有素因子整除<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> m 必须是素数<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> m 被 4 整除时 a−1 也被 4 整除<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> m=16、a=5、c=3、x0=1 的线性同余序列，周期是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 模取 2 的幂时，线性同余序列的哪一部分质量最差？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> 最高位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='1'> 最低位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='2'> 中间位<\/label><label class='quiz-opt'><input type='radio' name='ch01-q03' value='3'> 都一样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：检验随机性，并把随机数用起来<\/h1><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 掷骰子 60 次，六面各出现 10 次，卡方统计量是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 10<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q05' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 卡方检验分成 6 个格子，自由度是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 正确的洗牌做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q06' value='0'> 每个 i 与 1 到 n 中随机位置交换<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='1'> 从 i=n 递减，与 1 到 i 中随机位置交换<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='2'> 随机排序键后排序<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='3'> 每次随机取两个位置交换 n 次<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：浮点与多精度算术<\/h1><div class='quiz-item' data-qid='ch03-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 双精度浮点数的尾数（含隐含位）是多少位？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q07' value='0'> 24<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='1'> 32<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='2'> 53<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='3'> 64<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q08' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 快速乘法递归式 T(n)=3T(n/2)+O(n) 的复杂度指数约为多少？（填三位小数）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 双精度下 1e16 + 1 − 1e16 的结果是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q09' value='0'> 0<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='3'> 1e16<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：进制、有理数与多项式<\/h1><div class='quiz-item' data-qid='ch04-q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 十进制 100 的二进制表示是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q10' value='0'> 1100100<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='1'> 1001100<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='2'> 1010100<\/label><label class='quiz-opt'><input type='radio' name='ch04-q10' value='3'> 1110000<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q11' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 用秦九韶法则算 2x³+3x²+5x+7 在 x=2 处的值，结果是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 计算 x^15 最少需要多少次乘法？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q12' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='1'> 6<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='2'> 15<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='3'> 8<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='伪随机数'>伪随机数 — 由确定性算法产生、但通过统计检验看起来像随机的数列。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='线性同余法'>线性同余法 — 用 x 的下一项等于 a 乘 x 加 c 再对 m 取余来生成数列。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='周期'>周期 — 数列开始重复之前的不同项个数。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='满周期'>满周期 — 周期恰好等于模 m，一个周期内取遍所有余数。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='势'>势 — 衡量乘数在二进制低位上混合快慢的指标。 <span class=glossary-ref>（第 1 章：随机数是怎么造出来的）<\/span><\/li><li data-term='卡方检验'>卡方检验 — 把观测频数与期望频数的偏差平方后按期望归一，再加总得到的统计量。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='柯尔莫哥洛夫检验'>柯尔莫哥洛夫检验 — 比较经验分布函数与理论分布函数的最大差距。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='逆变换法'>逆变换法 — 用均匀随机数经过目标分布的累积分布函数反函数，得到该分布的随机数。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='洗牌'>洗牌 — 把 n 个元素随机重排，使 n! 种排列等概率出现。 <span class=glossary-ref>（第 2 章：检验随机性，并把随机数用起来）<\/span><\/li><li data-term='浮点'>浮点 — 用符号、指数、尾数三部分表示实数，尾数位数决定精度。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='有效位'>有效位 — 浮点尾数中真正可靠的二进制位数。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='多精度算术'>多精度算术 — 把大整数切成若干位一块，用数组表示并逐块运算。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='模算术'>模算术 — 只保留余数的算术，加减乘可以直接做，除法要解同余式。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='快速乘法'>快速乘法 — 把大整数对半切开，用三次半规模乘法替代四次，把复杂度降到约 n 的 1.585 次方。 <span class=glossary-ref>（第 3 章：浮点与多精度算术）<\/span><\/li><li data-term='秦九韶法则'>秦九韶法则 — 从最高次项开始，每次「乘 x 再加下一项」的求值方法。 <span class=glossary-ref>（第 4 章：进制、有理数与多项式）<\/span><\/li><li data-term='幂级数'>幂级数 — 形如 a0 加 a1x 加 a2x 平方……的无穷和，用于近似函数。 <span class=glossary-ref>（第 4 章：进制、有理数与多项式）<\/span><\/li><li data-term='进制转换'>进制转换 — 把一个整数在基数 b 与基数 b 的幂之间重新表示。 <span class=glossary-ref>（第 4 章：进制、有理数与多项式）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：造一个可用的伪随机数发生器<\/h2>\n<ol><li>\n<strong>选类型<\/strong>：需要长周期、可重复 → 线性同余；需要更高质量 → 组合多个发生器（如相加或异或）。\n<\/li><li>\n<strong>选模<\/strong>：模取 2 的幂便于硬件取余，但低位质量差；取素数（如 2^31−1）低位与高位一样好。\n<\/li><li>\n<strong>选乘数<\/strong>：模 2^e 时乘数取 a ≡ 5 (mod 8)，纯乘同余也能拿到 2^(e−2) 的周期。\n<\/li><li>\n<strong>验周期<\/strong>：m、c 互素，a−1 能被 m 的所有素因子整除，m 被 4 整除时 a−1 也被 4 整除 —— 三条齐了才是满周期。\n<\/li><li>\n<strong>做检验<\/strong>：卡方查均匀性，柯尔莫哥洛夫查分布形状，谱检验查多维相关性。\n<\/ol>\n<h2>决策规则：随机数用哪种变换<\/h2>\n<ul><li>\n只要均匀整数 → 直接用发生器的输出。\n<\/li><li>\n要 0 到 1 的实数 → 输出除以模，注意不要用到低位。\n<\/li><li>\n要正态分布 → Box-Muller（两个均匀数经对数与三角函数）。\n<\/li><li>\n要任意分布 → 逆变换法，前提是累积分布函数的反函数可算。\n<\/li><li>\n要随机排列 → Fisher-Yates 洗牌，从后往前，每次与前面随机位置交换。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用 rand() % n 取范围<\/strong>。当 n 不整除发生器周期时会引入偏斜，正确做法是拒绝采样或先放大再取整。\n<\/li><li>\n<strong>把低位当高位用<\/strong>。线性同余的低位周期很短（模 2^e 时第 0 位周期只有 2），要取高位。\n<\/li><li>\n<strong>用同一个种子跑两次实验还当成独立样本<\/strong>。伪随机数可重复是优点，但重复的样本不是新样本。\n<\/li><li>\n<strong>浮点数直接用 == 比较<\/strong>。应比较差值是否小于容差。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>线性同余<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>递推式<\/td><td>x(n+1) = (a·x(n) + c) mod m<\/td><\/tr><tr><td>满周期三条件<\/td><td>gcd(c, m) = 1；a−1 被 m 的所有素因子整除；m 被 4 整除时 a−1 也被 4 整除<\/td><\/tr><tr><td>模 2^e 的乘数<\/td><td>a ≡ 5 (mod 8)，纯乘同余周期 2^(e−2)<\/td><\/tr><tr><td>取范围<\/td><td>用高位，不要用低位<\/td><\/tr><\/tbody><\/table>\n<h2>常用检验<\/h2>\n<table><thead><tr><th>检验<\/th><th>统计量<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>卡方<\/td><td>Σ(观测−期望)²/期望<\/td><td>频数是否均匀<\/td><\/tr><tr><td>柯尔莫哥洛夫<\/td><td>经验分布与理论分布的最大差<\/td><td>分布形状<\/td><\/tr><tr><td>谱检验<\/td><td>多维格点的最大空隙<\/td><td>相邻数的相关性<\/td><\/tr><\/tbody><\/table>\n<h2>浮点与多精度<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>单精度<\/td><td>约 7 位十进制有效数字<\/td><\/tr><tr><td>双精度<\/td><td>约 16 位十进制有效数字<\/td><\/tr><tr><td>朴素乘法<\/td><td>n 位 × n 位需 n² 次单位乘法<\/td><\/tr><tr><td>快速乘法<\/td><td>T(n) = 3T(n/2) + O(n)，约 O(n^1.585)<\/td><\/tr><tr><td>秦九韶<\/td><td>n 次多项式只需 n 次乘法加 n 次加法<\/td><\/tr><\/tbody><\/table>\n<h2>洗牌<\/h2>\n<p>从 i = n 递减到 2，随机取 j 在 1 到 i 之间，交换 i 与 j。n! 种排列等概率。<\/p>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：随机数是怎么造出来的", "href": "#/chapter/ch01"}, {"label": "第 2 章：检验随机性，并把随机数用起来", "href": "#/chapter/ch02"}, {"label": "第 3 章：浮点与多精度算术", "href": "#/chapter/ch03"}, {"label": "第 4 章：进制、有理数与多项式", "href": "#/chapter/ch04"}]}, {"label": "概念", "children": [{"label": "线性同余发生器", "href": "#/concept/c01"}, {"label": "卡方检验", "href": "#/concept/c02"}, {"label": "秦九韶法则与多精度乘法", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：随机数是怎么造出来的", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：检验随机性，并把随机数用起来", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：浮点与多精度算术", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：进制、有理数与多项式", "href": "#/quiz/ch04"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true}},"taocp-v3":{"manifest": {"slug": "taocp-v3", "title": "计算机程序设计艺术 卷3：排序与查找", "subtitle": "把「找」和「排」这两件事的代价算到底", "book": {"title": "计算机程序设计艺术 卷3 排序与查找（第2版）", "author": "Donald E. Knuth（高德纳）著，贾洪峰 译", "source": ["图灵计算机科学丛书 计算机程序设计艺术 卷3 排序与查找 第2版.pdf（扫描版 625 页）"]}, "audience": "学过卷1、写过基本数据结构代码的读者", "goal": "系统掌握：能判断一个排序或查找场景该用哪种结构，能算出比较次数与 I/O 趟数，能解释 n log n 下界与散列退化的边界。", "companion": "taocp-v3学习伴侣.html", "learningPath": [{"step": "01", "title": "先看清排序的组合结构", "chapterIds": ["ch01"], "checkpoint": "能数逆序对、算多重集排列数、说出平均游程数"}, {"step": "02", "title": "五类内部排序与取舍", "chapterIds": ["ch02"], "checkpoint": "能针对四个场景各选一种算法并说出理由"}, {"step": "03", "title": "下界与排序网络", "chapterIds": ["ch03"], "checkpoint": "能推出 log2 n! 下界，能用 0-1 原理验证小网络"}, {"step": "04", "title": "外部排序", "chapterIds": ["ch04"], "checkpoint": "能算合并趟数与替代选择的游程长度"}, {"step": "05", "title": "查找结构与 B 树", "chapterIds": ["ch05"], "checkpoint": "能算二分与 B 树的层数，解释 AVL 的最坏保证"}, {"step": "06", "title": "散列与辅助键", "chapterIds": ["ch06"], "checkpoint": "能按装载因子估算平均查找长度，解释墓碑的必要性"}], "chapters": [{"id": "ch01", "title": "第 1 章：排序的组合性质", "file": "chapters/ch01-排序的组合性质.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：内部排序——五类算法与它们的代价", "file": "chapters/ch02-内部排序.md", "difficulty": 3}, {"id": "ch03", "title": "第 3 章：最优排序——比较次数的下界与排序网络", "file": "chapters/ch03-最优排序.md", "difficulty": 3}, {"id": "ch04", "title": "第 4 章：外部排序——数据比内存大怎么办", "file": "chapters/ch04-外部排序.md", "difficulty": 3}, {"id": "ch05", "title": "第 5 章：查找——从顺序扫到平衡树", "file": "chapters/ch05-查找.md", "difficulty": 3}, {"id": "ch06", "title": "第 6 章：散列查找与辅助键", "file": "chapters/ch06-散列与辅助键.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "逆序与排序代价", "file": "concepts/inversions-and-cost.md", "chapterIds": ["ch01", "ch02"]}, {"id": "c02", "title": "比较树下界", "file": "concepts/comparison-tree-lower-bound.md", "chapterIds": ["ch03"]}, {"id": "c03", "title": "散列与装载因子", "file": "concepts/hashing-load-factor.md", "chapterIds": ["ch06"]}], "glossary": [{"term": "逆序对", "def": "排列中前一个数大于后一个数的一对位置。", "chapterId": "ch01"}, {"term": "游程", "def": "排列中一段连续递增的最长子序列。", "chapterId": "ch01"}, {"term": "对合", "def": "做两次回到原样的置换，循环长度只能是 1 或 2。", "chapterId": "ch01"}, {"term": "稳定排序", "def": "相等元素在排序后保持原来的相对次序。", "chapterId": "ch02"}, {"term": "基准", "def": "快速排序中用来划分数组的元素。", "chapterId": "ch02"}, {"term": "堆", "def": "一种完全二叉树，每个节点都不小于（或不大于）它的孩子。", "chapterId": "ch02"}, {"term": "基数排序", "def": "按键的每一位分配与收集，不做元素间比较的排序。", "chapterId": "ch02"}, {"term": "比较树", "def": "把排序过程画成判断树，内部节点是比较，叶子是输出排列。", "chapterId": "ch03"}, {"term": "排序网络", "def": "一组固定的比较器，比较顺序与输入无关，可并行执行。", "chapterId": "ch03"}, {"term": "0-1 原理", "def": "若网络能排好所有 0/1 输入，就能排好任意输入。", "chapterId": "ch03"}, {"term": "初始游程", "def": "外部排序中一块内存数据排好后写到磁盘上的有序段。", "chapterId": "ch04"}, {"term": "替代选择", "def": "用堆边写边读，使平均游程长度达到缓冲区容量两倍的方法。", "chapterId": "ch04"}, {"term": "多阶段合并", "def": "用不均匀分配让有限磁带轮流充当输出的合并策略。", "chapterId": "ch04"}, {"term": "AVL 树", "def": "每个节点左右子树高度差不超过 1 的二叉查找树。", "chapterId": "ch05"}, {"term": "B 树", "def": "每个节点可存多个键、多个孩子，所有叶子同层的多路查找树。", "chapterId": "ch05"}, {"term": "装载因子", "def": "散列表中键数与槽数之比。", "chapterId": "ch06"}, {"term": "一次聚集", "def": "线性探测把连续槽位占满、越聚越长的现象。", "chapterId": "ch06"}, {"term": "墓碑", "def": "开放地址法删除后留下的标记，保证探测链不被截断。", "chapterId": "ch06"}, {"term": "倒排索引", "def": "由辅助键值指向包含该值的主键列表的结构。", "chapterId": "ch06"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "blank", "question": "排列 4, 3, 2, 1 的逆序对数是多少？（填数字）", "options": [], "answer": "6", "explain": "每一对都是逆序，共 C(4,2)=6 个，也等于插入排序的最坏移动次数。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "A、A、B、B 四个字符共有多少种不同排列？", "options": ["4", "6", "12", "24"], "answer": 1, "explain": "4!/(2!2!) = 24/4 = 6。"}, {"id": "ch01-q03", "chapterId": "ch01", "type": "single", "question": "随机排列的期望升序游程段数是？", "options": ["n/2", "(n+1)/2", "log n", "n"], "answer": 1, "explain": "期望升序游程数为 (n+1)/2，自然合并排序按游程合并。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "对已经升序排列的数组取首元素为基准做快排，复杂度是？", "options": ["O(n)", "O(n log n)", "O(n²)", "O(log n)"], "answer": 2, "explain": "每次划分一边空一边全，递归深度 n，总代价 n²。"}, {"id": "ch02-q05", "chapterId": "ch02", "type": "blank", "question": "堆排序建堆的代价是 O(___)。（填字母 n 或 n log n）", "options": [], "answer": "n", "explain": "自底向上建堆总代价 O(n)，因为大部分节点在下层、下沉距离短。"}, {"id": "ch02-q06", "chapterId": "ch02", "type": "single", "question": "基数排序必须满足的性质是？", "options": ["稳定", "原地", "比较元素大小", "递归"], "answer": 0, "explain": "从低位到高位，高位分配时必须保持低位结果的相对次序，所以必须稳定。"}, {"id": "ch03-q07", "chapterId": "ch03", "type": "blank", "question": "5 个元素排序，最坏情况至少需要多少次比较？（填数字）", "options": [], "answer": "7", "explain": "log2(5!) = log2 120 ≈ 6.91，向上取整 7，且 7 次可做到。"}, {"id": "ch03-q08", "chapterId": "ch03", "type": "single", "question": "排序网络的核心优势是？", "options": ["比较次数最少", "无分支、可并行", "不需要额外空间", "稳定"], "answer": 1, "explain": "网络结构固定，所有比较按层同时执行，适合硬件；比较次数通常更多。"}, {"id": "ch03-q09", "chapterId": "ch03", "type": "single", "question": "0-1 原理的作用是？", "options": ["把任意输入化归为 0/1 输入来验证网络", "证明快排最优", "计算逆序对数", "分析散列冲突"], "answer": 0, "explain": "只需验证 2^n 种 0/1 输入，若全排好则任意输入都排好。"}, {"id": "ch04-q10", "chapterId": "ch04", "type": "blank", "question": "1000 个初始游程做 4 路合并，需要多少趟？（填数字）", "options": [], "answer": "5", "explain": "4⁴=256 不够，4⁵=1024 够，所以 5 趟。"}, {"id": "ch04-q11", "chapterId": "ch04", "type": "single", "question": "替代选择在随机输入下的平均游程长度约为缓冲区容量的多少倍？", "options": ["0.5", "1", "2", "4"], "answer": 2, "explain": "Knuth 的分析给出平均约 2P，P 为缓冲区记录数，游程数因此减半。"}, {"id": "ch04-q12", "chapterId": "ch04", "type": "single", "question": "多阶段合并主要解决什么问题？", "options": ["比较次数太多", "磁带台数不足", "内存太大", "键值范围太小"], "answer": 1, "explain": "k 路合并需 k 台输入加 1 台输出，台数不够时用不均匀分配轮流用空带。"}, {"id": "ch05-q13", "chapterId": "ch05", "type": "blank", "question": "在 1 到 9 的有序数组里二分查找 7，需要多少次比较？（填数字）", "options": [], "answer": "2", "explain": "先比中间 5，7 大于 5；再在 6 到 9 中比中间 7，命中。"}, {"id": "ch05-q14", "chapterId": "ch05", "type": "single", "question": "二叉查找树最坏情况下的查找代价是？", "options": ["O(1)", "O(log n)", "O(n)", "O(n log n)"], "answer": 2, "explain": "按升序插入退化成链，查找退化为顺序扫描。"}, {"id": "ch05-q15", "chapterId": "ch05", "type": "single", "question": "10 亿个键、每节点 100 个孩子的 B 树，大约几层？", "options": ["3", "5", "10", "30"], "answer": 1, "explain": "log_100(10⁹) = 4.5，约 5 层；每层通常对应一次磁盘读。"}, {"id": "ch06-q16", "chapterId": "ch06", "type": "blank", "question": "m = 13，键 44 的除法散列槽位是多少？（填数字）", "options": [], "answer": "5", "explain": "44 = 3×13 + 5，余数 5。"}, {"id": "ch06-q17", "chapterId": "ch06", "type": "single", "question": "链地址法在 α = 2 时，成功查找平均比较次数约为？", "options": ["1", "2", "4", "8"], "answer": 1, "explain": "成功查找约 1 + α/2 = 2 次。"}, {"id": "ch06-q18", "chapterId": "ch06", "type": "single", "question": "开放地址法删除元素时为什么需要墓碑？", "options": ["为了节省空间", "为了保持探测链不断", "为了提高散列速度", "为了支持排序"], "answer": 1, "explain": "直接清空会截断后续键的探测链，使本来存在的键查找失败。"}, {"id": "q19", "chapterId": "__all__", "type": "single", "question": "综合题：一个日志系统要按时间排序 10 GB 数据，内存只有 1 GB，最合理的方案是？", "options": ["直接快速排序", "生成初始游程后用替代选择与多路合并", "用散列表", "用二叉查找树"], "answer": 1, "explain": "数据远大于内存必须外部排序；替代选择把平均游程做到 2P，多路合并减少趟数。快排装不下，散列与二叉查找树不解决排序。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "逆序对是什么？平均有多少个？", "back": "前大后小的一对位置；n 个元素的平均逆序对数为 n(n−1)/4。", "tags": ["组合性质"]}, {"id": "f02", "chapterId": "ch01", "front": "插入排序的移动次数等于什么？", "back": "等于初始逆序对数，每次左移一格消除恰好一个逆序对。", "tags": ["组合性质"]}, {"id": "f03", "chapterId": "ch01", "front": "多重集排列的种数公式？", "back": "n! 除以各重复组阶乘之积，n!/(n1!n2!…nk!)。", "tags": ["组合性质"]}, {"id": "f04", "chapterId": "ch02", "front": "五类内部排序是哪五类？", "back": "插入、交换、选择、合并、分布。", "tags": ["排序"]}, {"id": "f05", "chapterId": "ch02", "front": "快排最坏 O(n²) 的典型触发条件？", "back": "输入已有序却取首元素当基准，每次划分极不均衡。", "tags": ["排序"]}, {"id": "f06", "chapterId": "ch02", "front": "堆排序为什么最坏也是 O(n log n)？", "back": "建堆 O(n)，之后每次下沉 O(log n)，共 n 次，与输入无关。", "tags": ["排序"]}, {"id": "f07", "chapterId": "ch02", "front": "哪种排序稳定且 O(n log n)，代价是什么？", "back": "合并排序；代价是需要 O(n) 额外空间。", "tags": ["排序"]}, {"id": "f08", "chapterId": "ch03", "front": "比较排序的下界怎么推？", "back": "比较树至少 n! 个叶子，高度 ≥ log2(n!)，约 n log2 n − 1.44n。", "tags": ["下界"]}, {"id": "f09", "chapterId": "ch03", "front": "5 个元素最坏最少比较几次？", "back": "7 次，因为 log2 120 ≈ 6.91，向上取整。", "tags": ["下界"]}, {"id": "f10", "chapterId": "ch03", "front": "0-1 原理说的是什么？", "back": "若排序网络能排好所有 2^n 种 0/1 输入，就能排好任意输入。", "tags": ["排序网络"]}, {"id": "f11", "chapterId": "ch04", "front": "外部排序的趟数公式？", "back": "ceil(log_k R)，R 是初始游程数，k 是合并路数。", "tags": ["外部排序"]}, {"id": "f12", "chapterId": "ch04", "front": "替代选择的平均游程长度是多少？", "back": "约 2P，P 是缓冲区可容纳的记录数。", "tags": ["外部排序"]}, {"id": "f13", "chapterId": "ch04", "front": "多阶段合并为什么需要不均匀分配？", "back": "磁带台数有限，需要始终留一台空带当输出，按 Fibonacci 式分配可做到。", "tags": ["外部排序"]}, {"id": "f14", "chapterId": "ch05", "front": "顺序查找与二分查找的平均代价？", "back": "顺序 (n+1)/2；二分约 log2 n，但要求有序且可随机访问。", "tags": ["查找"]}, {"id": "f15", "chapterId": "ch05", "front": "AVL 树的高度上界？", "back": "约 1.44 log2(n+2) − 0.33，最坏也有对数级保证。", "tags": ["查找"]}, {"id": "f16", "chapterId": "ch05", "front": "B 树为什么适合数据库索引？", "back": "扇出 m 大使层数为 log_m n，每层一次磁盘读，I/O 次数远少于二叉树。", "tags": ["查找"]}, {"id": "f17", "chapterId": "ch06", "front": "链地址法的平均查找长度？", "back": "成功约 1 + α/2，失败约 α，α 是装载因子。", "tags": ["散列"]}, {"id": "f18", "chapterId": "ch06", "front": "线性探测的平均查找长度与 α 的关系？", "back": "成功约 (1/2)(1 + 1/(1−α))，α 趋近 1 时急剧恶化。", "tags": ["散列"]}]}, "rendered": {"ch01": "<h1>第 1 章：排序的组合性质<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：卷1 第 2 章（排列与二项式系数）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n数出一个排列里的逆序对，并说明它和插入排序移动次数的关系。\n<\/li><li>\n算多重集排列的种数。\n<\/li><li>\n说出「游程」是什么，以及随机排列的平均游程数。\n<\/li><li>\n解释研究这些组合量对分析排序算法有什么用。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>排序算法的平均代价，几乎都能写成「某个组合量的期望」；先把组合量算清楚，后面各节的复杂度公式才有依据。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：逆序（反序）与逆序对（难度：基础）<\/h3>\n<p>在一个排列里，如果前面的数比后面的大，这一对就叫一个<strong>逆序对<\/strong>。<\/p>\n<p><strong>实例<\/strong>：排列 3, 1, 4, 2。<\/p>\n<ul><li>\n(3,1)：3 &gt; 1，是\n<\/li><li>\n(3,4)：不是\n<\/li><li>\n(3,2)：3 &gt; 2，是\n<\/li><li>\n(1,4)：不是\n<\/li><li>\n(1,2)：不是\n<\/li><li>\n(4,2)：4 &gt; 2，是\n<\/ul>\n<p>共 3 个逆序对。<\/p>\n<p><strong>它为什么重要<\/strong>：插入排序每把一个元素往左挪一格，就消除恰好一个逆序对。所以<strong>插入排序的移动次数 = 初始逆序对数<\/strong>。<\/p>\n<p><strong>平均逆序对数<\/strong>：所有 n! 个排列平均下来是 n(n−1)/4。n = 4 时是 3，正好等于上面那个排列的逆序对数（巧合而已，不是每个排列都等于 3）。<\/p>\n<h3>概念 2：多重集的排列（难度：基础）<\/h3>\n<p>如果 n 个对象里有重复，全排列数要除以重复组的阶乘：<\/p>\n<p>种数 = n! / (n1! n2! … nk!)<\/p>\n<p>其中 ni 是第 i 类重复对象的个数。<\/p>\n<p><strong>实例<\/strong>：字母 A、A、B 三个字符的排列。3!/(2!1!) = 3，实际是 AAB、ABA、BAA 三种。 <strong>实例<\/strong>：A、A、B、B 四个字符：4!/(2!2!) = 6。<\/p>\n<p><strong>为什么这样除<\/strong>：把重复的对象先当成不同的，有 n! 种；每一种真实排列被重复数了 n1!×n2!×… 次（每个重复组内部怎么换都得到同一个排列）。<\/p>\n<h3>概念 3：游程（难度：进阶）<\/h3>\n<p>把排列从左往右扫，一段连续递增的最长子序列叫一个<strong>升序游程<\/strong>。整条排列可以切成若干游程。<\/p>\n<p><strong>实例<\/strong>：3, 5, 7, 1, 2, 9, 4 的升序游程是 [3,5,7]、[1,2,9]、[4]，共 3 段。<\/p>\n<p><strong>平均游程数<\/strong>：随机排列的期望升序游程数是 (n+1)/2。n = 7 时约 4 段，与上例的 3 段接近（样本只有一个，不必强求相等）。<\/p>\n<p><strong>它为什么重要<\/strong>：自然合并排序（natural merge sort）就是先找出这些游程，再把相邻游程两两合并。初始游程越少，合并趟数越少。这就是「输入已有的有序性」被利用的地方。<\/p>\n<h3>概念 4：置换的循环结构与对合（难度：进阶）<\/h3>\n<p>任何置换都能唯一分解成若干个互不相交的循环。例如把 1→3、3→2、2→1、4→4 写成 (1 3 2)(4)。<\/p>\n<ul><li>\n一个循环里元素的个数叫循环长度。\n<\/li><li>\n长度全为 1 的置换是恒等置换。\n<\/li><li>\n<strong>对合<\/strong>是「做两次回到原样」的置换，它的循环长度只能是 1 或 2。\n<\/ul>\n<p><strong>实例<\/strong>：交换 1 与 2、固定 3 的置换是 (1 2)(3)，做两次回到原样，是对合。 <strong>用途<\/strong>：卷4 生成排列时会用到「相邻交换」的格雷码路径，那条路径正是由对合式的交换序列构成的。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 593 224\" style=\"max-width: 593px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg18\"><style>#svg18{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg18 .error-icon{fill:#552222;}#svg18 .error-text{fill:#552222;stroke:#552222;}#svg18 .edge-thickness-normal{stroke-width:2px;}#svg18 .edge-thickness-thick{stroke-width:3.5px;}#svg18 .edge-pattern-solid{stroke-dasharray:0;}#svg18 .edge-pattern-dashed{stroke-dasharray:3;}#svg18 .edge-pattern-dotted{stroke-dasharray:2;}#svg18 .marker{fill:#333333;stroke:#333333;}#svg18 .marker.cross{stroke:#333333;}#svg18 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg18 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg18 .cluster-label text{fill:#333;}#svg18 .cluster-label span,#svg18 p{color:#333;}#svg18 .label text,#svg18 span,#svg18 p{fill:#333;color:#333;}#svg18 .node rect,#svg18 .node circle,#svg18 .node ellipse,#svg18 .node polygon,#svg18 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg18 .flowchart-label text{text-anchor:middle;}#svg18 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg18 .node .label{text-align:center;}#svg18 .node.clickable{cursor:pointer;}#svg18 .arrowheadPath{fill:#333333;}#svg18 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg18 .flowchart-link{stroke:#333333;fill:none;}#svg18 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg18 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg18 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg18 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg18 .cluster text{fill:#333;}#svg18 .cluster span,#svg18 p{color:#333;}#svg18 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg18 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg18 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg18_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg18_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 5 L 10 10 L 10 0 z\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"11\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg18_flowchart-circleEnd\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"-1\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg18_flowchart-circleStart\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg18_flowchart-crossEnd\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg18_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-I\" id=\"L-P-I-0\" d=\"M249,26.127L220.75,31.939C192.5,37.751,136,49.376,107.75,58.471C79.5,67.567,79.5,74.133,79.5,77.417L79.5,80.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-R\" id=\"L-P-R-0\" d=\"M288.5,36L288.5,40.167C288.5,44.333,288.5,52.667,288.5,60.117C288.5,67.567,288.5,74.133,288.5,77.417L288.5,80.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-C\" id=\"L-P-C-0\" d=\"M328,26.127L356.25,31.939C384.5,37.751,441,49.376,469.25,58.471C497.5,67.567,497.5,74.133,497.5,77.417L497.5,80.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-I LE-S1\" id=\"L-I-S1-0\" d=\"M79.5,122L79.5,126.167C79.5,130.333,79.5,138.667,79.5,146.117C79.5,153.567,79.5,160.133,79.5,163.417L79.5,166.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-R LE-S2\" id=\"L-R-S2-0\" d=\"M288.5,122L288.5,126.167C288.5,130.333,288.5,138.667,288.5,146.117C288.5,153.567,288.5,160.133,288.5,163.417L288.5,166.7\"></path><path marker-end=\"url(#svg18_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-S3\" id=\"L-C-S3-0\" d=\"M497.5,122L497.5,126.167C497.5,130.333,497.5,138.667,497.5,146.117C497.5,153.567,497.5,160.133,497.5,163.417L497.5,166.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(288.5, 18)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-231\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">一个排列</span></div></foreignObject></g></g><g transform=\"translate(79.5, 104)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-232\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数逆序对</span></div></foreignObject></g></g><g transform=\"translate(288.5, 104)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-234\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">切升序游程</span></div></foreignObject></g></g><g transform=\"translate(497.5, 104)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-236\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">分解成循环</span></div></foreignObject></g></g><g transform=\"translate(79.5, 190)\" data-id=\"S1\" data-node=\"true\" id=\"flowchart-S1-238\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">插入排序的移动次数</span></div></foreignObject></g></g><g transform=\"translate(288.5, 190)\" data-id=\"S2\" data-node=\"true\" id=\"flowchart-S2-240\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">自然合并排序的趟数</span></div></foreignObject></g></g><g transform=\"translate(497.5, 190)\" data-id=\"S3\" data-node=\"true\" id=\"flowchart-S3-242\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">生成排列的交换序列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：同一个排列可以量出三种「结构量」，各自对应一种排序或生成算法的代价。这张图说明为什么第 5 章要先把组合性质讲完再讲算法。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：逆序对像排队时「站错位置」的人数。每纠正一个人，就少一处错位；插入排序就是一个一个纠正。\n<\/li><li>\n类比失效：现实排队里两个人换位可能同时纠正多处错位（一次交换消除两个逆序对），逆序对与移动次数不再一一对应。这就是为什么交换类排序不能用「逆序对数」直接算代价。\n<\/ul>\n<p><strong>实例（游程与合并趟数）<\/strong>：n = 16 的排列切成 8 段游程。第一趟两两合并变 4 段，第二趟 2 段，第三趟 1 段，共 3 趟。若切成 16 段（完全无序），则要 4 趟。游程越少越省。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为逆序对数等于交换次数<\/strong>——实际上一次交换最多消除两个逆序对，也可能一个都不消除（换错位置时）。\n<\/li><li>\n<strong>别以为平均逆序对数是 n²/4 就说明「平均情况很慢」<\/strong>——实际上它恰好说明插入排序平均是 O(n²)，与实测一致。\n<\/li><li>\n<strong>别把游程当成「已经排好的段」<\/strong>——游程只要求段内递增，段与段之间没有顺序关系。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：排列 4, 3, 2, 1 的逆序对数是多少？（填数字）\n<p>（答案：6；解析：每一对都是逆序，(4,3)(4,2)(4,1)(3,2)(3,1)(2,1) 共 6 个，正好是 C(4,2)=6。）<\/p>\n<\/ol>\n<ol><li>\n单选题：A、A、B、B 四个字符共有多少种不同排列？\n<p>A. 4 B. 6 C. 12 D. 24 （答案：B；解析：4!/(2!2!) = 24/4 = 6。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么插入排序的移动次数恰好等于初始逆序对数？\n<p>（答案：每把第 i 个元素往左挪一格，它与左边那个更大的元素构成一个逆序对，挪过去就消除了这一个；挪到正确位置时它左边的都不大于它，逆序对清零。总移动次数等于被消除的逆序对总数。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n逆序对：前大后小的一对；平均 n(n−1)/4。\n<\/li><li>\n多重集排列数 = n! 除以各重复组阶乘。\n<\/li><li>\n升序游程的期望段数是 (n+1)/2，自然合并排序按游程工作。\n<\/ul>", "ch02": "<h1>第 2 章：内部排序——五类算法与它们的代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：7 小时 | <strong>前置<\/strong>：第 1 章（逆序与游程）；卷1 第 1 章（复杂度）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n按「插入、交换、选择、合并、分布」五类给常见排序算法归类。\n<\/li><li>\n说清快速排序平均 O(n log n)、最坏 O(n²) 的触发条件。\n<\/li><li>\n解释堆排序为什么最坏也是 O(n log n)，代价在哪里。\n<\/li><li>\n判断一个场景该用哪种排序：数据近乎有序、内存紧张、键值范围小。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>内部排序的全部差别，可以归结为两个问题：<strong>比较出多少信息、数据搬多少次<\/strong>。五类算法就是五种不同的取舍。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：插入类（难度：基础）<\/h3>\n<p><strong>直接插入<\/strong>：把第 i 个元素插进前面已经排好的部分，从后往前找位置，边找边挪。<\/p>\n<ul><li>\n最好情况（已有序）：每个元素只比较一次，O(n)。\n<\/li><li>\n最坏情况（完全逆序）：移动次数是逆序对数 n(n−1)/2，O(n²)。\n<\/li><li>\n平均：O(n²)。\n<\/li><li>\n稳定：相等元素不会交换相对次序。\n<\/ul>\n<p><strong>折半插入<\/strong>：找位置时用二分，比较次数降到 O(n log n)，但挪动仍是 O(n²)，总代价没变。<\/p>\n<p><strong>希尔排序<\/strong>：先按较大间隔分组做插入排序，再逐步缩小间隔。它是插入类里少见的能到 O(n^1.3) 左右的算法，但复杂度分析至今没有完全定论。<\/p>\n<h3>概念 2：交换类（难度：进阶）<\/h3>\n<p><strong>冒泡排序<\/strong>：相邻比较，逆序就交换，每一趟把最大值推到末尾。O(n²)，稳定，几乎没有实用价值，但它是「逆序对」最直观的演示。<\/p>\n<p><strong>快速排序<\/strong>：选一个基准（pivot），把比它小的放左边、大的放右边，再对左右两段递归。<\/p>\n<ul><li>\n平均 O(n log n)：每次划分大致对半。\n<\/li><li>\n最坏 O(n²)：每次划分都极不均衡。典型触发是「输入已经有序，却取第一个元素当基准」。\n<\/li><li>\n空间 O(log n)：递归栈深度。\n<\/li><li>\n不稳定。\n<\/ul>\n<p><strong>避免最坏的两个办法<\/strong>：随机选基准，或取头、中、尾三个数的中位数当基准。<\/p>\n<h3>概念 3：选择类（难度：进阶）<\/h3>\n<p><strong>直接选择<\/strong>：每趟从剩余元素里找最小的，与当前位置交换。比较次数固定 n(n−1)/2，与输入无关；交换次数最多 n−1。不稳定。<\/p>\n<p><strong>堆排序<\/strong>：先把数组建成大顶堆（O(n)），再反复把堆顶与末尾交换、缩小堆、下沉调整。<\/p>\n<ul><li>\n建堆 O(n)，每次下沉 O(log n)，共 n 次，总 O(n log n)。\n<\/li><li>\n最坏也是 O(n log n)，这是它相对快排的优势。\n<\/li><li>\n原地排序，空间 O(1)；但不稳定，且常数比快排大，实际常比快排慢。\n<\/ul>\n<p><strong>实例（下沉一次）<\/strong>：堆 [9, 7, 8, 3, 5]，把堆顶 9 与末尾 5 交换得 [5, 7, 8, 3, 9]，堆区缩小为前四个。5 下沉：与较大的孩子 8 交换，得 [8, 7, 5, 3]。堆恢复。<\/p>\n<h3>概念 4：合并类（难度：进阶）<\/h3>\n<p><strong>二路合并排序<\/strong>：把数组对半切，两段各自排好，再合并。合并时两个指针各扫一遍，O(n)。<\/p>\n<ul><li>\n总代价：T(n) = 2T(n/2) + O(n)，展开得 O(n log n)。\n<\/li><li>\n稳定。\n<\/li><li>\n代价是需要 O(n) 的额外空间。\n<\/ul>\n<p><strong>为什么合并能做到 O(n)<\/strong>：两段已经有序，每次只需比较两个队首，取小的那个，指针前移一格，不需要回头。<\/p>\n<h3>概念 5：分布类（难度：进阶）<\/h3>\n<p><strong>基数排序<\/strong>：不比较元素大小，而是按「位」分配。从最低位开始，每一轮按该位把元素分到若干个桶，再按桶序收集；做完最高位，整体有序。<\/p>\n<ul><li>\n代价 O(d(n + k))，d 是位数，k 是基数。\n<\/li><li>\n当 d 很小、k 不大时，是线性时间。\n<\/li><li>\n稳定（这是它能从低位往高位做的前提）。\n<\/ul>\n<p><strong>实例<\/strong>：对 12、3、25 按十进制基数排序。<\/p>\n<ul><li>\n个位分配：3 → 桶 3；12 → 桶 2；25 → 桶 5。收集：12、3、25。\n<\/li><li>\n十位分配：12 → 桶 1；3 → 桶 0；25 → 桶 2。收集：3、12、25。有序。\n<\/ul>\n<h3>概念 6：怎么选（难度：进阶）<\/h3>\n<table><thead><tr><th>场景<\/th><th>选择<\/th><th>理由<\/th><\/tr><\/thead><tbody><tr><td>数据近乎有序<\/td><td>直接插入<\/td><td>最好情况 O(n)<\/td><\/tr><tr><td>内存极紧、要最坏有保证<\/td><td>堆排序<\/td><td>原地，最坏 O(n log n)<\/td><\/tr><tr><td>通用、要求平均快<\/td><td>快速排序<\/td><td>常数小，缓存友好<\/td><\/tr><tr><td>要求稳定<\/td><td>合并排序<\/td><td>稳定且 O(n log n)<\/td><\/tr><tr><td>键值范围小、位数少<\/td><td>基数排序<\/td><td>线性时间<\/td><\/tr><tr><td>链表结构<\/td><td>合并排序<\/td><td>不需要随机访问<\/td><\/tr><\/tbody><\/table>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered "32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">不要</span></div></foreignObject></g></g><g transform=\"translate(207.38671875, 608.5)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">紧</span></div></foreignObject></g></g><g transform=\"translate(362.61328125, 608.5)\" class=\"edgeLabel\"><g transform=\"translate(-16, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">不紧</span></div></foreignObject></g></g><g transform=\"translate(25.5, 329.5)\" class=\"edgeLabel\"><g transform=\"translate(-16, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">链表</span></div></foreignObject></g></g><g transform=\"translate(116, 236.5)\" class=\"edgeLabel\"><g transform=\"translate(-40, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">键值范围小</span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(116, 18)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-243\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排序需求< <g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">内存紧吗</span></div></foreignObject></g></g><g transform=\"translate(207.38671875, 662)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-252\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">堆排序</span></div></foreignObject></g></g><g transform=\"translate(362.61328125, 662)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-254\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"147.453125\" y=\"-18\" x=\"-73.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"132.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快速排序 随机基准</span></div></foreignObject></g></g><g transform=\"translate(116, 329.5)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-258\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">基数排序</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：先问「数据在哪」再问「要不要稳定」，这两个问题基本就决定了算法。剩下的差别是常数与实现难度。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：插入排序像整理一手扑克牌，一张张插进已经排好的牌里；合并排序像两组已经排好的牌，每次从两叠顶上看一张小的；基数排序像先按个位把牌分堆，再按十位分堆。\n<\/li><li>\n类比失效：扑克牌只有 52 张，牌数一大，手就不可能同时握住；真实算法的「手」是内存，容量与访问速度才是关键约束。\n<\/ul>\n<p><strong>实例（快排一次划分）<\/strong>：数组 [5, 3, 8, 4, 2]，基准取 5。<\/p>\n<ul><li>\n3 &lt; 5，留左边；8 &gt; 5，留右边；4 &lt; 5，与 8 交换 → [5, 3, 4, 8, 2]；2 &lt; 5，与 8 交换 → [5, 3, 4, 2, 8]。\n<\/li><li>\n基准 5 与 2 交换 → [2, 3, 4, 5, 8]。\n<p>左边 [2,3,4] 全小于 5，右边 [8] 大于 5，划分完成。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为快排最坏 O(n²) 只是理论<\/strong>——实际上对已排序数据取首元素当基准，就会稳定触发。\n<\/li><li>\n<strong>别以为堆排序比快排快<\/strong>——实际上它最坏有保证，但常数大、缓存不友好，平均常慢于快排。\n<\/li><li>\n<strong>别以为基数排序不需要「比较」就更快<\/strong>——实际上它依赖键的位数与基数，键很长时 d 很大，未必比 O(n log n) 快。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：对已经升序排列的数组取首元素为基准做快排，复杂度是？\n<p>A. O(n) B. O(n log n) C. O(n²) D. O(log n) （答案：C；解析：每次划分都一边空一边全，递归深度 n，总代价 n²。）<\/p>\n<\/ol>\n<ol><li>\n填空题：堆排序建堆的代价是 O(___)。\n<p>（答案：n；解析：自底向上建堆的总代价是 O(n)，不是 O(n log n)，因为大部分节点在下层、下沉距离短。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么基数排序必须稳定？\n<p>（答案：低位排完后，高位相同的元素要保持低位的相对次序；若高位分配时打乱了低位结果，最终就不有序。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n五类：插入、交换、选择、合并、分布。\n<\/li><li>\n快排平均 O(n log n)、最坏 O(n²)；堆排序最坏 O(n log n)；合并稳定但要额外空间。\n<\/li><li>\n基数排序 O(d(n+k))，稳定的前提是从低位到高位。\n<\/ul>", "ch03": "<h1>第 3 章：最优排序——比较次数的下界与排序网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2 章；log 与阶乘的估算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用比较树推出「排序至少需要约 n log2 n 次比较」。\n<\/li><li>\n算出小规模下确切的比较次数下界（如 3 个元素、5 个元素）。\n<\/li><li>\n说清 0-1 原理，并解释它为什么能把检验工作从 2^n 类输入压到一类。\n<\/li><li>\n说出排序网络与比较排序的根本差别。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>n log n 不是某个算法的性能，而是<strong>问题本身的信息量下限<\/strong>；任何只靠比较的排序都逃不掉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：比较树与信息下界（难度：进阶）<\/h3>\n<p>把排序过程看成一棵判断树：<\/p>\n<ul><li>\n每个内部节点是一次比较（a 与 b 谁大）。\n<\/li><li>\n每条边是一个比较结果（小于或大于）。\n<\/li><li>\n每个叶子是一个可能的输出排列。\n<\/ul>\n<p>要正确排序 n 个元素，n! 种输入排列必须分别落到能输出正确结果的叶子上，所以叶子至少 n! 个。<\/p>\n<p>一棵二叉树有 L 个叶子时，高度至少 log2 L。因此最坏情况的比较次数 ≥ log2(n!)。<\/p>\n<p><strong>实例<\/strong>：<\/p>\n<ul><li>\nn = 3：log2 6 ≈ 2.58，向上取整得 3。3 次比较够（先比 a,b，再比 b,c，再按结果补一次）。\n<\/li><li>\nn = 5：log2 120 ≈ 6.91，向上取整得 7。5 个元素最坏情况至少 7 次比较，且 7 次可以做到。\n<\/li><li>\nn = 100：log2(100!) ≈ 525，而 n log2 n = 664，两者同阶。\n<\/ul>\n<p><strong>公式近似<\/strong>：log2(n!) ≈ n log2 n − 1.4427 n + O(log n)。那个 1.44 的系数是 1/ln 2。<\/p>\n<h3>概念 2：最优排序与「节约一次比较」（难度：高难）<\/h3>\n<p>对小 n，Knuth 给出了确切的最优比较次数：<\/p>\n<table><thead><tr><th>n<\/th><th>最坏情况最少比较次数<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>1<\/td><\/tr><tr><td>3<\/td><td>3<\/td><\/tr><tr><td>4<\/td><td>5<\/td><\/tr><tr><td>5<\/td><td>7<\/td><\/tr><tr><td>6<\/td><td>10<\/td><\/tr><\/tbody><\/table>\n<p>注意 5 个元素只要 7 次，而朴素插入排序最坏要 10 次。省下来的方式是「先做几次比较收集信息，再决定后面怎么比」，而不是固定流程。<\/p>\n<p><strong>为什么 n 一大就难<\/strong>：可能的比较策略爆炸式增长，最优策略难以构造，实践里用 O(n log n) 的算法接受一点点次优。<\/p>\n<h3>概念 3：排序网络（难度：高难）<\/h3>\n<p>排序网络是一组固定的比较器，每个比较器连接两根线，把较大的送到下方、较小的送到上方。<strong>没有分支<\/strong>，所有比较同时按层进行。<\/p>\n<p><strong>它和普通排序的差别<\/strong>：<\/p>\n<ul><li>\n普通排序的比较顺序依赖前面的结果（有分支）。\n<\/li><li>\n排序网络的比较顺序完全固定，适合硬件并行、GPU 实现。\n<\/ul>\n<p><strong>0-1 原理<\/strong>：如果一个排序网络能把所有 2^n 种「只含 0 和 1」的输入排好，那么它能把任意输入排好。<\/p>\n<p><strong>为什么成立<\/strong>（直觉）：比较器的行为只取决于「谁大」。把任意输入按某个阈值切成 0/1，若网络对每种切法都排好，则原输入也排好。这条原理把检验从「所有排列」压到「2^n 种 0/1 串」，工作量小得多。<\/p>\n<p><strong>Batcher 奇偶归并网络<\/strong>：把两段已排序的序列按奇偶下标分开归并，递归构造。规模 O(n log² n)，深度 O(log² n)。<\/p>\n<p><strong>实例（4 输入网络）<\/strong>：比较 (1,2)、(3,4)，再比较 (1,3)、(2,4)，最后比较 (2,3)。四层比较器，能排好任意 4 个输入。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 725.578125 310\" style=\"max-width: 725.578125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg20\"><style>#svg20{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg20 .error-icon{fill:#552222;}#svg20 .erro
