></g><g class=\"nodes\"><g transform=\"translate(31.5, 18)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-75\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">有限性</span></div></foreignObject></g></g><g transform=\"translate(136.5, 190)\" data-id=\"ALG\" data-node=\"true\" id=\"flowchart-ALG-76\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"47\" y=\"-18\" x=\"-23.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">算法</span></div></foreignObject></g></g><g transform=\"translate(31.5, 104)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-77\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">确定性</span></div></foreignObject></g></g><g transform=\"translate(31.5, 190)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-79\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"47\" y=\"-18\" x=\"-23.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">输入</span></div></foreignObject></g></g><g transform=\"translate(31.5, 276)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-81\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"47\" y=\"-18\" x=\"-23.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">输出</span></div></foreignObject></g></g><g transform=\"translate(31.5, 362)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-83\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">可行性</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看图看五点是否都连到同一个中心：任何一条断开，都不成立。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>有限性<\/strong>：存在一个有限的步数上界。证明时不要只说「显然会停」，要指出一个每轮严格减小、又有下界的量。\n<\/li><li>\n<strong>确定性<\/strong>：同一输入，每一步的状态都唯一。注意「依赖随机数」的算法要先固定随机源，才能算确定。\n<\/li><li>\n<strong>输入<\/strong>：0 个或多个，且限定取值范围。范围本身是算法的一部分。\n<\/li><li>\n<strong>输出<\/strong>：至少 1 个，且与输入有指定关系。\n<\/li><li>\n<strong>可行性<\/strong>：每一步都能在有限时间内完成。这一条是理想化的——它不要求快，只要求做得到。\n<\/ul>\n<p><strong>实例对照<\/strong>：求 gcd 的过程五条全满足；一个「不断打印当前时间」的进程缺有限性；一个「按感觉判断这串数字是不是质数」的过程缺确定性。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「程序 = 算法」——程序可能不终止、可能依赖环境，算法是程序里满足五条的那部分。\n<\/li><li>\n别以为可行性要求「快」——可行只要求有限时间，实际快慢归算法分析管。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.1<\/td><td>定义<\/td><td>五条准则首次给出<\/td><\/tr><tr><td>1.1 末<\/td><td>算法分析<\/td><td>可行性之上再加「代价要合理」<\/td><\/tr><tr><td>全书的算法描述<\/td><td>记号约定<\/td><td>每步用字母加编号，便于引用与证明<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：无\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">渐近记号与大 O<\/a>\n<\/ul>", "c02": "<h1>渐近记号与大 O<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>大 O 记号描述一个函数的增长速度上界：f(n) = O(g(n)) 表示 n 足够大时，f 的增长不会超过 g 的某个常数倍。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是比较算法的通用语言。两个排序算法，一个 O(n²) 一个 O(n log n)，在 n 很大时的高下不用实测就能判断。没有这套记号，算法分析只能停在「跑起来试试」。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 728.34375 52\" style=\"max-width: 728.34375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg6\"><style>#svg6{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg6 .error-icon{fill:#552222;}#svg6 .error-text{fill:#552222;stroke:#552222;}#svg6 .edge-thickness-normal{stroke-width:2px;}#svg6 .edge-thickness-thick{stroke-width:3.5px;}#svg6 .edge-pattern-solid{stroke-dasharray:0;}#svg6 .edge-pattern-dashed{stroke-dasharray:3;}#svg6 .edge-pattern-dotted{stroke-dasharray:2;}#svg6 .marker{fill:#333333;stroke:#333333;}#svg6 .marker.cross{stroke:#333333;}#svg6 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg6 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg6 .cluster-label text{fill:#333;}#svg6 .cluster-label span,#svg6 p{color:#333;}#svg6 .label text,#svg6 span,#svg6 p{fill:#333;color:#333;}#svg6 .node rect,#svg6 .node circle,#svg6 .node ellipse,#svg6 .node polygon,#svg6 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg6 .flowchart-label text{text-anchor:middle;}#svg6 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg6 .node .label{text-align:center;}#svg6 .node.clickable{cursor:pointer;}#svg6 .arrowheadPath{fill:#333333;}#svg6 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg6 .flowchart-link{stroke:#333333;fill:none;}#svg6 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg6 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg6 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg6 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg6 .cluster text{fill:#333;}#svg6 .cluster span,#svg6 p{color:#333;}#svg6 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg6 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg6 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg6_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg6_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 5 L 10 10 L 10 0 z\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"11\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg6_flowchart-circleEnd\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"-1\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg6_flowchart-circleStart\"><circle style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" r=\"5\" cy=\"5\" cx=\"5\"></circle></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"12\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg6_flowchart-crossEnd\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><marker orient=\"auto\" markerHeight=\"11\" markerWidth=\"11\" markerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg6_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg6_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-A LE-B\" id=\"L-A-B-0\" d=\"M95,18L99.167,18C103.333,18,111.667,18,119.117,18C126.567,18,133.133,18,136.417,18L139.7,18\"></path><path marker-end=\"url(#svg6_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-B LE-C\" id=\"L-B-C-0\" d=\"M240,18L244.167,18C248.333,18,256.667,18,264.117,18C271.567,18,278.133,18,281.417,18L284.7,18\"></path><path marker-end=\"url(#svg6_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-D\" id=\"L-C-D-0\" d=\"M401,18L405.167,18C409.333,18,417.667,18,425.117,18C432.567,18,439.133,18,442.417,18L445.7,18\"></path><path marker-end=\"url(#svg6_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-D LE-E\" id=\"L-D-E-0\" d=\"M562,18L566.167,18C570.333,18,578.667,18,586.117,18C593.567,18,600.133,18,603.417,18L606.7,18\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(47.5, 18)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-85\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">原始表达式</span></div></foreignObject></g></g><g transform=\"translate(192.5, 18)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-86\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">按次数排序</span></div></foreignObject></g></g><g transform=\"translate(345.5, 18)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-88\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">只留最高次项</span></div></foreignObject></g></g><g transform=\"translate(506.5, 18)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-90\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">去掉常数系数</span></div></foreignObject></g></g><g transform=\"translate(662.171875, 18)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-92\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"100.34375\" y=\"-18\" x=\"-50.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-42.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"85.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">得到 O 形式</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看图是一条单向流水线：每一步都丢掉不影响趋势的信息。<\/p>\n<h2>详解<\/h2>\n<p>严格定义：存在正常数 c 与 n₀，使所有 n ≥ n₀ 都有 f(n) ≤ c·g(n)。<\/p>\n<p><strong>为什么可以只留最高次项<\/strong>：以 3n² + 5n + 7 为例，取 n₀ = 1，则 5n ≤ 5n²、7 ≤ 7n²，于是整体 ≤ 15n²，c = 15 就满足定义。<\/p>\n<p><strong>常见阶的关系<\/strong>：O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(n³) &lt; O(2^n)。<\/p>\n<p><strong>实例<\/strong>：n = 1000 时，log2 n 约 10，n log2 n 约 10000，n² 是 100 万。三者差了五个数量级，这就是为什么 O(n²) 排序在百万级数据上不可用。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别把 O 当成「大约等于」，它是上界，不是等号。\n<\/li><li>\n别以为 O 越小一定越快，小 n 时常数项可能翻盘。\n<\/li><li>\n别把 O 和 Θ 混为一谈，Θ 要求上下界同时成立。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.2.11<\/td><td>引入<\/td><td>大 O 与欧拉求和<\/td><\/tr><tr><td>1.2.11.3<\/td><td>渐近计算<\/td><td>常用展开式<\/td><\/tr><tr><td>后续各卷<\/td><td>算法分析<\/td><td>每次给出复杂度都用这套记号<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">算法五准则<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">生成函数<\/a>\n<\/ul>", "c03": "<h1>生成函数<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>生成函数把一整条数列打包成一个关于 z 的级数：G(z) = a0 + a1z + a2z² + …，数列的第 n 项就是 z^n 的系数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是解递推式的标准工具。算法分析里大量出现「a(n) 等于前几项的组合」，直接求通项很难；转成生成函数后，递推变成一个代数方程，解方程比猜通项可靠。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1022.71875 52\" style=\"max-width: 1022.71875px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg7\"><style>#svg7{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg7 .error-icon{fill:#552222;}#svg7 .error-text{fill:#552222;stroke:#552222;}#svg7 .edge-thickness-normal{stroke-width:2px;}#svg7 .edge-thickness-thick{stroke-width:3.5px;}#svg7 .edge-pattern-solid{stroke-dasharray transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(39.5, 18)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-93\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">递推关系</span></div></foreignObject></g></g><g transform=\"translate(225.84375, 18)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-94\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"193.6875\" y=\"-18\" x=\"-96.84375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-89.34375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"178.6875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">两边乘 z 的 n 次方再求和</span></div></foreignObject></g></g><g transform=\"translate(446.859375, 18)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-96\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"148.34375\" y=\"-18\" x=\"-74.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-66.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"133.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">得到 G 的代数方程</span></div></foreignObject></g></g><g transform=\"translate(602.9765625, 18)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-98\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63.890625\" y=\"-18\" x=\"-31.9453125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24.4453125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48.890625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">解出 G</span></div></foreignObject></g></g><g transform=\"translate(740.421875, 18)\" data-id=\"X\" data-node=\"true\" id=\"flowchart-X-100\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">展开成幂级数</span></div></foreignObject></g></g><g transform=\"translate(926.3203125, 18)\" data-id=\"T\" data-node=\"true\" id=\"flowchart-T-102\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"160.796875\" y=\"-18\" x=\"-80.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"145.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">第 n 项系数就是通项</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看图的重点是中间那一步：递推为什么会变成方程，因为「n 变成 n−1」在幂级数里就是「乘一个 z」。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n常数数列 1, 1, 1, …：G(z) = 1/(1−z)。\n<\/li><li>\n自然数列 0, 1, 2, 3, …：G(z) = z/(1−z)²。\n<\/li><li>\n斐波那契：F(n) = F(n−1) + F(n−2)，可得 G(z) = z/(1 − z − z²)，再分解部分分式就能读出 φ^n 的主项。\n<\/ul>\n<p><strong>完整实例<\/strong>：a(n) = a(n−1) + 1，a(0) = 0。 设 G = Σa(n)z^n。对 n ≥ 1 求和：G − a(0) = zG + z/(1−z)。 代入 a(0) = 0：G = zG + z/(1−z)，即 G(1−z) = z/(1−z)，G = z/(1−z)²。 展开得 a(n) = n。代 n = 3 核对：数列 0, 1, 2, 3，一致。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为生成函数要求级数收敛才能用——形式幂级数不关心收敛，只关心系数。\n<\/li><li>\n别把 z 当成一个具体的数——它只是「位置标记」，用来区分第几项。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>1.2.9<\/td><td>引入<\/td><td>生成函数的定义与基本运算<\/td><\/tr><tr><td>1.2.10<\/td><td>典型分析<\/td><td>用生成函数解递推<\/td><\/tr><tr><td>卷3 排序分析<\/td><td>平均情况<\/td><td>排列计数用指数生成函数<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">渐近记号与大 O<\/a>\n<\/li><li>\n后续：卷3 的排序代价分析\n<\/ul>", "c04": "<h1>栈、队列与链接分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 4 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>栈和队列是「只允许在固定端点操作」的线性表；链接分配是让每个节点自带下一个节点地址的存储方式，节点不必相邻。<\/p>\n<h2>为什么重要<\/h2>\n<p>这两件事合起来回答了「数据放在哪、怎么动」。栈是递归与表达式求值的底层结构，队列是广度优先搜索的底层结构，链接分配则是所有动态数据结构的起点——树、图、散列表的节点都靠它串起来。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 577.03125 267\" style=\"max-width: 577.03125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg8\"><style>#svg8{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg8 .error-icon{fill:#552222;}#svg8 .error-text{fill:#552222;stroke:#552222;}#svg8 .edge-thickness-normal{stroke-width:2px;}#svg8 .edge-thickness-thick{stroke-width:3.5px;}#svg8 .edge-pattern-solid{stroke-dasharray:0;}#svg8 .edge-pattern-dashed{stroke-dasharray:3;}#svg8 .edge-pattern-d transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(57.7265625, 18)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-103\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"99.453125\" y=\"-18\" x=\"-49.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-42.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"84.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">栈 后进先出</span></div></foreignObject></g></g><g transform=\"translate(240.515625, 18)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-104\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"100.046875\" y=\"-18\" x=\"-50.0234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-42.5234375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"85.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">数组加 TOP</span></div></foreignObject></g></g><g transform=\"translate(57.7265625, 104)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-105\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"115.453125\" y=\"-18\" x=\"-57.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect>< <g transform=\"translate(463.3046875, 147)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-110\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"179.453125\" y=\"-18\" x=\"-89.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-82.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"164.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">插入 先接新链再改旧链</span></div></foreignObject></g></g><g transform=\"translate(463.3046875, 233)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-112\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"195.453125\" y=\"-18\" x=\"-97.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-90.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"180.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">删除 让前驱越过被删节点</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看两条路径的差别：数组靠下标定位，链表靠链定位；前者快在访问，后者快在插入删除。<\/p>\n<h2>详解<\/h2>\n<p><strong>栈<\/strong>：<code>TOP<\/code> 指向栈顶，入栈先判满再 <code>TOP+1<\/code>，出栈先判空再 <code>TOP−1<\/code>。 <strong>队列<\/strong>：循环数组，<code>front<\/code> 指队首、<code>rear<\/code> 指队尾，判满用 <code>(rear+1) mod m = front<\/code>。 <strong>链接分配<\/strong>：<\/p>\n<ul><li>\n在 P 后插入 Q：<code>Q.LINK = P.LINK<\/code>，然后 <code>P.LINK = Q<\/code>。\n<\/li><li>\n删除 P 后的 Q：<code>P.LINK = Q.LINK<\/code>，再释放 Q。\n<\/ul>\n<p><strong>实例<\/strong>：链 A→B→C，在 A 后插入 X。先 <code>X.LINK = A.LINK<\/code>（X 指向 B），再 <code>A.LINK = X<\/code>，得 A→X→B→C。若顺序颠倒，B 的地址丢失，链断。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为链表插入永远 O(1)——按位置查找那一步是 O(n)。\n<\/li><li>\n别以为数组做队列只要两个下标——不循环就会假溢出。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.2.1<\/td><td>栈与队列<\/td><td>端点的限制决定行为<\/td><\/tr><tr><td>2.2.2<\/td><td>顺序分配<\/td><td>溢出与假溢出<\/td><\/tr><tr><td>2.2.3<\/td><td>链接分配<\/td><td>指针三步操作<\/td><\/tr><tr><td>2.2.4–2.2.5<\/td><td>循环与双链<\/td><td>用额外链换操作便利<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">算法五准则<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">二叉树遍历<\/a>\n<\/ul>", "c05": "<h1>二叉树遍历<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>遍历是按固定次序访问树中每个节点恰好一次；先序、中序、后序的区别只在「什么时候访问根」。<\/p>\n<h2>为什么重要<\/h2>\n<p>树的很多操作都必须先遍历：统计节点数、复制一棵树、释放整棵树、把树表达式还原成中缀式。遍历顺序选错，结果就错——例如释放节点必须用后序，否则先释放了父节点就找不到子节点。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 441.03125 340\" style=\"max-width: 441.03125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg9\"><style>#svg9{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg9 .error-icon{fill:#552222;}#svg9 .error-text{fill:#552222;stroke:#552222;}#svg9 .edge-thickness-normal{stroke-width:2px;}#svg9 .edge-thickness-thick{stroke-width:3.5px;}#svg9 .edge-pattern-solid{stroke-dasharray:0;}#svg9 .edge-pattern-dashed{stroke-dasharray:3;}#svg9 .edge-pattern-dotted{stroke-dasharray:2;}#svg9 .marker{fill:#333333;stroke:#333333;}#svg9 .marker.cross{stroke:#333333;}#svg9 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg9 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg9 .cluster-label text{fill:#333;}#svg9 .cluster-label span,#svg9 p{color:#333;}#svg9 .label text,#svg9 span,#svg9 p{fill:#333;color:#333;}#svg9 .node rect,#svg9 .node circle,#svg9 .node ellipse,#svg9 .node polygon,#svg9 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg9 .flowchart-label text{text-anchor:middle;}#svg9 .node .katex p  width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">根</span></div></foreignObject></g></g><g transform=\"translate(212.515625, 151.5)\" data-id=\"V\" data-node=\"true\" id=\"flowchart-V-114\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">何时访问根</span></div></foreignObject></g></g><g transform=\"translate(54.171875, 306)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-116\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"108.34375\" y=\"-18\" x=\"-54.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-46.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"93.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">先序 根 左 右</span></div></foreignObject></g></g><g transform=\"translate(212.515625, 306)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-118\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"108.34375\" y=\"-18\" x=\"-54.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-46.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"93.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">中序 左 根 右</span></div></foreignObject></g></g><g transform=\"translate(370.859375, 306)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-120\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"108.34375\" y=\"-18\" x=\"-54.171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-46.671875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"93.34375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">后序 左 右 根</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看图只需盯住根的三个位置：前、中、后，序列自然就出来了。<\/p>\n<h2>详解<\/h2>\n<p>示例树：<\/p>\n<pre><code>        A\n       / \\\n      B   C\n     / \\   \\\n    D   E   F<\/code><\/pre>\n<ul><li>\n先序 A、B、D、E、C、F\n<\/li><li>\n中序 D、B、E、A、C、F\n<\/li><li>\n后序 D、E、B、F、C、A\n<\/ul>\n<p><strong>复核方法<\/strong>：先序首项 = 后序末项 = 根 A。在中序里找到 A，左边三个是左子树，右边两个是右子树。递归套用，三者互相验证。<\/p>\n<p><strong>中序的特殊用途<\/strong>：在二叉搜索树里，中序遍历得到升序序列。这也是「搜索树有序」这句话的准确含义。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为只给中序就能重建树——必须再给先序或后序之一。\n<\/li><li>\n别以为三种遍历只是「输出顺序不同」——它们的用途完全不同：先序用于复制，中序用于排序输出，后序用于释放。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.3.1<\/td><td>遍历<\/td><td>三序定义与递归实现<\/td><\/tr><tr><td>2.3.2<\/td><td>二叉树表示<\/td><td>遍历依赖 LCHILD 与 RCHILD<\/td><\/tr><tr><td>2.3.4<\/td><td>数学性质<\/td><td>路径长度与遍历深度相关<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">栈、队列与链接分配<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">动态存储分配<\/a>\n<\/ul>", "c06": "<h1>动态存储分配<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>动态存储分配是程序运行期间按需从内存池切出、并在用完后归还大小不一的块的过程。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有动态数据结构都依赖它。链表每插入一个节点就要申请一块，删除就要归还。分配策略选错，会出现「明明还有空间却申请不到」的碎片问题；回收策略选错，会泄漏或长时间暂停。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 602.562 bject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(304.5, 18)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-121\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79.90625\" y=\"-18\" x=\"-39.953125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32.453125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64.90625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">申请 size</span></div></foreignObject></g></g><g transform=\"translate(304.5, 127.5)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-122\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-41.5,41.5)\" class=\"label-container\" points=\"41.5,0 83,-41.5 41.5,-83 0,-41.5\"></polygon><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">策略</span></div></foreignObject></g></g><g transform=\"translate(87.5, 258)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-124\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"175\" y=\"-18\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-80, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"160\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">从头找第一个够大的块</span></div></foreignObject></g></g><g transform=\"translate(304.5, 258)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-126\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">找够大的块里最小的</span></div></foreignObject></g></g><g transform=\"translate(507.0625, 258)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-128\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"112.796875\" y=\"-18\" x=\"-56.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"97.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">按 2 的幂切分</span></div></foreignObject></g></g><g transform=\"translate(196, 344)\" data-id=\"F\" data-node=\"true\" id=\"flowchart-F-130\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"179.453125\" y=\"-18\" x=\"-89.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-82.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"164.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">切下所需 余下留作空闲</span></div></foreignObject></g></g><g transform=\"translate(507.0625, 344)\" data-id=\"G\" data-node=\"true\" id=\"flowchart-G-134\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">只与同尺寸伙伴合并</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看图注意：三种策略的差别不在「能不能分」，而在「分完剩下的碎片长什么样」。<\/p>\n<h2>详解<\/h2>\n<ul><li>\n<strong>首次适配<\/strong>：扫描到第一个够大的块就切。快，但低地址容易积累小碎片。\n<\/li><li>\n<strong>最佳适配<\/strong>：找最小的够大块。剩余碎片最小，但要扫全表。\n<\/li><li>\n<strong>边界标记<\/strong>：每个块的头部与尾部各存块大小。释放时检查物理相邻的下一个块是否空闲，是则合并。没有尾部标记，就无法 O(1) 找到前一个块。\n<\/li><li>\n<strong>伙伴系统<\/strong>：容量按 2 的幂。申请 5 得 8；释放时只与地址异或得到的「伙伴」合并。\n<\/ul>\n<p><strong>实例（伙伴系统）<\/strong>：容量 16，申请 5。16 切成 8+8，取左 8；8 切成 4+4，4 不够，退回用 8。返回地址 0、长度 8。释放后若地址 8 空闲，合并回 16。<\/p>\n<p><strong>碎片为什么不可避免<\/strong>：申请与释放的顺序不可预知，空闲块会被已分配的块隔开，即使总空闲量够，也未必有一块连续空间够大。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为「总空闲空间够」就能分配成功——必须有一块连续空间够大。\n<\/li><li>\n别以为最佳适配一定最省——它留下的碎片太小，往往无法再用，反而更差。\n<\/li><li>\n别以为边界标记只是为了调试——它是 O(1) 合并相邻块的前提。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>2.5<\/td><td>动态存储分配<\/td><td>首次适配与最佳适配<\/td><\/tr><tr><td>2.5 后半<\/td><td>边界标记<\/td><td>双向合并<\/td><\/tr><tr><td>习题<\/td><td>伙伴系统<\/td><td>按 2 的幂切分与合并<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">二叉树遍历<\/a>\n<\/li><li>\n后续：卷3 外部排序的缓冲区管理\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先弄懂「算法」这两个字<\/strong><br>阅读：<a href=\"#/book/taocp-v1/chapter/ch01\">第 1 章：算法是什么，怎么衡量它<\/a><br>检查点：能对任意流程判定是否满足五条准则，并手算 gcd(119, 544)<\/li><li class='path-step' id='path-02'><strong>步骤 02：补齐分析算法的数学<\/strong><br>阅读：<a href=\"#/book/taocp-v1/chapter/ch02\">第 2 章：分析算法要用的数学工具箱<\/a><br>检查点：能独立证明 1+2+…+n 的求和公式，写出 F10 与 H10 的数值<\/li><li class='path-step' id='path-03'><strong>步骤 03：看懂机器层的算法<\/strong><br>阅读：<a href=\"#/book/taocp-v1/chapter/ch03\">第 3 章：MIX 与基本程序设计技术<\/a><br>检查点：能解释 MIX 的字结构、子程序如何靠链接字返回、解释程序的三段循环<\/li><li class='path-step' id='path-04'><strong>步骤 04：线性表：栈、队列与链接<\/strong><br>阅读：<a href=\"#/book/taocp-v1/chapter/ch04\">第 4 章：线性表<\/a><br>检查点：能画出链表插入删除的指针变化，说清循环链表与双链表各解决了什么问题<\/li><li class='path-step' id='path-05'><strong>步骤 05：树与存储管理<\/strong><br>阅读：<a href=\"#/book/taocp-v1/chapter/ch05\">第 5 章：树、多链结构与动态存储<\/a><br>检查点：能写出三种遍历序列，算对扩充二叉树的 E 与 I，解释标记-清扫与伙伴系统<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：算法是什么，怎么衡量它<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 下列哪一条不属于算法的五条准则？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 有限性<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 确定性<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 可读性<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 可行性<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 执行欧几里得算法求 gcd(119, 544)，第一轮的余数是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 把 4n³ + 2n² + 100 化成大 O 形式，结果是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q03' value='0'> O(n²)<\/label><label class='quiz-opt'><input type='radio' name='  value='3'> 因为标记位丢失<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='算法'>算法 — 满足有限性、确定性、输入、输出、可行性的有限计算过程。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='确定性'>确定性 — 每一步的动作唯一确定，不依赖执行者的常识或临时判断。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='算法分析'>算法分析 — 确定一个算法在各类输入上要执行多少次基本操作。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='大 o 记号'>大 O 记号 — 描述增长速度的上界，表示 f 增长不快于某个参照函数。 <span class=glossary-ref>（第 1 章：算法是什么，怎么衡量它）<\/span><\/li><li data-term='数学归纳法'>数学归纳法 — 先验证起点，再由 n 成立推出 n+1 成立的证明方法。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='二项式系数'>二项式系数 — 从 n 个对象中选 k 个的方案数，记作 C(n, k)。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='调和数'>调和数 — 1 到 n 的倒数之和，增长极慢，约等于 ln n 加常数。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='斐波那契数'>斐波那契数 — 每项等于前两项之和的数列，按约 1.618 的比例指数增长。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='生成函数'>生成函数 — 把数列的每一项挂到 z 的各次幂上得到的多项式或级数。 <span class=glossary-ref>（第 2 章：分析算法要用的数学工具箱）<\/span><\/li><li data-term='mix'>MIX — 高德纳设计的虚构计算机，用来把算法写成可执行的机器指令。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='子程序'>子程序 — 可被反复调用的一段程序，调用点与返回点靠链接信息对接。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='协同程序'>协同程序 — 彼此平等、可以互相跳转而不形成调用栈的两段程序。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='解释程序'>解释程序 — 逐条读取、译码并执行另一台机器指令的程序。 <span class=glossary-ref>（第 3 章：MIX 与基本程序设计技术）<\/span><\/li><li data-term='栈'>栈 — 只在一端插入和删除的线性表，后进先出。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='队列'>队列 — 一端插入、另一端删除的线性表，先进先出。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='链接分配'>链接分配 — 每个节点自带指向下一个节点的链，节点在内存中不必相邻。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='循环链表'>循环链表 — 尾节点指回头节点的链表，用一个指针就能走到任意节点。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='双链表'>双链表 — 每个节点同时保存前驱与后继地址的链表，删除时无需再找前驱。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='正交表'>正交表 — 用行号、列号、值三元组表示稀疏二维表的存储方式。 <span class=glossary-ref>（第 4 章：线性表）<\/span><\/li><li data-term='二叉树'>二叉树 — 每个节点最多有两个有序子节点的树。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='遍历'>遍历 — 按某种固定次序访问树中每个节点恰好一次。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='扩充二叉树'>扩充二叉树 — 把二叉树的所有空链换成方形外部节点后得到的树。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='垃圾回收'>垃圾回收 — 自动找出程序中再也访问不到的表节点并回收其空间。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='动态存储分配'>动态存储分配 — 程序运行期间按需从内存池切出与归还大小不一的块。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='边界标记'>边界标记 — 在每个存储块两端记录块大小，使相邻空闲块能迅速合并。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='伙伴系统'>伙伴系统 — 按 2 的幂大小切分内存，回收时只合并同尺寸的伙伴块。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><li data-term='多链结构'>多链结构 — 一个节点同时挂在多条链上的结构，用来表示稀疏矩阵等关系。 <span class=glossary-ref>（第 5 章：树、多链结构与动态存储）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：算法分析四步<\/h2>\n<ol><li>\n<strong>定基本操作<\/strong>：选一个在循环里反复出现、能代表代价的动作（比较、求余、赋值）。\n<\/li><li>\n<strong>定输入规模<\/strong>：写清 n 是什么，取值范围是什么。平均值必须连同取值范围一起说。\n<\/li><li>\n<strong>写代价函数<\/strong>：数出该操作在每类输入上的执行次数，得到 T(n)。\n<\/li><li>\n<strong>化简与比较<\/strong>：化成渐近形式，只留最高次项；再对不同算法在同一 n 上比较。\n<\/ol>\n<h2>决策规则：线性结构怎么选<\/h2>\n<ul><li>\n只在末端进出，后进先出 → 栈，用数组加一个 TOP 指针即可。\n<\/li><li>\n两端分工，先进先出 → 队列，注意用循环数组避免“假溢出”。\n<\/li><li>\n中间频繁插入删除 → 链表，代价是每个节点多一个链字段、访问要顺着走。\n<\/li><li>\n需要 O(1) 找到前驱 → 双链表；只需要首尾相接 → 循环链表。\n<\/li><li>\n二维表极稀疏 → 正交表（行、列、值三元组），不要开满二维数组。\n<\/ul>\n<h2>决策规则：存储管理怎么选<\/h2>\n<ul><li>\n块大小固定、要求快 → 伙伴系统，切分与合并都只跟二进制位打交道。\n<\/li><li>\n块大小差异大、要省空间 → 首次适配加边界标记，回收时与相邻空闲块合并。\n<\/li><li>\n存在大量共享节点、无法判断何时可删 → 标记-清扫，先标出可达节点再整体回收。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用“显然会停”代替终止性证明<\/strong>。正确做法是指出一个随每轮严格减小、又有下界的量（欧几里得算法里就是余数 r）。\n<\/li><li>\n<strong>把平均值当成与范围无关的常数<\/strong>。换一个取值范围，平均值就变了。\n<\/li><li>\n<strong>在链表上做按下标访问<\/strong>。链表没有随机访问能力，按下标访问是 O(n)，要频繁按下标取就换数组。\n<\/li><li>\n<strong>给每个节点都开满链字段<\/strong>。多链结构应按实际关系开链，稀疏矩阵更是要用正交表。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>常用求和与闭式<\/h2>\n<table><thead><tr><th>场景<\/th><th>结果<\/th><\/tr><\/thead><tbody><tr><td>1 + 2 + … + n<\/td><td>n(n+1)/2<\/td><\/tr><tr><td>1 + x + x² + … + x^n<\/td><td>(1 − x^(n+1))/(1 − x)，x ≠ 1<\/td><\/tr><tr><td>Σ C(n, k)，k 从 0 到 n<\/td><td>2^n<\/td><\/tr><tr><td>调和数 H_n<\/td><td>约等于 ln n + 0.5772<\/td><\/tr><tr><td>斐波那契 F(n)<\/td><td>约等于 φ^n / √5，φ = 1.618<\/td><\/tr><\/tbody><\/table>\n<h2>复杂度对照<\/h2>\n<table><thead><tr><th>增长阶<\/th><th>n = 1000 时的量级<\/th><th>典型来源<\/th><\/tr><\/thead><tbody><tr><td>O(1)<\/td><td>1<\/td><td>数组按下标取<\/td><\/tr><tr><td>O(log n)<\/td><td>约 10<\/td><td>折半查找、平衡树<\/td><\/tr><tr><td>O(n)<\/td><td>1000<\/td><td>顺序扫描、链表遍历<\/td><\/tr><tr><td>O(n log n)<\/td><td>约 10000<\/td><td>归并排序、堆排序<\/td><\/tr><tr><td>O(n²)<\/td><td>100 万<\/td><td>双重循环、朴素排序<\/td><\/tr><\/tbody><\/table>\n<h2>指针操作三步<\/h2>\n<table><thead><tr><th>操作<\/th><th>步骤<\/th><\/tr><\/thead><tbody><tr><td>在 P 之后插入 Q<\/td><td>Q.LINK = P.LINK；P.LINK = Q<\/td><\/tr><tr><td>删除 P 之后的 Q<\/td><td>P.LINK = Q.LINK；释放 Q<\/td><\/tr><tr><td>双链表删除 Q<\/td><td>Q.LLINK.RLINK = Q.RLINK；Q.RLINK.LLINK = Q.LLINK<\/td><\/tr><\/tbody><\/table>\n<h2>树的遍历口诀<\/h2>\n<table><thead><tr><th>遍历<\/th><th>访问根的时机<\/th><th>序列特征<\/th><\/tr><\/thead><tbody><tr><td>前序<\/td><td>先根，再左，再右<\/td><td>根排第一<\/td><\/tr><tr><td>中序<\/td><td>先左，再根，再右<\/td><td>排序树里得到升序<\/td><\/tr><tr><td>后序<\/td><td>先左，再右，再根<\/td><td>根排最后，适合释放节点<\/td><\/tr><\/tbody><\/table>\n<h2>扩充二叉树<\/h2>\n<ul><li>\n内部路径长度 I = 各内部节点深度之和。\n<\/li><li>\n外部路径长度 E = 各外部节点深度之和。\n<\/li><li>\n恒等式：E = I + 2n（n 为内部节点数）。\n<\/ul>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：算法是什么，怎么衡量它", "href": "#/chapter/ch01"}, {"label": "第 2 章：分析算法要用的数学工具箱", "href": "#/chapter/ch02"}, {"label": "第 3 章：MIX 与基本程序设计技术", "href": "#/chapter/ch03"}, {"label": "第 4 章：线性表", "href": "#/chapter/ch04"}, {"label": "第 5 章：树、多链结构与动态存储", "href": "#/chapter/ch05"}]}, {"label": "概念", "children": [{"label": "算法五准则", "href": "#/concept/c01"}, {"label": "渐近记号与大 O", "href": "#/concept/c02"}, {"label": "生成函数", "href": "#/concept/c03"}, {"label": "栈、队列与链接分配", "href": "#/concept/c04"}, {"label": "二叉树遍历", "href": "#/concept/c05"}, {"label": "动态存储分配", "href": "#/concept/c06"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：算法是什么，怎么衡量它", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：分析算法要用的数学工具箱", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：MIX 与基本程序设计技术", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：线性表", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：树、多链结构与动态存储", "href": "#/quiz/ch05"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true, "ch04": true, "ch05": true}},"taocp-v2":{"manifest": {"slug": "taocp-v2", "title": "计算机程序设计艺术 卷2：半数值算法", "subtitle": "随机数与算术：程序里那两个「不精确」的源头", "book": {"title": "计算机程序设计艺术 卷2 半数值算法", "author": "Donald E. Knuth（高德纳）著", "source": ["计算机程序设计艺术 卷2 半数值算法.pdf（扫描版 618 页）"]}, "audience": "学过卷1、会写程序的自学者", "goal": "系统掌握：能设计并检验一个可用的伪随机数发生器，看懂浮点误差与多精度算法的代价，会用秦九韶法则算多项式。", "companion": "taocp-v2学习伴侣.html", "learningPath": [{"step": "01", "title": "伪随机数怎么造", "chapterIds": ["ch01"], "checkpoint": "能手算一个模 16 的线性同余序列并数出周期，说清满周期的三个条件"}, {"step": "02", "title": "怎么证明它像随机数", "chapterIds": ["ch02"], "checkpoint": "能算一次卡方统计量并与临界值比较，能写出逆变换法与洗牌的正确做法"}, {"step": "03", "title": "浮点与多精度算术", "chapterIds": ["ch03"], "checkpoint": "能解释 0.1 加 0.2 为何不等于 0.3，能算出两个 n 位整数朴素乘法的次数"}, {"step": "04", "title": "进制、有理数与多项式", "chapterIds": ["ch04"], "checkpoint": "能用秦九韶法则手算一个四次多项式，能说清快速乘法的递归式"}], "chapters": [{"id": "ch01", "title": "第 1 章：随机数是怎么造出来的", "file": "chapters/ch01-随机数生成.md", "difficulty": 2}, {"id": "ch02", "title": "第 2 章：检验随机性，并把随机数用起来", "file": "chapters/ch02-随机性检验与应用.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：浮点与多精度算术", "file": "chapters/ch03-浮点与多精度算术.md", "difficulty": 3}, {"id": "ch04", "title": "第 4 章：进制、有理数与多项式", "file": "chapters/ch04-进制有理数与多项式.md", "difficulty": 3}], "concepts": [{"id": "c01", "title": "线性同余发生器", "file": "concepts/linear-congruential.md", "chapterIds": ["ch01"]}, {"id": "c02", "title": "卡方检验", "file": "concepts/chi-square-test.md", "chapterIds": ["ch02"]}, {"id": "c03", "title": "秦九韶法则与多精度乘法", "file": "concepts/horner-and-multiprecision.md", "chapterIds": ["ch03", "ch04"]}], "glossary": [{"term": "伪随机数", "def": "由确定性算法产生、但通过统计检验看起来像随机的数列。", "chapterId": "ch01"}, {"term": "线性同余法", "def": "用 x 的下一项等于 a 乘 x 加 c 再对 m 取余来生成数列。", "chapterId": "ch01"}, {"term": "周期", "def": "数列开始重复之前的不同项个数。", "chapterId": "ch01"}, {"term": "满周期", "def": "周期恰好等于模 m，一个周期内取遍所有余数。", "chapterId": "ch01"}, {"term": "势", "def": "衡量乘数在二进制低位上混合快慢的指标。", "chapterId": "ch01"}, {"term": "卡方检验", "def": "把观测频数与期望频数的偏差平方后按期望归一，再加总得到的统计量。", "chapterId": "ch02"}, {"term": "柯尔莫哥洛夫检验", "def": "比较经验分布函数与理论分布函数的最大差距。", "chapterId": "ch02"}, {"term": "逆变换法", "def": "用均匀随机数经过目标分布的累积分布函数反函数，得到该分布的随机数。", "chapterId": "ch02"}, {"term": "洗牌", "def": "把 n 个元素随机重排，使 n! 种排列等概率出现。", "chapterId": "ch02"}, {"term": "浮点", "def": "用符号、指数、尾数三部分表示实数，尾数位数决定精度。", "chapterId": "ch03"}, {"term": "有效位", "def": "浮点尾数中真正可靠的二进制位数。", "chapterId": "ch03"}, {"term": "多精度算术", "def": "把大整数切成若干位一块，用数组表示并逐块运算。", "chapterId": "ch03"}, {"term": "模算术", "def": "只保留余数的算术，加减乘可以直接做，除法要解同余式。", "chapterId": "ch03"}, {"term": "快速乘法", "def": "把大整数对半切开，用三次半规模乘法替代四次，把复杂度降到约 n 的 1.585 次方。", "chapterId": "ch03"}, {"term": "秦九韶法则", "def": "从最高次项开始，每次「乘 x 再加下一项」的求值方法。", "chapterId": "ch04"}, {"term": "幂级数", "def": "形如 a0 加 a1x 加 a2x 平方……的无穷和，用于近似函数。", "chapterId": "ch04"}, {"term": "进制转换", "def": "把一个整数在基数 b 与基数 b 的幂之间重新表示。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "single", "question": "线性同余法满周期的条件不包括下列哪一条？", "options": ["c 与 m 互素", "a−1 被 m 的所有素因子整除", "m 必须是素数", "m 被 4 整除时 a−1 也被 4 整除"], "answer": 2, "explain": "模可以是 2 的幂也可以是素数，条件里没有要求 m 必须是素数。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "blank", "question": "m=16、a=5、c=3、x0=1 的线性同余序列，周期是多少？（填数字）", "options": [], "answer": "16", "explain": "序列走遍 0 到 15 后回到 1，周期等于模 16。"}, {"id": "ch01-q03", "chapterId": "ch01", "type": "single", "question": "模取 2 的幂时，线性同余序列的哪一部分质量最差？", "options": ["最高位", "最低位", "中间位", "都一样"], "answer": 1, "explain": "模 2^e 时最低位周期只有 2，第 k 位周期最多 2^(k+1)；进位只向上传播，低位看不到高位变化。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "掷骰子 60 次，六面各出现 10 次，卡方统计量是多少？", "options": ["0", "1", "6", "10"], "answer": 0, "explain": "每项 (10−10)²/10 = 0，总和 0。统计量恰为 0 反而提示「整齐得不像抽样」。"}, {"id": "ch02-q05", "chapterId": "ch02", "type": "blank", "question": "卡方检验分成 6 个格子，自由度是多少？（填数字）", "options": [], "answer": "5", "explain": "自由度 = 格子数 − 1 = 5，因为六个频数之和被样本量固定。"}, {"id": "ch02-q06", "chapterId": "ch02", "type": "single", "question": "正确的洗牌做法是？", "options": ["每个 i 与 1 到 n 中随机位置交换", "从 i=n 递减，与 1 到 i 中随机位置交换", "随机排序键后排序", "每次随机取两个位置交换 n 次"], "answer": 1, "explain": "Fisher-Yates：第 i 步只在 1 到 i 中取，路径数恰为 n!，每种排列等概率。全范围交换有 n^n 条路径，通常不能被 n! 整除，必然偏斜。"}, {"id": "ch03-q07", "chapterId": "ch03", "type": "single", "question": "双精度浮点数的尾数（含隐含位）是多少位？", "options": ["24", "32", "53", "64"], "answer": 2, "explain": "52 位显式尾数加 1 位隐含位共 53 位，约 16 位十进制有效数字。"}, {"id": "ch03-q08", "chapterId": "ch03", "type": "blank", "question": "快速乘法递归式 T(n)=3T(n/2)+O(n) 的复杂度指数约为多少？（填三位小数）", "options": [], "answer": "1.585", "explain": "指数是 log2 3 ≈ 1.58496，取三位为 1.585。"}, {"id": "ch03-q09", "chapterId": "ch03", "type": "single", "question": "双精度下 1e16 + 1 − 1e16 的结果是？", "options": ["0", "1", "2", "1e16"], "answer": 0, "explain": "1e16 附近的 ulp 是 2，加 1 不足半个 ulp 被舍入回 1e16，再减 1e16 得 0。"}, {"id": "ch04-q10", "chapterId": "ch04", "type": "single", "question": "十进制 100 的二进制表示是？", "options": ["1100100", "1001100", "1010100", "1110000"], "answer": 0, "explain": "64 + 32 + 4 = 100，对应第 6、5、2 位为 1，即 1100100。"}, {"id": "ch04-q11", "chapterId": "ch04", "type": "blank", "question": "用秦九韶法则算 2x³+3x²+5x+7 在 x=2 处的值，结果是多少？（填数字）", "options": [], "answer": "45", "explain": "2 → 7 → 19 → 45，与直接代入 16+12+10+7=45 一致。"}, {"id": "ch04-q12", "chapterId": "ch04", "type": "single", "question": "计算 x^15 最少需要多少次乘法？", "options": ["4", "6", "15", "8"], "answer": 1, "explain": "x²、x³、x⁶、x⁷、x¹⁴、x¹⁵ 各一次乘法，共 6 次（3 次平方、3 次相乘）。"}, {"id": "q13", "chapterId": "__all__", "type": "single", "question": "综合题：要为一个模拟程序选伪随机数发生器，既要求快又要求二维相关性可接受，最合理的做法是？", "options": ["模取 2 的幂并直接用最低位", "模取素数或组合两个发生器，并做谱检验", "平方取中法", "固定种子重复使用同一段序列"], "answer": 1, "explain": "模取素数让高低位质量一致，组合发生器提升周期与统计性质，谱检验专门查二维相关性。最低位质量最差，平方取中会退化，重复同一段不是新样本。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "线性同余法的递推式怎么写？", "back": "x(n+1) = (a·x(n) + c) mod m，参数是模 m、乘数 a、增量 c、初值 x0。", "tags": ["随机数"]}, {"id": "f02", "chapterId": "ch01", "front": "满周期的三个条件是什么？", "back": "gcd(c, m)=1；a−1 被 m 的所有素因子整除；m 被 4 整除时 a−1 也被 4 整除。", "tags": ["随机数"]}, {"id": "f03", "chapterId": "ch01", "front": "为什么线性同余不能直接用最低位？", "back": "模 2^e 时最低位周期只有 2，第 k 位周期最多 2^(k+1)，低位都很短，要用高位。", "tags": ["随机数"]}, {"id": "f04", "chapterId": "ch01", "front": "模取 2 的幂与取素数各有什么代价？", "back": "2 的幂快（按位与）但低位差；素数高低位一致但要做真除法。", "tags": ["随机数"]}, {"id": "f05", "chapterId": "ch02", "front": "卡方统计量的公式与自由度怎么定？", "back": "χ² = Σ(观测−期望)²/期望；自由度 = 格子数 − 1。", "tags": ["检验"]}, {"id": "f06", "chapterId": "ch02", "front": "卡方检验对期望频数有什么要求？", "back": "每格期望不小于 5，否则近似失效，要合并相邻格子。", "tags": ["检验"]}, {"id": "f07", "chapterId": "ch02", "front": "逆变换法怎么把均匀数变成指数分布？", "back": "x = −ln(1−u)/λ，λ 是速率参数。", "tags": ["变换"]}, {"id": "f08", "chapterId": "ch02", "front": "Fisher-Yates 洗牌怎么做？", "back": "从 i=n 递减到 2，随机取 j 在 1 到 i 之间，交换第 i 与第 j 个。", "tags": ["洗牌"]}, {"id": "f09", "chapterId": "ch03", "front": "浮点数由哪三部分组成？", "back": "符号位、指数、尾数；尾数位数决定精度。", "tags": ["浮点"]}, {"id": "f10", "chapterId": "ch03", "front": "为什么 0.1 + 0.2 不等于 0.3？", "back": "0.1 与 0.2 在二进制下都是无限循环小数，存进有限尾数时已被截断，相加再舍入。", "tags": ["浮点"]}, {"id": "f11", "chapterId": "ch03", "front": "朴素多精度乘法的代价是多少？快速乘法呢？", "back": "朴素 O(n²)；快速乘法 T(n)=3T(n/2)+O(n)，约 O(n^1.585)。", "tags": ["多精度"]}, {"id": "f12", "chapterId": "ch03", "front": "模运算里什么时候可以做除法？", "back": "除数的逆元存在时，条件是 gcd(a, m) = 1。", "tags": ["模算术"]}, {"id": "f13", "chapterId": "ch04", "front": "整数转 b 进制的步骤？", "back": "不断除以 b 记余数，商为 0 后把余数倒着读。", "tags": ["进制"]}, {"id": "f14", "chapterId": "ch04", "front": "秦九韶法则的步骤？", "back": "从最高次系数开始，每次「乘 x 再加下一个系数」，直到常数项。", "tags": ["多项式"]}, {"id": "f15", "chapterId": "ch04", "front": "有理数运算为什么必须约分？", "back": "不约分分子分母会指数膨胀；用欧几里得算法约分后规模可控。", "tags": ["有理数"]}, {"id": "f16", "chapterId": "ch04", "front": "Horner 与进制转换有什么共同点？", "back": "两者都是「从一端开始，每步乘基数再加下一位/下一系数」，是同一个算法。", "tags": ["多项式"]}]}, "rendered": {"ch01": "<h1>第 1 章：随机数是怎么造出来的<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：卷1 第 1 章（算法与代价）、卷1 第 2 章（同余与数论）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清「伪随机数」为什么能替代随机数，以及它替代不了什么。\n<\/li><li>\n写出线性同余法的递推式，手算一小段序列并数出周期。\n<\/li><li>\n用满周期的三个条件判断一组参数行不行。\n<\/li><li>\n解释为什么线性同余的低位不能直接用，模取 2 的幂与取素数各有什么代价。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>计算机造不出真随机，它造的是<strong>周期极长、通过统计检验的确定序列<\/strong>；随机性的保证来自数论，不来自算法有多复杂。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：伪随机数到底「伪」在哪（难度：基础）<\/h3>\n<p>真随机来自物理过程（噪声、放射性衰变）。程序只能做确定运算，所以同一个种子必然产生同一串数。<\/p>\n<p>这看起来是缺陷，实际是优点：<strong>可复现<\/strong>。调试模拟、跑对照实验、复现论文结果，都要求「同样的种子给同样的序列」。真正要避免的是另一件事——序列看起来有规律，比如每 10 个数循环一次，或者低位总是 0 和 1 交替。<\/p>\n<p>所以「伪随机」的合格标准是两条：周期足够长（长到实验跑不完一个周期），统计性质足够像独立均匀分布（过得了检验）。<\/p>\n<p><strong>类比<\/strong>：掷骰子换成按一张极长的数字表往下读。表是印好的（确定），但你不知道从哪一行开始，读出来的数字看起来就是随机的。 <strong>类比失效<\/strong>：真骰子每次掷都独立；数字表只要知道位置就能预测下一个数。密码学场景里这一点是致命的，所以加密用的随机数不能用这种表。<\/p>\n<h3>概念 2：线性同余法（难度：基础）<\/h3>\n<p>最常用的一类发生器，递推只有一行：<\/p>\n<p>x(n+1) = (a·x(n) + c) mod m<\/p>\n<p>四个参数：模 m、乘数 a、增量 c、初值 x0。输出取 x(n) 本身，或取它除以 m 的小数。<\/p>\n<p><strong>手算实例<\/strong>：m = 16，a = 5，c = 3，x0 = 1。<\/p>\n<table><thead><tr><th>n<\/th><th>x(n)<\/th><th>计算<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><td>初值<\/td><\/tr><tr><td>1<\/td><td>8<\/td><td>5×1+3 = 8，8 mod 16 = 8<\/td><\/tr><tr><td>2<\/td><td>11<\/td><td>5×8+3 = 43，43 mod 16 = 11<\/td><\/tr><tr><td>3<\/td><td>10<\/td><td>5×11+3 = 58，58 mod 16 = 10<\/td><\/tr><tr><td>4<\/td><td>5<\/td><td>5×10+3 = 53，53 mod 16 = 5<\/td><\/tr><tr><td>5<\/td><td>12<\/td><td>5×5+3 = 28，28 mod 16 = 12<\/td><\/tr><tr><td>6<\/td><td>15<\/td><td>5×12+3 = 63，63 mod 16 = 15<\/td><\/tr><tr><td>7<\/td><td>14<\/td><td>5×15+3 = 78，78 mod 16 = 14<\/td><\/tr><tr><td>8<\/td><td>9<\/td><td>5×14+3 = 73，73 mod 16 = 9<\/td><\/tr><tr><td>9<\/td><td>0<\/td><td>5×9+3 = 48，48 mod 16 = 0<\/td><\/tr><tr><td>10<\/td><td>3<\/td><td>5×0+3 = 3<\/td><\/tr><tr><td>11<\/td><td>2<\/td><td>5×3+3 = 18，18 mod 16 = 2<\/td><\/tr><tr><td>12<\/td><td>13<\/td><td>5×2+3 = 13<\/td><\/tr><tr><td>13<\/td><td>4<\/td><td>5×13+3 = 68，68 mod 16 = 4<\/td><\/tr><tr><td>14<\/td><td>7<\/td><td>5×4+3 = 23，23 mod 16 = 7<\/td><\/tr><tr><td>15<\/td><td>6<\/td><td>5×7+3 = 38，38 mod 16 = 6<\/td><\/tr><tr><td>16<\/td><td>1<\/td><td>5×6+3 = 33，33 mod 16 = 1<\/td><\/tr><\/tbody><\/table>\n<p>第 16 步回到初值 1，所以周期是 16，正好等于模 m。这一串把 0 到 15 全部取了一遍，叫<strong>满周期<\/strong>。<\/p>\n<h3>概念 3：满周期的三个条件（难度：进阶）<\/h3>\n<p>不是随便选 a、c 都能满周期。三个条件同时成立才够：<\/p>\n<ol><li>\n<strong>c 与 m 互素<\/strong>：gcd(c, m) = 1。\n<\/li><li>\n<strong>a − 1 能被 m 的所有素因子整除<\/strong>。\n<\/li><li>\n<strong>若 m 被 4 整除，则 a − 1 也能被 4 整除<\/strong>。\n<\/ol>\n<p>用上面的例子核对：m = 16 = 2⁴，素因子只有 2；c = 3 与 16 互素 ✓；a − 1 = 4 能被 2 整除 ✓；m 被 4 整除，4 也能被 4 整除 ✓。三条齐，所以满周期。<\/p>\n<p><strong>为什么是这三条<\/strong>（直觉版）：第 1 条保证增量能把序列推离 0 的循环，第 2、3 条保证乘数在二进制下「搅得够狠」，让低位也跟着变。<\/p>\n<h3>概念 4：模与乘数怎么挑（难度：进阶）<\/h3>\n<ul><li>\n<strong>模取 2 的幂<\/strong>：取余变成按位与，硬件上极快。代价是低位质量差——模 2^e 时最低位的周期只有 2，次低位只有 4。所以<strong>要用高位，不要用低位<\/strong>。\n<\/li><li>\n<strong>模取素数<\/strong>：例如 m = 2^31 − 1。取余要真做除法，慢一点，但高位低位质量一样，且周期可达 m − 1。\n<\/li><li>\n<strong>纯乘同余（c = 0）<\/strong>：模 2^e 时，乘数取 a ≡ 5 (mod 8)，周期可达 2^(e−2)。\n<\/li><li>\n<strong>势（potency）<\/strong>：衡量乘数把低位搅乱的快慢。势不够，序列的低位会出现明显的短循环，即使整体周期很长。\n<\/ul>\n<p><strong>实例<\/strong>：模 2^32、乘数取 5 的纯乘同余，周期约 2^30，看起来很长；但最低位的周期只有 2，直接用 <code>x % 2<\/code> 会得到 0、1、0、1 的死循环。<\/p>\n<h3>概念 5：其他发生器（难度：进阶）<\/h3>\n<ul><li>\n<strong>平方取中法<\/strong>：把上一个数平方，取中间几位。早期用过，但会退化到 0（一旦出现 0 就永远 0），已被淘汰。\n<\/li><li>\n<strong>滞后斐波那契法<\/strong>：x(n) = x(n−k) + x(n−j) mod m，只用加法，适合硬件；理论分析比线性同余难。\n<\/li><li>\n<strong>组合发生器<\/strong>：把两个发生器的输出相加或异或。周期是两者周期的最小公倍数量级，统计性质通常更好。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 411.34765625 512\" style=\"max-width: 411.34765625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg11\"><style>#svg11{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg11 .error-icon{fill:#552222;}#svg11 .error-text{fill:#552222;stroke:#552222;}#svg11 .edge-thickness-normal{stroke-width:2px;}#svg11 .edge-thickness-thick{stroke-width:3.5px;}#svg11 .edge-pattern-solid{stroke lygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">参数合格吗</span></div></foreignObject></g></g><g transform=\"translate(217.95703125, 306)\" data-id=\"OK\" data-node=\"true\" id=\"flowchart-OK-148\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"96.78125\" y=\"-18\" x=\"-48.390625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40.890625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"81.78125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">周期等于 m</span></div></foreignObject></g></g><g transform=\"translate(355.84765625, 306)\" data-id=\"BAD\" data-node=\"true\" id=\"flowchart-BAD-150\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">提前循环</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：图上有一个闭环（生成）和一个判断（参数）。闭环转得快不代表序列好——判断分支不过关，闭环再快也只是在原地打转。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：线性同余像一台齿轮组。模 m 是齿轮的齿数，乘数 a 决定每次转几格，增量 c 决定起点偏移。齿数选得不好，齿轮会在几个位置之间来回咬，永远走不到别的齿。\n<\/li><li>\n类比失效：齿轮的周期一眼能数出来，序列的周期要靠数论算。而且现实中「走遍所有齿」也不等于「看起来随机」——顺序可能极有规律（例如每次固定加 5）。\n<\/ul>\n<p><strong>实例（判断参数）<\/strong>：m = 8，a = 5，c = 4，x0 = 1。<\/p>\n<ul><li>\ngcd(4, 8) = 4 ≠ 1，第 1 条就不过。实际序列：1 → (5+4)=9 mod 8 = 1，立刻回到初值，周期 1。这就是「条件不过关」的直接后果。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为周期长就等于随机性好<\/strong>——实际上周期 2^30 的序列也可能低位全是 0、1 交替。周期只是必要条件。\n<\/li><li>\n<strong>别以为取模 2 的幂又快又好<\/strong>——实际上快是真，低位差也是真。要么取高位，要么换素数模。\n<\/li><li>\n<strong>别以为 <code>rand() % n<\/code> 就能得到均匀的 0 到 n−1<\/strong>——实际上当 n 不整除周期时会偏斜，越靠近 n 的边界越明显。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：线性同余法满周期的条件不包括下列哪一条？\n<p>A. c 与 m 互素 B. a − 1 被 m 的所有素因子整除 C. m 必须是素数 D. m 被 4 整除时 a − 1 也被 4 整除 （答案：C；解析：模可以是 2 的幂，也可以是素数，条件里没有要求 m 必须是素数。）<\/p>\n<\/ol>\n<ol><li>\n填空题：m = 16、a = 5、c = 3、x0 = 1 的线性同余序列，周期是 ___。\n<p>（答案：16；解析：序列走遍 0 到 15 后回到 1，周期等于模 16，属满周期。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么模 2^e 的线性同余发生器不能直接取最低位当随机位？\n<p>（答案：最低位的周期只有 2，会在 0、1 之间交替；第 k 位的周期最多 2^(k+1)，低位都短。解析：模 2 的幂时进位只向上传播，低位看不到高位的变化，所以要用高位。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性同余一行递推：x(n+1) = (a·x(n) + c) mod m。\n<\/li><li>\n满周期三条件：c 与 m 互素、a−1 被 m 的素因子整除、m 被 4 整除时 a−1 也被 4 整除。\n<\/li><li>\n模 2 的幂要取高位；模取素数则高低位质量一致。\n<\/ul>", "ch02": "<h1>第 2 章：检验随机性，并把随机数用起来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1 章；基础概率\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n用卡方统计量判断一组频数是否偏离均匀，并说出自由度怎么定。\n<\/li><li>\n说出柯尔莫哥洛夫检验与卡方检验各自查什么。\n<\/li><li>\n用逆变换法把均匀随机数变成指定分布的随机数。\n<\/li><li>\n写出正确的洗牌算法，并解释常见写法为什么会偏。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>检验不能证明「随机」，只能证明「没查出问题」；用途不同，需要的随机性质也不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：卡方检验（难度：基础）<\/h3>\n<p>把取值范围分成 k 个格子，统计每个格子里实际落了多少个数，与「如果均匀应该落多少」比较。<\/p>\n<p>统计量：χ² = Σ (观测数 − 期望数)² / 期望数。<\/p>\n<p><strong>实例<\/strong>：掷一枚骰子 60 次，六个面分别出现 8、12、9、11、10、10 次。期望每面 10 次。 χ² = (8−10)²/10 + (12−10)²/10 + (9−10)²/10 + (11−10)²/10 + (10−10)²/10 + (10−10)²/10 = (4 + 4 + 1 + 1 + 0 + 0)/10 = 1.0。<\/p>\n<p>自由度 = 格子数 − 1 = 5。查表，5% 显著性水平的临界值约 11.07。1.0 远小于 11.07，所以没有理由认为骰子不均匀。<\/p>\n<p><strong>自由度为什么减 1<\/strong>：六个格子的频数加起来必须等于 60，知道五个就能推出第六个，独立信息只有 5 份。<\/p>\n<p><strong>使用时的一条硬规矩<\/strong>：每个格子的期望频数不能太小（一般要求不小于 5）。期望太小时卡方统计量不服从卡方分布，结论不可靠。解决办法是合并相邻格子。<\/p>\n<h3>概念 2：柯尔莫哥洛夫检验（难度：进阶）<\/h3>\n<p>卡方只看「每个格子多少」，不看「顺序」。柯尔莫哥洛夫检验比较的是<strong>累积分布<\/strong>：<\/p>\n<p>把 n 个观测值排序，得到经验分布函数 F_n(x)（小于等于 x 的比例）。理论分布函数记 F(x)。统计量取两者差的最大值：<\/p>\n<p>D = max |F_n(x) − F(x)|<\/p>\n<p>D 越小越像。它的好处是直接看整体形状，不依赖分格；缺点是只对连续分布好用。<\/p>\n<p><strong>两检验的分工<\/strong>：卡方查「频数是否均匀」，柯尔莫哥洛夫查「形状是否吻合」。前者对局部的偏离敏感，后者对整体的偏移敏感。<\/p>\n<h3>概念 3：谱检验与多维相关（难度：进阶）<\/h3>\n<p>线性同余生成的数对 (x(n), x(n+1)) 落在平面上并不是漫布，而是落在若干条平行直线上。谱检验就是量这些直线之间的最大空隙：空隙越小，分布越像二维均匀。<\/p>\n<p><strong>为什么会出现直线<\/strong>：因为 x(n+1) 是 x(n) 的线性函数取余，相邻两个数满足一个线性关系，落在少数几条斜率为 a 的直线上。三维、四维同理，会落在超平面上。<\/p>\n<p>这也是「乘数不能随便取」的一个原因：乘数选得差，直线少而稀，二维、三维的相关性就肉眼可见。<\/p>\n<h3>概念 4：把均匀数变成别的分布（难度：进阶）<\/h3>\n<p><strong>逆变换法<\/strong>：设目标分布的累积分布函数是 F，取一个均匀随机数 u（0 到 1），令 x = F 的反函数在 u 处的值。<\/p>\n<p><strong>实例（指数分布）<\/strong>：F(x) = 1 − e^(−λx)，反解得 x = −ln(1−u)/λ。取 λ = 2、u = 0.5： x = −ln(0.5)/2 = 0.6931/2 ≈ 0.3466。 核对：F(0.3466) = 1 − e^(−0.6931) = 1 − 0.5 = 0.5，正好对应 u = 0.5。<\/p>\n<p><strong>Box-Muller 法（正态分布）<\/strong>：取两个独立均匀数 u1、u2， z = √(−2 ln u1) · cos(2π u2)。 这样得到的 z 服从标准正态分布。它的直觉是：半径由指数分布决定（−2 ln u1 开方），角度均匀，合起来就是二维正态。<\/p>\n<h3>概念 5：洗牌（难度：进阶）<\/h3>\n<p>要把 n 个元素随机重排，要求 n! 种排列等概率。<\/p>\n<p><strong>正确做法（Fisher-Yates）<\/strong>：从 i = n 递减到 2，随机取 j 在 1 到 i 之间（含），交换第 i 与第 j 个元素。<\/p>\n<p>为什么对：第 i 步时，前 i 个位置里每个元素被换到位置 i 的概率都是 1/i，逐层乘起来每种排列的概率都是 1/n!。<\/p>\n<p><strong>常见错误写法<\/strong>：对每个 i 从 1 到 n，随机取 j 在 1 到 n 之间，交换 i 与 j。这样一共 n^n 种可能，而 n! 通常不整除 n^n，必然有排列比其他排列更常出现。n = 3 时共有 27 种路径要分给 6 种排列，27 不能被 6 整除，偏斜无法避免。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 890.6640625 340\" style=\"max-width: 890.6640625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg12\"><style>#svg12{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg12 .error-icon{fill:#552222;}#svg12 .error-text{fill:#552222;stroke:#552222;}#svg12 .edge-thickness-normal{stroke-width:2px;}#svg12 .edge-thickness-thick{stroke-width:3.5px;}#svg12 .edge-pattern-solid{stroke-dasharray:0;}#svg12 .edge-pattern-dashed{stroke-dasharray:3;}#svg12 .edge-patter 随机数 u</span></div></foreignObject></g></g><g transform=\"translate(332.078125, 151.5)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-152\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">要什么分布</span></div></foreignObject></g></g><g transform=\"translate(97.28125, 306)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-154\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"194.5625\" y=\"-18\" x=\"-97.28125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-89.78125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"179.5625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">逆变换 x 等于 F 的反函数</span></div></foreignObject></g></g><g transform=\"translate(332.078125, 306)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-156\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"175.03125\" y=\"-18\" x=\"-87.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-80.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"160.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Box Muller 两个均匀数</span></div></foreignObject></g></g><g transform=\"translate(559.3203125, 306)\" data-id=\"R\" data-node=\"true\" id=\"flowchart-R-158\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"179.453125\" y=\"-18\" x=\"-89.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-82.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"164.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">拒绝采样 避免取模偏斜</span></div></foreignObject></g></g><g transform=\"translate(770.546875, 151.5)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-160\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"208.234375\" y=\"-18\" x=\"-104.1171875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-96.6171875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"193.234375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">洗牌 Fisher Yates 从后往前</span></div></foreignObject></g></g><g transform=\"translate(770.546875, 306)\" data-id=\"P\" data-node=\"true\" id=\"flowchart-P-162\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">每种排列概率相等</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：注意「取模」被单独标成需要拒绝采样的分支。这是实践里最常见的坑：直接 <code>% n<\/code> 会偏，尤其当 n 接近发生器周期时。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：卡方检验像检查一副麻将被摸过之后每个花色数量是否接近；柯尔莫哥洛夫检验像把整副牌按大小摊开，看分布曲线贴不贴合标准曲线。\n<\/li><li>\n类比失效：麻将牌数是固定的，随机数的分布是连续或离散无限多种；检验的临界值依赖样本量，样本越大越容易「查出问题」，即使偏差很小。\n<\/ul>\n<p><strong>实例（判断偏斜）<\/strong>：某发生器输出 0 到 9，理论上每个 10%。实测 1000 次，0 出现 130 次，其余 9 个数字共 870 次、平均 96.7 次。 χ² ≈ (130−100)²/100 + 9×(96.7−100)²/100 ≈ 9 + 0.98 ≈ 9.98。 自由度 9，5% 临界值约 16.9。9.98 &lt; 16.9，单看这一项还不算显著；但 0 的偏差已经很明显，值得再查低位。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为检验通过就说明「真随机」<\/strong>——实际上只说明这批数据没暴露问题。换一段、换一个维度可能就查出来了。\n<\/li><li>\n<strong>别以为卡方值越小越好<\/strong>——实际上太小（接近 0）反而可疑，说明观测值与期望值贴合得不像随机抽样。\n<\/li><li>\n<strong>别以为洗牌只要「看起来乱」就行<\/strong>——实际上要求每种排列等概率，错误写法产生的偏斜用肉眼看不出来，但用统计一测就现形。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n单选题：掷骰子 60 次，六面各 10 次，卡方统计量是多少？\n<p>A. 0 B. 1 C. 6 D. 10 （答案：A；解析：每项 (10−10)²/10 = 0，总和 0。注意统计量为 0 反而提示「过于整齐」，真实抽样很少这么巧。）<\/p>\n<\/ol>\n<ol><li>\n填空题：卡方检验中，把范围分成 6 个格子，自由度是 ___。\n<p>（答案：5；解析：自由度 = 格子数 − 1 = 6 − 1 = 5，因为六个频数之和被样本量固定。）<\/p>\n<\/ol>\n<ol><li>\n简答题：为什么「对每个 i 随机与 1 到 n 中某个位置交换」的洗牌不公平？\n<p>（答案：一共 n^n 条执行路径，而目标排列只有 n! 种，n^n 通常不能被 n! 整除，必然有排列被多算、有排列被少算。解析：正确做法是第 i 步只在 1 到 i 中取，路径数恰好是 n!，一一对应。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n卡方：Σ(观测−期望)²/期望，自由度 = 格子数 − 1，期望频数不小于 5。\n<\/li><li>\n柯尔莫哥洛夫看累积分布的最大差，查形状；卡方查频数。\n<\/li><li>\n洗牌从后往前，每步只在 1 到 i 中取。\n<\/ul>", "ch03": "<h1>第 3 章：浮点与多精度算术<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1 章；二进制基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清浮点数的三部分结构，解释为什么 0.1 加 0.2 不等于 0.3。\n<\/li><li>\n举一个灾难性抵消的例子并说明原因。\n<\/li><li>\n用数组表示大整数，写出多精度加法与朴素乘法的代价。\n<\/li><li>\n说清快速乘法为什么能把 O(n²) 降到约 O(n^1.585)。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>浮点数的本质是「用固定位数的科学计数法表示实数」，<strong>能表示的数只有有限多个<\/strong>；多精度算术的本质是「把大数切块，用整数运算模拟手算竖式」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：浮点数的三部分（难度：基础）<\/h3>\n<p>一个浮点数由三部分构成：<\/p>\n<ul><li>\n<strong>符号位<\/strong>：正或负。\n<\/li><li>\n<strong>指数<\/strong>：决定数量级，相当于科学计数法里的 10 的几次方，只不过底数是 2。\n<\/li><li>\n<strong>尾数<\/strong>（也叫有效数字）：决定精度，相当于科学计数法里小数点后的那串数字。\n<\/ul>\n<p>双精度（64 位）里，尾数占 52 位，加上隐含的 1 位共 53 位有效二进制位。53 位约等于 15.95 位十进制数字，所以说双精度有「约 16 位有效数字」。<\/p>\n<p><strong>类比<\/strong>：浮点像一把只有 16 个刻度的尺子，量什么都能量，但只能记到 16 位。量一栋楼和量一颗螺丝，绝对精度不同，相对精度一样。 <strong>类比失效<\/strong>：尺子的刻度是均匀的，浮点数的刻度随指数变化——数值越大，相邻两个可表示数的间隔越大（这个间隔叫 ulp）。<\/p>\n<h3>概念 2：0.1 加 0.2 为什么不等于 0.3（难度：进阶）<\/h3>\n<p>0.1 在二进制下是无限循环小数：0.000110011001100…（1100 循环）。有限位的尾数只能截断，存进去的已经不是精确的 0.1，而是一个略大或略小的近似值。<\/p>\n<p>0.2 同理。两个近似值相加，再舍入到最近的 53 位，结果可能是 0.30000000000000004。<\/p>\n<p><strong>这不是程序的 bug，是表示方式的必然结果<\/strong>。<\/p>\n<p><strong>推论一<\/strong>：不要用 <code>==<\/code> 比较两个浮点数，要比较差值是否小于容差。 <strong>推论二<\/strong>：判断「0.1 + 0.2 是否等于 0.3」这类问题，答案永远是「按位比较不等，按数学期望相等」。<\/p>\n<p><strong>灾难性抵消<\/strong>：两个相近的大数相减，有效位会被「抵消」掉。 实例：双精度下 1e16 + 1 的结果仍是 1e16。因为 1e16 附近的 ulp 是 2，加 1 不足半个 ulp，被舍入掉了。再减 1e16 得到 0，而数学上应该是 1。<\/p>\n<h3>概念 3：多精度加法的代价（难度：基础）<\/h3>\n<p>把大整数按基数 b 切块，存进数组，低位在前。例如十进制 123456 存成 [6, 5, 4, 3, 2, 1]（每块一位），或按千进制存成 [456, 123]。<\/p>\n<p><strong>加法<\/strong>：从低位到高位逐块相加，处理进位。n 块需要 n 次加法加 n 次进位判断，代价 O(n)。 <strong>减法<\/strong>：同理，借位从高位借。 <strong>比较<\/strong>：从最高块往下比，第一个不同的块决定大小。<\/p>\n<h3>概念 4：朴素乘法的代价（难度：进阶）<\/h3>\n<p>竖式乘法：用第二个数的每一位去乘第一个数的每一位，再把结果错位相加。<\/p>\n<p><strong>实例<\/strong>：47 × 23。<\/p>\n<ul><li>\n3 × 47 = 141\n<\/li><li>\n2 × 47 = 94，整体左移一位得 940\n<\/li><li>\n141 + 940 = 1081\n<\/ul>\n<p>代价：n 位乘 n 位，要做 n² 次单位乘法、约 n² 次加法。所以朴素多精度乘法是 O(n²)。<\/p>\n<p><strong>为什么这很重要<\/strong>：RSA 加密要乘几百位、几千位的整数，O(n²) 在 n = 4096 位时是 1600 万次单位乘法，太慢。这就是快速乘法的动机。<\/p>\n<h3>概念 5：快速乘法（难度：高难）<\/h3>\n<p>把两个 n 位数各切成高低两半：<\/p>\n<p>X = X1·b^(n/2) + X0，Y = Y1·b^(n/2) + Y0<\/p>\n<p>直接展开要算四次半规模乘法：X1Y1、X1Y0、X0Y1、X0Y0。<\/p>\n<p>Karatsuba 的技巧是只算三次：<\/p>\n<ol><li>\nP1 = X1·Y1\n<\/li><li>\nP2 = X0·Y0\n<\/li><li>\nP3 = (X1 + X0)(Y1 + Y0)\n<\/ol>\n<p>中间项 X1Y0 + X0Y1 = P3 − P1 − P2，不用再乘。<\/p>\n<p>于是 T(n) = 3T(n/2) + O(n)。展开得 T(n) = O(n^log2 3) ≈ O(n^1.585)。n = 4096 时，n^1.585 约 4.6×10⁵ 量级，比 n² 的 1.6×10⁷ 小一个多数量级。<\/p>\n<p><strong>代价<\/strong>：多做了几次加减法，但加减是 O(n)，比省下的一次 O(n²) 乘法划算。<\/p>\n<h3>概念 6：模算术（难度：进阶）<\/h3>\n<p>模 m 的算术只保留余数。加、减、乘都可以先算再取余；除法要先求逆元。<\/p>\n<p><strong>实例<\/strong>：模 7 下，3 × 5 = 15 ≡ 1，所以 3 的逆元是 5，5 的逆元是 3。要求 3 除 2（即 2 × 3 的逆元），就是 2 × 5 = 10 ≡ 3。<\/p>\n<p><strong>为什么除法难<\/strong>：不是所有数都有逆元。模 6 下，2 没有逆元，因为 2x ≡ 1 (mod 6) 无解（左边永远是偶数）。有逆元的充要条件是 gcd(a, m) = 1。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 483.93359375 512\" style=\"max-width: 483.93359375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg13\"><style>#svg13{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg13 .error-icon{fill:#552222;}#svg13 .error-text{fill:#552222;stroke:#552222;}#svg13 .edge-thickness-normal{stroke-width:2px;}#svg13 .edge-thickness-thick{stroke-width:3.5px;}#svg13 .edge-pattern-solid{stroke-dasharray:0;}#svg13 .edge-pattern-dashed{stroke-dasharray:3;}#svg13 .edge-pattern-dotted{stroke-dasharray:2;}#svg13 .marker{fill:#333333;stroke:#333333;}#svg13 .marker.cross{stroke:#333333;}#svg13 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg13 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg13 .cluster-label text{fill:#333;}#svg13 .cluster-label span,#svg13 p{color:#333;}#svg13 .label text,#svg13 span,#svg13 p{fill:#333;color:#333;}#svg13 .node rect,#svg13 .node circle,#svg13 .node ellipse,#svg13 .node polygon,#svg13 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg13 .flowchart-label text{text-anchor:middle;}#svg13 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg13 .node .label{text-align:center;}#svg13 .node.clickable{cursor:pointer;}#svg13 .arrowheadPath{fill:#333333;}#svg13 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg13 .flowchart-link{stroke:#333333;fill:none;}#svg13 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg13 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg13 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg13 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg13 .cluster text{fill:#333;}#svg13 .cluster span,#svg13 p{color:#333;}#svg13 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-s rkerUnits=\"userSpaceOnUse\" refY=\"5.2\" refX=\"-1\" viewBox=\"0 0 11 11\" class=\"marker cross flowchart\" id=\"svg13_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg13_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-A LE-B\" id=\"L-A-B-0\" d=\"M216.297,36L216.297,40.167C216.297,44.333,216.297,52.667,216.363,60.2C216.429,67.734,216.561,74.467,216.627,77.834L216.693,81.201\"></path><path marker-end=\"url(#svg13_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-B LE-C\" id=\"L-B-C-0\" d=\"M258.194,176.103L280.122,188.836C302.05,201.569,345.906,227.034,367.834,244.801C389.762,262.567,389.762,272.633,389.762,277.667L389.762,282.7\"></path><path marker-end=\"url(#svg13_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-B LE-D\" id=\"L-B-D-0\" d=\"M184.717,185.42L173.822,196.6C162.927,207.78,141.137,230.14,130.243,246.353C119.348,262.567,119.348,272.633,119.348,277.667L119.348,282.7\"></path><path marker-end=\"url(#svg13_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-D LE-E\" id=\"L-D-E-0\" d=\"M85.554,324L77.731,328.167C69.908,332.333,54.263,340.667,46.44,348.117C38.617,355.567,38.617,362.133,38.617,365.417L38.617,368.7\"></path><path marker-end=\"url(#svg13_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-D LE-F\" id=\"L-D-F-0\" d=\"M153.142,324L160.965,328.167C168.787,332.333,184.433,340.667,192.255,348.117C200.078,355.567,200.078,362.133,200.078,365.417L200.078,368.7\"></path><path marker-end=\"url(#svg13_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-
