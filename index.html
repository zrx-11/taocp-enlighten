><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：卷1 至卷3 的 MMIX 重写<\/h1><div class='quiz-item' data-qid='ch03-q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> MMIX 相比 MIX，字长与字节宽度的变化是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q07' value='0'> 32 位到 64 位，6 位字节到 8 位字节<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='1'> 16 位到 32 位<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='2'> 不变<\/label><label class='quiz-opt'><input type='radio' name='ch03-q07' value='3'> 64 位到 128 位<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q08' data-type='blank'><p class='quiz-q'><b>Q2.<\/b> 双链表删除一个已知节点需要修改几个指针？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 为什么 64 位下链表相对数组更不划算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q09' value='0'> 指针占 8 字节且节点分散，空间与缓存都更差<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='1'> 链表不能存 64 位数据<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='2'> 链表不能删除<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='3'> 数组不能随机访问<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='通用寄存器'>通用寄存器 — MMIX 的 256 个 64 位寄存器，编号 0 到 255，其中 0 号恒为 0。 <span class=glossary-ref>（第 1 章：MMIX 的寄存器、内存与指令）<\/span><\/li><li data-term='三地址指令'>三地址指令 — 一条指令同时指定两个源操作数和一个目的寄存器。 <span class=glossary-ref>（第 1 章：MMIX 的寄存器、内存与指令）<\/span><\/li><li data-term='加载与存储'>加载与存储 — 在内存与寄存器之间搬运数据的指令。 <span class=glossary-ref>（第 1 章：MMIX 的寄存器、内存与指令）<\/span><\/li><li data-term='分支'>分支 — 根据比较结果跳转到另一个地址。 <span class=glossary-ref>（第 1 章：MMIX 的寄存器、内存与指令）<\/span><\/li><li data-term='汇编语言'>汇编语言 — 用助记符写指令、由汇编器翻译成机器码的语言。 <span class=glossary-ref>（第 2 章：汇编、子程序与协同程序）<\/span><\/li><li data-term='栈帧'>栈帧 — 一次子程序调用在栈上占用的区域，存返回地址与局部变量。 <span class=glossary-ref>（第 2 章：汇编、子程序与协同程序）<\/span><\/li><li data-term='pushj'>pushj — MMIX 的跳转并保存返回地址指令。 <span class=glossary-ref>（第 2 章：汇编、子程序与协同程序）<\/span><\/li><li data-term='协同程序'>协同程序 — 可以互相暂停与恢复、交替执行的两段代码。 <span class=glossary-ref>（第 2 章：汇编、子程序与协同程序）<\/span><\/li><li data-term='解释程序'>解释程序 — 逐条读取指令并模拟其行为的程序。 <span class=glossary-ref>（第 2 章：汇编、子程序与协同程序）<\/span><\/li><li data-term='链接分配'>链接分配 — 用指针把分散的内存块串成表。 <span class=glossary-ref>（第 3 章：卷1 至卷3 的 MMIX 重写）<\/span><\/li><li data-term='替代选择'>替代选择 — 外部排序中用堆边写边读、加长游程的方法。 <span class=glossary-ref>（第 3 章：卷1 至卷3 的 MMIX 重写）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：把一段算法翻成机器码<\/h2>\n<ol><li>\n<strong>分配寄存器<\/strong>：把最热的变量放进寄存器，$0 恒为 0 可当常数零用。\n<\/li><li>\n<strong>写循环<\/strong>：循环变量、边界、步长各占一个寄存器；先写退出条件。\n<\/li><li>\n<strong>处理数组<\/strong>：基址寄存器加偏移，加载/存储成对出现。\n<\/li><li>\n<strong>函数调用<\/strong>：参数放寄存器，pushj 保存返回地址，pop 恢复。\n<\/li><li>\n<strong>核对<\/strong>：用几条边界输入跑一遍，检查寄存器与内存的最终值。\n<\/ol>\n<h2>决策规则：什么时候用协同程序<\/h2>\n<ul><li>\n两个过程要对称地交替推进（生产者/消费者、两遍扫描）→ 协同程序。\n<\/li><li>\n一方调用另一方、调用完必须返回 → 普通子程序。\n<\/li><li>\n需要保存「执行到一半」的状态 → 协同程序的栈。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把返回地址存在固定寄存器里<\/strong>：嵌套调用会覆盖，必须压栈。\n<\/li><li>\n<strong>用 $0 存数据<\/strong>：$0 恒为 0，写进去也读不回来。\n<\/li><li>\n<strong>忘记 MMIX 的地址是字节地址<\/strong>：按 8 字节一个单位算偏移时要乘以 8。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>机器规格<\/h2>\n<table><thead><tr><th>项目<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>通用寄存器<\/td><td>256 个，每个 64 位，$0 恒为 0<\/td><\/tr><tr><td>地址空间<\/td><td>2^64 字节<\/td><\/tr><tr><td>指令长度<\/td><td>32 位，含 opcode 与三个操作数字段<\/td><\/tr><tr><td>字节序<\/td><td>大端（高位字节在低地址）<\/td><\/tr><\/tbody><\/table>\n<h2>常用指令<\/h2>\n<table><thead><tr><th>动作<\/th><th>指令<\/th><\/tr><\/thead><tbody><tr><td>加载 8 字节<\/td><td>LDO / LDV<\/td><\/tr><tr><td>存储 8 字节<\/td><td>STO / STV<\/td><\/tr><tr><td>加法<\/td><td>ADD<\/td><\/tr><tr><td>比较<\/td><td>CMP<\/td><\/tr><tr><td>条件跳转<\/td><td>BZ / BN / BP<\/td><\/tr><tr><td>调用子程序<\/td><td>PUSHJ<\/td><\/tr><tr><td>返回<\/td><td>POP<\/td><\/tr><\/tbody><\/table>\n<h2>调用约定<\/h2>\n<table><thead><tr><th>项目<\/th><th>做法<\/th><\/tr><\/thead><tbody><tr><td>参数<\/td><td>放 $1 起的高编号寄存器或栈<\/td><\/tr><tr><td>返回地址<\/td><td>PUSHJ 压栈，POP 弹出<\/td><\/tr><tr><td>局部变量<\/td><td>栈帧内偏移寻址<\/td><\/tr><tr><td>返回值<\/td><td>放固定寄存器<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：MMIX 的寄存器、内存与指令", "href": "#/chapter/ch01"}, {"label": "第 2 章：汇编、子程序与协同程序", "href": "#/chapter/ch02"}, {"label": "第 3 章：卷1 至卷3 的 MMIX 重写", "href": "#/chapter/ch03"}]}, {"label": "概念", "children": [{"label": "MMIX 指令格式", "href": "#/concept/c01"}, {"label": "子程序与栈帧", "href": "#/concept/c02"}, {"label": "协同程序", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：MMIX 的寄存器、内存与指令", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：汇编、子程序与协同程序", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：卷1 至卷3 的 MMIX 重写", "href": "#/quiz/ch03"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCoverage": {"ch01": true, "ch02": true, "ch03": true}}};
const META = [{"key": "taocp-v1", "title": "计算机程序设计艺术 卷1：基本算法", "subtitle": "从「什么叫算法」到树与动态存储：整套 TAOCP 的地基", "chapters": 5, "concepts": 6, "quizzes": 16, "cards": 23, "companion": "01-基本算法/taocp-v1学习伴侣.html"}, {"key": "taocp-v2", "title": "计算机程序设计艺术 卷2：半数值算法", "subtitle": "随机数与算术：程序里那两个「不精确」的源头", "chapters": 4, "concepts": 3, "quizzes": 13, "cards": 16, "companion": "02-半数值算法/taocp-v2学习伴侣.html"}, {"key": "taocp-v3", "title": "计算机程序设计艺术 卷3：排序与查找", "subtitle": "把「找」和「排」这两件事的代价算到底", "chapters": 6, "concepts": 3, "quizzes": 19, "cards": 18, "companion": "03-排序与查找/taocp-v3学习伴侣.html"}, {"key": "taocp-v4a", "title": "计算机程序设计艺术 卷4A：组合算法（一）", "subtitle": "把「所有可能」变成可计算的对象", "chapters": 4, "concepts": 3, "quizzes": 13, "cards": 12, "companion": "04-组合算法一/taocp-v4a学习伴侣.html"}, {"key": "taocp-v4b", "title": "计算机程序设计艺术 卷4B：生成所有元组和排列", "subtitle": "n 元组与排列：两种最基本的「全部可能」", "chapters": 2, "concepts": 3, "quizzes": 7, "cards": 7, "companion": "05-生成元组与排列/taocp-v4b学习伴侣.html"}, {"key": "mmix", "title": "计算机程序设计艺术 MMIX 增补", "subtitle": "用一台 64 位机器，把前几卷的算法真正跑起来", "chapters": 3, "concepts": 3, "quizzes": 10, "cards": 7, "companion": "06-MMIX增补/mmix学习伴侣.html"}];
const CROSS = {"doc1": "<h1>跨书总览：TAOCP 六书学习路线<\/h1>\n<p>这套知识库把六本 TAOCP 中文版做成了一条可以按顺序推进的路线。目标不是「读完」，而是<strong>系统掌握<\/strong>：读完能自己判断一个算法场景该用什么结构、代价大概多少、什么时候会退化。<\/p>\n<h2>推荐学习顺序<\/h2>\n<table><thead><tr><th>顺序<\/th><th>书<\/th><th>为什么在这个位置<\/th><th>能力里程碑<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>卷1 基本算法<\/td><td>全书的地基：算法分析、数学工具、MIX、线性表、树。后面五本都默认你懂这里的记号<\/td><td>能写出 O 记号、能手算一个算法的平均代价、能解释栈与链表<\/td><\/tr><tr><td>2<\/td><td>卷2 半数值算法<\/td><td>只依赖卷1 的数论与算术基础；随机数与浮点是后面排序、组合实验的工具<\/td><td>能设计并检验一个伪随机数发生器，能解释浮点误差<\/td><\/tr><tr><td>3<\/td><td>卷3 排序与查找<\/td><td>依赖卷1 的树与卷2 的概率工具；是「算法分析」最完整的一次实战<\/td><td>能算比较次数下界、能算外部排序趟数、能选对查找结构<\/td><\/tr><tr><td>4<\/td><td>卷4A 组合算法（一）<\/td><td>依赖卷1 的排列组合与卷3 的算法分析；开始处理指数级问题<\/td><td>能表示并化简布尔函数、能写出不重不漏的生成算法<\/td><\/tr><tr><td>5<\/td><td>卷4B 生成元组与排列<\/td><td>卷4A 第 7.2 节的展开；最短的一册，适合作为组合算法的收尾<\/td><td>能实现字典序、格雷码、相邻交换三类生成<\/td><\/tr><tr><td>6<\/td><td>MMIX 增补<\/td><td>旁注性质：把卷1 至卷3 的算法落到真实机器上。可以在任意阶段穿插读<\/td><td>能读懂 MMIX 汇编、能解释栈帧与协同程序<\/td><\/tr><\/tbody><\/table>\n<h2>各书定位（一句话）<\/h2>\n<ul><li>\n<strong>卷1 基本算法<\/strong>：定义「算法分析」这门手艺，给出全书共用的数学工具箱与数据结构底座。\n<\/li><li>\n<strong>卷2 半数值算法<\/strong>：处理两类算不准的东西——随机与实数，教你把近似变成可控的近似。\n<\/li><li>\n<strong>卷3 排序与查找<\/strong>：把「排」与「找」的代价算到常数级，并给出 n log n 的信息论下界。\n<\/li><li>\n<strong>卷4A 组合算法（一）<\/strong>：从 0 与 1 讲到生成全部组合对象，正面处理组合爆炸。\n<\/li><li>\n<strong>卷4B 生成元组与排列<\/strong>：把「生成」这一个动作打磨到每次只改一位。\n<\/li><li>\n<strong>MMIX 增补<\/strong>：抽象算法的机器级注解，看清「落到硬件要多做哪些事」。\n<\/ul>\n<h2>学习节奏建议<\/h2>\n<ul><li>\n<strong>第一轮（8 到 10 周）<\/strong>：卷1 全部 → 卷2 第 1、3 章 → 卷3 第 1、2、5 章。每周 6 到 8 小时，先求「看懂并算得出代价」。\n<\/li><li>\n<strong>第二轮（6 到 8 周）<\/strong>：卷3 剩余章节 → 卷4A 第 1、4 章 → 卷4B。重点是动手实现，不只看。\n<\/li><li>\n<strong>第三轮（4 周）<\/strong>：卷2 剩余章节、卷4A 第 2、3 章、MMIX。这一轮做跨书整合题。\n<\/li><li>\n<strong>交叉复习<\/strong>：每读完一本，回到《跨书概念映射表.md》，看同一个概念在其他书里怎么讲；差异处往往就是理解不到位的点。\n<\/ul>\n<h2>总入口<\/h2>\n<p>打开 <code>index.html<\/code> 总学习手册，按顺序推进；每本书的进度独立保存，测验按章拆开，抽认卡可以按标签筛。<\/p>", "doc2": "<h1>跨书概念映射表<\/h1>\n<p>对照各书真实 <code>manifest.json<\/code> 与章节目录生成，不凭记忆填写。表中「—」表示该书没有系统讲这个概念。<\/p>\n<table><thead><tr><th>概念<\/th><th>卷1 基本算法<\/th><th>卷2 半数值<\/th><th>卷3 排序查找<\/th><th>卷4A 组合一<\/th><th>卷4B 元组排列<\/th><th>MMIX 增补<\/th><th>口径差异<\/th><\/tr><\/thead><tbody><tr><td>渐近分析<\/td><td>第 1 章<\/td><td>第 3 章（浮点误差）<\/td><td>第 3 章（下界）<\/td><td>第 2 章（求值代价）<\/td><td>—<\/td><td>—<\/td><td>卷1 给记号与规则，卷3 用它推下界，卷4A 用它估电路规模<\/td><\/tr><tr><td>线性表与链接<\/td><td>第 4 章<\/td><td>—<\/td><td>第 6 章（链地址）<\/td><td>—<\/td><td>—<\/td><td>第 3 章<\/td><td>卷1 讲结构与操作，MMIX 讲 64 位下指针的真实开销<\/td><\/tr><tr><td>树<\/td><td>第 5 章<\/td><td>—<\/td><td>第 5 章<\/td><td>第 4 章（生成树）<\/td><td>—<\/td><td>第 3 章<\/td><td>卷1 讲表示与遍历，卷3 讲平衡与多路，卷4A 讲枚举<\/td><\/tr><tr><td>排列与组合计数<\/td><td>第 2 章<\/td><td>—<\/td><td>第 1 章（逆序）<\/td><td>第 4 章<\/td><td>第 1、2 章<\/td><td>—<\/td><td>卷1 给公式，卷3 用逆序分析排序，卷4B 把公式变成生成算法<\/td><\/tr><tr><td>随机数<\/td><td>—<\/td><td>第 1、2 章<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>第 3 章<\/td><td>卷2 讲生成与检验，MMIX 讲 64 位下的实现<\/td><\/tr><tr><td>概率与期望<\/td><td>第 1 章（平均分析）<\/td><td>第 2 章（检验）<\/td><td>第 1、2 章（平均代价）<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>卷2 用统计检验，卷3 用期望算平均比较次数<\/td><\/tr><tr><td>整数算术与模<\/td><td>第 2 章<\/td><td>第 3、4 章<\/td><td>第 6 章（散列取模）<\/td><td>第 3 章（位运算）<\/td><td>—<\/td><td>第 3 章<\/td><td>卷2 讲多精度与模逆，卷3 只用取模，卷4A 讲按位<\/td><\/tr><tr><td>排序<\/td><td>—<\/td><td>第 2 章（洗牌）<\/td><td>第 1 至 4 章<\/td><td>—<\/td><td>—<\/td><td>第 3 章<\/td><td>卷3 是主体；卷2 只讲随机重排；MMIX 讲 I/O 约束<\/td><\/tr><tr><td>查找<\/td><td>—<\/td><td>—<\/td><td>第 5、6 章<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>只有卷3 系统讲，卷4A 的 BDD 是一种「查找结构」但口径不同<\/td><\/tr><tr><td>布尔与位运算<\/td><td>第 1 章（位串）<\/td><td>—<\/td><td>—<\/td><td>第 1 至 3 章<\/td><td>第 1 章（编码）<\/td><td>第 1 章<\/td><td>卷4A 是主体；卷4B 只用格雷码；MMIX 讲机器字<\/td><\/tr><tr><td>生成与枚举<\/td><td>第 2 章（排列）<\/td><td>第 2 章（抽样）<\/td><td>—<\/td><td>第 4 章<\/td><td>第 1、2 章<\/td><td>—<\/td><td>卷4A 给框架，卷4B 给两个对象的精细算法<\/td><\/tr><tr><td>机器级实现<\/td><td>第 3 章（MIX）<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>全书<\/td><td>卷1 用 MIX 讲原理，MMIX 换成 64 位并补写卷1 至卷3<\/td><\/tr><\/tbody><\/table>\n<h2>使用方式<\/h2>\n<ol><li>\n先在某本书里把一个概念学到能复述。\n<\/li><li>\n回到这张表，找到它在另一本书的位置，读那一节。\n<\/li><li>\n如果两处定义不同，不要强行统一——记下各自的适用场景。典型例子是「树」：卷1 关心表示与遍历，卷3 关心平衡与磁盘 I/O，两者不是同一个问题。\n<\/li><li>\n如果某个概念在表里是「—」，说明这套知识库没有覆盖它，不要以为整本书都没讲。\n<\/ol>\n<h2>已知的口径冲突<\/h2>\n<ul><li>\n<strong>「链表」的成本<\/strong>：卷1 按抽象操作计代价（指针赋值 O(1)），MMIX 增补按真实机器计（缓存不友好、指针 8 字节）。两者都对，场景不同。\n<\/li><li>\n<strong>「排序」的代价<\/strong>：卷3 以比较次数为主，外部排序以 I/O 趟数为主。讨论「快慢」时必须先说清在数什么。\n<\/li><li>\n<strong>「随机」的定义<\/strong>：卷2 的可操作定义是「过得了统计检验」，密码学要求「不可预测」，后者这套书没有展开。\n<\/ul>", "doc3": "<h1>综合检验建议<\/h1>\n<p>读完六本之后，用下面几道题检验「系统掌握」。它们都要求同时调用两本以上书的内容，单靠一本书答不完整。<\/p>\n<h2>跨书整合题<\/h2>\n<h3>题 1：给一个日志系统选排序方案<\/h3>\n<ul><li>\n涉及：卷3 第 2、4 章；卷2 第 1 章；MMIX 第 3 章\n<\/li><li>\n场景：每天 200 GB 日志，每条 200 字节，需要按时间戳排序后归档；单机内存 32 GB，磁盘顺序读 500 MB/s。\n<\/li><li>\n要求：给出方案（初始游程大小、合并路数、预计趟数、总 I/O 量），并说明为什么不用快排。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n算出记录数约 10⁹，初始游程数 R 与游程大小 P 的关系正确。\n<\/li><li>\n趟数用 ceil(log_k R)，k 的取值说明内存约束。\n<\/li><li>\n总 I/O 量按 2N×趟数估算，并说明最后一遍只读不写。\n<\/li><li>\n指出「内存装不下」是排除内部排序的唯一理由。\n<\/ol>\n<\/ul>\n<h3>题 2：设计一个可复现的实验随机源<\/h3>\n<ul><li>\n涉及：卷2 第 1、2 章；卷1 第 1 章（可复现性）\n<\/li><li>\n场景：要跑 100 万次蒙特卡洛模拟，要求同一 seed 结果完全一致，且不同 seed 之间统计独立。\n<\/li><li>\n要求：选一种发生器、给出参数、设计三项检验、说明如何洗牌。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n说明为什么选线性同余或组合发生器，参数满足满周期条件。\n<\/li><li>\n卡方检验的分格、期望频数下限、自由度。\n<\/li><li>\n洗牌必须是 Fisher-Yates，指出全范围交换的偏斜。\n<\/li><li>\n说明「可复现」与「独立样本」不是一回事。\n<\/ol>\n<\/ul>\n<h3>题 3：从布尔函数到生成算法<\/h3>\n<ul><li>\n涉及：卷4A 第 1、4 章；卷4B 第 1、2 章\n<\/li><li>\n场景：要枚举一个 6 变量布尔函数的所有满足赋值，并统计个数。\n<\/li><li>\n要求：给出两种方法（真值表枚举、BDD 上动态规划），比较代价。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n真值表法 2^6 = 64 次求值，说明 n 增大后的爆炸。\n<\/li><li>\nBDD 法按图的大小计，说明变量顺序的影响。\n<\/li><li>\n枚举与计数是两类问题，方法不同。\n<\/li><li>\n若还要「列出」而不只是「计数」，说明输出规模本身就是下界。\n<\/ol>\n<\/ul>\n<h3>题 4：把卷3 的查找结构搬到磁盘<\/h3>\n<ul><li>\n涉及：卷3 第 5、6 章；MMIX 第 3 章\n<\/li><li>\n场景：10 亿条键值记录，键 16 字节，值 100 字节，要支持点查与前缀范围查。\n<\/li><li>\n要求：选 B 树或 LSM 类结构，估算层数与每次查询的 I/O 次数。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n扇出与层数的关系 log_m n。\n<\/li><li>\n点查 I/O 次数约等于层数。\n<\/li><li>\n范围查的代价取决于叶子链表与块大小。\n<\/li><li>\n指出散列不支持范围查，所以不能只考虑 O(1)。\n<\/ol>\n<\/ul>\n<h3>题 5：解释「为什么 n log n 是下界，但基数排序能线性」<\/h3>\n<ul><li>\n涉及：卷3 第 3 章；卷4A 第 1 章（位表示）\n<\/li><li>\n要求：写一段不超过 300 字的解释，必须点明「比较模型」与「字长模型」的差别。\n<\/li><li>\n评分要点：\n<ol>\n<li>\n下界来自比较树的叶子数。\n<\/li><li>\n基数排序不做元素间比较，按位分配。\n<\/li><li>\n线性是对「字长固定」而言；键很长时 d 增大，仍是线性但常数大。\n<\/li><li>\n不把「线性」说成「绝对比 n log n 快」。\n<\/ol>\n<\/ul>\n<h2>进阶路线<\/h2>\n<ol><li>\n<strong>偏理论<\/strong>：卷1 第 1.2 节 → 卷3 第 5.1、5.3 节 → 卷4A 第 7.1 节。走生成函数与下界证明，配合《具体数学》。\n<\/li><li>\n<strong>偏工程<\/strong>：卷3 第 5.4、6.4 节 → 卷2 第 4.3 节 → MMIX 全书。走存储、散列、多精度的实现路线。\n<\/li><li>\n<strong>偏竞赛<\/strong>：卷4A 第 7.2 节 → 卷4B 全书 → 卷3 第 5.2 节。走组合生成与排序实现的路线，重点是手写代码。\n<\/li><li>\n<strong>偏系统<\/strong>：MMIX 全书 → 卷1 第 1.4 节 → 卷3 第 5.4 节。走机器级实现与 I/O 优化的路线。\n<\/ol>\n<h2>自评标准<\/h2>\n<ul><li>\n能不看书画出六本书各自的心智模型图，说明每本书回答什么问题。\n<\/li><li>\n能对任意一个具体场景，说出「用哪种结构、代价量级、退化条件」三件事。\n<\/li><li>\n能在同一概念上指出两本书的口径差异，并说明各自适用场景。\n<\/li><li>\n能做到以上三条，才算「系统掌握」；只看过一遍不算。\n<\/ul>"};
const CROSS_META = [{"key": "doc1", "label": "跨书总览：TAOCP 六书学习路线", "file": "README.md"}, {"key": "doc2", "label": "跨书概念映射表", "file": "跨书概念映射表.md"}, {"key": "doc3", "label": "综合检验建议", "file": "综合检验建议.md"}];
const TABS = [{"key": "cross", "label": "跨书总览"}, {"key": "taocp-v1", "label": "计算机程序设计艺术 卷1：基本算法"}, {"key": "taocp-v2", "label": "计算机程序设计艺术 卷2：半数值算法"}, {"key": "taocp-v3", "label": "计算机程序设计艺术 卷3：排序与查找"}, {"key": "taocp-v4a", "label": "计算机程序设计艺术 卷4A：组合算法（一）"}, {"key": "taocp-v4b", "label": "计算机程序设计艺术 卷4B：生成所有元组和排列"}, {"key": "mmix", "label": "计算机程序设计艺术 MMIX 增补"}];
const FIRST_DOC = "doc1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let cur = {book:'cross', doc:FIRST_DOC, page:'cross'};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
function stKey(book,k){ return 'hb:'+book+':'+k; }
function getState(book){
  return { visited: store.get(stKey(book,'visited'))||[], quiz: store.get(stKey(book,'quiz'))||{}, cards: store.get(stKey(book,'cards'))||{} };
}

/* ---------- 路由 ---------- */
function parseHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return {book:'cross', doc:FIRST_DOC, page:'cross'};
  const p = h.split('/');
  if(p[0]==='cross') return {book:'cross', doc:p[1]||FIRST_DOC, page:'cross'};
  if(p[0]==='book'){
    const key=p[1], page=p.slice(2).join('/')||'path';
    return {book:key, page:page, doc:null};
  }
  return {book:'cross', doc:FIRST_DOC, page:'cross'};
}
function pageIdOf(page){
  if(page==='path') return '__path__';
  if(page==='cards') return '__cards__';
  if(page==='glossary') return '__glossary__';
  if(page==='patterns') return '__patterns__';
  if(page==='cheatsheet') return '__cheatsheet__';
  if(page.startsWith('quiz/')) return '__quiz_'+(page.split('/')[1]||'all')+'__';
  if(page.startsWith('chapter/')) return page.slice(8);
  if(page.startsWith('concept/')) return page.slice(8);
  return page;
}

/* ---------- 顶栏 ---------- */
function renderTabs(){
  const el = $('#tabs'); el.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');
    b.className='tab'+(cur.book===t.key?' active':'');
    b.textContent=t.label;
    b.onclick=()=>{ location.hash = t.key==='cross' ? '#/cross/'+FIRST_DOC : '#/book/'+t.key+'/path'; };
    el.appendChild(b);
  });
}

/* ---------- 侧栏 ---------- */
function renderNav(){
  const nav=$('#nav'); nav.innerHTML='';
  const add=(label,href,cls)=>{
    const a=document.createElement('a'); a.className='nav-item'+(cls?' '+cls:''); a.href=href; a.textContent=label;
    nav.appendChild(a); return a;
  };
  const sec=t=>{ const d=document.createElement('div'); d.className='nav-sec'; d.textContent=t; nav.appendChild(d); };

  if(cur.book==='cross'){
    sec(CROSS_META.length>1 ? '跨书总览' : '总览');
    CROSS_META.forEach(c=> add(c.label, '#/cross/'+c.key, cur.doc===c.key?'active':''));
    sec('书籍入口');
    META.forEach(m=> add(m.title, '#/book/'+m.key+'/path'));
    updateProgress(0, CROSS_META.length>1 ? '跨书总览' : '总览');
    return;
  }
  const B=BOOKS[cur.book];
  const S=getState(cur.book);
  const man=B.manifest;
  add('学习路径','#/book/'+cur.book+'/path', cur.page==='path'?'active':'');
  sec('章节');
  (man.chapters||[]).forEach(c=>{
    const id=c.id;
    const a=add(c.title, '#/book/'+cur.book+'/chapter/'+id, cur.page==='chapter/'+id?'active':'');
    if(S.visited.includes(cur.book+'/chapter/'+id)){
      const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
    }
  });
  if((man.concepts||[]).length){
    sec('概念');
    man.concepts.forEach(c=>{
      const a=add(c.title, '#/book/'+cur.book+'/concept/'+c.id, cur.page==='concept/'+c.id?'active':'');
      if(S.visited.includes(cur.book+'/concept/'+c.id)){
        const s=document.createElement('span'); s.className='done'; s.textContent='✓'; a.appendChild(s);
      }
    });
  }
  sec('测验');
  add('全部测验','#/book/'+cur.book+'/quiz/all', cur.page==='quiz/all'?'active':'');
  (man.chapters||[]).forEach(c=>{
    if(!((B.quizCoverage||{})[c.id])) return;
    add('测验：'+c.title, '#/book/'+cur.book+'/quiz/'+c.id, cur.page==='quiz/'+c.id?'active':'');
  });
  sec('复习工具');
  add('抽认卡','#/book/'+cur.book+'/cards', cur.page==='cards'?'active':'');
  add('术语表','#/book/'+cur.book+'/glossary', cur.page==='glossary'?'active':'');
  if(B.rendered['__patterns__']) add('模式库','#/book/'+cur.book+'/patterns', cur.page==='patterns'?'active':'');
  if(B.rendered['__cheatsheet__']) add('速查表','#/book/'+cur.book+'/cheatsheet', cur.page==='cheatsheet'?'active':'');
  sec('其他');
  const m=META.find(x=>x.key===cur.book);
  if(m) add('单独打开学习伴侣 ↗', encodeURI(m.companion));

  updateProgressBook(cur.book);
}

/* ---------- 进度 ---------- */
function updateProgress(pct,label){
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=label;
}
function updateProgressBook(book){
  const B=BOOKS[book], S=getState(book);
  const chs=(B.manifest.chapters||[]).length;
  const done=(B.manifest.chapters||[]).filter(c=>S.visited.includes(book+'/chapter/'+c.id)).length;
  const pct=chs?Math.round(done/chs*100):0;
  $('#progress-fill').style.width=pct+'%';
  $('#progress-label').textContent=`《${(META.find(x=>x.key===book)||{}).title||book}》 进度 ${pct}% · 已学 ${done}/${chs} 章`;
}

/* ---------- 渲染 ---------- */
function renderCross(){
  const v=$('#view');
  const docId=cur.doc||FIRST_DOC;
  const html=CROSS[docId]||'<div class="empty">页面不存在</div>';
  let pre='';
  if(docId===FIRST_DOC){
    pre = '<h1>学习总手册</h1>'
      + '<p>本学习系统把书点化为一套可跟着走的学习内容。顶部切换书籍，或用下方卡片进入；'
      + '每本书含学习路径、章节精讲、概念页、测验、抽认卡、术语表、模式库与速查表，进度自动保存在本机浏览器。</p>'
      + '<div class="book-cards">'
      + META.map(m=>`<div class="book-card"><h3>${esc(m.title)}</h3>
          <div class="meta">${m.chapters} 章 · ${m.concepts} 概念 · ${m.quizzes} 测验 · ${m.cards} 抽认卡</div>
          <div class="enter"><a href="#/book/${m.key}/path">进入学习 →</a> &nbsp;|&nbsp;
          <a href="${encodeURI(m.companion)}" target="_blank">单独伴侣 ↗</a></div></div>`).join('')
      + '</div>';
  }
  v.innerHTML = pre + html;
  renderMermaid();
}

function renderBook(){
  const B=BOOKS[cur.book];
  if(!B){ $('#view').innerHTML='<div class="empty">书目不存在</div>'; return; }
  const pid=pageIdOf(cur.page);
  let html=B.rendered[pid];
  if(!html){ html='<div class="empty">页面不存在</div>'; }
  const S=getState(cur.book);
  if((cur.page.startsWith('chapter/')||cur.page.startsWith('concept/')) && !S.visited.includes(cur.book+'/'+cur.page)){
    S.visited.push(cur.book+'/'+cur.page);
    store.set(stKey(cur.book,'visited'), S.visited);
  }
  $('#view').innerHTML=html;
  if(cur.page==='cards') initCards();
  if(cur.page==='glossary') initGlossary();
  if(cur.page.startsWith('quiz/')) initQuizzes();
  if(pid==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 测验 ---------- */
function initQuizzes(){
  const B=BOOKS[cur.book];
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn=item.querySelector('.quiz-check');
    if(!btn||item.dataset.inited) return;
    item.dataset.inited='1';
    btn.addEventListener('click',()=>{
      const qid=item.dataset.qid, type=item.dataset.type;
      const q=(B.manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user=null, correct=false, fb='';
      if(type==='single'){
        const sel=item.querySelector('input:checked');
        user=sel?parseInt(sel.value):null;
        correct=(user===q.answer);
        fb=correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      }else if(type==='multi'){
        user=Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans=Array.isArray(q.answer)?q.answer.slice().sort():[q.answer];
        correct=user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb=correct?'✓ 正确':'✗ 错误';
      }else if(type==='blank'){
        const v=(item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        correct=(v===String(q.answer).trim().toLowerCase());
        fb=correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)?q.answer.includes(val):val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed=item.querySelector('.quiz-feedback');
      feed.className='quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent=fb;
      let ex=item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML='解析：'+esc(q.explain||'');
      const S=getState(cur.book);
      const ch=q.chapterId||'__all__';
      if(!S.quiz[ch]) S.quiz[ch]={n:0};
      S.quiz[ch].n+=1;
      store.set(stKey(cur.book,'quiz'), S.quiz);
    });
  });
}
function updatePath(){
  const B=BOOKS[cur.book], S=getState(cur.book);
  document.querySelectorAll('.path-step').forEach(el=>{
    const step=el.id.replace('path-','');
    const s=(B.manifest.learningPath||[]).find(x=>String(x.step)===step);
    if(s && (s.chapterIds||[]).every(c=>S.visited.includes(cur.book+'/chapter/'+c))){
      el.classList.add('passed');
      if(!el.querySelector('.ck')){ const sp=document.createElement('span'); sp.className='ck done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx=0, cardList=[];
function initCards(){
  const B=BOOKS[cur.book];
  const cards=B.manifest.flashcards||[];
  cardList=cards.slice(); cardIdx=0;
  if(!$('#card-done')){
    const d=document.createElement('div'); d.id='card-done'; d.className='empty';
    d.style.display='none'; d.textContent='本组卡片已全部复习完 🎉';
    const st=$('#card-stage'); if(st) st.appendChild(d);
  }
  const sel=$('#card-filter'); if(!sel) return;
  sel.innerHTML='<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c;
    const ch=(B.manifest.chapters||[]).find(x=>x.id===c);
    o.textContent=ch?ch.title:c; sel.appendChild(o);
  });
  sel.onchange=()=>{ const v=sel.value; cardList=v?cards.filter(c=>c.chapterId===v):cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick=()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick=()=>markCard(true);
  $('#card-again-btn').onclick=()=>markCard(false);
  showCard();
}
function showCard(){
  const S=getState(cur.book);
  updateCardCounts();
  const done=$('#card-done'), fc=$('#flashcard');
  if(cardIdx>=cardList.length){
    if(done) done.style.display=''; if(fc) fc.style.display='none'; return;
  }
  if(done) done.style.display='none'; if(fc) fc.style.display='';
  const c=cardList[cardIdx];
  document.querySelector('.fc-front').textContent=c.front;
  document.querySelector('.fc-back').textContent=c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const S=getState(cur.book);
  const c=cardList[cardIdx]; if(!c) return;
  S.cards[c.id]=known?'known':'again';
  store.set(stKey(cur.book,'cards'), S.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const S=getState(cur.book);
  const known=Object.values(S.cards).filter(v=>v==='known').length;
  const again=Object.values(S.cards).filter(v=>v==='again').length;
  const k=$('#card-known'), a=$('#card-again'), l=$('#card-left');
  if(k) k.textContent=known; if(a) a.textContent=again; if(l) l.textContent=Math.max(0,cardList.length-cardIdx);
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input=$('#glossary-filter');
  if(!input||input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput=()=>{
    const v=input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display=(!v||li.dataset.term.includes(v))?'':'none';
    });
  };
}

/* ---------- 全局搜索 ---------- */
let searchIdx=null;
function buildSearch(){
  if(searchIdx) return searchIdx;
  searchIdx=[];
  META.forEach(m=>{
    const B=BOOKS[m.key];
    Object.entries(B.rendered).forEach(([pid,html])=>{
      if(pid.startsWith('__')) return;
      const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
      searchIdx.push({book:m.key, page:pdfToPage(pid, B), text, label:m.title});
    });
  });
  Object.entries(CROSS).forEach(([k,html])=>{
    const meta=CROSS_META.find(x=>x.key===k)||{};
    searchIdx.push({book:'cross', page:'cross/'+k, text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' '), label:(meta.label||'总览')});
  });
  return searchIdx;
}
function pdfToPage(pid, B){
  if(pid.startsWith('__quiz_')) return 'quiz/'+pid.replace('__quiz_','').replace('__','');
  if(pid==='__path__') return 'path';
  if(pid==='__cards__') return 'cards';
  if(pid==='__glossary__') return 'glossary';
  if(pid==='__patterns__') return 'patterns';
  if(pid==='__cheatsheet__') return 'cheatsheet';
  const ch=(B.manifest.chapters||[]).find(c=>c.id===pid);
  if(ch) return 'chapter/'+pid;
  return 'concept/'+pid;
}
$('#q').addEventListener('input', e=>{
  const v=e.target.value.trim().toLowerCase();
  if(!v){ route(); return; }
  const hits=buildSearch().filter(p=>p.text.toLowerCase().includes(v)).slice(0,40);
  $('#view').innerHTML='<h1>搜索结果：'+esc(v)+'</h1>'+
    (hits.length? hits.map(h=>{
      const href=h.book==='cross'?('#/cross/'+(h.page.split('/')[1]||FIRST_DOC)):('#/book/'+h.book+'/'+h.page);
      return `<div class="search-hit"><a href="${href}">${esc(h.label)}</a><br><span style="color:var(--muted);font-size:13px">${esc(h.text.slice(0,200))}</span></div>`;
    }).join('') : '<div class="empty">未找到相关内容，试试章节名 / 概念名 / 术语。</div>');
});

/* ---------- Mermaid ---------- */
let mermaidState='idle';
function renderMermaid(){
  const els=Array.from(document.querySelectorAll('.mermaid')).filter(el=>!el.dataset.rendered);
  if(!els.length) return;
  const run=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme:document.body.dataset.theme==='dark'?'dark':'default'});
    els.forEach((el,idx)=>{ try{
      const out=mermaid.render('mm'+Date.now()+idx, el.textContent);
      if(out && typeof out.then==='function'){
        out.then(r=>{ el.innerHTML=r.svg; el.dataset.rendered='1'; }).catch(()=>{ el.dataset.rendered='0'; });
      } else { el.innerHTML=out; el.dataset.rendered='1'; }
    } catch(e){ el.dataset.rendered='0'; } });
  }catch(e){} };
  if(window.mermaid){ run(); return; }
  if(mermaidState==='loading') return;
  mermaidState='loading';
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ mermaidState='loaded'; run(); };
  s.onerror=()=>{ mermaidState='failed'; };
  document.head.appendChild(s);
}

/* ---------- 主题 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d=document.body.dataset.theme==='dark';
  document.body.dataset.theme=d?'':'dark';
  themeBtn.textContent=d?'🌙 深色':'☀️ 浅色';
};

/* ---------- 启动 ---------- */
function route(){
  cur=parseHash();
  renderTabs();
  renderNav();
  if(cur.book==='cross') renderCross(); else renderBook();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=820) sb.classList.remove('open'); });
})();
route();
</script>
