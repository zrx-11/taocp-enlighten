lns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排序问题</span></div></foreignObject></g></g><g transform=\"translate(341.45703125, 104)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-260\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"154.59375\" y=\"-18\" x=\"-77.296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-69.796875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"139.59375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">信息下界 log n 阶乘</span></div></foreignObject></g></g><g transform=\"translate(104.4140625, 190)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-262\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"131.453125\" y=\"-18\" x=\"-65.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-58.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"116.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">普通算法 有分支</span></div></foreignObject></g></g><g transform=\"translate(453.3125, 190)\" data-id=\"N\" data-node=\"true\" id=\"flowchart-N-264\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"131.453125\" y=\"-18\" x=\"-65.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-58.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"116.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">排序网络 无分支</span></div></foreignObject></g></g><g transform=\"translate(104.4140625, 276)\" data-id=\"O1\" data-node=\"true\" id=\"flowchart-O1-266\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"208.828125\" y=\"-18\" x=\"-104.4140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-96.9140625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"193.828125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">快排 堆排 合并 达到 n log n</span></div></foreignObject></g></g><g transform=\"translate(328.125, 276)\" data-id=\"O2\" data-node=\"true\" id=\"flowchart-O2-268\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"138.59375\" y=\"-18\" x=\"-69.296875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-61.796875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"123.59375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">Batcher 奇偶归并</span></div></foreignObject></g></g><g transform=\"translate(578.5, 276)\" data-id=\"Z\" data-node=\"true\" id=\"flowchart-Z-270\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"262.15625\" y=\"-18\" x=\"-131.078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-123.578125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"247.15625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">0 1 原理 只需验 2 的 n 次方 种输入</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：两条分支共享同一个下界。排序网络的优势不在比较次数更少（它通常更多），而在「无分支、可并行」。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：比较排序像查字典，查到一半就知道该往左还是往右翻；排序网络像洗牌机，不管牌面是什么，固定地把指定位置的两张牌比一下、大的放右边。\n<\/li><li>\n类比失效：洗牌机的动作固定，但它的比较器数量是人工设计的；真实的排序网络规模随 n 增长，设计本身是组合难题。\n<\/ul>\n<p><strong>实例（0-1 原理的用法）<\/strong>：要验证一个 4 输入网络，不必测 24 种排列，只需测 16 种 0/1 串：0000、0001、…、1111。全部排好，就说明它对任意 4 个数字都正确。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为 n log n 是所有排序的下限<\/strong>——实际上只是「基于比较」的下限。基数排序不比较，可以到线性。\n<\/li><li>\n<strong>别以为排序网络比较次数少<\/strong>——实际上它通常比最优比较排序多，胜在无分支和并行。\n<\/li><li>\n<strong>别以为 0-1 原理是近似<\/strong>——实际上它是严格等价的判定条件。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：5 个元素排序，最坏情况至少需要多少次比较？（填数字）\n<p>（答案：7；解析：log2(5!) = log2 120 ≈ 6.91，向上取整为 7，且存在 7 次比较的最优算法。）<\/p>\n<\/ol>\n<ol><li>\n单选题：排序网络的核心优势是？\n<p>A. 比较次数最少 B. 无分支、可并行 C. 不需要额外空间 D. 稳定 （答案：B；解析：网络结构固定，所有比较按层同时进行，适合硬件实现；比较次数通常反而更多。）<\/p>\n<\/ol>\n<ol><li>\n简答题：0-1 原理为什么能把验证工作大幅减少？\n<p>（答案：只需验证 2^n 种 0/1 输入，而不是 n! 种排列；任意输入可按阈值切成 0/1，若每种切法都被排好，原输入也必被排好。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n比较排序下界 log2(n!)，约 n log2 n。\n<\/li><li>\n小 n 的最优比较次数：3 个元素 3 次，5 个元素 7 次。\n<\/li><li>\n0-1 原理：验 2^n 种 0/1 输入即可判定整个网络。\n<\/ul>", "ch04": "<h1>第 4 章：外部排序——数据比内存大怎么办<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2 章（合并排序）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清外部排序为什么以「读写次数」而不是「比较次数」衡量代价。\n<\/li><li>\n算出给定初始游程数与路数时的合并趟数。\n<\/li><li>\n解释替代选择为什么能把平均游程长度做到缓冲区容量的两倍。\n<\/li><li>\n说出多阶段合并解决的现实问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>外部排序的瓶颈不在 CPU，在磁盘；所以一切设计都围绕<strong>减少读写趟数<\/strong>，哪怕多花比较。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：初始游程（难度：基础）<\/h3>\n<p>内存装不下全部数据，先分块读进来，每块内部排好，写回磁盘，形成一个<strong>有序游程<\/strong>（run）。这一步叫「生成初始游程」。<\/p>\n<p>若内存能放 P 条记录，朴素做法每块产生长度 P 的游程；数据总量 N 条，就有 N/P 个游程。<\/p>\n<p><strong>代价<\/strong>：读一遍、写一遍，各 N 条。<\/p>\n<h3>概念 2：替代选择（难度：进阶）<\/h3>\n<p>朴素分块浪费了内存：块与块之间没有利用「刚写出去的最小元素可能比下一块的最大元素还小」这个事实。<\/p>\n<p><strong>替代选择<\/strong>的做法：把内存当成一个堆，先装满 P 条。每次取出堆顶（最小）写出，再从输入读一条进来：<\/p>\n<ul><li>\n若新读的比刚写的大，它可以留在当前游程里，堆调整后继续。\n<\/li><li>\n若新读的比刚写的小，它不能进当前游程，先存到「保留区」，等下一个游程用。\n<\/ul>\n<p><strong>效果<\/strong>：随机输入下，平均游程长度约为 2P，也就是游程数减半，合并趟数少一趟。<\/p>\n<p><strong>实例<\/strong>：P = 4，输入序列 5, 2, 9, 1, 7, 3。<\/p>\n<ul><li>\n装满 [5,2,9,1] 建堆，堆顶 1。写出 1，读 7（7 &gt; 1，可进当前游程）。\n<\/li><li>\n堆顶 2，写出 2，读 3（3 &gt; 2，可进）。\n<\/li><li>\n堆顶 5，写出 5，输入已空，当前游程继续把堆里剩下的 7、9 写完 → 游程 [1,2,5,7,9]，长度 5，超过 P = 4。\n<\/ul>\n<h3>概念 3：k 路合并与趟数（难度：基础）<\/h3>\n<p>把 k 个游程同时合并成一个：每次从 k 个游程的队首取最小的。用败者树或堆，每次取最小是 O(log k)。<\/p>\n<p><strong>趟数公式<\/strong>：R 个初始游程，k 路合并，趟数 = 向上取整的 log_k R。<\/p>\n<p><strong>实例<\/strong>：R = 1000，k = 4。 4⁴ = 256 &lt; 1000，4⁵ = 1024 ≥ 1000，所以要 5 趟。<\/p>\n<p><strong>每趟代价<\/strong>：读 N 条、写 N 条（最后一遍只读不写）。总读写量约为 2N × 趟数。<\/p>\n<p><strong>k 是不是越大越好<\/strong>：k 大则趟数少，但 k 个输入缓冲区要占内存，每个缓冲区太小又会增加读块次数。实践里 k 常取几十到几百。<\/p>\n<h3>概念 4：多阶段合并（难度：高难）<\/h3>\n<p>磁带只能顺序读写，台数有限（历史上常见 3 到 6 台）。k 路合并需要 k 台输入加 1 台输出，台数一紧就做不了。<\/p>\n<p><strong>多阶段合并<\/strong>用「不均匀分配」解决：不要求每台磁带的游程数一样，而是按 Fibonacci 数分配，让合并过程中始终有一台空带可以当输出，轮流使用。<\/p>\n<p><strong>实例（3 台磁带、Fibonacci 分配）<\/strong>：初始游程数按 1、2、3、5、8… 分配，合并时把最短的两段并到空带上，始终维持「有一段空带」的状态。<\/p>\n<p><strong>级联合并<\/strong>是它的推广：允许更多磁带、更复杂的分配表，减少「空转」。<\/p>\n<h3>概念 5：反向读取与振荡（难度：高难）<\/h3>\n<p>磁带合并时，若能把上一次写的磁带反着读，就不必倒带，直接接着上一趟的尾部继续。<strong>振荡排序<\/strong>（oscillating sort）利用这一点，让读的方向在趟与趟之间交替，省掉倒带时间。<\/p>\n<p><strong>这几节为什么今天还要看<\/strong>：思路仍然适用于现代存储。SSD 虽然随机访问快，但顺序读写仍远快于随机；「减少趟数、尽量顺序」的原则没变。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 303.453125 786\" style=\"max-width: 303.453125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg21\"><style>#svg21{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg21 .error-icon{fill:#552222;}#svg21 .error-text{fill:#552222;stroke:#552222;}#svg21 .edge-thickness-normal{stroke-width:2px;}#svg21 .edge-thickness-thick{stroke-width:3.5px;}#svg21 .edge-pattern-solid{stroke-dasharray:0;}#svg21 .edge-pattern-dashed{stroke-dasharray:3;}#svg21 .edge-pattern-dotted{stroke-dasharray:2;}#svg21 .marker{fill:#333333;stroke:#333333;}#svg21 .marker.cross{stroke:#333333;}#svg21 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg21 .label{font-family:\"trebuchet ms\",verdan 14.28125\" y=\"-18\" x=\"-57.140625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-49.640625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"99.28125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">游程长度 P 条</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 580)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-282\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多路合并</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 666)\" data-id=\"P1\" data-node=\"true\" id=\"flowchart-P1-286\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"101.25\" y=\"-18\" x=\"-50.625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-43.125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"86.25\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">趟数 log k R</span></div></foreignObject></g></g><g transform=\"translate(141.50390625, 752)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-288\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">有序输出</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：两个箭头最终汇到同一个合并环节，但游程数不同——替代选择把 R 减半，直接省下一整趟读写。这就是它值得单独讲的原因。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：外部排序像整理一屋子书，桌子只能放 100 本。先把每 100 本排好堆成一摞，再把几摞同时摊开，每次取最小的一本放成大摞。\n<\/li><li>\n类比失效：书可以随手抽，磁盘不行；磁盘按块读，随机访问有寻道开销，所以「块大小」也是设计参数。\n<\/ul>\n<p><strong>实例（算总代价）<\/strong>：N = 10⁸ 条，P = 10⁶ 条，k = 10。<\/p>\n<ul><li>\n朴素游程数 R = 100，趟数 log10 100 = 2。\n<\/li><li>\n用替代选择，R = 50，趟数 log10 50 ≈ 1.7，向上取整仍是 2 趟，但第二趟的输入少了一半。\n<\/li><li>\n总读写量：朴素约 2×10⁸×2 = 4×10⁸ 条记录，替代选择约 3×10⁸ 条。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为外部排序比内部排序「算法更复杂」<\/strong>——实际上核心就是合并排序加缓冲区管理，复杂的是调度。\n<\/li><li>\n<strong>别以为 k 越大越好<\/strong>——实际上 k 受内存限制，缓冲区太小会让每次读的块变碎，反而更慢。\n<\/li><li>\n<strong>别以为多阶段合并已经过时<\/strong>——实际上「不均匀分配 + 轮流用空带」的思想在分布式归并与日志合并树里仍在用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：1000 个初始游程做 4 路合并，需要多少趟？（填数字）\n<p>（答案：5；解析：4⁴ = 256 不够，4⁵ = 1024 够，所以 5 趟。）<\/p>\n<\/ol>\n<ol><li>\n单选题：替代选择在随机输入下的平均游程长度约为内存容量的多少倍？\n<p>A. 0.5 B. 1 C. 2 D. 4 （答案：C；解析：Knuth 的分析给出平均约 2P，P 为缓冲区可容纳的记录数。）<\/p>\n<\/ol>\n<ol><li>\n简答题：多阶段合并要解决的是什么问题？\n<p>（答案：磁带台数有限，k 路合并需要 k 台输入加 1 台输出，台数不够；多阶段用 Fibonacci 式的不均匀分配，让合并过程中始终有一台空带可作输出。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n外部排序以读写趟数计代价；趟数 = log_k R。\n<\/li><li>\n替代选择让平均游程达 2P，游程数减半。\n<\/li><li>\n多阶段合并用不均匀分配解决磁带台数不足。\n<\/ul>", "ch05": "<h1>第 5 章：查找——从顺序扫到平衡树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 2 章；卷1 第 2 章（树的数学性质）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n算出顺序查找与二分查找的平均、最坏比较次数。\n<\/li><li>\n解释二叉查找树平均 O(log n)、最坏 O(n) 的原因。\n<\/li><li>\n说清 AVL 树靠什么把高度控制在约 1.44 log2 n。\n<\/li><li>\n算出 B 树的层数，并解释为什么数据库索引用它而不是二叉树。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>查找的代价取决于<strong>数据怎么组织<\/strong>：无序只能扫，有序能折半，树把折半变成动态结构，多路树把「层数」换成「扇出」。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：顺序查找（难度：基础）<\/h3>\n<p>从第一个元素开始逐个比较，找到就返回。<\/p>\n<ul><li>\n成功查找平均比较次数：(n+1)/2（假设每个位置等概率被查）。\n<\/li><li>\n失败查找：n 次。\n<\/li><li>\n<strong>哨兵技巧<\/strong>：把要查的键放在数组末尾当哨兵，循环里就不必每次判断「是否越界」，比较次数不变但每轮少一次判断。\n<\/ul>\n<p><strong>适用<\/strong>：数据量小、无序、或只在链表上查找。<\/p>\n<h3>概念 2：二分查找（难度：基础）<\/h3>\n<p>要求数据<strong>有序且能随机访问<\/strong>。每次比较中间元素，排除一半。<\/p>\n<ul><li>\n最坏比较次数：约 log2 n 次（准确说是向上取整的 log2(n+1)）。\n<\/li><li>\n前提：有序；数组（链表不行，因为取中间要 O(n)）。\n<\/ul>\n<p><strong>实例<\/strong>：在 1 到 9 中查 7。<\/p>\n<ul><li>\n中间是 5，7 &gt; 5，看右半 6 到 9。\n<\/li><li>\n右半中间是 7（取下中位数），命中。共 2 次比较。\n<\/li><li>\n最坏是查 9 或 1，需要 4 次。\n<\/ul>\n<h3>概念 3：二叉查找树（难度：进阶）<\/h3>\n<p>每个节点满足：左子树所有键小于它，右子树所有键大于它。查找时一路向下比较。<\/p>\n<ul><li>\n平均查找长度约 2 ln n ≈ 1.39 log2 n。\n<\/li><li>\n最坏 O(n)：按升序依次插入，树退化成一条链。\n<\/li><li>\n删除节点分三种情况：叶子直接删；只有一个孩子用孩子顶替；有两个孩子用中序后继（右子树最小）顶替。\n<\/ul>\n<p><strong>实例<\/strong>：依次插入 3、1、5、2 得到：<\/p>\n<ul><li>\n3 为根，1 在左，5 在右，2 在 1 的右边。\n<p>查 2：3 → 1 → 2，3 次比较。<\/p>\n<\/ul>\n<h3>概念 4：平衡树（难度：高难）<\/h3>\n<p>AVL 树要求每个节点的左右子树高度差不超过 1。插入或删除破坏了平衡，就通过<strong>旋转<\/strong>恢复。<\/p>\n<ul><li>\n高度上界：约 1.44 log2(n+2) − 0.33，比二叉查找树的平均情况只差一点，但<strong>最坏也有保证<\/strong>。\n<\/li><li>\n四种失衡情形：左左、左右、右左、右右；左右与右左需要双旋。\n<\/li><li>\n代价：每次插入/删除最多 O(log n) 次旋转，常数比普通二叉查找树大。\n<\/ul>\n<p><strong>红黑树<\/strong>是另一种平衡方案，平衡条件更松（最长路径不超过最短的两倍），插入删除的旋转次数更少，工程里更常用。<\/p>\n<h3>概念 5：多路树与 B 树（难度：高难）<\/h3>\n<p>二叉树的每个节点只有两个孩子，树高 log2 n；如果每个节点能有 m 个孩子，树高就是 log_m n。<\/p>\n<p><strong>B 树<\/strong>：每个节点存多个键、多个孩子，所有叶子在同一层。查找时在每个节点内部做一次二分或顺序比较，然后下到某个孩子。<\/p>\n<p><strong>实例<\/strong>：10 亿个键，每个节点 100 个孩子。 层数 ≈ log_100(10⁹) = 9/2 = 4.5，也就是 5 层左右。若用二叉树，要约 30 层。<\/p>\n<p><strong>为什么数据库用 B 树<\/strong>：每一层通常对应一次磁盘读。5 次读 vs 30 次读，差距是 6 倍。把「层数」压下来，就是把 I/O 次数压下来。<\/p>\n<h3>概念 6：数字查找（难度：进阶）<\/h3>\n<p>键是数字或字符串时，可以按「位」分支，而不是按大小比较。<\/p>\n<ul><li>\n<strong>基数查找树（trie）<\/strong>：每个节点对应一位数字，路径拼起来就是键。查找代价与键长成正比，与元素个数关系不大。\n<\/li><li>\n<strong>数字查找树<\/strong>：按键的二进制位分支，类似 trie 但更紧凑。\n<\/ul>\n<p><strong>适用<\/strong>：键长固定、集合很大、需要前缀查询（如 IP 路由表、词典）。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document docume ker cross flowchart\" id=\"svg22_flowchart-crossStart\"><path style=\"stroke-width: 2; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 1,1 l 9,9 M 10,1 l -9,9\"></path></marker><g class=\"root\"><g class=\"clusters\"></g><g class=\"edgePaths\"><path marker-end=\"url(#svg22_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-Q LE-O\" id=\"L-Q-O-0\" d=\"M214.531,31.751L203.365,36.626C192.198,41.501,169.865,51.25,158.771,62.159C147.677,73.067,147.822,85.134,147.895,91.167L147.967,97.2\"></path><path marker-end=\"url(#svg22_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-O LE-S\" id=\"L-O-S-0\" d=\"M121.908,207.377L113.241,220.23C104.575,233.084,87.243,258.792,78.576,276.679C69.91,294.567,69.91,304.633,69.91,309.667L69.91,314.7\"></path><path marker-end=\"url(#svg22_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-O LE-B\" id=\"L-O-B-0\" d=\"M174.155,207.377L182.654,220.23C191.154,233.084,208.153,258.792,216.653,276.679C225.152,294.567,225.152,304.633,225.152,309.667L225.152,314.7\"></path><path marker-end=\"url(#svg22_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-B LE-T\" id=\"L-B-T-0\" d=\"M225.152,356L225.152,360.167C225.152,364.333,225.152,372.667,225.218,380.2C225.284,387.734,225.416,394.467,225.482,397.834L225.548,401.201\"></path><path marker-end=\"url(#svg22_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-T LE-BST\" id=\"L-T-BST-0\" d=\"M180.448,556.296L168.738,569.663C157.028,583.03,133.608,609.765,121.898,628.166C110.188,646.567,110.188,656.633,110.188,661.667L110.188,666.7\"></path><path marker-end=\"url(#svg22_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-BST LE-AVL\" id=\"L-BST-AVL-0 e=\"true\" id=\"flowchart-BT-302\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"139.484375\" y=\"-18\" x=\"-69.7421875\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-62.2421875, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"124.484375\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">B 树 层数 log m n</span></div></foreignObject></g></g><g transform=\"translate(404.60546875, 167.5)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-304\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-81.5,81.5)\" class=\"label-container\" points=\"81.5,0 163,-81.5 81.5,-163 0,-81.5\"></polygon><g transform=\"translate(-56, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"112\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">键是定长数字吗</span></div></foreignObject></g></g><g transform=\"translate(404.60546875, 338)\" data-id=\"TR\" data-node=\"true\" id=\"flowchart-TR-306\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"105.671875\" y=\"-18\" x=\"-52.8359375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-45.3359375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"90.671875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">trie 按位分支</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：三个判断依次收窄选择。最后一条分支提醒：键的结构本身也能当索引，不必只依赖大小比较。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：顺序查找像在一叠没编号的文件里翻；二分查找像查字典，每次翻到中间看该往前还是往后；B 树像图书馆先分楼层、再分书架、再分格子。\n<\/li><li>\n类比失效：字典的「中间」是物理页，翻页有成本；B 树把多个键塞进一个节点，正是为了把「翻页次数」压低到与层数同阶。\n<\/ul>\n<p><strong>实例（AVL 旋转）<\/strong>：插入后出现「左左」失衡（左子树的左子树过高），做一次右旋：把左孩子提为根，原根变为它的右孩子，左孩子原来的右子树挂到原根的左边。旋转后高度恢复，中序顺序不变。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为二分查找总比顺序查找快<\/strong>——实际上 n 很小时（比如小于 10），二分的前期开销与分支预测损失可能让它更慢。\n<\/li><li>\n<strong>别以为二叉查找树平均 O(log n) 就够用<\/strong>——实际上最坏会退化成链，必须加平衡机制。\n<\/li><li>\n<strong>别以为 B 树是为了「比较次数少」<\/strong>——实际上它每个节点比较次数不少，省的是磁盘 I/O 次数。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：在 1 到 9 的有序数组里二分查找 7，需要多少次比较？（填数字）\n<p>（答案：2；解析：先比中间 5，7 大于 5；再在 6 到 9 中比中间 7，命中。）<\/p>\n<\/ol>\n<ol><li>\n单选题：二叉查找树最坏情况下的查找代价是？\n<p>A. O(1) B. O(log n) C. O(n) D. O(n log n) （答案：C；解析：按升序插入会退化成链，查找退化为顺序扫描。）<\/p>\n<\/ol>\n<ol><li>\n简答题：10 亿个键，B 树每个节点 100 个孩子，大约几层？为什么这很重要？\n<p>（答案：约 5 层，因为 log_100(10⁹) = 4.5。每层通常一次磁盘读，5 次读远少于二叉树的约 30 次，直接决定索引的响应时间。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n顺序查找平均 (n+1)/2；二分最坏约 log2 n，但要求有序且可随机访问。\n<\/li><li>\n二叉查找树平均 1.39 log2 n，最坏 n；AVL 把最坏压到约 1.44 log2 n。\n<\/li><li>\nB 树用高扇出把层数降到 log_m n，省的是 I/O。\n<\/ul>", "ch06": "<h1>第 6 章：散列查找与辅助键<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 5 章；模运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n选一个像样的散列函数，并说清模为什么常取素数。\n<\/li><li>\n比较链地址法与开放地址法的代价，用装载因子估算平均查找长度。\n<\/li><li>\n解释线性探测的「一次聚集」问题，以及双散列怎么缓解。\n<\/li><li>\n说清辅助键与倒排索引解决的问题。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>散列把「比较」换成「计算」：不靠键的大小顺序，而靠一个函数把键直接映射到位置；代价从 log n 变成常数级，前提是冲突可控。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：散列函数（难度：基础）<\/h3>\n<p>散列函数把键映射到 0 到 m−1 的槽位。理想情况下，不同键均匀落到不同槽。<\/p>\n<p><strong>除法散列<\/strong>：h(k) = k mod m。<\/p>\n<ul><li>\nm 取素数，且离 2 的幂远一些。若 m = 2^p，则只取键的低 p 位，键的低位若有规律就会集中冲突。\n<\/li><li>\n实例：m = 13，键 18、41、22、44、59 分别落到 5、2、9、5、7。44 与 18 冲突。\n<\/ul>\n<p><strong>乘法散列<\/strong>：h(k) = floor(m · frac(k · A))，A 常取黄金比例 0.618…。它对 m 的取值不敏感，m 可以取 2 的幂。<\/p>\n<h3>概念 2：链地址法（难度：基础）<\/h3>\n<p>每个槽挂一条链表，冲突的键依次挂上去。<\/p>\n<ul><li>\n装载因子 α = n/m（键数除以槽数）。\n<\/li><li>\n成功查找平均比较次数 ≈ 1 + α/2。\n<\/li><li>\n失败查找平均比较次数 ≈ α。\n<\/li><li>\n优点：实现简单，删除方便，α 可以大于 1。\n<\/li><li>\n缺点：链表指针占空间，缓存不友好。\n<\/ul>\n<p><strong>实例<\/strong>：m = 5，α = 2（10 个键），成功查找平均约 1 + 1 = 2 次比较。<\/p>\n<h3>概念 3：开放地址法（难度：进阶）<\/h3>\n<p>所有键都存在表内，冲突时按某个探测序列找下一个空槽。<\/p>\n<ul><li>\n<strong>线性探测<\/strong>：h, h+1, h+2, … 依次试。\n<\/li><li>\n<strong>二次探测<\/strong>：h, h+1², h+2², … 跳着试。\n<\/li><li>\n<strong>双散列<\/strong>：用第二个散列函数决定步长，步长与 m 互素才能遍历全表。\n<\/ul>\n<p><strong>线性探测的代价<\/strong>：成功查找平均约 (1/2)(1 + 1/(1−α))。α = 0.5 时约 1.5 次；α = 0.9 时约 5.5 次，急剧恶化。<\/p>\n<p><strong>一次聚集<\/strong>：线性探测会把连续占用的槽连成一片，新键落进去后继续加长这片区域，后面的键越来越难找。二次探测与双散列就是为了打散这种连续块。<\/p>\n<p><strong>删除的坑<\/strong>：开放地址法不能直接把槽清空，否则会截断别人的探测链。要用「墓碑」标记，查找时跳过、插入时可复用。<\/p>\n<h2>概念 4：辅助键与倒排索引（难度：进阶）<\/h2>\n<p>主键唯一标识一条记录；<strong>辅助键<\/strong>是其他可用于查找的字段（如作者、日期、标签），可以有重复。<\/p>\n<ul><li>\n<strong>倒排文件<\/strong>：为每个辅助键值建一个列表，记录包含该值的所有主键。查「作者=Knuth」就直接取出列表。\n<\/li><li>\n<strong>多键查询<\/strong>：多个条件同时用时，对各列表求交；求交的代价取决于列表长度，短的先做。\n<\/li><li>\n<strong>组合键<\/strong>：把多个字段拼成一个键再散列，适合精确匹配；范围查询仍要靠有序索引。\n<\/ul>\n<p><strong>实例<\/strong>：三篇文章的主键 1、2、3，标签分别是 {算法, 数学}、{算法}、{数学}。<\/p>\n<ul><li>\n标签「算法」的倒排表：1、2。\n<\/li><li>\n标签「数学」的倒排表：1、3。\n<\/li><li>\n查「同时有算法与数学」：两表求交得 1。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 362.5 768\" style=\"max-width: 362.5px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg23\"><style>#svg23{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg23 .error-icon{fill:#552222;}#svg23 .error-text{fill:#552222;stroke:#552222;}#svg23 .edge-thickness-normal{stroke-width:2px;}#svg23 .edge-thickness-thick{stroke-width:3.5px;}#svg23 .edge-pattern-solid{stroke-dasharray:0;}#svg23 .edge-pattern-dashed{stroke-dasharray:3;}#svg23 .edge-pattern-dotted{stroke-dasharray:2;}#svg23 .marker{fill:#333333;stroke:#333333;}#svg23 .marker.cross{stroke:#333333;}#svg23 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg23 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;} /path><path marker-end=\"url(#svg23_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-S LE-C\" id=\"L-S-C-0\" d=\"M117,208L117,212.167C117,216.333,117,224.667,117.066,232.2C117.132,239.734,117.264,246.467,117.33,249.834L117.396,253.201\"></path><path marker-end=\"url(#svg23_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-OK\" id=\"L-C-OK-0\" d=\"M93.892,333.892L84.827,343.66C75.762,353.428,57.631,372.964,48.565,395.682C39.5,418.4,39.5,444.3,39.5,457.25L39.5,470.2\"></path><path marker-end=\"url(#svg23_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-C LE-M\" id=\"L-C-M-0\" d=\"M141.108,333.892L150.006,343.66C158.905,353.428,176.703,372.964,185.672,387.849C194.642,402.734,194.784,412.967,194.855,418.084L194.926,423.201\"></path><path marker-end=\"url(#svg23_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-M LE-L\" id=\"L-M-L-0\" d=\"M165.949,530.449L157.291,541.124C148.633,551.799,131.316,573.15,122.658,588.858C114,604.567,114,614.633,114,619.667L114,624.7\"></path><path marker-end=\"url(#svg23_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-M LE-P\" id=\"L-M-P-0\" d=\"M224.051,530.449L232.542,541.124C241.034,551.799,258.017,573.15,266.508,588.858C275,604.567,275,614.633,275,619.667L275,624.7\"></path><path marker-end=\"url(#svg23_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-W\" id=\"L-P-W-0\" d=\"M275,666L275,670.167C275,674.333,275,682.667,275,690.117C275,697.567,275,704.133,275,707.417L275,710.7\"></path><path marker-end=\"url(#svg23_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-K2 LE-I\" id=\"L-K2-I-0\" d=\"M238,36L238,40.167C \"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">删除需用墓碑</span></div></foreignObject></g></g><g transform=\"translate(238, 18)\" data-id=\"K2\" data-node=\"true\" id=\"flowchart-K2-323\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">辅助键</span></div></foreignObject></g></g><g transform=\"translate(238, 104)\" data-id=\"I\" data-node=\"true\" id=\"flowchart-I-324\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"63\" y=\"-18\" x=\"-31.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-24, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"48\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">倒排表</span></div></foreignObject></g></g><g transform=\"translate(238, 190)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-326\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"95\" y=\"-18\" x=\"-47.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">多条件求交</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：上半部分是单键查找的两条路；下半部分说明辅助键走的是完全不同的结构——不是散列到槽，而是「键值 → 主键列表」的映射。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：散列像图书馆按书名的哈希值把书放进编号柜子；冲突就是两本书算到同一个柜子，只好在柜子里再排一层。\n<\/li><li>\n类比失效：图书馆的柜子大小固定，书多了必须换馆；散列表可以扩容重散列（rehash），但扩容那一下代价是 O(n)。\n<\/ul>\n<p><strong>实例（线性探测）<\/strong>：m = 7，依次插入 10、17、24、31。<\/p>\n<ul><li>\n10 mod 7 = 3，放 3。\n<\/li><li>\n17 mod 7 = 3，冲突，试 4，放入。\n<\/li><li>\n24 mod 7 = 3，冲突，4 被占，试 5，放入。\n<\/li><li>\n31 mod 7 = 3，冲突，4、5 被占，试 6，放入。\n<p>四个键挤在 3 到 6 一段，这就是一次聚集。<\/p>\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为散列查找永远是 O(1)<\/strong>——实际上 α 接近 1 时开放地址法急剧退化，最坏可到 O(n)。\n<\/li><li>\n<strong>别以为 m 取 2 的幂很方便就没问题<\/strong>——实际上它只取键的低位，键低位有规律时冲突严重。\n<\/li><li>\n<strong>别以为删除可以直接清空槽<\/strong>——实际上会截断探测链，必须用墓碑。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：m = 13，键 44 的除法散列槽位是多少？（填数字）\n<p>（答案：5；解析：44 = 3×13 + 5，余数为 5。）<\/p>\n<\/ol>\n<ol><li>\n单选题：链地址法在装载因子 α = 2 时，成功查找的平均比较次数约为？\n<p>A. 1 B. 2 C. 4 D. 8 （答案：B；解析：成功查找约 1 + α/2 = 1 + 1 = 2 次。）<\/p>\n<\/ol>\n<ol><li>\n简答题：开放地址法为什么不能直接删除元素？\n<p>（答案：直接清空会截断后续键的探测链，使本来能找到的键查找失败；要用墓碑标记，查找时跳过、插入时可复用。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n除法散列 m 取素数，避开 2 的幂。\n<\/li><li>\n链地址成功查找约 1 + α/2；线性探测约 (1/2)(1 + 1/(1−α))。\n<\/li><li>\n开放地址删除要用墓碑；辅助键用倒排表。\n<\/ul>", "c01": "<h1>逆序与排序代价<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 1、2 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>逆序对是排列中「前大后小」的一对位置；逆序对总数直接等于插入排序需要移动的次数。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把「排序有多难」从算法层面拉到了数据层面：同一份数据，逆序对少就好排，多就难排。平均逆序对数是 n(n−1)/4，这就是插入类排序平均 O(n²) 的来源。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 752.328125 138\" style=\"max-width: 752.328125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg24\"><style>#svg24{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg24 .error-icon{fill:#552222;}#svg24 .error-text{fill:#552222;stroke:#552222;}#svg24 .edge-thickness- " class=\"node default default flowchart-label\"><rect height=\"36\" width=\"144.796875\" y=\"-18\" x=\"-72.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"129.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">插入排序移动 3 次</span></div></foreignObject></g></g><g transform=\"translate(298.78125, 104)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-334\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"296.8125\" y=\"-18\" x=\"-148.40625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-140.90625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"281.8125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均情况 对 n 个元素为 n n 减一 除以四</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>看这条链：数据的一个静态属性（逆序对数）直接等于一个算法的动态工作量（移动次数）。<\/p>\n<h2>详解<\/h2>\n<p><strong>计数方法<\/strong>：对每个元素，数它右边比它小的元素个数，全部加起来。<\/p>\n<p><strong>实例<\/strong>：3, 1, 4, 2。3 右边比它小的有 1、2（2 个）；1 右边没有；4 右边有 2（1 个）；2 是最后一个。合计 3 个。<\/p>\n<p><strong>与交换排序的区别<\/strong>：一次相邻交换能消除恰好一个逆序对；但一次远距离交换可能消除两个，也可能一个都不消。所以「交换次数」不能直接等于逆序对数，只有插入排序的「挪动一格」是严格一一对应。<\/p>\n<p><strong>上界<\/strong>：完全逆序的排列有 n(n−1)/2 个逆序对，这是最大值，也是插入排序的最坏移动次数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为逆序对数相同的两个排列，排序代价也相同：快排的代价取决于基准选择，不只是逆序数。\n<\/li><li>\n别以为平均逆序对数是 n²/4 就说明「平均只比最坏快一倍」：常数确实只差一倍，但 n log n 算法能把这项彻底甩开。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.1.1<\/td><td>反序<\/td><td>逆序对的定义与平均 n(n−1)/4<\/td><\/tr><tr><td>5.2.1<\/td><td>插入排序<\/td><td>移动次数等于逆序对数<\/td><\/tr><tr><td>5.2.2<\/td><td>交换排序<\/td><td>一次交换最多消除两个逆序对<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">比较树下界<\/a>\n<\/ul>", "c02": "<h1>比较树下界<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把任何比较排序的执行过程画成一棵二叉树，叶子必须覆盖 n! 种输入排列，所以树高至少 log2(n!)，这就是比较排序的比较次数下界。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是一条「不可能性」结论：不管多聪明的比较排序，最坏情况都至少要 log2(n!) 次比较。知道下界，才知道一个算法还有多少优化空间，也才知道该换思路（比如改用不比较的基数排序）。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 296.90625 310\" style=\"max-width: 296.90625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg25\"><style>#svg25{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg25 .error-icon{fill:#552222;}#svg25 .error-text{fill:#552222;stroke:#552222;}#svg25 .edge-thickness-normal{stroke-width:2px;}#svg25 .edge-thickness-thick{stroke-width:3.5px;}#svg25 .edge-pattern-solid{stroke-dasharray:0;}#svg25 .edge-pattern-dashed{stroke-dasharray:3;}#svg25 .edge-pattern-dotted{stroke-dasharray:2;}#svg25 .marker{fill:#333333;stroke:#333333;}#svg25 .marker.cross{stroke:#333333;}#svg25 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg25 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg25 .cluster-label text{fill:#333;}#svg25 .cluster-label span,#svg25 p{color:#333;}#svg25 .label text,#svg25 span,#svg25 p{fill:#333;color:#333;}#svg25 .node rect,#svg25 .node circle,#svg25 .node ellipse,#svg25 .node polygon,#svg25 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg25 .flowchart-label text{text-anchor:middle;}#svg25 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg25 .node .label{text-align:center;}#svg25 .node.clickable{cursor:pointer;}#svg25 .arrowheadPath{fill:#333333;}#svg25 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg25 .flowchart-link{stroke:#333333;fill:none;}#svg25 .edgeLabel{background-color:#e8e8e8 r\"></rect><g transform=\"translate(-50.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"100.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">叶子 一个排列</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>每个叶子对应一种可能的输出顺序；要覆盖 n! 种顺序，叶子数不能少，树就压不下来。<\/p>\n<h2>详解<\/h2>\n<p><strong>推导<\/strong>：二叉树高度 h 最多有 2^h 个叶子。要 2^h ≥ n!，得 h ≥ log2(n!)。<\/p>\n<p><strong>数值<\/strong>：<\/p>\n<ul><li>\nn = 3：log2 6 ≈ 2.58，取整 3。\n<\/li><li>\nn = 5：log2 120 ≈ 6.91，取整 7。\n<\/li><li>\nn = 10：log2(3628800) ≈ 21.8，取整 22。\n<\/ul>\n<p><strong>近似式<\/strong>：log2(n!) ≈ n log2 n − 1.4427n + O(log n)。线性项系数 1.4427 就是 1/ln 2。<\/p>\n<p><strong>适用边界<\/strong>：只对「基于比较」的算法成立。基数排序按位分配，不受这条下界约束，可以做到 O(n)。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为下界是「平均情况」：它是最坏情况的下界，平均情况可以更低（但一般仍同阶）。\n<\/li><li>\n别以为达到下界就说明算法最优：下界只约束比较次数，不约束移动次数、空间、缓存行为。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>5.3.1<\/td><td>比较次数最少<\/td><td>比较树模型与 log2(n!) 下界<\/td><\/tr><tr><td>5.3.4<\/td><td>排序网络<\/td><td>0-1 原理与网络规模<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">逆序与排序代价<\/a>\n<\/li><li>\n后续：第 2 章的合并排序\n<\/ul>", "c03": "<h1>散列与装载因子<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>散列用一个函数把键映射到槽位；装载因子 α = 键数/槽数衡量表的拥挤程度，直接决定平均查找长度。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把查找从 O(log n) 压到常数级，是所有字典、缓存、数据库索引的基础。但它有明确的退化边界：α 一高，常数级就变成线性。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 288.0234375 550\" style=\"max-width: 288.0234375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg26\"><style>#svg26{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg26 .error-icon{fill:#552222 html\"><span class=\"nodeLabel\">键</span></div></foreignObject></g></g><g transform=\"translate(112, 104)\" data-id=\"H\" data-node=\"true\" id=\"flowchart-H-348\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">散列函数</span></div></foreignObject></g></g><g transform=\"translate(112, 190)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-350\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"119.015625\" y=\"-18\" x=\"-59.5078125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-52.0078125, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"104.015625\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">槽 0 到 m 减一</span></div></foreignObject></g></g><g transform=\"translate(112, 299.5)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-352\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-41.5,41.5)\" class=\"label-container\" points=\"41.5,0 83,-41.5 41.5,-83 0,-41.5\"></polygon><g transform=\"translate(-16, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"32\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">冲突</span></div></foreignObject></g></g><g transform=\"translate(39.5, 430)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-354\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"79\" y=\"-18\" x=\"-39.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-32, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"64\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">直接命中</span></div></foreignObject></g></g><g transform=\"translate(184.5, 430)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-356\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"111\" y=\"-18\" x=\"-55.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-48, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"96\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">链地址或探测</span></div></foreignObject></g></g><g transform=\"translate(184.5, 516)\" data-id=\"L\" data-node=\"true\" id=\"flowchart-L-358\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"175.046875\" y=\"-18\" x=\"-87.5234375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-80.0234375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"160.046875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">平均长度随 alpha 上升</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p>图里的关键边是最后一条：冲突处理方式不变，α 一变，平均长度就变。<\/p>\n<h2>详解<\/h2>\n<p><strong>链地址法<\/strong>：成功查找约 1 + α/2 次比较；失败查找约 α 次。α 可以大于 1。<\/p>\n<p><strong>线性探测<\/strong>：成功查找约 (1/2)(1 + 1/(1−α))。α = 0.5 时 1.5 次，α = 0.9 时 5.5 次。<\/p>\n<p><strong>实例<\/strong>：m = 7，插入 10、17、24、31，依次落在 3、4、5、6，形成一段连续占用，后续键落到这一段里要找更久。<\/p>\n<p><strong>扩容<\/strong>：α 超过阈值（常用 0.75）就加倍槽数并重新散列所有键，单次代价 O(n)，摊还后仍是常数。<\/p>\n<p><strong>删除<\/strong>：开放地址法要用墓碑，否则截断探测链。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为散列查找永远 O(1)：那是在 α 受控且散列函数均匀的前提下。\n<\/li><li>\n别以为槽数取 2 的幂总是方便：它只取键的低位，键低位有规律时冲突集中。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>6.4<\/td><td>散列<\/td><td>散列函数、冲突处理与平均长度<\/td><\/tr><tr><td>6.5<\/td><td>辅助键<\/td><td>倒排表与多键查询<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">比较树下界<\/a>\n<\/li><li>\n后续：卷4 的位运算技巧\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：先看清排序的组合结构<\/strong><br>阅读：<a href=\"#/book/taocp-v3/chapter/ch01\">第 1 章：排序的组合性质<\/a><br>检查点：能数逆序对、算多重集排列数、说出平均游程数<\/li><li class='path-step' id='path-02'><strong>步骤 02：五类内部排序与取舍<\/strong><br>阅读：<a href=\"#/book/taocp-v3/chapter/ch02\">第 2 章：内部排序——五类算法与它们的代价<\/a><br>检查点：能针对四个场景各选一种算法并说出理由<\/li><li class='path-step' id='path-03'><strong>步骤 03：下界与排序网络<\/strong><br>阅读：<a href=\"#/book/taocp-v3/chapter/ch03\">第 3 章：最优排序——比较次数的下界与排序网络<\/a><br>检查点：能推出 log2 n! 下界，能用 0-1 原理验证小网络<\/li><li class='path-step' id='path-04'><strong>步骤 04：外部排序<\/strong><br>阅读：<a href=\"#/book/taocp-v3/chapter/ch04\">第 4 章：外部排序——数据比内存大怎么办<\/a><br>检查点：能算合并趟数与替代选择的游程长度<\/li><li class='path-step' id='path-05'><strong>步骤 05：查找结构与 B 树<\/strong><br>阅读：<a href=\"#/book/taocp-v3/chapter/ch05\">第 5 章：查找——从顺序扫到平衡树<\/a><br>检查点：能算二分与 B 树的层数，解释 AVL 的最坏保证<\/li><li class='path-step' id='path-06'><strong>步骤 06：散列与辅助键<\/strong><br>阅读：<a href=\"#/book/taocp-v3/chapter/ch06\">第 6 章：散列查找与辅助键<\/a><br>检查点：能按装载因子估算平均查找长度，解释墓碑的必要性<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：排序的组合性质<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 排列 4, 3, 2, 1 的逆序对数是多少？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' ut class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q06' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 基数排序必须满足的性质是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q06' value='0'> 稳定<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='1'> 原地<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='2'> 比较元素大小<\/label><label class='quiz-opt'><input type='radio' name='ch02-q06' value='3'> 递归<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：最优排序——比较次数的下界与排序网络<\/h2><div class='quiz-item' data-qid='ch03-q07' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 5 个元素排序，最坏情况至少需要多少次比较？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q08' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 排序网络的核心优势是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q08' value='0'> 比较次数最少<\/label><label class='quiz-opt'><input type='radio' name='ch03-q08' value='1'> 无分支、可并行<\/label><label class='quiz-opt'><input type='radio' name='ch03-q08' value='2'> 不需要额外空间<\/label><label class='quiz-opt'><input type='radio' name='ch03-q08' value='3'> 稳定<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch03-q09' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 0-1 原理的作用是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch03-q09' value='0'> 把任意输入化归为 0/1 输入来验证网络<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='1'> 证明快排最优<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='2'> 计算逆序对数<\/label><label class='quiz-opt'><input type='radio' name='ch03-q09' value='3'> 分析散列冲突<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 4 章：外部排序——数据比内存大怎么办<\/h2><div class='quiz-item' data-qid='ch04-q10' data-type='blank'><p class='quiz-q'><b>Q1.<\/b> 1000 个初始游程做 4 路合并，需要多少趟？（填数字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 替代选择在随机输入下的平均游程长度约为缓冲区容量的多少倍？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q11' value='0'> 0.5<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='2'> 2<\/label><label class='quiz-opt'><input type='radio' name='ch04-q11' value='3'> 4<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch04-q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 多阶段合并主要解决什么问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch04-q12' value='0'> 比较次数太多<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='1'> 磁带台数不足<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='2'> 内存太大<\/label><label class='quiz-opt'><input type='radio' name='ch04-q12' value='3'> 键值范围太小<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 5 章：查找 iv>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='逆序对'>逆序对 — 排列中前一个数大于后一个数的一对位置。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='游程'>游程 — 排列中一段连续递增的最长子序列。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='对合'>对合 — 做两次回到原样的置换，循环长度只能是 1 或 2。 <span class=glossary-ref>（第 1 章：排序的组合性质）<\/span><\/li><li data-term='稳定排序'>稳定排序 — 相等元素在排序后保持原来的相对次序。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='基准'>基准 — 快速排序中用来划分数组的元素。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='堆'>堆 — 一种完全二叉树，每个节点都不小于（或不大于）它的孩子。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='基数排序'>基数排序 — 按键的每一位分配与收集，不做元素间比较的排序。 <span class=glossary-ref>（第 2 章：内部排序——五类算法与它们的代价）<\/span><\/li><li data-term='比较树'>比较树 — 把排序过程画成判断树，内部节点是比较，叶子是输出排列。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='排序网络'>排序网络 — 一组固定的比较器，比较顺序与输入无关，可并行执行。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='0-1 原理'>0-1 原理 — 若网络能排好所有 0/1 输入，就能排好任意输入。 <span class=glossary-ref>（第 3 章：最优排序——比较次数的下界与排序网络）<\/span><\/li><li data-term='初始游程'>初始游程 — 外部排序中一块内存数据排好后写到磁盘上的有序段。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='替代选择'>替代选择 — 用堆边写边读，使平均游程长度达到缓冲区容量两倍的方法。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='多阶段合并'>多阶段合并 — 用不均匀分配让有限磁带轮流充当输出的合并策略。 <span class=glossary-ref>（第 4 章：外部排序——数据比内存大怎么办）<\/span><\/li><li data-term='avl 树'>AVL 树 — 每个节点左右子树高度差不超过 1 的二叉查找树。 <span class=glossary-ref>（第 5 章：查找——从顺序扫到平衡树）<\/span><\/li><li data-term='b 树'>B 树 — 每个节点可存多个键、多个孩子，所有叶子同层的多路查找树。 <span class=glossary-ref>（第 5 章：查找——从顺序扫到平衡树）<\/span><\/li><li data-term='装载因子'>装载因子 — 散列表中键数与槽数之比。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='一次聚集'>一次聚集 — 线性探测把连续槽位占满、越聚越长的现象。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='墓碑'>墓碑 — 开放地址法删除后留下的标记，保证探测链不被截断。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><li data-term='倒排索引'>倒排索引 — 由辅助键值指向包含该值的主键列表的结构。 <span class=glossary-ref>（第 6 章：散列查找与辅助键）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：判断一个排序该用什么<\/h2>\n<ol><li>\n<strong>数据在哪<\/strong>：内存 → 内部排序；磁盘 → 外部排序。\n<\/li><li>\n<strong>要不要稳定<\/strong>：要 → 合并排序或基数排序；不要 → 快排、堆排。\n<\/li><li>\n<strong>最坏要不要保证<\/strong>：要 → 堆排序；不要 → 快排。\n<\/li><li>\n<strong>数据有无现成结构<\/strong>：近乎有序 → 插入排序；键值范围小 → 基数排序；链表 → 合并排序。\n<\/ol>\n<h2>框架：判断一个查找该用什么<\/h2>\n<ol><li>\n<strong>能不能随机访问<\/strong>：不能 → 顺序查找或跳表。\n<\/li><li>\n<strong>数据动不动<\/strong>：静态 → 有序数组加二分；动态 → 平衡树。\n<\/li><li>\n<strong>数据在不在内存<\/strong>：在磁盘 → B 树。\n<\/li><li>\n<strong>要不要范围查询<\/strong>：要 → 树；只要精确匹配 → 散列。\n<\/ol>\n<h2>决策规则：散列的装载因子<\/h2>\n<ul><li>\nα &lt; 0.5：开放地址法还很轻松。\n<\/li><li>\n0.5 ≤ α &lt; 0.75：可用，但探测长度明显上升。\n<\/li><li>\nα ≥ 0.75：必须扩容重散列，否则退化。\n<\/li><li>\n链地址法可容忍 α &gt; 1，但缓存不友好。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>对已排序数据取首元素当快排基准<\/strong>：必然 O(n²)。\n<\/li><li>\n<strong>用 2 的幂当散列表长度<\/strong>：只取键的低位，低位有规律就冲突。\n<\/li><li>\n<strong>开放地址法直接清空槽<\/strong>：截断探测链，后续查找失败。\n<\/li><li>\n<strong>用比较排序去排键值范围很小的整数<\/strong>：明明可以用基数排序到线性。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>排序代价<\/h2>\n<table><thead><tr><th>算法<\/th><th>平均<\/th><th>最坏<\/th><th>空间<\/th><th>稳定<\/th><\/tr><\/thead><tbody><tr><td>直接插入<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>是<\/td><\/tr><tr><td>希尔<\/td><td>约 n^1.3<\/td><td>依间隔序列<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>冒泡<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>是<\/td><\/tr><tr><td>快速排序<\/td><td>n log n<\/td><td>n²<\/td><td>log n<\/td><td>否<\/td><\/tr><tr><td>直接选择<\/td><td>n²<\/td><td>n²<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>堆排序<\/td><td>n log n<\/td><td>n log n<\/td><td>1<\/td><td>否<\/td><\/tr><tr><td>合并排序<\/td><td>n log n<\/td><td>n log n<\/td><td>n<\/td><td>是<\/td><\/tr><tr><td>基数排序<\/td><td>d(n+k)<\/td><td>d(n+k)<\/td><td>n+k<\/td><td>是<\/td><\/tr><\/tbody><\/table>\n<h2>查找代价<\/h2>\n<table><thead><tr><th>结构<\/th><th>平均<\/th><th>最坏<\/th><\/tr><\/thead><tbody><tr><td>顺序查找<\/td><td>n/2<\/td><td>n<\/td><\/tr><tr><td>二分查找<\/td><td>log n<\/td><td>log n<\/td><\/tr><tr><td>二叉查找树<\/td><td>1.39 log n<\/td><td>n<\/td><\/tr><tr><td>AVL / 红黑树<\/td><td>log n<\/td><td>1.44 log n<\/td><\/tr><tr><td>B 树<\/td><td>log_m n 层<\/td><td>同<\/td><\/tr><tr><td>散列（链地址）<\/td><td>1 + α/2<\/td><td>n<\/td><\/tr><\/tbody><\/table>\n<h2>关键公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>公式<\/th><\/tr><\/thead><tbody><tr><td>比较排序下界<\/td><td>log2(n!) ≈ n log2 n − 1.44n<\/td><\/tr><tr><td>外部合并趟数<\/td><td>ceil(log_k R)<\/td><\/tr><tr><td>替代选择游程<\/td><td>平均 2P<\/td><\/tr><tr><td>链地址成功查找<\/td><td>1 + α/2<\/td><\/tr><tr><td>线性探测成功查找<\/td><td>(1/2)(1 + 1/(1−α))<\/td><\/tr><\/tbody><\/table>"}, "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：排序的组合性质", "href": "#/chapter/ch01"}, {"label": "第 2 章：内部排序——五类算法与它们的代价", "href": "#/chapter/ch02"}, {"label": "第 3 章：最优排序——比较次数的下界与排序网络", "href": "#/chapter/ch03"}, {"label": "第 4 章：外部排序——数据比内存大怎么办", "href": "#/chapter/ch04"}, {"label": "第 5 章：查找——从顺序扫到平衡树", "href": "#/chapter/ch05"}, {"label": "第 6 章：散列查找与辅助键", "href": "#/chapter/ch06"}]}, {"label": "概念", "children": [{"label": "逆序与排序代价", "href": "#/concept/c01"}, {"label": "比较树下界", "href": "#/concept/c02"}, {"label": "散列与装载因子", "href": "#/concept/c03"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：排序的组合性质", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：内部排序——五类算法与它们的代价", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：最优排序——比较次数的下界与排序网络", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：外部排序——数据比内存大怎么办", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：查找——从顺序扫到平衡树", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：散列查找与辅助键", "href": "#/quiz/ch06"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "quizCove f": "与运算左边为假就不再算右边，或运算左边为真就不再算右边。", "chapterId": "ch02"}, {"term": "位并行", "def": "把 64 个布尔值打包进一个字，一次运算同时处理 64 组输入。", "chapterId": "ch02"}, {"term": "四 Russians 方法", "def": "把输入切成小块，预计算每块的所有取值结果，求值时查表拼接。", "chapterId": "ch02"}, {"term": "总体计数", "def": "数一个二进制数里 1 的个数。", "chapterId": "ch03"}, {"term": "二元决策图", "def": "按变量顺序分支、并合并相同子图的有向无环图，用来紧凑表示布尔函数。", "chapterId": "ch03"}, {"term": "有序", "def": "BDD 中从根到叶的路径上变量出现顺序固定。", "chapterId": "ch03"}, {"term": "归约", "def": "合并同构子图、删掉两个分支相同的节点。", "chapterId": "ch03"}, {"term": "组合爆炸", "def": "可能情况的数量随规模指数增长，无法逐一枚举。", "chapterId": "ch04"}, {"term": "回溯", "def": "走一步、不行就退回上一步换下一个选择的搜索方式。", "chapterId": "ch04"}, {"term": "格雷码", "def": "相邻两个编码只差一位的二进制编码序列。", "chapterId": "ch04"}, {"term": "字典序", "def": "按第一个不同位置的元素大小决定先后。", "chapterId": "ch04"}], "patterns": {"file": "patterns.md"}, "cheatsheet": {"file": "cheatsheet.md"}, "quizzes": [{"id": "ch01-q01", "chapterId": "ch01", "type": "blank", "question": "3 个变量的布尔函数共有多少个？（填数字）", "options": [], "answer": "256", "explain": "2^(2^3) = 2^8 = 256，因为 8 种输入、每种输出独立取 0 或 1。"}, {"id": "ch01-q02", "chapterId": "ch01", "type": "single", "question": "三变量多数函数在输入 101 时输出？", "options": ["0", "1", "不确定", "取决于变量顺序"], "answer": 1, "explain": "101 里有两个 1，满足「至少两个为 1」，输出 1。"}, {"id": "ch01-q03", "chapterId": "ch01", "type": "single", "question": "(x∧y)∨(x∧¬y) 化简的结果是？", "options": ["x", "y", "x∧y", "x∨y"], "answer": 0, "explain": "提取 x 得 x∧(y∨¬y) = x∧1 = x。"}, {"id": "ch02-q04", "chapterId": "ch02", "type": "single", "question": "一个 64 位字最多能同时打包多少组布尔输入？", "options": ["8", "16", "32", "64"], "answer": 3, "explain": "每一位一组，64 位即 64 组。"}, {"id": "ch02-q05", "chapterId": "ch02", "type": "single", "question": "四 Russians 方法中，n 个变量切成每块 k 个，预计算规模约为 (n/k) 乘以多少？", "options": ["2^k", "k", "n", "2^n"], "answer": 0, "explain": "每块要枚举 k 个变量的全部 2^k 种取值。"}, {"id": "ch02-q06", "chapterId": "ch02", "type": "single", "question": "短路求值在 f = (x>0) ∧ (1/x>2) 中避免了什么？", "options": ["除零", "溢出", "精度损失", "死循环"], "answer": 0, "explain": "x=0 时左边为假，右边不再求值，避免 1/x 除零。"}, {"id": "ch03-q07", "chapterId": "ch03", "type": "blank", "question": "二进制 7 里有几个 1？（填数字）", "options": [], "answer": "3", "explain": "7 = 111，用 x&(x−1) 循环三次归零。"}, {"id": "ch03-q08", "chapterId": "ch03", "type": "single", "question": "BDD 能用于等价性验证，关键靠哪条性质？", "options": ["有序", "归约后的规范形式", "变量个数少", "终端只有两个"], "answer": 1, "explain": "固定顺序下归约后的 BDD 唯一，两函数等价当且仅当图同构。"}, {"id": "ch03-q09", "chapterId": "ch03", "type": "single", "question": "x&(x−1) 的作用是？", "options": ["取最低位的 1", "清掉最低位的 1", "全部取反", "左移一位"], "answer": 1, "explain": "减一把最低位 1 变 0、右侧变 1，再相与即清掉最低位的那个 1。"}, {"id": "ch04-q10", "chapterId": "ch04", "type": "blank", "question": "{1,2,3,4} 的全部子集有多少个？（填数字）", "options": [], "answer": "16", "explain": "2^4 = 16，含空集与全集。"}, {"id": "ch04-q11", "chapterId": "ch04", "type": "single", "question": "3 位格雷码序列的第三个编码是？", "options": ["010", "011", "100", "101"], "answer": 1, "explain": "序列为 000、001、011、010、110、111、101、100，第三个是 011。"}, {"id": "ch04-q12", "chapterId": "ch04", "type": "single", "question": "回溯算法中的剪枝为什么不会漏解？", "options": ["因为剪掉的分支都不可行", "因为剪枝是随机选的", "因为回溯会重来", "因为解都在叶子"], "answer": 0, "explain": "剪掉的都是「无论后续怎么选都不合法」的分支，合法解不会经过它们。"}, {"id": "q13", "chapterId": "__all__", "type": "single", "question": "综合题：要验证两个各含 40 个变量的组合电路功能是否相同，最合适的做法是？", "options": ["建真值表逐行比较", "把两个电路建成 BDD 再比较是否同构", "随机测 100 组输入", "用 DNF 展开后比较项数"], "answer": 1, "explain": "40 个变量真值表有 2^40 行，DNF 可能指数爆炸；BDD 归约后是规范形式，同构即等价。随机测试不能证明等价。"}], "flashcards": [{"id": "f01", "chapterId": "ch01", "front": "n 变量布尔函数共有多少个？", "back": "2^(2^n) 个，因为 2^n 种输入、每种输出独立取 0/1。", "tags": ["布尔"]}, {"id": "f02", "chapterId": "ch01", "front": "析取范式怎么从真值表得到？", "back": "把输出为 1 的每一行写成一个极小项，再全部相或。", "tags": ["布尔"]}, {"id": "f03", "chapterId": "ch01", "front": "德摩根律的两条式子？", "back": "¬(a∧b)=¬a∨¬b；¬(a∨b)=¬a∧¬b。", "tags": ["布尔"]}, {"id": "f04", "chapterId": "ch02", "front": "短路求值的规则？", "back": "与运算左边为假即停；或运算左边为真即停，避免无意义的右侧求值。", "tags": ["求值"]}, {"id": "f05", "chapterId": "ch02", "front": "位并行求值的条件与上限？", "back": "各组完全独立、只含按位运算；一个 64 位字最多 64 组。", "tags": ["求值"]}, {"id": "f06", "chapterId": "ch02", "front": "四 Russians 方法的预计算与单次求值代价？", "back": "预计算约 (n/k)×2^k；单次求值约 n/k 次查表。", "tags": ["求值"]}, {"id": "f07", "chapterId": "ch03", "front": "x&(x−1) 做了什么？", "back": "清掉最低位的 1；循环次数等于 1 的个数。", "tags": ["位运算"]}, {"id": "f08", "chapterId": "ch03", "front": "BDD 的两条规则是什么？", "back": "有序（变量顺序固定）与归约（合并同构子图、删掉两分支相同的节点）。", "tags": ["决策图"]}, {"id": "f09", "chapterId": "ch03", "front": "为什么变量顺序会影响 BDD 大小？", "back": "顺序决定要保留多少未处理变量的组合路径；顺序差时中间组合无法合并，规模指数增长。", "tags": ["决策图"]}, {"id": "f10", "chapterId": "ch04", "front": "组合问题的五个类型？", "back": "存在、构造、计数、生成、优化。", "tags": ["生成"]}, {"id": "f11", "chapterId": "ch04", "front": "生成全部子集的两种方法？", "back": "二进制掩码从 0 数到 2^n−1；递归「选/不选」每个元素。", "tags": ["生成"]}, {"id": "f12", "chapterId": "ch04", "front": "回溯框架的四步？", "back": "判断是否完整、枚举候选、做选择后递归、撤销选择。", "tags": ["生成"]}]}, "rendered": {"ch01": "<h1>第 1 章：0 与 1——布尔代数基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：二进制与位运算\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n写出 n 变量布尔函数的总数公式，并解释为什么是这个数。\n<\/li><li>\n给一个函数写真值表，再从真值表写出析取范式。\n<\/li><li>\n用德摩根律与吸收律化简表达式。\n<\/li><li>\n说清「极小项」与「析取范式」的关系。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>布尔函数只有两种输出，所以它的全部信息就是一张真值表；范式是把这张表翻译成代数表达式的标准方法。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：布尔函数与它的数量（难度：基础）<\/h3>\n<p>布尔函数接受 n 个 0/1 输入，输出一个 0/1。<\/p>\n<p>n 个变量共有 2^n 种输入组合；每一种组合的输出可以独立取 0 或 1，所以总共有 2^(2^n) 个不同的布尔函数。<\/p>\n<p><strong>实例<\/strong>：n = 1 时有 2^2 = 4 个函数：恒 0、恒 1、原样、取反。 <strong>实例<\/strong>：n = 2 时有 2^4 = 16 个函数，包括与、或、异或、蕴含等。 <strong>推论<\/strong>：n = 6 时是 2^64 个，已经数不清；所以「枚举所有布尔函数」只在小 n 可行。<\/p>\n<p><strong>三变量多数函数<\/strong>（三个输入里至少两个为 1 时输出 1）：<\/p>\n<table><thead><tr><th>x y z<\/th><th>输出<\/th><\/tr><\/thead><tbody><tr><td>000<\/td><td>0<\/td><\/tr><tr><td>001<\/td><td>0<\/td><\/tr><tr><td>010<\/td><td>0<\/td><\/tr><tr><td>011<\/td><td>1<\/td><\/tr><tr><td>100<\/td><td>0<\/td><\/tr><tr><td>101<\/td><td>1<\/td><\/tr><tr><td>110<\/td><td>1<\/td><\/tr><tr><td>111<\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<h3>概念 2：极小项与析取范式（难度：基础）<\/h3>\n<p><strong>极小项<\/strong>是「每个变量恰好出现一次」的乘积项，例如 x∧¬y∧z。<\/p>\n<p>把真值表里所有输出为 1 的行，各写成一个极小项，再全部相或，就得到<strong>析取范式<\/strong>（DNF）。<\/p>\n<p><strong>实例<\/strong>：上面的多数函数，输出为 1 的行是 011、101、110、111，对应极小项：<\/p>\n<ul><li>\n¬x∧y∧z\n<\/li><li>\nx∧¬y∧z\n<\/li><li>\nx∧y∧¬z\n<\/li><li>\nx∧y∧z\n<\/ul>\n<p>四项相或就是它的析取范式。这个写法一定正确，但通常不是最短的。<\/p>\n<p><strong>另一种范式<\/strong>：把输出为 0 的行写成和的乘积，再全部相与，得到合取范式（CNF）。<\/p>\n<h3>概念 3：化简（难度：进阶）<\/h3>\n<p><strong>德摩根律<\/strong>：¬(a∧b) = ¬a∨¬b，¬(a∨b) = ¬a∧¬b。整体取反，逐项取反，与或互换。<\/p>\n<p><strong>吸收律<\/strong>：a∨(a∧b) = a，a∧(a∨b) = a。<\/p>\n<p><strong>实例<\/strong>：化简 (x∧y)∨(x∧¬y)。 提取 x：x∧(y∨¬y) = x∧1 = x。所以这个表达式就是 x。 核对：y 取 0 或 1 时，两项总有一项为真，结果只取决于 x ✓。<\/p>\n<p><strong>实例<\/strong>：化简 x∨(x∧y) = x（吸收律）。<\/p>\n<p><strong>系统化简<\/strong>：奎因—麦卡斯基方法先找「尽量大的乘积项」，再挑最少的一组覆盖所有 1。它保证最优，但最坏代价指数级。<\/p>\n<h3>概念 4：为什么范式在实践里常常不够用（难度：进阶）<\/h3>\n<p>析取范式的项数可能指数多。n 个变量的奇偶函数（异或链）用 DNF 表示要 2^(n−1) 个极小项，而用异或链只需 n−1 个运算。<\/p>\n<p>这说明「表示方式」决定了规模。第 3 章的二元决策图就是为了解决「有些函数用公式写必然爆炸」这个问题。<\/p>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 191 684\" style=\"max-width: 191px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg27\"><style>#svg27{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg27 .error-icon{fill:#552222;}#svg27 .error-text{fill:#552222;stroke:#552222;}#svg27 .edge-thickness-normal{stroke-width:2px;}#svg27 .edge-thickness-thick{stroke-width:3.5px;}#svg27 .edge-pattern-solid{stroke-dasharray:0;}#svg27 .edge-pattern-dashed{stroke-dasharray:3;}#svg27 .edge-pattern-dotted{stroke-dasharray:2;}#svg27 .marker{fill:#333333;stroke:#333333;}#svg27 .marker.cross{stroke:#333333;}#svg27 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg27 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg27 .cluster-label text{fill:#333;}#svg27 .cluster-label span,#svg27 p{color:#333;}#svg27 .label text,#svg27 span,#svg27 p{fill:#333;color:#333;}#svg27 .node rect,#svg27 .node circle,#svg27 .node ellipse,#svg27 .node polygon,#svg27 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg27 .flowchart-label text{text-anchor:middle;}#svg27 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg27 .node .label{text-align:center;}#svg27 .node.clickable{cursor:pointer;}#svg27 .arrowheadPath{fill:#333333;}#svg27 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg27 .flowchart-link{stroke:#333333;fill:none;}#svg27 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg27 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg27 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg27 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#svg27 .cluster text{fill:#333;}#svg27 .cluster span,#svg27 p{color:#333;}#svg27 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#svg27 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#svg27 :root{--mermaid-font-family:\"trebuchet ms\",verdana,arial,sans-serif;}</style><g><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"6\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg27_flowchart-pointEnd\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" class=\"arrowMarkerPath\" d=\"M 0 0 L 10 5 L 0 10 z\"></path></marker><marker orient=\"auto\" markerHeight=\"12\" markerWidth=\"12\" markerUnits=\"userSpaceOnUse\" refY=\"5\" refX=\"4.5\" viewBox=\"0 0 10 10\" class=\"marker flowchart\" id=\"svg27_flowchart-pointStart\"><path style=\"stroke-width: 1; stroke-dasharray: 1, 0;\" c  class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g transform=\"translate(87.5, 596.5)\" class=\"edgeLabel\"><g transform=\"translate(-8, -10.5)\" class=\"label\"><foreignObject height=\"21\" width=\"16\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\">是</span></div></foreignObject></g></g></g><g class=\"nodes\"><g transform=\"translate(87.5, 18)\" data-id=\"T\" data-node=\"true\" id=\"flowchart-T-359\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"167.03125\" y=\"-18\" x=\"-83.515625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-76.015625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"152.03125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">真值表 2 的 n 次方 行</span></div></foreignObject></g></g><g transform=\"translate(87.5, 104)\" data-id=\"M\" data-node=\"true\" id=\"flowchart-M-360\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"144.796875\" y=\"-18\" x=\"-72.3984375\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64.8984375, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"129.796875\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">挑出输出为 1 的行</span></div></foreignObject></g></g><g transform=\"translate(87.5, 190)\" data-id=\"E\" data-node=\"true\" id=\"flowchart-E-362\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"143\" y=\"-18\" x=\"-71.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-64, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"128\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">每行写一个极小项</span></div></foreignObject></g></g><g transform=\"translate(87.5, 276)\" data-id=\"O\" data-node=\"true\" id=\"flowchart-O-364\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"163.453125\" y=\"-18\" x=\"-81.7265625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-74.2265625, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"148.453125\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">全部相或 得析取范式</span></div></foreignObject></g></g><g transform=\"translate(87.5, 362)\" data-id=\"S\" data-node=\"true\" id=\"flowchart-S-366\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"175\" y=\"-18\" x=\"-87.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-80, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"160\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">用德摩根与吸收律化简</span></div></foreignObject></g></g><g transform=\"translate(87.5, 495.5)\" data-id=\"Q\" data-node=\"true\" id=\"flowchart-Q-368\" class=\"node default default flowchart-label\"><polygon style=\"\" transform=\"translate(-65.5,65.5)\" class=\"label-container\" points=\"65.5,0 131,-65.5 65.5,-131 0,-65.5\"></polygon><g transform=\"translate(-40, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"80\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">还能更小吗</span></div></foreignObject></g></g><g transform=\"translate(87.5, 650)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-370\" class=\"node default default flowchart-label\"><rect height=\"36\" width=\"159\" y=\"-18\" x=\"-79.5\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"></rect><g transform=\"translate(-72, -10.5)\" style=\"\" class=\"label\"><rect></rect><foreignObject height=\"21\" width=\"144\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\">改用决策图或异或链</span></div></foreignObject></g></g></g></g></g></svg><\/div>\n<p><strong>看图说明<\/strong>：范式是一条「必定正确但可能很长」的路线；最后的判断提醒，表示方式本身也是算法设计的一部分。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：真值表像一份逐条记录的规定手册，每种情况一条；范式是把这些条目改写成一句逻辑公式。\n<\/li><li>\n类比失效：手册的条目可以随便加，公式不行——同样的函数，不同写法长度能差指数级。\n<\/ul>\n<p><strong>实例（写范式）<\/strong>：f = x⊕y。真值表里输出为 1 的是 (0,1) 与 (1,0)，极小项是 ¬x∧y 与 x∧¬y，所以 f = (¬x∧y)∨(x∧¬y)。这就是异或的标准展开。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n<strong>别以为析取范式就是「最简式」<\/strong>——实际上它只是标准形式，项数可能远多于最优写法。\n<\/li><li>\n<strong>别以为 2^(2^n) 只是个大数字<\/strong>——实际上它说明 n 稍大就无法枚举全部函数，必须靠结构化的表示。\n<\/li><li>\n<strong>别以为化简只是「好看」<\/strong>——实际上项数直接决定电路面积与求值代价。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n填空题：3 个变量的布尔函数共有多少个？（填数字）\n<p>（答案：256；解析：2^(2^3) = 2^8 = 256。）<\/p>\n<\/ol>\n<ol><li>\n单选题：三变量多数函数在输入 101 时输出？\n<p>A. 0 B. 1 C. 不确定 D. 取决于变量顺序 （答案：B；解析：101 里有两个 1，满足「至少两个为 1」，输出 1。）<\/p>\n<\/ol>\n<ol><li>\n简答题：把 (x∧y)∨(x∧¬y) 化简，并说明用了什么规则。\n<p>（答案：结果为 x。提取公因子 x 得 x∧(y∨¬y)，而 y∨¬y = 1，故为 x；用到了分配律与「一个变量与其否定相或恒为真」。）<\/p>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nn 变量布尔函数共 2^(2^n) 个。\n<\/li><li>\n真值表输出为 1 的行 → 极小项 → 相或得析取范式。\n<\/li><li>\n德摩根：整体取反、逐项取反、与或互换。\n<\/ul>", "ch02": "<h1>第 2 章：布尔函数求值<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：<\/p>\n<ol><li>\n说清「按表达式求值」的代价，以及短路求值省在哪里。\n<\/li><li>\n用位并行一次算 64 组输入，并说明它的限制。\n<\/li><li>\n说出四 Russians 方法的预计算与总代价。\n<\/li><li>\n判断一个场景该用哪种求值策略。\n<\/ol>\n<h2>一句话核心<\/h2>\n<p>求值的核心矛盾是「要算多少组输入」；位并行与分块预计算都是把重复劳动合并，用空间或位宽换时间。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：直接求值与短路（难度：基础）<\/h3>\n<p>给定表达式与一组输入，按运算顺序算。代价与表达式大小成正比。<\/p>\n<p><strong>短路求值<\/strong>：a∧b 中若 a 为假，b 不必算；a∨b 中若 a 为真，b 不必算。<\/p>\n<p><strong>实例<\/strong>：f = (x &gt; 0) ∧ (1/x &gt; 2)。当 x = 0 时，左边为假，短路后不会去算 1/x，避免了除零。这不是优化，而是正确性的保证。<\/p>\n<p><strong>代价的不确定性<\/strong>：短路让最坏情况与平均情况不同。最坏仍要算全部，最好只算一部分。<\/p>\n<h3>概念 2：位并行（难度：进阶）<\/h3>\n<p>一个 64 位机器字里，每一位可以独立当一个布尔值。于是 64 组输入可以打包成 64 个字，一次按位运算同时算 64 组。<\/p>\n<p><strong>实例<\/strong>：要算 f = x∧y 在 64 组输入上的结果，只需一条按位与指令。<\/p>\n<p><strong>限制<\/strong>：<\/p>\n<ul><li>\n每组输入的变量必须排在同一位上（第 i 组的所有变量都在第 i 位）。\n<\/li><li>\n表达式里只能有按位运算；一旦需要「第 i 组的结果影响第 j 组」，位并行就失效。\n<\/li><li>\n64 位是硬上限，超过要拆成多字。\n<\/ul>\n<p><strong>为什么它快<\/strong>：原本 64 次运算变成 1 次，理论上 64 倍加速；实际受限于打包与拆包的开销，通常几十倍。<\/p>\n<h3>概念 3：四 Russians 方法（难度：高难）<\/h3>\n<p>名字来自四位俄罗斯数学家。思路是「把变量分块，预计算每块的所有可能取值」。<\/p>\n<p><strong>做法<\/strong>：<\/p>\n<ol><li>\n把 n 个变量切成若干块，每块 k 个变量。\n<\/li><li>\n对每块，枚举 2^k 种取值，算出这块对应的函数片段，存成表。\n<\/li><li>\n求值时，每块查一次表，把结果拼起来。\n<\/ol>\n<p><strong>代价<\/strong>：<\/p>\n<ul><li>\n预计算：约 (n/k) × 2^k。\n<\/li><li>\n每次求值：约 n/k 次查表与拼接。\n<\/ul>\n<p><strong>实例<\/strong>：n = 64，k = 8。预计算 8 块 × 256 种 = 2048 次；每次求值只需 8 次查表。相比逐位算 64 次，快了约 8 倍；相比对 2^64 组输入逐一求值，这是把「指数」压成「线性 × 常数」。<\/p>\n<p><strong>k 怎么选<\/strong>：k 太大，2^k 的表存不下；k 太小，加速不明显。典型的平衡点是 k 取 8 到 16。<\/p>\n<h3>概念 4：三种策略的取舍（难度：进阶）<\/h3>\n<table><thead><tr><th>策略<\/th><th>适合<\/th><th>代价<\/th><th>限制<\/th><\/tr><\/thead><tbody><tr><td>直接求值<\/td><td>单组或少量输入<\/td><td>O(表达式大小)<\/td><td>无<\/td><\/tr><tr><td>短路<\/td><td>有提前终止的分支<\/td><td>最坏不变，平均变好<\/td><td>依赖求值顺序<\/td><\/tr><tr><td>位并行<\/td><td>大量输入、同一表达式<\/td><td>约 1/64<\/td><td>需要打包，不能跨界依赖<\/td><\/tr><tr><td>四 Russians<\/td><td>大量输入、变量多<\/td><td>预计算 + 线性查表<\/td><td>表占空间<\/td><\/tr><\/tbody><\/table>\n<h2>图示<\/h2>\n<div class=\"diagram-rendered\" data-rendered=\"1\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 517.65234375 655\" style=\"max-width: 517.65234375px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"svg28\"><style>#svg28{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;fill:#333;}#svg28 .error-icon{fill:#552222;}#svg28 .error-text{fill:#552222;stroke:#552222;}#svg28 .edge-thickness-normal{stroke-width:2px;}#svg28 .edge-thickness-thick{stroke-width:3.5px;}#svg28 .edge-pattern-solid{stroke-dasharray:0;}#svg28 .edge-pattern-dashed{stroke-dasharray:3;}#svg28 .edge-pattern-dotted{stroke-dasharray:2;}#svg28 .marker{fill:#333333;stroke:#333333;}#svg28 .marker.cross{stroke:#333333;}#svg28 svg{font-family:\"trebuchet ms\",verdana,arial,sans-serif;font-size:16px;}#svg28 .label{font-family:\"trebuchet ms\",verdana,arial,sans-serif;color:#333;}#svg28 .cluster-label text{fill:#333;}#svg28 .cluster-label span,#svg28 p{color:#333;}#svg28 .label text,#svg28 span,#svg28 p{fill:#333;color:#333;}#svg28 .node rect,#svg28 .node circle,#svg28 .node ellipse,#svg28 .node polygon,#svg28 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#svg28 .flowchart-label text{text-anchor:middle;}#svg28 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#svg28 .node .label{text-align:center;}#svg28 .node.clickable{cursor:pointer;}#svg28 .arrowheadPath{fill:#333333;}#svg28 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#svg28 .flowchart-link{stroke:#333333;fill:none;}#svg28 .edgeLabel{background-color:#e8e8e8;text-align:center;}#svg28 .edgeLabel rect{opacity:0.5;background-color:#e8e8e8;fill:#e8e8e8;}#svg28 .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#svg28 .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#s 428.008,217.475,454.754,207.29,473.16C197.105,491.567,197.105,501.633,197.105,506.667L197.105,511.7\"></path><path marker-end=\"url(#svg28_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-P LE-R\" id=\"L-P-R-0\" d=\"M348.691,401.262L358.71,414.635C368.728,428.008,388.764,454.754,398.783,473.16C408.801,491.567,408.801,501.633,408.801,506.667L408.801,511.7\"></path><path marker-end=\"url(#svg28_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-BP LE-L\" id=\"L-BP-L-0\" d=\"M197.105,553L197.105,557.167C197.105,561.333,197.105,569.667,197.105,577.117C197.105,584.567,197.105,591.133,197.105,594.417L197.105,597.7\"></path><path marker-end=\"url(#svg28_flowchart-pointEnd)\" style=\"fill:none;\" class=\"edge-thickness-normal edge-pattern-solid flowchart-link LS-R LE-T\" id=\"L-R-T-0\" d=\"M408.801,553L408.801,557.167C408.801,561.333,408.801,569.667,408.801,577.117C408.801,584.567,408.801,591.133,408.801,594.417L408.801,597.7\"></path></g><g class=\"edgeLabels\"><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject height=\"0\" width=\"0\"><div style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"edgeLabel\"></span></div></foreignObject></g></g><g class=\"edgeLabel\"><g transform=\"translate(0, 0)\" class=\"label\"><foreignObject heigh
